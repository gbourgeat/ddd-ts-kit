version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint and dependency-cruiser need the TypeScript 6 API; the native
      # compiler is the separate `@typescript/native` alias.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # The Node.js typings follow the oldest runtime the kit supports (`engines` in
      # package.json), not the newest release: a major is raised by hand with it.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: chore
      include: scope
    groups:
      lint:
        patterns:
          - 'eslint*'
          - '@eslint/*'
          - 'typescript-eslint'
          - '@typescript-eslint/*'
          - 'knip'
          - 'dependency-cruiser'
      # pglite-socket pins the exact pglite it was built for: the two move together.
      pglite:
        patterns:
          - '@electric-sql/pglite'
          - '@electric-sql/pglite-*'
      test:
        patterns:
          - 'vitest'
          - '@vitest/*'
          - '@faker-js/faker'
      typescript:
        patterns:
          - 'typescript'
          - '@typescript/native'
      production-minor:
        dependency-type: production
        update-types: [minor, patch]
      development-minor:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
