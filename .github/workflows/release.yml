name: Release

# Publishes every package of `packages/` to the npm registry, under one version, when a tag
# `v<version>` is pushed. A run that stopped half-way is run again: a package already on the
# registry at this version is skipped.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: The tag is the version every package states
        env:
          TAG: ${{ github.ref_name }}
        run: node pipeline/monorepo/release-version.mjs --expect "${TAG#v}"
      - run: npm run build
      - name: The tarballs are what a consumer can install
        run: npm run package:check
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: node pipeline/monorepo/publish-packages.mjs "${TAG#v}"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag

  # GitHub Packages accepts a scope only from the account or organization of that name: this
  # job runs once the repository variable is set and a token of the `ddd-ts-kit` organization
  # is stored. Installing from that registry needs a token even for a public package.
  github-packages:
    name: Publish to GitHub Packages
    if: ${{ vars.PUBLISH_GITHUB_PACKAGES == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://npm.pkg.github.com
      - run: npm ci
      - run: npm run build
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: node pipeline/monorepo/publish-packages.mjs "${TAG#v}" --registry https://npm.pkg.github.com
