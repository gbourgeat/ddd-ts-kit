name: Release

# Publishes every package of `packages/` to the npm registry, under one version, when a tag
# `v<version>` is pushed. A run that stopped half-way is run again: a package already on the
# registry at this version is skipped. No secret is involved: each package names this workflow
# and its `npm` environment as its trusted publisher, and npm exchanges the identity token of
# the job (`id-token: write`) for a publish token that lives for that one publication.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The generated projects the pipeline of a pull request only type-checks (Prisma, TypeORM),
  # installed for real from the packed kit and held to their whole `verify`: nothing is published
  # while one of them is red.
  generated-stacks:
    name: Generated projects on Prisma and TypeORM, installed for real
    runs-on: ubuntu-26.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: The package managers a generated project pins
        run: corepack enable
      - name: Each stack installed, then green from its first minute to its first use case
        run: npm run ci:test:stacks-at-night
      - name: Every pair of capability values, generated whole and type-checked
        run: npm run ci:test:pairwise
      - name: PostgreSQL
        run: sh pipeline/github/scripts/start-postgres.sh
      - name: The first migration of each ORM generated, guarded and applied
        env:
          DDD_TS_KIT_MIGRATIONS_SERVER: postgres://app:app@localhost:5432
        run: npm run ci:test:migrations

  publish:
    name: Publish to npm
    needs: generated-stacks
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: The tag is the version every package states
        env:
          TAG: ${{ github.ref_name }}
        run: node pipeline/monorepo/release-version.mjs --expect "${TAG#v}"
      - run: npm run build
      - name: The tarballs are what a consumer can install
        run: npm run package:check
      - name: The npm of this runner exchanges an identity token (trusted publishing needs 11.5.1 or later)
        run: |
          npm --version
          node -e "const [major, minor, patch] = process.argv[1].split('.').map(Number); process.exit(major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1))) ? 0 : 1)" "$(npm --version)"
      # setup-node writes an `.npmrc` whose token line reads NODE_AUTH_TOKEN and gives the variable a
      # placeholder: reading the registry ignores it, and `npm publish` replaces it with the token
      # it gets for the identity of this job, so the step sets none.
      - name: Publish (trusted publishing through OIDC, with provenance)
        env:
          TAG: ${{ github.ref_name }}
        run: node pipeline/monorepo/publish-packages.mjs "${TAG#v}"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag

  # GitHub Packages accepts a scope only from the account or organization of that name: this
  # job runs once the repository variable is set and a token of the `ddd-ts-kit` organization
  # is stored. Installing from that registry needs a token even for a public package.
  github-packages:
    name: Publish to GitHub Packages
    needs: generated-stacks
    if: ${{ vars.PUBLISH_GITHUB_PACKAGES == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          cache: npm
          registry-url: https://npm.pkg.github.com
      - run: npm ci
      - run: npm run build
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: node pipeline/monorepo/publish-packages.mjs "${TAG#v}" --registry https://npm.pkg.github.com
