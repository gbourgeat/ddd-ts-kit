name: CI

on:
  push:
    branches: [main]
  pull_request:
    # A pull request in draft runs the fast checks only; marking it ready runs the whole of them (ready_for_review).
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    # Every night, everything, on both Node lines: a pull request runs the unit specs of the packages its change reaches.
    - cron: '0 3 * * *'
  # The run of the night on demand (`gh workflow run ci.yml --ref <branch>`): before a tag, or to try a change of the night jobs.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer commit of a pull request supersedes the run in progress; the default branch finishes every run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  install:
    name: Install and build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      scope: ${{ steps.affected.outputs.scope }}
      packages: ${{ steps.affected.outputs.packages }}
      filters: ${{ steps.affected.outputs.filters }}
      integration: ${{ steps.affected.outputs.integration }}
      integrated: ${{ steps.affected.outputs.integrated }}
      stacks: ${{ steps.kind.outputs.stacks }}
      release: ${{ steps.kind.outputs.release }}
      deep: ${{ steps.kind.outputs.deep }}
      draft: ${{ steps.kind.outputs.draft }}
      whole: ${{ steps.kind.outputs.whole }}
      generates: ${{ steps.kind.outputs.generates }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull request is checked out as its merge commit, whose first parent is the base it is compared with.
          fetch-depth: 2
      - uses: ./.github/actions/setup
      - name: What this run covers (everything on the default branch and at night, the affected packages on a pull request)
        id: affected
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
        run: node pipeline/monorepo/affected-packages.mjs --base "$BASE" --format github | tee -a "$GITHUB_OUTPUT"
      # `all` on the default branch, at night and on a release; on another pull request the script says `cover` when the change
      # touches anything a generated project runs or is built from (`packages/`, `pipeline/`, the root configuration) and `none` when it touches none of it (docs/proposals/generated-project-families.md).
      - name: Which of the slow families this run starts (not in draft, not on documents alone, not on a change that touches nothing a project runs), the stacks they take, and whether it goes deep (the night, on demand, a release)
        id: kind
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          INTEGRATED: ${{ steps.affected.outputs.integrated }}
          TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.head_ref }}
          STACKS: ${{ steps.affected.outputs.stacks }}
        run: |
          release=false
          case "$HEAD_REF" in release/*) release=true ;; esac
          case "$TITLE" in 'chore(release)'*) release=true ;; esac
          if [ "$release" = true ]; then STACKS=all; fi
          # The slow proofs (pnpm, Node 22 for the alias runs, the intermediate states of the first minute, the coverage gate on
          # its ten stacks, the pairs, the migrations) are the night's and the release's: the trunk and the other pull requests keep the rest.
          deep=false
          case "$EVENT" in schedule|workflow_dispatch) deep=true ;; esac
          if [ "$release" = true ]; then deep=true; fi
          # `whole`: the example and the copy of the example, which integrate every package; `generates`: the jobs that generate projects.
          whole=false; generates=false
          if [ "$INTEGRATED" = true ] && [ "$DRAFT" != true ]; then
            whole=true
            if [ "$STACKS" != none ]; then generates=true; fi
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "deep=$deep" >> "$GITHUB_OUTPUT"
          echo "draft=$([ "$DRAFT" = true ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "whole=$whole" >> "$GITHUB_OUTPUT"
          echo "generates=$generates" >> "$GITHUB_OUTPUT"
          echo "stacks=$STACKS" >> "$GITHUB_OUTPUT"

  # The gates that take under three minutes each, in one job: a run has fewer jobs to queue against the
  # 20 the plan allows at a time, and a failure still names its step (docs/proposals/build-and-test-velocity.md).
  checks:
    name: Static checks
    needs: install
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit of a pull request and its base, which the files of changes/ and the inputs of the website are judged against.
          fetch-depth: 2
      - uses: ./.github/actions/setup
      - name: No em dash or en dash, and the French documentation complete and current
        run: npm run ci:docs
      - name: What the change does for a user in a file of changes/, CHANGELOG.md and the plugin version left to the release
        if: ${{ github.event_name == 'pull_request' }}
        run: node pipeline/monorepo/changes.mjs --check --base HEAD^1
      - name: The asymmetries this pull request accepts, shown for the review
        if: ${{ github.event_name == 'pull_request' }}
        run: node pipeline/monorepo/asymmetries.mjs --base HEAD^1
      - name: Type check (the packages, the specs of each of them, the checked samples of the documentation)
        run: npm run ci:typecheck
      - name: Dead code
        run: npm run ci:deadcode
      - name: Pack, publint, arethetypeswrong
        run: npm run ci:build
      # A pull request that touches no page, no diagram, no file of the site and none of its inputs
      # passes without building it; the default branch and the night always build it.
      - name: Whether this run changes what the website is built from
        id: changed
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "pull_request" ] \
            || git diff --name-only HEAD^1 HEAD \
              | grep -qE '(\.md$|^docs/|^site/|^pipeline/monorepo/translations\.mjs$|^package-lock\.json$|^\.github/workflows/(ci|pages)\.yml$|^\.github/actions/setup/)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "No page, diagram or file of the website changed: nothing to build."
          fi
      - name: The pages assembled from the Markdown files, built by Astro, every link and anchor validated, every page in both languages at its route
        if: ${{ steps.changed.outputs.build == 'true' }}
        run: npm run site:build

  lint:
    name: Lint
    needs: install
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # A pull request is linted by Oxlint (type-aware by tsgolint, the rules of the kit as a JS plugin): six seconds
      # without any cache, where ESLint needs 36. The trunk and the night keep ESLint on the whole tree: it holds
      # typescript-eslint's `no-unsafe-enum-assignment`, which Oxlint lacks, and is the reference the trial job
      # compares Oxlint with (docs/proposals/build-and-test-velocity.md).
      - run: npm run ci:format
      - name: Oxlint
        if: ${{ github.event_name == 'pull_request' }}
        run: npm run lint:oxlint
      - name: ESLint
        if: ${{ github.event_name != 'pull_request' }}
        run: npx eslint --config eslint.config.mjs .

  architecture:
    name: Architecture
    needs: install
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Rule fixtures (check --self), dependency graph, the guard and the affected selection
        run: npm run ci:arch

  unit:
    name: Unit tests (Node 24, coverage floors)
    needs: install
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Unit specs, each package held to its coverage floor (vitest.config.ts)
        if: ${{ needs.install.outputs.scope != 'none' }}
        env:
          KIT_AFFECTED: ${{ needs.install.outputs.packages }}
          FILTERS: ${{ needs.install.outputs.filters }}
        run: npm run ci:test:unit -- $FILTERS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore
          retention-days: 14

  coverage:
    name: Coverage report (Codecov)
    # The measure of a whole run only: a pull request measures the packages it reaches, which would read as a drop.
    # Not a gate: the floors of vitest.config.ts are. The report feeds the badge of the README and the history.
    # The unit report, and the integration one when that job passed: Codecov adds what the specs on a server cover.
    # `!cancelled()` keeps a failed integration job from skipping the unit report.
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.install.outputs.scope == 'all' && needs.unit.result == 'success' }}
    needs: [install, unit, integration]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: coverage
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          disable_search: true
          flags: unit
          fail_ci_if_error: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ needs.integration.result == 'success' }}
        with:
          name: coverage-integration
          path: coverage-integration
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: ${{ needs.integration.result == 'success' }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-integration/lcov.info
          disable_search: true
          flags: integration
          fail_ci_if_error: false

  unit-oldest:
    name: Unit tests (Node 22)
    needs: install
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: 22
      - name: The same specs on the oldest supported Node (coverage is measured once, on Node 24)
        if: ${{ needs.install.outputs.scope != 'none' }}
        env:
          FILTERS: ${{ needs.install.outputs.filters }}
        run: npm test -- $FILTERS

  alias:
    name: Import alias at run time (Node ${{ matrix.node }})
    needs: install
    # Left out of a draft, when nothing but documents they do not read changed, and when the change touches nothing a generated project runs.
    if: ${{ needs.install.outputs.generates == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Both Node lines at night and on the pull request of a release; every other run, the trunk included, runs the newest one.
        node: ${{ fromJSON(needs.install.outputs.deep == 'true' && '[22, 24]' || '[24]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - name: Every stack built, run compiled with plain node, from sources under tsx and vitest (on a pull request, a cover of them)
        env:
          KIT_STACKS: ${{ needs.install.outputs.stacks }}
        run: npm run ci:test:alias

  integration:
    name: Integration tests
    needs: install
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      DDD_TS_KIT_TEST_DATABASE_URL: postgres://app:app@localhost:5432/app
      DDD_TS_KIT_TEST_S3_ENDPOINT: http://localhost:9000
      DDD_TS_KIT_TEST_REDIS_URL: redis://localhost:6379
      DDD_TS_KIT_OPENFGA_URL: http://localhost:8080
      DDD_TS_KIT_TEST_VARNISH_URL: http://127.0.0.1:16081
      DDD_TS_KIT_TEST_VARNISH_BACKEND_PORT: '18089'
      # The purges reach the container through its published port, from another address: Varnish lets them in with it.
      VARNISH_PURGE_KEY: ci-purge-key
      DDD_TS_KIT_TEST_VARNISH_PURGE_KEY: ci-purge-key
      DDD_TS_KIT_TEST_NATS_URL: nats://localhost:4222
      DDD_TS_KIT_TEST_AMQP_URL: amqp://kit:kit@localhost:5672
      DDD_TS_KIT_TEST_KAFKA_BROKERS: 127.0.0.1:9092
      # The broker advertises 9095 on its RELAYED listener; the connection-loss specs listen there and relay to 9094.
      DDD_TS_KIT_TEST_KAFKA_RELAY: 127.0.0.1:9095=127.0.0.1:9094
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: PostgreSQL (pulled with retries, from the next registry when one refuses)
        if: ${{ needs.install.outputs.integration == 'true' }}
        run: sh pipeline/github/scripts/start-postgres.sh
      - name: MinIO for the S3 connector (pinned by digest, pulled with retries)
        if: ${{ needs.install.outputs.integration == 'true' }}
        run: sh pipeline/github/scripts/start-minio.sh
      - name: Dragonfly for the Redis package, its event bus, job store, cache, lock and rate limiter (pinned by digest, pulled with retries)
        if: ${{ needs.install.outputs.integration == 'true' }}
        run: sh pipeline/github/scripts/start-dragonfly.sh
      - name: OpenFGA (the image the specs of @ddd-ts-kit/openfga are held to, pinned by digest)
        if: ${{ needs.install.outputs.integration == 'true' }}
        run: |
          docker run --detach --name openfga --publish 8080:8080 \
            openfga/openfga:v1.22.0@sha256:9cf9a20af32a40434cd3a788c429879439ee9ea9abf65c9c200ee17cd43f769e run > /dev/null
          for second in $(seq 1 60); do
            if curl --silent --fail http://localhost:8080/healthz > /dev/null; then
              echo "OpenFGA is ready (${second}s)."
              exit 0
            fi
            sleep 1
          done
          docker logs openfga >&2
          echo "OpenFGA did not become healthy." >&2
          exit 1
      - name: Varnish, with the VCL init --http-cache varnish writes, in front of the origin the purger spec starts
        if: ${{ needs.install.outputs.integration == 'true' }}
        run: sh pipeline/github/scripts/start-varnish.sh packages/cli/templates/init/docker/varnish.vcl.tpl 18089 16081
      - name: NATS with JetStream for the broker adapter (pinned by digest, pulled with retries)
        if: ${{ needs.install.outputs.integration == 'true' }}
        run: sh pipeline/github/scripts/start-nats.sh
      - name: RabbitMQ for the broker adapter (pinned by digest, pulled with retries, waited until fully booted)
        if: ${{ needs.install.outputs.integration == 'true' }}
        run: sh pipeline/github/scripts/start-rabbitmq.sh
      - name: Kafka for the broker adapter, with the relayed listener of the connection-loss specs (pinned by digest)
        if: ${{ needs.install.outputs.integration == 'true' }}
        run: sh pipeline/github/scripts/start-kafka.sh
      - name: Adapter specs on a server (skipped when no adapter package is reached), measured for Codecov
        if: ${{ needs.install.outputs.integration == 'true' }}
        env:
          KIT_COVERAGE: integration
        run: npm run ci:test:integration -- --coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && needs.install.outputs.integration == 'true' }}
        with:
          name: coverage-integration
          path: coverage/integration
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: End-to-end tests (${{ matrix.shard }}/4)
    needs: install
    # Left out of a draft, when nothing but documents they do not read changed, and when the change touches nothing a generated project runs.
    if: ${{ needs.install.outputs.generates == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Every stack generated and held to its own pipeline, a quarter of the spec files on each runner (the two sweeps of `init` alone, on a pull request, on a cover of the stacks)
        env:
          KIT_STACKS: ${{ needs.install.outputs.stacks }}
          # The coverage gate of the generated projects on its ten stacks at night and on a release, on one stack otherwise.
          DDD_TS_KIT_NIGHT: ${{ needs.install.outputs.deep == 'true' && '1' || '' }}
        run: npm run ci:test:e2e:stacks -- --shard=${{ matrix.shard }}/4

  pairwise:
    name: Every pair of capability values, generated and type-checked
    needs: install
    # At night and on the pull request of a release: the stacks generated to meet every pair of values of two capability flags.
    if: ${{ needs.install.outputs.generates == 'true' && needs.install.outputs.deep == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Each stack generated whole and held to the compiler
        run: npm run ci:test:pairwise

  migrations:
    name: First migration of a generated project, on a real PostgreSQL
    needs: install
    # At night, on demand and on the pull request of a release: the tool of each ORM generates, the audit guard is added, the migration is applied.
    if: ${{ needs.install.outputs.generates == 'true' && needs.install.outputs.deep == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      DDD_TS_KIT_MIGRATIONS_SERVER: postgres://app:app@localhost:5432
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: PostgreSQL
        run: sh pipeline/github/scripts/start-postgres.sh
      - name: Drizzle, Prisma and TypeORM, installed for real, generate their first migration and apply it
        run: npm run ci:test:migrations

  managers:
    name: Generated project on ${{ matrix.manager }}
    needs: install
    # Left out of a draft, when nothing but documents they do not read changed, and when the change touches nothing a generated project runs.
    if: ${{ needs.install.outputs.generates == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Both package managers at night and on the pull request of a release; every other run, the trunk included, installs on npm, the dialect the templates are written in.
        manager: ${{ fromJSON(needs.install.outputs.deep == 'true' && '["npm", "pnpm"]' || '["npm"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: The package manager a generated project pins
        run: corepack enable
      # Packed once for the whole job: each spec file packed the 26 packages again.
      - name: The kit as npm packs it, once, for every project this job installs
        run: echo "DDD_TS_KIT_PACKED_KIT=$(node pipeline/monorepo/pack-kit.mjs "$RUNNER_TEMP/packed-kit")" >> "$GITHUB_ENV"
      - name: Installed for real from the packed kit and held to verify (every kind generated on the default stack and a heavy one; from the first minute, the quick start of the README and the other proven stacks)
        env:
          DDD_TS_KIT_PACKAGE_MANAGER: ${{ matrix.manager }}
          # At night and on the pull request of a release, the stacks the workspace cannot run too (Prisma, TypeORM), with every capability on,
          # and the intermediate states of the first minute (after one context, then two); another run keeps the first state and the last.
          DDD_TS_KIT_NIGHT: ${{ needs.install.outputs.deep == 'true' && '1' || '' }}
        run: npm run ci:test:managers

  example:
    name: Example application (examples/scheduling)
    needs: install
    # The runs that integrate every package: left out of a draft, and when nothing but documents they do not read changed.
    if: ${{ needs.install.outputs.whole == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: The example's own gate (types, lint, format, tests with the coverage thresholds, end to end, architecture, graph, dead code, documents)
        run: npm run verify --workspace examples/scheduling
      - name: Varnish in front of the example (the VCL of its docker/varnish), and the end-to-end spec that reads the API through it
        env:
          VARNISH_URL: http://127.0.0.1:54081
          VARNISH_BACKEND_PORT: '54300'
          VARNISH_PURGE_KEY: ci-purge-key
        run: |
          sh pipeline/github/scripts/start-varnish.sh examples/scheduling/docker/varnish/default.vcl 54300 54081
          npm run test:e2e --workspace examples/scheduling -- test/e2e/get-opening-hours.e2e.spec.ts
      - name: PostgreSQL (pulled with retries, from the next registry when one refuses)
        run: sh pipeline/github/scripts/start-postgres.sh
      - name: The example's adapter specs on a PostgreSQL server (two concurrent bookings meet real transactions)
        env:
          DATABASE_URL: postgres://app:app@localhost:5432/app
        run: |
          npm run db:migrate --workspace examples/scheduling
          npm run test:postgres --workspace examples/scheduling

  conformance:
    name: Every rule broken once in a copy of the example
    needs: install
    # The runs that integrate every package: left out of a draft, and when nothing but documents they do not read changed.
    if: ${{ needs.install.outputs.whole == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run example:conformance

  security:
    name: Security
    needs: install
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          build: 'false'
      - name: Production dependencies audit
        run: npm run ci:audit
      - name: Dependency review
        if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
      - name: Secrets
        if: ${{ !cancelled() }}
        run: docker run --rm --volume "$GITHUB_WORKSPACE:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner

  # Two trials of docs/proposals/build-and-test-velocity.md (its seventh line), measured for a month and never a gate:
  # the gate job does not need them, and a failure of theirs fails nothing. Each writes what the month compares.
  oxlint:
    name: Trial, Oxlint beside ESLint
    needs: install
    # The default branch and the night, not a pull request: nothing of this run is read before a merge.
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: ESLint and Oxlint on this repository, the findings compared by file, line and rule
        run: |
          t0=$(date +%s)
          npx oxlint --type-aware -f json > oxlint.json 2> oxlint.err || true
          t1=$(date +%s)
          npx eslint --config eslint.config.mjs --format json . > eslint.json 2> eslint.err || true
          t2=$(date +%s)
          {
            echo "| tool | wall, no cache |"
            echo "|---|---|"
            echo "| Oxlint, type-aware, the rules of the kit as a JS plugin | $((t1 - t0)) s |"
            echo "| ESLint, typescript-eslint, no cache | $((t2 - t1)) s |"
            echo
            node pipeline/monorepo/compare-linters.mjs eslint.json oxlint.json .
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oxlint-${{ github.run_id }}
          path: |
            oxlint.json
            oxlint.err
            eslint.json
            eslint.err
          retention-days: 30

  unit-arm:
    name: Trial, unit tests on arm64
    needs: install
    # The night only: ten runs give a p50 to compare with the x64 job of the same nights.
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: The same specs as the Node 22 job, on four physical cores instead of two with hyper-threading
        run: npm test

  e2e-arm:
    name: Trial, end-to-end tests (3/4) on arm64
    needs: install
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: The third shard, the longest, as the x64 job runs it at night
        env:
          DDD_TS_KIT_NIGHT: '1'
        run: npm run ci:test:e2e:stacks -- --shard=3/4

  mutation:
    name: Mutation score of the example, every night
    needs: install
    # The night only: Stryker on the domain and application layers of the four contexts of the example takes minutes, and nothing of it is read before a merge.
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Stryker on the domain and application layers of every context of the example, each layer held to its "mutation" floor of its config
        run: npm run test:mutation --workspace examples/scheduling
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: mutation
          path: examples/scheduling/reports/mutation
          if-no-files-found: ignore
          retention-days: 30

  mutation-changed:
    name: Mutation score of the change, on the example
    needs: install
    # A pull request, not in draft: the report of the last night is reused for what the change leaves alone, and the survivors of the files of the example it touched are listed. A reading, not a gate: the floor is held by the night.
    if: ${{ github.event_name == 'pull_request' && needs.install.outputs.draft != 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history: the files of the change are those since its merge base with the base branch.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: The report of the last night, when there is one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list --workflow "${{ github.workflow }}" --event schedule --branch "${{ github.event.repository.default_branch }}" --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -n "$run" ]; then gh run download "$run" --name mutation --dir examples/scheduling/reports/mutation || echo "The last night kept no report: a full run."; fi
          # The night runs without a base and writes no incremental file: its json report is the same object, which Stryker reads back (docs/proposals/generated-project-families.md).
          if [ -f examples/scheduling/reports/mutation/mutation.json ]; then cp examples/scheduling/reports/mutation/mutation.json examples/scheduling/reports/mutation/incremental.json; fi
      - name: Stryker on what the change touches in the example, then the survivors of its files
        run: |
          mkdir -p examples/scheduling/reports/mutation
          base=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          DDD_TS_KIT_MUTATION_SINCE="$base" npm run --silent test:mutation --workspace examples/scheduling | tee examples/scheduling/reports/mutation/changed.txt
          { echo '```'; cat examples/scheduling/reports/mutation/changed.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  gate:
    name: gate
    if: ${{ always() }}
    needs: [install, checks, lint, architecture, unit, unit-oldest, alias, integration, e2e, managers, example, conformance, security]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Every gate passed
        env:
          # Every job this one needs, read whole: a job added later is held without being listed here.
          NEEDS: ${{ toJSON(needs) }}
          # A job is skipped without failing the gate only where the install job says its own `if:` skips it, and then only:
          # `generates` is false for a draft, for a change of documents alone and for a change that touches nothing a project runs and no
          # generator; `whole` is false for a draft and for a change of documents alone.
          SKIP_WITHOUT_GENERATES: alias e2e managers
          SKIP_WITHOUT_WHOLE: example conformance
          GENERATES: ${{ needs.install.outputs.generates }}
          WHOLE: ${{ needs.install.outputs.whole }}
        run: |
          echo "Results: $(echo "$NEEDS" | jq -r 'to_entries | map("\(.key)=\(.value.result)") | join(" ")')"
          failed=$(echo "$NEEDS" | jq -r --arg generating "$SKIP_WITHOUT_GENERATES" --arg whole "$SKIP_WITHOUT_WHOLE" --arg generates "$GENERATES" --arg wholly "$WHOLE" '
            ($generating | split(" ")) as $byGenerates
            | ($whole | split(" ")) as $byWhole
            | to_entries[]
            | select(.value.result != "success")
            | select(
                .value.result != "skipped"
                or ((((.key | IN($byGenerates[])) and $generates != "true") or ((.key | IN($byWhole[])) and $wholly != "true")) | not)
              )
            | "\(.key)=\(.value.result)"')
          if [ -n "$failed" ]; then
            echo "::error::A required job did not pass: $failed"
            exit 1
          fi
