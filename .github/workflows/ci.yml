name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Every night, everything, on both Node lines: a pull request runs the unit specs of the packages its change reaches.
    - cron: '0 3 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer commit of a pull request supersedes the run in progress; the default branch finishes every run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  install:
    name: Install and build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      scope: ${{ steps.affected.outputs.scope }}
      packages: ${{ steps.affected.outputs.packages }}
      filters: ${{ steps.affected.outputs.filters }}
      integration: ${{ steps.affected.outputs.integration }}
      integrated: ${{ steps.affected.outputs.integrated }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull request is checked out as its merge commit, whose first parent is the base it is compared with.
          fetch-depth: 2
      - uses: ./.github/actions/setup
      - name: What this run covers (everything on the default branch and at night, the affected packages on a pull request)
        id: affected
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
        run: node pipeline/monorepo/affected-packages.mjs --base "$BASE" --format github | tee -a "$GITHUB_OUTPUT"

  typecheck:
    name: Typecheck
    needs: install
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run ci:typecheck

  lint:
    name: Lint
    needs: install
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run ci:format
      - run: npm run ci:lint

  architecture:
    name: Architecture
    needs: install
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Rule fixtures (check --self), dependency graph, the guard and the affected selection
        run: npm run ci:arch

  deadcode:
    name: Dead code
    needs: install
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run ci:deadcode

  docs:
    name: Docs
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit of a pull request and its base, which the files of changes/ are judged against.
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: No em dash or en dash, and the French documentation complete and current (the scripts need no dependency)
        run: npm run ci:docs
      - name: What the change does for a user in a file of changes/, CHANGELOG.md and the plugin version left to the release
        if: ${{ github.event_name == 'pull_request' }}
        run: node pipeline/monorepo/changes.mjs --check --base HEAD^1

  unit:
    name: Unit tests (Node 24, coverage floors)
    needs: install
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Unit specs, each package held to its coverage floor (vitest.config.ts)
        if: ${{ needs.install.outputs.scope != 'none' }}
        env:
          KIT_AFFECTED: ${{ needs.install.outputs.packages }}
          FILTERS: ${{ needs.install.outputs.filters }}
        run: npm run ci:test:unit -- $FILTERS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore
          retention-days: 14

  coverage:
    name: Coverage report (Codecov)
    # The measure of a whole run only: a pull request measures the packages it reaches, which would read as a drop.
    # Not a gate: the floors of vitest.config.ts are. The report feeds the badge of the README and the history.
    # The unit report, and the integration one when that job passed: Codecov adds what the specs on a server cover.
    # `!cancelled()` keeps a failed integration job from skipping the unit report.
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.install.outputs.scope == 'all' && needs.unit.result == 'success' }}
    needs: [install, unit, integration]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: coverage
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          disable_search: true
          flags: unit
          fail_ci_if_error: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ needs.integration.result == 'success' }}
        with:
          name: coverage-integration
          path: coverage-integration
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: ${{ needs.integration.result == 'success' }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-integration/lcov.info
          disable_search: true
          flags: integration
          fail_ci_if_error: false

  unit-oldest:
    name: Unit tests (Node 22)
    needs: install
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: 22
      - name: The same specs on the oldest supported Node (coverage is measured once, on Node 24)
        if: ${{ needs.install.outputs.scope != 'none' }}
        env:
          FILTERS: ${{ needs.install.outputs.filters }}
        run: npm test -- $FILTERS

  alias:
    name: Import alias at run time (Node ${{ matrix.node }})
    needs: install
    # The runs that integrate every package: left out when nothing but documents they do not read changed.
    if: ${{ needs.install.outputs.integrated == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - name: Every stack built, run compiled with plain node, from sources under tsx and vitest
        run: npm run ci:test:alias

  integration:
    name: Integration tests
    needs: install
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      DDD_TS_KIT_TEST_DATABASE_URL: postgres://app:app@localhost:5432/app
      DDD_TS_KIT_TEST_S3_ENDPOINT: http://localhost:9000
      DDD_TS_KIT_TEST_REDIS_URL: redis://localhost:6379
      DDD_TS_KIT_OPENFGA_URL: http://localhost:8080
      DDD_TS_KIT_TEST_VARNISH_URL: http://127.0.0.1:16081
      DDD_TS_KIT_TEST_VARNISH_BACKEND_PORT: '18089'
      # The purges reach the container through its published port, from another address: Varnish lets them in with it.
      VARNISH_PURGE_KEY: ci-purge-key
      DDD_TS_KIT_TEST_VARNISH_PURGE_KEY: ci-purge-key
      DDD_TS_KIT_TEST_NATS_URL: nats://localhost:4222
      DDD_TS_KIT_TEST_AMQP_URL: amqp://kit:kit@localhost:5672
      DDD_TS_KIT_TEST_KAFKA_BROKERS: 127.0.0.1:9092
      # The broker advertises 9095 on its RELAYED listener; the connection-loss specs listen there and relay to 9094.
      DDD_TS_KIT_TEST_KAFKA_RELAY: 127.0.0.1:9095=127.0.0.1:9094
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: PostgreSQL (pulled with retries, from the next registry when one refuses)
        if: ${{ needs.install.outputs.integration == 'true' }}
        run: sh pipeline/github/scripts/start-postgres.sh
      - name: MinIO for the S3 connector (pinned by digest, pulled with retries)
        if: ${{ needs.install.outputs.integration == 'true' }}
        run: sh pipeline/github/scripts/start-minio.sh
      - name: Dragonfly for the Redis package, its event bus, job store, cache, lock and rate limiter (pinned by digest, pulled with retries)
        if: ${{ needs.install.outputs.integration == 'true' }}
        run: sh pipeline/github/scripts/start-dragonfly.sh
      - name: OpenFGA (the image the specs of @ddd-ts-kit/openfga are held to, pinned by digest)
        if: ${{ needs.install.outputs.integration == 'true' }}
        run: |
          docker run --detach --name openfga --publish 8080:8080 \
            openfga/openfga:v1.22.0@sha256:9cf9a20af32a40434cd3a788c429879439ee9ea9abf65c9c200ee17cd43f769e run > /dev/null
          for second in $(seq 1 60); do
            if curl --silent --fail http://localhost:8080/healthz > /dev/null; then
              echo "OpenFGA is ready (${second}s)."
              exit 0
            fi
            sleep 1
          done
          docker logs openfga >&2
          echo "OpenFGA did not become healthy." >&2
          exit 1
      - name: Varnish, with the VCL init --http-cache varnish writes, in front of the origin the purger spec starts
        if: ${{ needs.install.outputs.integration == 'true' }}
        run: sh pipeline/github/scripts/start-varnish.sh packages/cli/templates/init/docker/varnish.vcl.tpl 18089 16081
      - name: NATS with JetStream for the broker adapter (pinned by digest, pulled with retries)
        if: ${{ needs.install.outputs.integration == 'true' }}
        run: sh pipeline/github/scripts/start-nats.sh
      - name: RabbitMQ for the broker adapter (pinned by digest, pulled with retries, waited until fully booted)
        if: ${{ needs.install.outputs.integration == 'true' }}
        run: sh pipeline/github/scripts/start-rabbitmq.sh
      - name: Kafka for the broker adapter, with the relayed listener of the connection-loss specs (pinned by digest)
        if: ${{ needs.install.outputs.integration == 'true' }}
        run: sh pipeline/github/scripts/start-kafka.sh
      - name: Adapter specs on a server (skipped when no adapter package is reached), measured for Codecov
        if: ${{ needs.install.outputs.integration == 'true' }}
        env:
          KIT_COVERAGE: integration
        run: npm run ci:test:integration -- --coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && needs.install.outputs.integration == 'true' }}
        with:
          name: coverage-integration
          path: coverage/integration
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: End-to-end tests (${{ matrix.shard }}/4)
    needs: install
    # The runs that integrate every package: left out when nothing but documents they do not read changed.
    if: ${{ needs.install.outputs.integrated == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Every stack generated and held to its own pipeline, a quarter of the spec files on each runner
        run: npm run ci:test:e2e:stacks -- --shard=${{ matrix.shard }}/4

  managers:
    name: Generated project on ${{ matrix.manager }}
    needs: install
    # The runs that integrate every package: left out when nothing but documents they do not read changed.
    if: ${{ needs.install.outputs.integrated == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        manager: [npm, pnpm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: The package manager a generated project pins
        run: corepack enable
      - name: Installed for real from the packed kit and held to verify (every kind generated on the default stack and a heavy one; from the first minute, the quick start of the README and the other proven stacks)
        env:
          DDD_TS_KIT_PACKAGE_MANAGER: ${{ matrix.manager }}
        run: npm run ci:test:managers

  example:
    name: Example application (examples/scheduling)
    needs: install
    # The runs that integrate every package: left out when nothing but documents they do not read changed.
    if: ${{ needs.install.outputs.integrated == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: The example's own gate (types, lint, format, tests with the coverage thresholds, end to end, architecture, graph, dead code, documents)
        run: npm run verify --workspace examples/scheduling
      - name: Varnish in front of the example (the VCL of its docker/varnish), and the end-to-end spec that reads the API through it
        env:
          VARNISH_URL: http://127.0.0.1:54081
          VARNISH_BACKEND_PORT: '54300'
          VARNISH_PURGE_KEY: ci-purge-key
        run: |
          sh pipeline/github/scripts/start-varnish.sh examples/scheduling/docker/varnish/default.vcl 54300 54081
          npm run test:e2e --workspace examples/scheduling -- test/e2e/get-opening-hours.e2e.spec.ts
      - name: PostgreSQL (pulled with retries, from the next registry when one refuses)
        run: sh pipeline/github/scripts/start-postgres.sh
      - name: The example's adapter specs on a PostgreSQL server (two concurrent bookings meet real transactions)
        env:
          DATABASE_URL: postgres://app:app@localhost:5432/app
        run: |
          npm run db:migrate --workspace examples/scheduling
          npm run test:postgres --workspace examples/scheduling

  conformance:
    name: Every rule broken once in a copy of the example
    needs: install
    # The runs that integrate every package: left out when nothing but documents they do not read changed.
    if: ${{ needs.install.outputs.integrated == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run example:conformance

  security:
    name: Security
    needs: install
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          build: 'false'
      - name: Production dependencies audit
        run: npm run ci:audit
      - name: Dependency review
        if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
      - name: Secrets
        if: ${{ !cancelled() }}
        run: docker run --rm --volume "$GITHUB_WORKSPACE:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner

  package:
    name: Packages
    needs: install
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Pack, publint, arethetypeswrong
        run: npm run ci:build

  site:
    name: Documentation website
    needs: install
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull request is checked out as its merge commit, whose first parent is the base it is compared with.
          fetch-depth: 2
      # A pull request that touches no page, no diagram, no file of the site and none of its inputs
      # passes without building it; the default branch and the night always build it.
      - name: Whether this run changes what the website is built from
        id: changed
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "pull_request" ] \
            || git diff --name-only HEAD^1 HEAD \
              | grep -qE '(\.md$|^docs/|^site/|^pipeline/monorepo/translations\.mjs$|^package-lock\.json$|^\.github/workflows/(ci|pages)\.yml$|^\.github/actions/setup/)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "No page, diagram or file of the website changed: nothing to build."
          fi
      - uses: ./.github/actions/setup
        if: ${{ steps.changed.outputs.build == 'true' }}
        with:
          build: 'false'
      - name: The pages assembled from the Markdown files, built by Astro, every link and anchor validated, every page in both languages at its route
        if: ${{ steps.changed.outputs.build == 'true' }}
        run: npm run site:build

  gate:
    name: gate
    if: ${{ always() }}
    needs: [install, typecheck, lint, architecture, deadcode, docs, site, unit, unit-oldest, alias, integration, e2e, managers, example, conformance, security, package]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Every gate passed
        env:
          # Every job this one needs, read whole: a job added later is held without being listed here.
          NEEDS: ${{ toJSON(needs) }}
          # The runs that integrate every package, skipped when the change is documents alone (`integrated` of the install job), and then only.
          MAY_SKIP: alias e2e managers example conformance
          INTEGRATED: ${{ needs.install.outputs.integrated }}
        run: |
          echo "Results: $(echo "$NEEDS" | jq -r 'to_entries | map("\(.key)=\(.value.result)") | join(" ")')"
          failed=$(echo "$NEEDS" | jq -r --arg may "$MAY_SKIP" --arg integrated "$INTEGRATED" '
            ($may | split(" ")) as $skippable
            | to_entries[]
            | select(.value.result != "success")
            | select(.value.result != "skipped" or $integrated == "true" or ((.key | IN($skippable[])) | not))
            | "\(.key)=\(.value.result)"')
          if [ -n "$failed" ]; then
            echo "::error::A required job did not pass: $failed"
            exit 1
          fi
