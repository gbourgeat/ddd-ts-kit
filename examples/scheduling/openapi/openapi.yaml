          x-error-codes:
            - APPOINTMENT_NOT_FOUND
            - NO_DOCUMENT
        '406':
          description: 'Not Acceptable. Error codes: NOT_ACCEPTABLE.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          x-error-codes:
            - NOT_ACCEPTABLE
        '422':
          description: 'Unprocessable Content. Error codes: VALIDATION_FAILED.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          x-error-codes:
