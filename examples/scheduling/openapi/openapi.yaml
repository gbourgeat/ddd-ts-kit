  /appointments/{appointmentId}/document:
    get:
      operationId: getAppointmentDocument
      summary: Get a link to the document of an appointment
      description: The file itself is fetched from the link it answers, which expires after five minutes; every access is recorded in the audit trail.
      tags:
        - scheduling
      security:
        - bearer: []
      parameters:
        - name: appointmentId
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: The link to the document.
          headers:
            Cache-Control:
              description: How the caches on the way may keep this answer.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                properties:
                  url:
                    type: string
                  expiresAt:
                    type: string
                  name:
                    type: string
                  mediaType:
                    type: string
                  size:
                    type: integer
                type: object
                required:
                  - url
                  - expiresAt
                  - name
                  - mediaType
                  - size
        '401':
          description: 'Unauthorized. Error codes: UNAUTHORIZED.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          x-error-codes:
