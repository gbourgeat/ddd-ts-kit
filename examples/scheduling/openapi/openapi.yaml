components:
  schemas:
    Accepted:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: The identifier of what the command created or changed.
      additionalProperties: false
    AgendaLine:
      properties:
        id:
          type: string
        calendarId:
          type: string
        practiceId:
          type: string
        practitionerId:
          type: string
        patientId:
          type: string
        appointmentTypeId:
          type: string
        startsAt:
          oneOf:
            - format: date
              type: string
            - format: date-time
              type: string
        endsAt:
          oneOf:
            - format: date
              type: string
            - format: date-time
              type: string
        day:
          pattern: ^\d{4}-\d{2}-\d{2}$
          type: string
        status:
          type: string
          enum:
            - requested
            - booked
            - cancelled
            - expired
            - completed
            - no-show
        confirmBefore:
          oneOf:
            - format: date
              type: string
            - format: date-time
              type: string
        cancelledBy:
          type: string
          enum:
            - patient
            - practice
      type: object
      required:
        - id
        - calendarId
        - practiceId
        - practitionerId
        - patientId
        - appointmentTypeId
        - startsAt
        - endsAt
        - day
        - status
    AgendaLinePage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AgendaLine'
        total:
          type: integer
          minimum: 0
          description: Present when it is cheap to count.
        nextCursor:
          type: string
          description: Present when more items follow.
    CalendarDayAppointmentDto:
      properties:
        id:
          type: string
        patientId:
          type: string
        appointmentTypeId:
          type: string
        status:
          type: string
          enum:
            - requested
            - booked
      type: object
      required:
        - id
        - patientId
        - appointmentTypeId
        - status
    CalendarDayAppointmentTypeDto:
      properties:
        id:
          type: string
        name:
          type: string
        duration:
          type: integer
        grid:
          type: integer
        buffer:
          type: integer
        needsConfirmation:
          type: boolean
      type: object
      required:
        - id
        - name
        - duration
        - grid
        - buffer
        - needsConfirmation
    CalendarDayBusyDto:
      properties:
        startsAt:
          oneOf:
            - format: date
              type: string
            - format: date-time
              type: string
        endsAt:
          oneOf:
            - format: date
              type: string
            - format: date-time
              type: string
        heldUntil:
          oneOf:
            - format: date
              type: string
            - format: date-time
              type: string
        appointment:
          $ref: '#/components/schemas/CalendarDayAppointmentDto'
      type: object
      required:
        - startsAt
        - endsAt
        - heldUntil
    CalendarDaySpanDto:
      properties:
        startsAt:
          oneOf:
            - format: date
              type: string
            - format: date-time
              type: string
        endsAt:
          oneOf:
            - format: date
              type: string
            - format: date-time
              type: string
      type: object
      required:
        - startsAt
        - endsAt
    DayRangeDto:
      properties:
        start:
          pattern: ^\d{2}:\d{2}$
          type: string
        end:
          pattern: ^\d{2}:\d{2}$
          type: string
      type: object
      required:
        - start
        - end
    FormBlock:
      type: object
      description: 'A group (`type: group`, `blocks`) or a field (`type: field`, `widget`, `required`, `readOnly`, `constraints`, `options`, `lookup`, `visibleWhen`, `requiredWhen`, `value`). Labels are translation keys.'
      required:
        - type
        - name
        - label
      properties:
        type:
          enum:
            - group
            - field
        name:
          type: string
        label:
          type: string
        widget:
          type: string
        required:
          type: boolean
        readOnly:
          type: boolean
        constraints:
          type: object
        options:
          type: array
          items:
            type: object
            properties:
              value: {}
              label:
                type: string
        multiple:
          type: boolean
        lookup:
          type: object
          properties:
            operation:
              type: string
            method:
              type: string
            path:
              type: string
        visibleWhen:
          type: object
        requiredWhen:
          type: object
        value: {}
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/FormBlock'
    OpeningRangeDto:
      properties:
        weekday:
          type: string
          enum:
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday
        start:
          pattern: ^\d{2}:\d{2}$
          type: string
        end:
          pattern: ^\d{2}:\d{2}$
          type: string
      type: object
      required:
        - weekday
        - start
        - end
    Problem:
      type: object
      description: Problem details (RFC 9457) with a stable machine-readable code.
      required:
        - type
        - title
        - status
        - code
        - requestId
      properties:
        type:
          type: string
          description: URI identifying the kind of problem.
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Stable error code; branch on this, not on the title.
        detail:
          type: string
        issues:
          type: array
          description: Present when the request failed validation.
          items:
            type: object
            required:
              - path
              - code
              - message
            properties:
              path:
                type: string
                description: Dotted path, for example body.items.0.sku.
              code:
                type: string
              message:
                type: string
        facts:
          type: object
          description: The facts of the refusal its code exposes, by name. Absent when it exposes none.
          additionalProperties: true
        requestId:
          type: string
    TimeSpan:
      properties:
        startsAt:
          oneOf:
            - format: date
              type: string
            - format: date-time
              type: string
        endsAt:
          oneOf:
            - format: date
              type: string
            - format: date-time
              type: string
      type: object
      required:
        - startsAt
        - endsAt
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
