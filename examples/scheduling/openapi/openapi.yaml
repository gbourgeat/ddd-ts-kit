openapi: '3.1.0'
info:
  title: scheduling
  version: '0.83.3'
tags:
  - name: analytics
  - name: audit
  - name: identity
  - name: notification
  - name: scheduling
paths:
  /appointments:
    get:
      operationId: searchAppointments
      summary: Search appointments
      tags:
        - scheduling
      security:
        - bearer: []
      parameters:
        - name: filter[id]
          in: query
          description: 'Filters on `id`, written `<operator>:<value>`; the value alone means `eq`. Operators: eq, in. The value is text.'
          required: false
          schema:
            type: string
            description: 'Filters on `id`, written `<operator>:<value>`; the value alone means `eq`. Operators: eq, in. The value is text.'
            x-filter-operators:
              - eq
              - in
            x-filter-type: string
        - name: filter[calendarId]
          in: query
          description: 'Filters on `calendarId`, written `<operator>:<value>`; the value alone means `eq`. Operators: eq, in. The value is text.'
          required: false
          schema:
            type: string
            description: 'Filters on `calendarId`, written `<operator>:<value>`; the value alone means `eq`. Operators: eq, in. The value is text.'
            x-filter-operators:
              - eq
              - in
            x-filter-type: string
        - name: filter[practiceId]
          in: query
          description: 'Filters on `practiceId`, written `<operator>:<value>`; the value alone means `eq`. Operators: eq. The value is text.'
          required: false
          schema:
            type: string
            description: 'Filters on `practiceId`, written `<operator>:<value>`; the value alone means `eq`. Operators: eq. The value is text.'
            x-filter-operators:
              - eq
            x-filter-type: string
        - name: filter[practitionerId]
          in: query
          description: 'Filters on `practitionerId`, written `<operator>:<value>`; the value alone means `eq`. Operators: eq. The value is text.'
          required: false
          schema:
            type: string
            description: 'Filters on `practitionerId`, written `<operator>:<value>`; the value alone means `eq`. Operators: eq. The value is text.'
            x-filter-operators:
              - eq
            x-filter-type: string
        - name: filter[patientId]
          in: query
          description: 'Filters on `patientId`, written `<operator>:<value>`; the value alone means `eq`. Operators: eq. The value is text.'
          required: false
          schema:
            type: string
            description: 'Filters on `patientId`, written `<operator>:<value>`; the value alone means `eq`. Operators: eq. The value is text.'
            x-filter-operators:
              - eq
            x-filter-type: string
        - name: filter[appointmentTypeId]
          in: query
          description: 'Filters on `appointmentTypeId`, written `<operator>:<value>`; the value alone means `eq`. Operators: eq. The value is text.'
          required: false
          schema:
            type: string
            description: 'Filters on `appointmentTypeId`, written `<operator>:<value>`; the value alone means `eq`. Operators: eq. The value is text.'
            x-filter-operators:
              - eq
            x-filter-type: string
        - name: filter[startsAt]
          in: query
          description: 'Filters on `startsAt`, written `<operator>:<value>`; the value alone means `eq`. Operators: gte, lt, between. The value is an ISO 8601 instant with its zone.'
          required: false
          schema:
            type: string
            description: 'Filters on `startsAt`, written `<operator>:<value>`; the value alone means `eq`. Operators: gte, lt, between. The value is an ISO 8601 instant with its zone.'
            x-filter-operators:
              - gte
              - lt
              - between
            x-filter-type: instant
        - name: filter[heldUntil]
          in: query
          description: 'Filters on `heldUntil`, written `<operator>:<value>`; the value alone means `eq`. Operators: gt. The value is an ISO 8601 instant with its zone.'
          required: false
          schema:
            type: string
            description: 'Filters on `heldUntil`, written `<operator>:<value>`; the value alone means `eq`. Operators: gt. The value is an ISO 8601 instant with its zone.'
            x-filter-operators:
              - gt
            x-filter-type: instant
        - name: filter[day]
          in: query
          description: 'Filters on `day`, written `<operator>:<value>`; the value alone means `eq`. Operators: eq, gte, lte, between. The value is text.'
          required: false
          schema:
            type: string
            description: 'Filters on `day`, written `<operator>:<value>`; the value alone means `eq`. Operators: eq, gte, lte, between. The value is text.'
            x-filter-operators:
              - eq
              - gte
              - lte
              - between
            x-filter-type: string
        - name: filter[status]
          in: query
          description: 'Filters on `status`, written `<operator>:<value>`; the value alone means `eq`. Operators: eq, ne, in. The value is text.'
          required: false
          schema:
            type: string
            description: 'Filters on `status`, written `<operator>:<value>`; the value alone means `eq`. Operators: eq, ne, in. The value is text.'
            x-filter-operators:
              - eq
              - ne
              - in
            x-filter-type: string
        - name: filter[confirmBefore]
          in: query
          description: 'Filters on `confirmBefore`, written `<operator>:<value>`; the value alone means `eq`. Operators: isNull. The value is an ISO 8601 instant with its zone.'
          required: false
          schema:
            type: string
            description: 'Filters on `confirmBefore`, written `<operator>:<value>`; the value alone means `eq`. Operators: isNull. The value is an ISO 8601 instant with its zone.'
            x-filter-operators:
              - isNull
            x-filter-type: instant
        - name: filter[cancelledBy]
          in: query
          description: 'Filters on `cancelledBy`, written `<operator>:<value>`; the value alone means `eq`. Operators: eq, isNull. The value is text.'
          required: false
          schema:
            type: string
            description: 'Filters on `cancelledBy`, written `<operator>:<value>`; the value alone means `eq`. Operators: eq, isNull. The value is text.'
            x-filter-operators:
              - eq
              - isNull
            x-filter-type: string
        - name: sort
          in: query
          description: The fields to sort by, a leading "-" for descending, repeated or separated by commas.
          required: false
          schema:
            type: array
            items:
              type: string
              enum:
                - startsAt
                - '-startsAt'
                - day
                - '-day'
                - changedAt
                - '-changedAt'
                - id
                - '-id'
            description: The fields to sort by, a leading "-" for descending, repeated or separated by commas.
        - name: limit
          in: query
          description: Size of the page.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
            description: Size of the page.
        - name: offset
          in: query
          description: Items to skip. Not with `cursor`.
          required: false
          schema:
            type: integer
            minimum: 0
            description: Items to skip. Not with `cursor`.
        - name: cursor
          in: query
          description: The `nextCursor` of the previous page. Not with `offset`.
          required: false
          schema:
            type: string
            minLength: 1
            description: The `nextCursor` of the previous page. Not with `offset`.
      responses:
        '200':
          description: One page of the search.
          headers:
            Cache-Control:
              description: How the caches on the way may keep this answer.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgendaLinePage'
        '401':
          description: 'Unauthorized. Error codes: UNAUTHORIZED.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          x-error-codes:
            - UNAUTHORIZED
        '403':
          description: 'Forbidden. Error codes: FORBIDDEN.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          x-error-codes:
            - FORBIDDEN
        '406':
          description: 'Not Acceptable. Error codes: NOT_ACCEPTABLE.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          x-error-codes:
            - NOT_ACCEPTABLE
        '422':
          description: 'Unprocessable Content. Error codes: INVALID_CRITERIA, VALIDATION_FAILED.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          x-error-codes:
            - INVALID_CRITERIA
            - VALIDATION_FAILED
    post:
      operationId: bookAppointment
      summary: Book appointment
      tags:
        - scheduling
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                startsAt:
                  oneOf:
                    - format: date
                      type: string
                    - format: date-time
                      type: string
                calendarId:
                  minLength: 1
                  type: string
                appointmentTypeId:
                  minLength: 1
                  type: string
                patientId:
                  minLength: 1
                  type: string
                internalNote:
                  maxLength: 2000
                  type: string
                  minLength: 1
                  x-field-access:
                    read:
                      permission: scheduling:appointment.note.read
                    write:
                      permission: scheduling:appointment.note.write
              type: object
              required:
                - startsAt
                - calendarId
                - appointmentTypeId
          application/xml:
            schema:
              properties:
                startsAt:
                  oneOf:
                    - format: date
                      type: string
                    - format: date-time
                      type: string
                calendarId:
                  minLength: 1
                  type: string
                appointmentTypeId:
                  minLength: 1
                  type: string
                patientId:
                  minLength: 1
                  type: string
                internalNote:
                  maxLength: 2000
                  type: string
                  minLength: 1
                  x-field-access:
                    read:
                      permission: scheduling:appointment.note.read
                    write:
                      permission: scheduling:appointment.note.write
              type: object
              required:
                - startsAt
                - calendarId
                - appointmentTypeId
      responses:
        '201':
          description: Done; the body carries the identifier.
          headers:
            Cache-Control:
              description: How the caches on the way may keep this answer.
              schema:
                type: string
                const: no-store
            Vary:
              description: The request headers this answer depends on, besides the URL.
              schema:
                type: string
                const: accept
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
            application/xml:
              schema:
                $ref: '#/components/schemas/Accepted'
        '401':
          description: 'Unauthorized. Error codes: UNAUTHORIZED.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/problem+xml:
              schema:
                $ref: '#/components/schemas/Problem'
          x-error-codes:
            - UNAUTHORIZED
        '403':
          description: 'Forbidden. Error codes: FORBIDDEN.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/problem+xml:
              schema:
                $ref: '#/components/schemas/Problem'
          x-error-codes:
            - FORBIDDEN
        '404':
          description: 'Not Found. Error codes: UNKNOWN_CALENDAR.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/problem+xml:
              schema:
                $ref: '#/components/schemas/Problem'
          x-error-codes:
            - UNKNOWN_CALENDAR
        '406':
          description: 'Not Acceptable. Error codes: NOT_ACCEPTABLE.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/problem+xml:
              schema:
                $ref: '#/components/schemas/Problem'
          x-error-codes:
            - NOT_ACCEPTABLE
        '409':
          description: 'Conflict. Error codes: PATIENT_LIMIT_REACHED, SLOT_TAKEN.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/problem+xml:
              schema:
                $ref: '#/components/schemas/Problem'
          x-error-codes:
            - PATIENT_LIMIT_REACHED
            - SLOT_TAKEN
        '415':
          description: 'Unsupported Media Type. Error codes: UNSUPPORTED_MEDIA_TYPE.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/problem+xml:
              schema:
                $ref: '#/components/schemas/Problem'
          x-error-codes:
            - UNSUPPORTED_MEDIA_TYPE
        '422':
          description: 'Unprocessable Content. Error codes: BOOKING_TOO_FAR, BOOKING_TOO_LATE, OFF_GRID, OUTSIDE_AVAILABILITY, UNKNOWN_APPOINTMENT_TYPE, VALIDATION_FAILED.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/problem+xml:
              schema:
                $ref: '#/components/schemas/Problem'
          x-error-codes:
            - BOOKING_TOO_FAR
            - BOOKING_TOO_LATE
            - OFF_GRID
            - OUTSIDE_AVAILABILITY
            - UNKNOWN_APPOINTMENT_TYPE
            - VALIDATION_FAILED
  /appointments/{appointmentId}:
    get:
      operationId: getAppointment
      summary: Get appointment
      tags:
        - scheduling
      security:
        - bearer: []
      parameters:
        - name: appointmentId
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: The answer.
          headers:
            Cache-Control:
              description: How the caches on the way may keep this answer.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                properties:
                  id:
                    type: string
                  calendarId:
                    type: string
                  practiceId:
                    type: string
                  practitionerId:
                    type: string
                  patientId:
                    type: string
                  appointmentTypeId:
                    type: string
                  startsAt:
                    oneOf:
                      - format: date
                        type: string
                      - format: date-time
                        type: string
                  endsAt:
                    oneOf:
                      - format: date
                        type: string
                      - format: date-time
                        type: string
                  day:
                    pattern: ^\d{4}-\d{2}-\d{2}$
                    type: string
                  status:
                    type: string
                    enum:
                      - requested
                      - booked
                      - cancelled
                      - expired
                      - completed
                      - no-show
                  confirmBefore:
                    oneOf:
                      - format: date
                        type: string
                      - format: date-time
                        type: string
                  cancelledBy:
                    type: string
                    enum:
                      - patient
                      - practice
                  patientName:
                    type: string
                  internalNote:
                    type: string
                    x-field-access:
                      read:
                        permission: scheduling:appointment.note.read
                type: object
                required:
                  - id
                  - calendarId
                  - practiceId
                  - practitionerId
                  - patientId
                  - appointmentTypeId
                  - startsAt
                  - endsAt
                  - day
                  - status
        '401':
          description: 'Unauthorized. Error codes: UNAUTHORIZED.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          x-error-codes:
            - UNAUTHORIZED
        '403':
          description: 'Forbidden. Error codes: FORBIDDEN.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          x-error-codes:
            - FORBIDDEN
        '404':
          description: 'Not Found. Error codes: APPOINTMENT_NOT_FOUND.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          x-error-codes:
            - APPOINTMENT_NOT_FOUND
        '406':
          description: 'Not Acceptable. Error codes: NOT_ACCEPTABLE.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          x-error-codes:
            - NOT_ACCEPTABLE
        '422':
          description: 'Unprocessable Content. Error codes: VALIDATION_FAILED.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          x-error-codes:
            - VALIDATION_FAILED
