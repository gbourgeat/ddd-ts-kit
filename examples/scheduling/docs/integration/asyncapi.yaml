            type: string
            description: 'Unique id of the event: the idempotency key.'
          type:
            type: string
            const: identity.delegation.revoked
          version:
            type: integer
            const: 1
          occurredAt:
            type: string
            format: date-time
          payload:
            properties:
              delegationId:
                type: string
              practiceId:
                type: string
              practitionerId:
                type: string
              assistantId:
                type: string
              cause:
                type: string
                enum:
                  - revoked
                  - expired
                  - member-removed
            type: object
            required:
              - delegationId
              - practiceId
              - practitionerId
              - assistantId
              - cause
          traceparent:
            type: string
            description: W3C traceparent captured at publication.
          correlationId:
            type: string
    identity.person.registered.v1:
