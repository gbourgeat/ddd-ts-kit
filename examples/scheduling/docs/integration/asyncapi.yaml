asyncapi: '3.0.0'
info:
  title: scheduling
  version: '0.20.0'
channels:
  identity.delegation.granted:
    address: identity.delegation.granted
    description: A practitioner let an assistant of the same practice manage their calendars, with or without their availability, until an optional end.
    messages:
      v1:
        $ref: '#/components/messages/identity.delegation.granted.v1'
  identity.delegation.revoked:
    address: identity.delegation.revoked
    description: 'A delegation ended: withdrawn, expired at its end date, or because one of the two left the practice.'
    messages:
      v1:
        $ref: '#/components/messages/identity.delegation.revoked.v1'
  identity.person.registered:
    address: identity.person.registered
    description: A person signed in for the first time and is now known to the platform, with the name and the address to reach them.
    messages:
      v1:
        $ref: '#/components/messages/identity.person.registered.v1'
  identity.practice.member-added:
    address: identity.practice.member-added
    description: A person became a member of a practice with a role; the time zone of the practice travels with it so that a consumer needs nothing else to place the member.
    messages:
      v1:
        $ref: '#/components/messages/identity.practice.member-added.v1'
  identity.practice.member-removed:
    address: identity.practice.member-removed
    description: 'A membership ended: the person no longer holds this role in the practice.'
    messages:
      v1:
        $ref: '#/components/messages/identity.practice.member-removed.v1'
  identity.practice.opened:
    address: identity.practice.opened
    description: A practice was opened, in its time zone, with its first manager.
    messages:
      v1:
        $ref: '#/components/messages/identity.practice.opened.v1'
  scheduling.appointment.booked:
    address: scheduling.appointment.booked
    description: 'A slot is now held for a patient: booked, or requested when the patient must still confirm before a deadline.'
    messages:
      v1:
        $ref: '#/components/messages/scheduling.appointment.booked.v1'
  scheduling.appointment.cancelled:
    address: scheduling.appointment.cancelled
    description: An appointment was cancelled before taking place, by the patient or by the practice; its slot is free again. The reason given stays in scheduling.
    messages:
      v1:
        $ref: '#/components/messages/scheduling.appointment.cancelled.v1'
  scheduling.appointment.completed:
    address: scheduling.appointment.completed
    description: The appointment took place.
    messages:
      v1:
        $ref: '#/components/messages/scheduling.appointment.completed.v1'
  scheduling.appointment.confirmed:
    address: scheduling.appointment.confirmed
    description: 'The patient confirmed a requested appointment: it will be honoured.'
    messages:
      v1:
        $ref: '#/components/messages/scheduling.appointment.confirmed.v1'
  scheduling.appointment.expired:
    address: scheduling.appointment.expired
    description: A requested appointment was not confirmed in time; its slot is free again.
    messages:
      v1:
        $ref: '#/components/messages/scheduling.appointment.expired.v1'
  scheduling.appointment.marked-no-show:
    address: scheduling.appointment.marked-no-show
    description: The patient did not come to the appointment.
    messages:
      v1:
        $ref: '#/components/messages/scheduling.appointment.marked-no-show.v1'
  scheduling.appointment.rescheduled:
    address: scheduling.appointment.rescheduled
    description: An appointment moved to another slot of the same calendar, in one step; the previous slot is free again.
    messages:
      v1:
        $ref: '#/components/messages/scheduling.appointment.rescheduled.v1'
  scheduling.calendar.created:
    address: scheduling.calendar.created
    description: A practitioner has a new calendar in a practice, in the time zone of that practice.
    messages:
      v1:
        $ref: '#/components/messages/scheduling.calendar.created.v1'
operations:
  send.identity.delegation.granted:
    action: send
    channel:
      $ref: '#/channels/identity.delegation.granted'
    messages:
      - $ref: '#/channels/identity.delegation.granted/messages/v1'
