components:
  messages:
    identity.delegation.granted.v1:
      name: identity.delegation.granted
      title: identity.delegation.granted v1
      summary: A practitioner let an assistant of the same practice manage their calendars, with or without their availability, until an optional end.
      contentType: application/json
      tags:
        - name: identity
      payload:
        type: object
        required:
          - id
          - type
          - version
          - occurredAt
          - payload
        properties:
          id:
            type: string
            description: 'Unique id of the event: the idempotency key.'
          type:
            type: string
            const: identity.delegation.granted
          version:
            type: integer
            const: 1
          occurredAt:
            type: string
            format: date-time
          payload:
            properties:
              delegationId:
                type: string
              practiceId:
                type: string
              practitionerId:
                type: string
              assistantId:
                type: string
              availabilityIncluded:
                type: boolean
              endsAt:
                oneOf:
                  - format: date
                    type: string
                  - format: date-time
                    type: string
            type: object
            required:
              - delegationId
              - practiceId
              - practitionerId
              - assistantId
              - availabilityIncluded
          traceparent:
            type: string
            description: W3C traceparent captured at publication.
          correlationId:
            type: string
    identity.delegation.revoked.v1:
      name: identity.delegation.revoked
      title: identity.delegation.revoked v1
      summary: 'A delegation ended: withdrawn, expired at its end date, or because one of the two left the practice.'
      contentType: application/json
      tags:
        - name: identity
      payload:
        type: object
        required:
          - id
          - type
          - version
          - occurredAt
          - payload
        properties:
