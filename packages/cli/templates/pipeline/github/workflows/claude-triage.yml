name: Claude triage

# Opt-in (--ci-extras claude-triage): when a run of the CI workflow fails, Claude Code reads the
# logs of its failed jobs and the files they name, with read-only tools, and writes a three-line
# triage (the most likely cause, flaky or real, what to do) to the summary of this job and as a
# comment on the pull request of the run. It changes nothing and reruns nothing: a person decides.
# It spends API tokens on every failed run; the gate job of ci.yml never needs it. The model is
# reached with ANTHROPIC_API_KEY, a secret of the repository, or through Amazon Bedrock, Google
# Vertex AI or Microsoft Foundry: uncomment the matching input below and add the credential step
# of the provider before the action, as its documentation (docs/cloud-providers.md of
# anthropics/claude-code-action) shows.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  triage:
    name: Triage of the failed run
    # A failure of a run of the repository's own branches: a fork does not read the secret.
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: The names and the logs of the failed jobs, bounded
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p .triage
          gh run view "$RUN_ID" --json jobs --jq '.jobs[] | select(.conclusion == "failure") | .name' > .triage/failed-jobs.txt || true
          gh run view "$RUN_ID" --log-failed 2>&1 | tail -c 400000 > .triage/log.txt || true
          echo "Failed jobs:"; cat .triage/failed-jobs.txt
      - uses: anthropics/claude-code-action@ae68417a745a5df4b2124873632bd73a2255e6f6 # v1.0.259
        id: triage
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # use_bedrock: "true"
          # use_vertex: "true"
          # use_foundry: "true"
          # Read-only tools; the answer is held to a schema, read by the next step. `--model <id>` pins a model.
          claude_args: |
            --max-turns 15
            --allowedTools "Read,Grep,Glob"
            --json-schema '{"type":"object","properties":{"cause":{"type":"string"},"kind":{"type":"string","enum":["flaky","real"]},"action":{"type":"string"}},"required":["cause","kind","action"]}'
          prompt: |
            The CI run ${{ github.event.workflow_run.html_url }} of commit ${{ github.event.workflow_run.head_sha }} failed. The names of its failed jobs are in .triage/failed-jobs.txt and their logs in .triage/log.txt (the last 400 kB). Read them, and the files of the repository they name, with Read, Grep and Glob only: change nothing, run nothing.

            Answer with three fields. cause: the most likely cause in one line, naming the job and the file and line when the log gives one. kind: flaky when the same commit would most likely pass again (a timeout, a registry or network error, a port already in use, a service that did not become healthy, a test that depends on timing), real otherwise. action: what to do in one line, either rerunning the job, or the fix to make and where.
      - name: The triage in the summary of this job and on the pull request of the run
        env:
          GH_TOKEN: ${{ github.token }}
          OUTPUT: ${{ steps.triage.outputs.structured_output }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          if [ -z "$OUTPUT" ]; then
            echo "No triage: the action gave no structured output." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          triage="$(printf '%s' "$OUTPUT" | jq -r '"Most likely cause: \(.cause)\nFlaky or real: \(.kind)\nWhat to do: \(.action)"')"
          {
            echo "## Triage of the failed CI run"
            echo
            echo "$RUN_URL"
            echo
            echo "$triage"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$PR" ]; then
            gh pr comment "$PR" --body "$(printf '<!-- ddd-ts-kit:claude-triage -->\n**Triage of the failed CI run** %s\n\n%s\n\n_Written by Claude from the logs, read-only: a person decides._' "$RUN_URL" "$triage")"
          fi
