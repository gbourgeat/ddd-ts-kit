name: Intent to spec

# The headless design pass: when a pull request merged into the default branch turns an intent
# of docs/architecture/intents/ to `Status: accepted`, the story skill runs phases 1 to 4 of
# the story without an owner (the questions written with their recommended option taken
# provisionally, the rows, the design review, the acceptance written and locked) and opens the
# pull request whose body is the list of questions; the owner answers in the review, and the
# build starts from the merged answers. Opt-in and paid: it needs the ANTHROPIC_API_KEY secret
# and consumes API tokens on each accepted intent; nothing runs without the secret.

on:
  pull_request:
    types: [closed]
    paths:
      - 'docs/architecture/intents/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  specify:
    name: Specify each accepted intent
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit and its first parent: the diff of the pull request on the trunk.
          fetch-depth: 2
          ref: ${{ github.event.pull_request.base.ref }}
      - uses: ./.github/actions/setup
      - name: 'The intents this merge accepted (a line Status: accepted added in the header)'
        id: accepted
        run: |
          accepted=$(git diff --unified=0 HEAD^1 HEAD -- docs/architecture/intents/ \
            | awk '/^\+\+\+ b\//{file=substr($0, 7)} /^\+.*Status: *accepted/{print file}' | sort -u)
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$accepted" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "count=$(printf '%s\n' "$accepted" | grep -c '^docs/' || true)" >> "$GITHUB_OUTPUT"
      - name: Claude Code and the plugin
        if: steps.accepted.outputs.count != '0'
        run: |
          npm install --global @anthropic-ai/claude-code
          claude plugin marketplace add gbourgeat/ddd-ts-kit
          claude plugin install ddd-ts-kit@ddd-ts-kit
      - name: One story per accepted intent, headless, to its pull request
        if: steps.accepted.outputs.count != '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # A pull request opened with the token of the workflow starts no other workflow: give a
          # token of an app or a person for the checks of the story to run on it.
          GH_TOKEN: ${{ secrets.INTENT_TO_SPEC_TOKEN || secrets.GITHUB_TOKEN }}
          ACCEPTED: ${{ steps.accepted.outputs.files }}
        run: |
          git config user.name 'intent-to-spec'
          git config user.email 'intent-to-spec@users.noreply.github.com'
          git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}"
          printf '%s\n' "$ACCEPTED" | grep '^docs/' | while read -r intent; do
            code=$(basename "$intent" .md | tr '[:lower:]' '[:upper:]' | tr -c 'A-Z0-9-\n' '-')
            claude -p "/ddd-ts-kit:story $code --headless $intent" \
              --permission-mode acceptEdits \
              --output-format text
          done
