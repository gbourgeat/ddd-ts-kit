workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # A pipeline schedule (Build > Pipeline schedules, every night on the default branch) runs everything.
    - if: $CI_PIPELINE_SOURCE == "schedule"

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.v2.gitlab-ci.yml
    rules:
      - if: $GITLAB_FEATURES =~ /\bdependency_scanning\b/

stages:
  - install
  - test
  - security
  - gate

variables:
  AST_ENABLE_MR_PIPELINES: 'true'
  NODE_VERSION: '24'
  # Behind the dependency proxy of a group, a registry that rate-limits is never asked twice:
  # POSTGRES_IMAGE: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/postgres:18
  POSTGRES_IMAGE: postgres:18
  # The upstream MinIO project stopped publishing images in 2025; pgsty/minio builds the same server.
  MINIO_IMAGE: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
  # OpenSearch 3.9.0, the node the specs of @ddd-ts-kit/opensearch run against.
  OPENSEARCH_IMAGE: opensearchproject/opensearch:3@sha256:3b55f6b6249cfdb92b52ee59adc8a266203ba9ef9f5d82544fad6f1af2f3609e

default:
  # A newer commit of a merge request supersedes the pipeline in progress; the default branch finishes every pipeline.
  interruptible: true
  # An image that could not be pulled (a registry that rate-limits once) or a runner that failed is tried again; a failing script is not.
  retry:
    max: 2
    when: [runner_system_failure, stuck_or_timeout_failure, scheduler_failure]

# One install per lockfile and Node line, shared by every job and every pipeline: the key holds
# the lockfile and the root manifest, so a hit is what `npm ci` gives for them. A job that finds
# no cache installs.
.node:
  image: node:${NODE_VERSION}-bookworm-slim
  cache:
    key:
      prefix: node-$NODE_VERSION
      files:
        - package-lock.json
        - package.json
    paths:
      - node_modules/
      - packages/*/node_modules/
      - examples/*/node_modules/
      - site/node_modules/
    policy: pull
  before_script:
    - test -d node_modules || npm ci

# One build per pipeline: the install job builds the packages and hands dist/ and the build
# info over as artifacts. A job that received none builds.
.built:
  extends: .node
  needs: [install]
  before_script:
    - test -d node_modules || npm ci
    - test -d packages/kernel/dist || npm run build

.junit:
  artifacts:
    when: always
    expire_in: 14 days
    reports:
      junit: reports/junit.xml

install:
  extends: .node
  stage: install
  # The image with git: what a merge request covers is read from the difference with its target.
  image: node:${NODE_VERSION}-bookworm
  cache:
    key:
      prefix: node-$NODE_VERSION
      files:
        - package-lock.json
        - package.json
    paths:
      - node_modules/
      - packages/*/node_modules/
      - examples/*/node_modules/
      - site/node_modules/
    policy: pull-push
  script:
    - node --version
    - npm run build
    - if [ -n "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}" ]; then git fetch --quiet --depth=1 origin "$CI_MERGE_REQUEST_DIFF_BASE_SHA"; fi
    # Everything on the default branch and on a schedule, the affected packages on a merge request.
    - node pipeline/monorepo/affected-packages.mjs --base "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}" --format github | sed 's/^/AFFECTED_/' | tee affected.env
  artifacts:
    expire_in: 1 day
    paths:
      - packages/*/dist/
      - packages/*/tsconfig.tsbuildinfo
    reports:
      dotenv: affected.env

merge-request-title:
  extends: .node
  stage: test
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - printf '%s\n' "$CI_MERGE_REQUEST_TITLE" | sed -E 's/^(\[Draft\]|Draft:|\(Draft\)|WIP:) *//I' | npx --no -- commitlint --verbose

typecheck:
  extends: .built
  stage: test
  script:
    - npm run ci:typecheck

lint:
  extends: .built
  stage: test
  variables:
    ESLINT_CODE_QUALITY_REPORT: reports/gl-code-quality-eslint.json
  script:
    - mkdir -p reports
    - npm run ci:format
    - npm run ci:lint -- --format gitlab
  artifacts:
    when: always
    expire_in: 14 days
    reports:
      codequality: reports/gl-code-quality-eslint.json

architecture:
  extends: .built
  stage: test
  script:
    - npm run ci:arch
  # The coverage table names the file under its floor, not the branch: the lcov the run wrote names it (#723).
  after_script:
    - node pipeline/monorepo/uncovered-branches.mjs coverage/plugin.lcov

deadcode:
  extends: .built
  stage: test
  script:
    - npm run ci:deadcode

docs:
  stage: test
  needs: []
  image: node:${NODE_VERSION}-bookworm-slim
  script:
    # No em dash or en dash, and the French documentation complete and current: the scripts need no dependency.
    - npm run ci:docs

unit:
  extends: [.built, .junit]
  stage: test
  script:
    - if [ "$AFFECTED_scope" = "none" ]; then echo "Only documents changed, no spec to run."; exit 0; fi
    - export KIT_AFFECTED="$AFFECTED_packages"
    # Each package held to its coverage floor (vitest.config.ts); coverage is measured once, on this Node line.
    - npm run ci:test:unit -- --reporter=default --reporter=junit --outputFile.junit=reports/junit.xml $AFFECTED_filters
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    when: always
    expire_in: 14 days
    reports:
      junit: reports/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml

unit-oldest:
  extends: [.built, .junit]
  stage: test
  variables:
    NODE_VERSION: '22'
  # The install job fills the cache of its own Node line: this job fills the one of Node 22.
  cache:
    policy: pull-push
  script:
    - if [ "$AFFECTED_scope" = "none" ]; then echo "Only documents changed, no spec to run."; exit 0; fi
    # The same specs on the oldest supported Node.
    - npm test -- --reporter=default --reporter=junit --outputFile.junit=reports/junit.xml $AFFECTED_filters

alias:
  extends: .built
  stage: test
  parallel:
    matrix:
      - NODE_VERSION: ['22', '24']
  script:
    # The import alias at run time on this Node: every stack built, run compiled with plain node, from sources under tsx and vitest.
    - npm run ci:test:alias

integration:
  extends: [.built, .junit]
  stage: test
  services:
    - name: $POSTGRES_IMAGE
      alias: postgres
    - name: $MINIO_IMAGE
      alias: minio
      command: ['server', '/data']
    - name: docker.dragonflydb.io/dragonflydb/dragonfly:v2.0.2@sha256:061f00b201b58e12f974e4e96c761a881ee1c05e9d8ee967466a604b7299753b
      alias: dragonfly
      command: ['--proactor_threads=2', '--maxmemory=512mb']
    # One node, no disk watermark: a setting with a dot is a flag here, a variable name holds none.
    - name: $OPENSEARCH_IMAGE
      alias: opensearch
      command: ['opensearch', '-Ediscovery.type=single-node', '-Ecluster.routing.allocation.disk.threshold_enabled=false']
  variables:
    POSTGRES_USER: app
    POSTGRES_PASSWORD: app
    POSTGRES_DB: app
    MINIO_ROOT_USER: ddd-ts-kit
    MINIO_ROOT_PASSWORD: ddd-ts-kit-secret
    DDD_TS_KIT_TEST_DATABASE_URL: postgres://app:app@postgres:5432/app
    DDD_TS_KIT_TEST_S3_ENDPOINT: http://minio:9000
    DDD_TS_KIT_TEST_REDIS_URL: redis://dragonfly:6379
    DISABLE_SECURITY_PLUGIN: 'true'
    DISABLE_INSTALL_DEMO_CONFIG: 'true'
    OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    DDD_TS_KIT_TEST_OPENSEARCH_URL: http://opensearch:9200
  script:
    - if [ "$AFFECTED_integration" != "true" ]; then echo "No adapter package is reached, no spec to run."; exit 0; fi
    - npm run ci:test:integration -- --reporter=default --reporter=junit --outputFile.junit=reports/junit.xml

e2e:
  extends: [.built, .junit]
  stage: test
  timeout: 30 minutes
  parallel: 4
  script:
    # Every stack generated and held to its own pipeline, a quarter of the spec files on each runner.
    - npm run ci:test:e2e:stacks -- --shard=$CI_NODE_INDEX/$CI_NODE_TOTAL --reporter=default --reporter=junit --outputFile.junit=reports/junit.xml

managers:
  extends: .built
  stage: test
  timeout: 30 minutes
  parallel:
    matrix:
      - DDD_TS_KIT_PACKAGE_MANAGER: [npm, pnpm]
  script:
    # The package manager a generated project pins: pnpm then follows the release each project pins (pmOnFail: download).
    - npm install --global pnpm@12.11.2
    # Installed for real from the packed kit and held to verify: every kind generated on the default stack and a heavy one;
    # from the first minute, the quick start of the README and the other proven stacks.
    - npm run ci:test:managers

example:
  extends: .built
  stage: test
  services:
    - name: ${POSTGRES_IMAGE}
      alias: postgres
  variables:
    POSTGRES_USER: app
    POSTGRES_PASSWORD: app
    POSTGRES_DB: app
  script:
    # Its own gate with the coverage thresholds.
    - npm run verify --workspace examples/scheduling
    # The adapter specs again, on a server: two concurrent bookings meet real transactions.
    - export DATABASE_URL=postgres://app:app@postgres:5432/app
    - npm run db:migrate --workspace examples/scheduling
    - npm run test:postgres --workspace examples/scheduling

conformance:
  extends: .built
  stage: test
  script:
    # Every rule of the catalogue broken once in a copy of the example.
    - npm run example:conformance

audit:
  extends: .node
  stage: security
  needs: []
  script:
    - npm run ci:audit

secrets:
  stage: security
  needs: []
  image:
    name: ghcr.io/gitleaks/gitleaks:v8.30.1
    entrypoint: ['']
  variables:
    GIT_DEPTH: '0'
  script:
    - gitleaks git . --redact --no-banner

package:
  extends: .built
  stage: test
  script:
    - npm run ci:build

gate:
  stage: gate
  image: node:${NODE_VERSION}-bookworm-slim
  variables:
    GIT_STRATEGY: none
  script:
    - echo "Every job of the earlier stages passed."
