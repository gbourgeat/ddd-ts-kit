workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.v2.gitlab-ci.yml
    rules:
      - if: $GITLAB_FEATURES =~ /\bdependency_scanning\b/

stages:
  - install
  - static
  - test
  - security
  - package
  - gate

variables:
  AST_ENABLE_MR_PIPELINES: "true"
  NODE_VERSION: "24"
  POSTGRES_IMAGE: postgres:18

default:
  interruptible: true

.node:
  image: node:${NODE_VERSION}-bookworm-slim
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
    policy: pull
  before_script:
    - npm ci --cache .npm --prefer-offline

.built:
  extends: .node
  before_script:
    - npm ci --cache .npm --prefer-offline
    - npm run build

.junit:
  artifacts:
    when: always
    expire_in: 14 days
    reports:
      junit: reports/junit.xml

install:
  extends: .node
  stage: install
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
    policy: pull-push
  script:
    - node --version && npm --version

merge-request-title:
  extends: .node
  stage: static
  needs: [install]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - printf '%s\n' "$CI_MERGE_REQUEST_TITLE" | sed -E 's/^(\[Draft\]|Draft:|\(Draft\)|WIP:) *//I' | npx --no -- commitlint --verbose

typecheck:
  extends: .node
  stage: static
  needs: [install]
  script:
    - npm run ci:typecheck

lint:
  extends: .built
  stage: static
  needs: [install]
  variables:
    ESLINT_CODE_QUALITY_REPORT: reports/gl-code-quality-eslint.json
  script:
    - mkdir -p reports
    - npm run ci:lint -- --format gitlab
  artifacts:
    when: always
    expire_in: 14 days
    reports:
      codequality: reports/gl-code-quality-eslint.json

architecture:
  extends: .built
  stage: static
  needs: [install]
  script:
    - npm run ci:arch

deadcode:
  extends: .built
  stage: static
  needs: [install]
  script:
    - npm run ci:deadcode

docs:
  extends: .node
  stage: static
  needs: [install]
  script:
    - npm run ci:docs

unit:
  extends: [.built, .junit]
  stage: test
  needs: [typecheck, lint, architecture, deadcode, docs]
  parallel:
    matrix:
      - NODE_VERSION: ["22", "24"]
  script:
    - npm run ci:test:unit -- --reporter=default --reporter=junit --outputFile.junit=reports/junit.xml
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    when: always
    expire_in: 14 days
    reports:
      junit: reports/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml

integration:
  extends: [.built, .junit]
  stage: test
  needs: [unit]
  services:
    - name: $POSTGRES_IMAGE
      alias: postgres
  variables:
    POSTGRES_USER: app
    POSTGRES_PASSWORD: app
    POSTGRES_DB: app
    DDD_TS_KIT_TEST_DATABASE_URL: postgres://app:app@postgres:5432/app
  script:
    - npm run ci:test:integration -- --reporter=default --reporter=junit --outputFile.junit=reports/junit.xml

e2e:
  extends: [.built, .junit]
  stage: test
  needs: [integration]
  timeout: 30 minutes
  script:
    - npm run ci:test:e2e -- --reporter=default --reporter=junit --outputFile.junit=reports/junit.xml

example:
  extends: .built
  stage: test
  needs: [unit]
  services:
    - name: ${POSTGRES_IMAGE}
      alias: postgres
  variables:
    POSTGRES_USER: app
    POSTGRES_PASSWORD: app
    POSTGRES_DB: app
  script:
    - npm run example:verify
    # The adapter specs again, on a server: two concurrent bookings meet real transactions.
    - export DATABASE_URL=postgres://app:app@postgres:5432/app
    - npm run db:migrate --workspace examples/scheduling
    - npm run test:postgres --workspace examples/scheduling

audit:
  extends: .node
  stage: security
  needs: [install]
  script:
    - npm run ci:audit

secrets:
  stage: security
  needs: []
  image:
    name: ghcr.io/gitleaks/gitleaks:v8.30.1
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0"
  script:
    - gitleaks git . --redact --no-banner

package:
  extends: .built
  stage: package
  needs: [unit]
  script:
    - npm run ci:build

gate:
  stage: gate
  image: node:${NODE_VERSION}-bookworm-slim
  variables:
    GIT_STRATEGY: none
  script:
    - echo "Every job of the earlier stages passed."
