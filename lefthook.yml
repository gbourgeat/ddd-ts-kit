min_version: 2.0.0
# The hook runs the lefthook of the checkout it fires in: each worktree its own, and a checkout
# without its dependencies fails the commit instead of skipping the checks.
lefthook: node_modules/.bin/lefthook

# A hook that passes says nothing: a job prints its output only when it fails.
output:
  - failure

pre-commit:
  parallel: true
  jobs:
    - name: oxlint
      # The staged files, type-aware, with the rules of the kit as a JS plugin (.oxlintrc.json): 0.8 s for a commit of
      # thirteen files where ESLint needs 1.7. The pipeline runs ESLint on the trunk and at night, as the reference.
      glob: '*.{ts,mts,cts,js,mjs,cjs}'
      run: npx --no -- oxlint --type-aware --no-error-on-unmatched-pattern {staged_files}
    - name: format
      glob: '*.{ts,mts,cts,js,mjs,cjs,json,jsonc}'
      run: npx --no -- biome format --no-errors-on-unmatched {staged_files}
    - name: no em dash or en dash
      run: npm run check:dashes
    - name: secrets
      # The staged changes, before they are committed, when gitleaks is installed (`gitleaks protect --staged` before
      # 8.19); otherwise one line, and the pipeline scans the whole history anyway.
      run: 'if command -v gitleaks >/dev/null 2>&1; then gitleaks git --pre-commit --staged --redact --no-banner; else echo "secrets: gitleaks is not installed, the staged changes are not scanned here; the pipeline scans the whole history."; fi'

pre-push:
  jobs:
    - name: typecheck
      run: npm run ci:typecheck
    - name: unit tests
      # The specs of the packages the branch reaches and of the packages that depend on them, as on a pull request,
      # without coverage (the pipeline measures it); everything when a file shared by every package changed; nothing
      # when only documents did (docs/proposals/build-and-test-velocity.md).
      # Under the lock of the machine: two heavy commands at most, whoever started them (CONTRIBUTING.md).
      run: bash pipeline/monorepo/heavy-lock.sh node pipeline/monorepo/affected-packages.mjs --base origin/main --run test

commit-msg:
  jobs:
    - name: conventional commit
      run: npx --no -- commitlint --edit {1}
