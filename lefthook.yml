min_version: 2.0.0
# The hook runs the lefthook of the checkout it fires in: each worktree its own, and a checkout
# without its dependencies fails the commit instead of skipping the checks.
lefthook: node_modules/.bin/lefthook

pre-commit:
  parallel: true
  jobs:
    - name: eslint
      glob: '*.{ts,mts,cts,js,mjs,cjs}'
      run: npx --no -- eslint --config eslint.config.mjs --no-warn-ignored {staged_files}
    - name: format
      glob: '*.{ts,mts,cts,js,mjs,cjs,json,jsonc}'
      run: npx --no -- biome format --no-errors-on-unmatched {staged_files}
    - name: no em dash or en dash
      run: npm run check:dashes
    - name: secrets
      # The staged changes, before they are committed, when gitleaks is installed (`gitleaks protect --staged` before
      # 8.19); otherwise one line, and the pipeline scans the whole history anyway.
      run: 'if command -v gitleaks >/dev/null 2>&1; then gitleaks git --pre-commit --staged --redact --no-banner; else echo "secrets: gitleaks is not installed, the staged changes are not scanned here; the pipeline scans the whole history."; fi'

pre-push:
  jobs:
    - name: typecheck
      run: npm run ci:typecheck
    - name: unit tests
      run: npm run ci:test:unit

commit-msg:
  jobs:
    - name: conventional commit
      run: npx --no -- commitlint --edit {1}
