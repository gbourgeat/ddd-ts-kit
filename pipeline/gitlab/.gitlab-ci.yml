workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.v2.gitlab-ci.yml
    rules:
      - if: $GITLAB_FEATURES =~ /\bdependency_scanning\b/

stages:
  - install
  - static
  - test
  - verify
  - security
  - package
  - gate

variables:
  AST_ENABLE_MR_PIPELINES: 'true'
  NODE_IMAGE: node:24-bookworm-slim
  POSTGRES_IMAGE: postgres:18

default:
  interruptible: true

.node:
  image: $NODE_IMAGE
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
    policy: pull
  before_script:
    - npm ci --cache .npm --prefer-offline

.postgres:
  services:
    - name: $POSTGRES_IMAGE
      alias: postgres
  variables:
    POSTGRES_USER: app
    POSTGRES_PASSWORD: app
    POSTGRES_DB: app
    DATABASE_URL: postgres://app:app@postgres:5432/app

.junit:
  artifacts:
    when: always
    expire_in: 14 days
    reports:
      junit: reports/junit.xml

install:
  extends: .node
  stage: install
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
    policy: pull-push
  script:
    - node --version && npm --version

merge-request-title:
  extends: .node
  stage: static
  needs: [install]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - printf '%s\n' "$CI_MERGE_REQUEST_TITLE" | sed -E 's/^(\[Draft\]|Draft:|\(Draft\)|WIP:) *//I' | npx --no -- commitlint --verbose

typecheck:
  extends: .node
  stage: static
  needs: [install]
  script:
    - npm run ci:typecheck

lint:
  extends: .node
  stage: static
  needs: [install]
  variables:
    ESLINT_CODE_QUALITY_REPORT: reports/gl-code-quality-eslint.json
  script:
    - mkdir -p reports
    - npm run ci:format
    - npm run ci:lint -- --format gitlab
  artifacts:
    when: always
    expire_in: 14 days
    reports:
      codequality: reports/gl-code-quality-eslint.json

architecture:
  extends: .node
  stage: static
  needs: [install]
  script:
    - mkdir -p reports
    - npm run --silent ci:arch:check -- --format json > reports/arch.json || true
    - node .gitlab/arch-to-codequality.mjs reports/arch.json reports/gl-code-quality-arch.json
    - npm run ci:arch:graph
  artifacts:
    when: always
    expire_in: 14 days
    reports:
      codequality: reports/gl-code-quality-arch.json

deadcode:
  extends: .node
  stage: static
  needs: [install]
  script:
    - npm run ci:deadcode

unit:
  extends: [.node, .junit]
  stage: test
  needs: [typecheck, lint, architecture, deadcode]
  script:
    - npm run ci:test:unit -- --reporter=default --reporter=junit --outputFile.junit=reports/junit.xml
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    when: always
    expire_in: 14 days
    reports:
      junit: reports/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml

integration:
  extends: [.node, .postgres, .junit]
  stage: test
  needs: [unit]
  script:
    - npm run db:migrate
    - npm run ci:test:integration -- --reporter=default --reporter=junit --outputFile.junit=reports/junit.xml

e2e:
  extends: [.node, .postgres, .junit]
  stage: test
  needs: [integration]
  script:
    - npm run db:migrate
    - npm run ci:test:e2e -- --reporter=default --reporter=junit --outputFile.junit=reports/junit.xml

docs:
  extends: .node
  stage: verify
  needs: [typecheck, lint, architecture, deadcode]
  script:
    - npm run ci:docs

audit:
  extends: .node
  stage: security
  needs: [install]
  script:
    - npm run ci:audit

secrets:
  stage: security
  needs: []
  image:
    name: ghcr.io/gitleaks/gitleaks:v8.30.1
    entrypoint: ['']
  variables:
    GIT_DEPTH: '0'
  script:
    - gitleaks git . --redact --no-banner

build:
  extends: .node
  stage: package
  needs: [e2e]
  script:
    - npm run ci:build

image:
  stage: package
  needs: [build]
  image:
    name: moby/buildkit:v0.34.0-rootless
    entrypoint: ['']
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  script:
    - buildctl-daemonless.sh build --frontend dockerfile.v0 --local context=. --local dockerfile=. --output type=image,name=app:ci,push=false

gate:
  stage: gate
  image: $NODE_IMAGE
  variables:
    GIT_STRATEGY: none
  script:
    - echo "Every job of the earlier stages passed."
