workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    # A merge request reads the cache of ESLint the default branch wrote; the default branch and the night write it.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        LINT_CACHE_POLICY: pull
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables:
        LINT_CACHE_POLICY: pull-push
    # A pipeline schedule (Build > Pipeline schedules, every night on the default branch) runs everything.
    - if: $CI_PIPELINE_SOURCE == "schedule"
      variables:
        LINT_CACHE_POLICY: pull-push

stages:
  - install
  - test
  - security
  - gate

variables:
  NODE_IMAGE: node:24-bookworm-slim
  # Behind the dependency proxy of a group, a registry that rate-limits is never asked twice:
  # POSTGRES_IMAGE: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/postgres:18
  POSTGRES_IMAGE: postgres:18

default:
  # A newer commit of a merge request supersedes the pipeline in progress; the default branch finishes every pipeline.
  interruptible: true
  # An image that could not be pulled (a registry that rate-limits once) or a runner that failed is tried again; a failing script is not.
  retry:
    max: 2
    when: [runner_system_failure, stuck_or_timeout_failure, scheduler_failure]

# One install per lockfile, shared by every job and every pipeline. The key holds the lockfile
# and package.json: a hit is what a fresh install of that lockfile gives. A job that finds no
# cache installs.
.node:
  image: $NODE_IMAGE
  cache:
    key:
      files:
        - package-lock.json
        - package.json
    paths:
      - node_modules/
    policy: pull
  before_script:
    - test -d node_modules || npm ci

.postgres:
  services:
    - name: $POSTGRES_IMAGE
      alias: postgres
  variables:
    POSTGRES_USER: app
    POSTGRES_PASSWORD: app
    POSTGRES_DB: app
    DATABASE_URL: postgres://app:app@postgres:5432/app

.junit:
  artifacts:
    when: always
    expire_in: 14 days
    reports:
      junit: reports/junit.xml

install:
  extends: .node
  stage: install
  # The image with git: what a merge request covers is read from the difference with its target.
  image: node:24-bookworm
  cache:
    key:
      files:
        - package-lock.json
        - package.json
    paths:
      - node_modules/
    policy: pull-push
  script:
    - node --version
    - if [ -n "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}" ]; then git fetch --quiet --depth=1 origin "$CI_MERGE_REQUEST_DIFF_BASE_SHA"; fi
    # Everything on the default branch and on a schedule, the affected contexts on a merge request.
    - npx --no -- ddd-ts-kit affected --base "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}" --format env | tee affected.env
  artifacts:
    reports:
      dotenv: affected.env

merge-request-title:
  extends: .node
  stage: test
  needs: [install]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - printf '%s\n' "$CI_MERGE_REQUEST_TITLE" | sed -E 's/^(\[Draft\]|Draft:|\(Draft\)|WIP:) *//I' | npx --no -- commitlint --verbose

typecheck:
  extends: .node
  stage: test
  needs: [install]
  script:
    - npm run ci:typecheck

lint:
  extends: .node
  stage: test
  needs: [install]
  cache:
    - key:
        files:
          - package-lock.json
          - package.json
      paths:
        - node_modules/
      policy: pull
    # The cache of ESLint (`ddd-ts-kit lint` keys it by the content of each file): a merge request reads the one the
    # default branch wrote last for this lockfile and this config; the default branch and the night lint everything,
    # which also sees a type changed in another file, and write it.
    - key:
        files:
          - package-lock.json
          - eslint.config.mjs
      paths:
        - .eslintcache/
      policy: $LINT_CACHE_POLICY
  variables:
    ESLINT_CODE_QUALITY_REPORT: reports/gl-code-quality-eslint.json
  script:
    - mkdir -p reports
    - npm run ci:format
    # The contexts a merge request does not reach are left to the default branch.
    - npm run ci:lint -- --format gitlab $AFFECTED_LINT
  artifacts:
    when: always
    expire_in: 14 days
    reports:
      codequality: reports/gl-code-quality-eslint.json

architecture:
  extends: .node
  stage: test
  needs: [install]
  script:
    - mkdir -p reports
    - npm run --silent ci:arch:check -- --format json > reports/arch.json || true
    - node .gitlab/arch-to-codequality.mjs reports/arch.json reports/gl-code-quality-arch.json
    - npm run ci:arch:graph
  artifacts:
    when: always
    expire_in: 14 days
    reports:
      codequality: reports/gl-code-quality-arch.json

deadcode:
  extends: .node
  stage: test
  needs: [install]
  script:
    - npm run ci:deadcode

unit:
  extends: [.node, .junit]
  stage: test
  needs: [install]
  script:
    - if [ "$AFFECTED_SCOPE" = "none" ]; then echo "Only documents changed, no spec to run."; exit 0; fi
    - export DDD_TS_KIT_AFFECTED="$AFFECTED_CONTEXTS"
    - npm run ci:test:unit -- --reporter=default --reporter=junit --outputFile.junit=reports/junit.xml $AFFECTED_ARGS
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    when: always
    expire_in: 14 days
    reports:
      junit: reports/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml

integration:
  extends: [.node, .postgres, .junit]
  stage: test
  needs: [install]
  script:
    - if [ "$AFFECTED_SCOPE" = "none" ]; then echo "Only documents changed, no spec to run."; exit 0; fi
    - export DDD_TS_KIT_AFFECTED="$AFFECTED_CONTEXTS"
    - npm run db:migrate
    - npm run ci:test:integration -- --reporter=default --reporter=junit --outputFile.junit=reports/junit.xml $AFFECTED_ARGS

e2e:
  extends: [.node, .postgres, .junit]
  stage: test
  needs: [install]
  script:
    - if [ "$AFFECTED_SCOPE" = "none" ]; then echo "Only documents changed, no spec to run."; exit 0; fi
    - npm run db:migrate
    # The whole application, whatever the contexts a change reaches.
    - npm run ci:test:e2e -- --reporter=default --reporter=junit --outputFile.junit=reports/junit.xml

build:
  extends: .node
  stage: test
  needs: [install]
  script:
    - npm run ci:build
    # The generated documents and contracts, from that build.
    - npm run ci:docs

audit:
  extends: .node
  stage: security
  needs: [install]
  script:
    - npm run ci:audit

secrets:
  stage: security
  needs: []
  image:
    name: ghcr.io/gitleaks/gitleaks:v8.30.1
    entrypoint: ['']
  variables:
    GIT_DEPTH: '0'
  script:
    - gitleaks git . --redact --no-banner

image:
  stage: test
  needs: []
  image:
    name: moby/buildkit:v0.34.0-rootless
    entrypoint: ['']
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  script:
    - buildctl-daemonless.sh build --frontend dockerfile.v0 --local context=. --local dockerfile=. --output type=image,name=app:ci,push=false

gate:
  stage: gate
  image: $NODE_IMAGE
  variables:
    GIT_STRATEGY: none
  script:
    - echo "Every job of the earlier stages passed."
