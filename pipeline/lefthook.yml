min_version: 2.0.0
# The hook runs the lefthook of the checkout it fires in: each worktree its own, and a checkout
# without its dependencies fails the commit instead of skipping the checks.
lefthook: node_modules/.bin/lefthook

pre-commit:
  parallel: true
  jobs:
    - name: eslint
      glob: '*.{ts,mts,cts,js,mjs,cjs}'
      run: npx --no -- eslint --no-warn-ignored {staged_files}
    - name: format
      glob: '*.{ts,mts,cts,js,mjs,cjs,json,jsonc}'
      run: npx --no -- biome format --no-errors-on-unmatched {staged_files}
    - name: architecture
      glob: 'src/**/*.{ts,mts,cts}'
      run: npx --no -- ddd-ts-kit check {staged_files}
    - name: behaviour pages
      glob: '**/*.spec.ts'
      # A spec in the commit changes what the tests state: the pages of docs/behaviour/, and nothing else, are
      # regenerated and join the commit, so that docs --check has nothing to say. A worker confined to its context (.ddd-ts-kit/worker.json)
      # leaves them to the trunk, as every shared file.
      run: 'if [ -f .ddd-ts-kit/worker.json ]; then echo "behaviour pages: left to the trunk, as every shared file of a worker."; else npx --no -- ddd-ts-kit docs --behaviour && git add docs/behaviour; fi'
    - name: commit size
      run: npx --no -- ddd-ts-kit check --commit-size --staged
    - name: secrets
      # The staged changes, before they are committed, when gitleaks is installed (`gitleaks protect --staged` before
      # 8.19); otherwise one line, and the pipeline scans the whole history anyway.
      run: 'if command -v gitleaks >/dev/null 2>&1; then gitleaks git --pre-commit --staged --redact --no-banner; else echo "secrets: gitleaks is not installed, the staged changes are not scanned here; the pipeline scans the whole history."; fi'

pre-push:
  jobs:
    - name: typecheck
      run: npm run ci:typecheck
    - name: unit tests
      # The contexts the branch reaches and the ones downstream of them, as on a pull request; everything when git
      # cannot tell (no origin/HEAD: `git remote set-head origin --auto`). The pipeline runs everything on the trunk.
      run: npx --no -- ddd-ts-kit affected --base origin/HEAD --run ci:test:unit
    - name: merges
      run: npx --no -- ddd-ts-kit verify-merge --warn

commit-msg:
  jobs:
    - name: conventional commit
      run: npx --no -- commitlint --edit {1}
