<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">The two claim strategies of PrismaOutboxStore</title>
  <desc id="desc">With skip-locked, one short transaction locks the due rows with a raw select for update skip locked, reads them and leases them; relays pass over each other's rows. With compare-and-set, the store reads the due rows, then takes each one with an updateMany guarded by the attempt count it read, and reads again to replace the rows another relay took. Both lease a claimed record for leaseMs, so the records of a relay that died come back.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="640" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">The two claim strategies of PrismaOutboxStore</text>

  <!-- left panel: skip-locked -->
  <text x="40" y="76" font-size="16" font-weight="700" fill="#7a4f9a">'skip-locked'</text>
  <text x="160" y="76" font-size="14" fill="#5f6b73">PostgreSQL or MySQL 8</text>
  <rect x="24" y="92" width="444" height="334" rx="12" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="44" y="116" font-size="14" font-weight="600" fill="#5f6b73">one short transaction (or the unit of work in progress)</text>

  <rect x="44" y="132" width="404" height="76" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="246" y="156" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">1. lock the due rows</text>
  <text x="246" y="178" font-size="13" fill="#1f2328" text-anchor="middle">select id ... for update skip locked limit n</text>
  <text x="246" y="198" font-size="13" fill="#1f2328" text-anchor="middle">raw SQL, the one statement Prisma cannot build</text>

  <rect x="44" y="232" width="404" height="76" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="246" y="256" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">2. read them</text>
  <text x="246" y="278" font-size="13" fill="#1f2328" text-anchor="middle">findMany({ where: { id: { in: ids } } })</text>
  <text x="246" y="298" font-size="13" fill="#1f2328" text-anchor="middle">Prisma Client</text>

  <rect x="44" y="332" width="404" height="76" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="246" y="356" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">3. lease them</text>
  <text x="246" y="378" font-size="13" fill="#1f2328" text-anchor="middle">updateMany: attempts + 1, nextAttemptAt = now + leaseMs</text>
  <text x="246" y="398" font-size="13" fill="#1f2328" text-anchor="middle">Prisma Client</text>

  <line x1="246" y1="210" x2="246" y2="230" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="246" y1="310" x2="246" y2="330" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="40" y="452" font-size="14" fill="#1f2328">Commit: the row locks go after milliseconds, the lease stays.</text>
  <text x="40" y="484" font-size="14" fill="#1f2328"><tspan font-weight="700">Gains:</tspan> relays pass over each other's rows, never wait.</text>
  <text x="40" y="508" font-size="14" fill="#1f2328"><tspan font-weight="700">Costs:</tspan> names the dialect, the schema and the table.</text>

  <!-- right panel: compare-and-set -->
  <text x="512" y="76" font-size="16" font-weight="700" fill="#7a4f9a">'compare-and-set'</text>
  <text x="672" y="76" font-size="14" fill="#5f6b73">any database</text>

  <rect x="512" y="132" width="384" height="76" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="704" y="156" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">1. read the due rows</text>
  <text x="704" y="178" font-size="13" fill="#1f2328" text-anchor="middle">findMany: status pending, nextAttemptAt &lt;= now</text>
  <text x="704" y="198" font-size="13" fill="#1f2328" text-anchor="middle">ordered by nextAttemptAt, then sequence</text>

  <rect x="512" y="232" width="384" height="76" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="704" y="256" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">2. take each one</text>
  <text x="704" y="278" font-size="13" fill="#1f2328" text-anchor="middle">updateMany where id and attempts are as read</text>
  <text x="704" y="298" font-size="13" fill="#1f2328" text-anchor="middle">count 1: taken; count 0: another relay was first</text>

  <rect x="512" y="332" width="384" height="76" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="704" y="356" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">3. replace the lost ones</text>
  <text x="704" y="378" font-size="13" fill="#1f2328" text-anchor="middle">fewer than asked and more were due:</text>
  <text x="704" y="398" font-size="13" fill="#1f2328" text-anchor="middle">read again</text>

  <line x1="704" y1="210" x2="704" y2="230" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="704" y1="310" x2="704" y2="330" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M898,370 H922 V170 H900" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="512" y="452" font-size="14" fill="#1f2328">No transaction needed: the guard is the attempt count.</text>
  <text x="512" y="484" font-size="14" fill="#1f2328"><tspan font-weight="700">Gains:</tspan> Prisma Client only, any database.</text>
  <text x="512" y="508" font-size="14" fill="#1f2328"><tspan font-weight="700">Costs:</tspan> one statement per record.</text>

  <!-- both -->
  <rect x="24" y="536" width="912" height="80" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="44" y="562" font-size="14" font-weight="600" fill="#5f6b73">Both strategies</text>
  <text x="44" y="584" font-size="14" fill="#1f2328">A claimed record is hidden from other claims for leaseMs (30 s by default). The relay publishes it, then marks it</text>
  <text x="44" y="604" font-size="14" fill="#1f2328">published; if the relay dies first, the lease expires and the record is claimed again: at least once.</text>
</svg>
