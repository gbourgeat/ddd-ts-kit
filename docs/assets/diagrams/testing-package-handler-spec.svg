<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">A handler spec on createTestBuses</title>
  <desc id="desc">The spec executes a command on the command bus, which runs it inside the in-memory unit of work. The real handler saves the aggregate into the repository fake, wrapped by dispatching: the fake keeps a copy and the recorded events wait. Once the handler has returned, the events are dispatched in recording order to domainEvents: the before-commit handlers, then the after-commit ones. A reaction publishes an integration event on the in-memory event bus. When execute has resolved, the spec reads the state of the fake and the published events.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="560" rx="16" fill="#ffffff"/>
  <text x="32" y="36" font-size="18" font-weight="600" fill="#1f2328">A handler spec on createTestBuses()</text>

  <!-- the spec reads the fake afterwards -->
  <path d="M107,110 V76 H819 V106" fill="none" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <circle cx="300" cy="76" r="11" fill="#ffffff" stroke="#3d4449" stroke-width="1.5"/>
  <text x="300" y="81" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">7</text>
  <text x="320" y="68" font-size="13" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">orders.count(), orders.all()</text>

  <!-- row 1 -->
  <rect x="32" y="110" width="150" height="90" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="107" y="148" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">the spec</text>
  <text x="107" y="172" font-size="13" fill="#1f2328" text-anchor="middle">arrange, act, read</text>

  <rect x="238" y="110" width="180" height="90" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="328" y="142" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">commandBus</text>
  <text x="328" y="166" font-size="13" fill="#1f2328" text-anchor="middle">runs each command</text>
  <text x="328" y="186" font-size="13" fill="#1f2328" text-anchor="middle">in the unit of work</text>

  <rect x="474" y="110" width="180" height="90" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="564" y="142" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">the handler</text>
  <text x="564" y="166" font-size="13" fill="#1f2328" text-anchor="middle">the real one,</text>
  <text x="564" y="186" font-size="13" fill="#1f2328" text-anchor="middle">it only saves</text>

  <rect x="710" y="110" width="218" height="90" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="819" y="142" font-size="15" font-weight="700" fill="#7a4f9a" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">dispatching(fake)</text>
  <text x="819" y="166" font-size="13" fill="#1f2328" text-anchor="middle">InMemoryRepository:</text>
  <text x="819" y="186" font-size="13" fill="#1f2328" text-anchor="middle">a copy kept, version + 1</text>

  <!-- row 1 arrows -->
  <line x1="182" y1="155" x2="234" y2="155" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="208" cy="134" r="11" fill="#ffffff" stroke="#3d4449" stroke-width="1.5"/>
  <text x="208" y="139" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">1</text>
  <line x1="418" y1="155" x2="470" y2="155" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="444" cy="134" r="11" fill="#ffffff" stroke="#3d4449" stroke-width="1.5"/>
  <text x="444" y="139" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">2</text>
  <line x1="654" y1="155" x2="706" y2="155" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="680" cy="134" r="11" fill="#ffffff" stroke="#3d4449" stroke-width="1.5"/>
  <text x="680" y="139" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">3</text>

  <!-- fake to domainEvents -->
  <line x1="819" y1="200" x2="819" y2="296" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="842" cy="248" r="11" fill="#ffffff" stroke="#3d4449" stroke-width="1.5"/>
  <text x="842" y="253" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">4</text>

  <!-- row 2 -->
  <rect x="710" y="300" width="218" height="90" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="819" y="332" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">domainEvents</text>
  <text x="819" y="356" font-size="13" fill="#1f2328" text-anchor="middle">before-commit handlers,</text>
  <text x="819" y="376" font-size="13" fill="#1f2328" text-anchor="middle">then after-commit ones</text>

  <rect x="474" y="300" width="180" height="90" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="564" y="332" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">a reaction</text>
  <text x="564" y="356" font-size="13" fill="#1f2328" text-anchor="middle">publishes the</text>
  <text x="564" y="376" font-size="13" fill="#1f2328" text-anchor="middle">integration event</text>

  <rect x="238" y="300" width="180" height="90" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="328" y="332" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">eventBus</text>
  <text x="328" y="356" font-size="13" fill="#1f2328" text-anchor="middle">InMemoryEventBus:</text>
  <text x="328" y="376" font-size="13" fill="#1f2328" text-anchor="middle">keeps what is published</text>

  <!-- row 2 arrows -->
  <line x1="710" y1="345" x2="658" y2="345" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="684" cy="324" r="11" fill="#ffffff" stroke="#3d4449" stroke-width="1.5"/>
  <text x="684" y="329" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">5</text>
  <line x1="474" y1="345" x2="422" y2="345" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="448" cy="324" r="11" fill="#ffffff" stroke="#3d4449" stroke-width="1.5"/>
  <text x="448" y="329" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">6</text>

  <!-- the spec reads the published events afterwards -->
  <path d="M107,200 V345 H234" fill="none" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <circle cx="107" cy="272" r="11" fill="#ffffff" stroke="#3d4449" stroke-width="1.5"/>
  <text x="107" y="277" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">7</text>
  <text x="40" y="370" font-size="13" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">publishedEvents()</text>

  <!-- steps -->
  <line x1="32" y1="410" x2="928" y2="410" stroke="#3d4449" stroke-opacity="0.2"/>
  <g font-size="13" fill="#1f2328">
    <text x="40" y="436"><tspan font-weight="700">1</tspan>  execute(new PlaceOrder('sku-1'))</text>
    <text x="40" y="458"><tspan font-weight="700">2</tspan>  the handler runs inside the unit of work</text>
    <text x="40" y="480"><tspan font-weight="700">3</tspan>  save: the fake keeps a copy, the events wait</text>
    <text x="40" y="502"><tspan font-weight="700">4</tspan>  the handler returned: events handed over in order</text>
    <text x="500" y="436"><tspan font-weight="700">5</tspan>  domainEvents calls a before-commit handler</text>
    <text x="500" y="458"><tspan font-weight="700">6</tspan>  that reaction publishes an integration event</text>
    <text x="500" y="480"><tspan font-weight="700">7</tspan>  execute resolved: the spec reads what is true now</text>
  </g>
  <line x1="40" y1="534" x2="84" y2="534" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="96" y="539" font-size="13" fill="#1f2328">a call</text>
  <line x1="180" y1="534" x2="224" y2="534" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="236" y="539" font-size="13" fill="#1f2328">a read, once execute has resolved: the spec asserts state and events, never calls</text>
</svg>
