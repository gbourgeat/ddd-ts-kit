<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 624" width="960" height="624" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">A token stops at the boundary of the API</title>
  <desc id="desc">The client application signs in at the identity provider and receives a signed access token. It calls POST /appointments with the token as a bearer credential. The API boundary fetches the key set of the provider once and caches it, verifies the signature, issuer, audience, expiry and algorithm, maps the claims to an actor and a session and drops the token, then sends the BookAppointment command carrying the actor to the use case. The answer is 201, or a 401 problem when the token is refused, in which case the use case is never called.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="624" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">A token stops at the boundary of the API</text>
  <!-- participants -->
  <rect x="30" y="58" width="180" height="48" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="120" y="88" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">client application</text>
  <rect x="270" y="58" width="180" height="48" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="360" y="88" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">identity provider</text>
  <rect x="510" y="58" width="180" height="48" rx="10" fill="#f6ede6" stroke="#9a5b2b" stroke-width="2"/>
  <text x="600" y="88" font-size="16" font-weight="700" fill="#9a5b2b" text-anchor="middle">API boundary</text>
  <rect x="750" y="58" width="180" height="48" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="840" y="88" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">use case</text>
  <!-- lifelines -->
  <line x1="120" y1="106" x2="120" y2="568" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="360" y1="106" x2="360" y2="568" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="600" y1="106" x2="600" y2="568" stroke="#9a5b2b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="840" y1="106" x2="840" y2="568" stroke="#2b5d8a" stroke-width="1.5" stroke-dasharray="4 4"/>
  <!-- 1 sign in -->
  <line x1="122" y1="150" x2="356" y2="150" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="240" y="142" font-size="13" fill="#1f2328" text-anchor="middle">1. sign in</text>
  <!-- 2 token -->
  <line x1="358" y1="192" x2="124" y2="192" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="240" y="184" font-size="13" fill="#1f2328" text-anchor="middle">2. access token (signed JWT)</text>
  <!-- 3 request -->
  <line x1="122" y1="244" x2="596" y2="244" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="240" y="236" font-size="13" fill="#1f2328" text-anchor="middle">3. POST /appointments</text>
  <text x="480" y="236" font-size="13" fill="#1f2328" text-anchor="middle">Authorization: Bearer &lt;token&gt;</text>
  <!-- 4 key set -->
  <line x1="598" y1="292" x2="364" y2="292" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="480" y="284" font-size="13" fill="#1f2328" text-anchor="middle">4. fetch the key set, once (cached)</text>
  <!-- 5 verify -->
  <rect x="480" y="316" width="240" height="52" rx="8" fill="#f6ede6" stroke="#9a5b2b" stroke-width="1.5"/>
  <text x="600" y="337" font-size="13" fill="#1f2328" text-anchor="middle">5. verify the signature, issuer,</text>
  <text x="600" y="356" font-size="13" fill="#1f2328" text-anchor="middle">audience, expiry and algorithm</text>
  <!-- 6 map -->
  <rect x="480" y="384" width="240" height="52" rx="8" fill="#f6ede6" stroke="#9a5b2b" stroke-width="1.5"/>
  <text x="600" y="405" font-size="13" fill="#1f2328" text-anchor="middle">6. map the claims to an Actor</text>
  <text x="600" y="424" font-size="13" fill="#1f2328" text-anchor="middle">and a Session; drop the token</text>
  <!-- 7 command -->
  <line x1="602" y1="472" x2="836" y2="472" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="720" y="464" font-size="13" fill="#1f2328" text-anchor="middle">7. BookAppointment(actor, ...)</text>
  <rect x="756" y="488" width="168" height="40" rx="8" fill="#e7eef5" stroke="#2b5d8a" stroke-width="1.5"/>
  <text x="840" y="513" font-size="13" fill="#2b5d8a" text-anchor="middle">an Actor, never a token</text>
  <!-- 8 answer -->
  <line x1="598" y1="552" x2="124" y2="552" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="240" y="544" font-size="13" fill="#1f2328" text-anchor="middle">8. 201, or 401 problem</text>
  <text x="480" y="544" font-size="13" fill="#1f2328" text-anchor="middle">a refused token never reaches 7</text>
  <!-- legend -->
  <line x1="40" y1="600" x2="76" y2="600" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="84" y="604" font-size="13" fill="#1f2328">call</text>
  <line x1="130" y1="600" x2="166" y2="600" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="174" y="604" font-size="13" fill="#1f2328">answer</text>
</svg>
