<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 884" width="960" height="884" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Une lecture publique rangée sous ses étiquettes, puis purgée après la validation d'une commande</title>
  <desc id="desc">Une séquence entre cinq participants : le client, le cache partagé (Varnish), l'API, la base de données et le relais de l'outbox. D'abord une lecture publique : le client demande GET /calendars/c-1/opening-hours, le cache ne l'a pas et la transmet à l'API, qui répond 200 avec l'en-tête d'étiquettes xkey: calendar:c-1 ; le cache garde la réponse une heure sous cette étiquette et retire l'en-tête avant le client. La même lecture, plus tard, est servie par le cache. Puis une commande : le client envoie PUT, le cache la transmet à l'API, qui enregistre le calendrier et une demande de purge dans une seule transaction. Le relais réclame la demande, envoie PURGE avec xkey-purge: calendar:c-1 au cache, qui répond 200 et retire les réponses rangées sous l'étiquette, puis le relais la marque publiée. La lecture suivante n'est pas dans le cache, et la nouvelle réponse y est rangée à nouveau.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="884" rx="16" fill="#ffffff"/>
  <text x="24" y="36" font-size="18" font-weight="600" fill="#1f2328">Une lecture publique rangée sous ses étiquettes, purgée après la validation</text>
  <!-- participants -->
  <rect x="24" y="56" width="120" height="56" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="84" y="90" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">client</text>
  <rect x="228" y="56" width="180" height="56" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="318" y="80" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">cache partagé</text>
  <text x="318" y="100" font-size="13" fill="#1f2328" text-anchor="middle">Varnish</text>
  <rect x="468" y="56" width="160" height="56" rx="10" fill="#f6ede6" stroke="#9a5b2b" stroke-width="2"/>
  <text x="548" y="80" font-size="16" font-weight="700" fill="#9a5b2b" text-anchor="middle">API</text>
  <text x="548" y="100" font-size="13" fill="#1f2328" text-anchor="middle">route, cas d'usage</text>
  <rect x="658" y="56" width="140" height="56" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="728" y="80" font-size="15" font-weight="700" fill="#7a4f9a" text-anchor="middle">base de données</text>
  <text x="728" y="100" font-size="13" fill="#1f2328" text-anchor="middle">état, outbox</text>
  <rect x="818" y="56" width="120" height="56" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="878" y="75" font-size="14" font-weight="700" fill="#7a4f9a" text-anchor="middle">relais</text>
  <text x="878" y="91" font-size="14" font-weight="700" fill="#7a4f9a" text-anchor="middle">de l'outbox</text>
  <text x="878" y="106" font-size="13" fill="#1f2328" text-anchor="middle">CachePurger</text>
  <!-- lifelines -->
  <g stroke="#5f6b73" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="84" y1="112" x2="84" y2="828"/>
    <line x1="318" y1="112" x2="318" y2="828"/>
    <line x1="548" y1="112" x2="548" y2="828"/>
    <line x1="728" y1="112" x2="728" y2="828"/>
    <line x1="878" y1="112" x2="878" y2="828"/>
  </g>
  <!-- 1. a public read -->
  <rect x="24" y="126" width="370" height="24" rx="6" fill="#ffffff"/>
  <text x="24" y="143" font-size="14" font-weight="700" fill="#1f2328">1. Une lecture publique, servie une fois par l'API</text>
  <text x="201" y="168" font-size="13" fill="#1f2328" text-anchor="middle">GET /calendars/c-1/opening-hours</text>
  <line x1="86" y1="176" x2="316" y2="176" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="433" y="206" font-size="13" fill="#1f2328" text-anchor="middle">absente : transmise à l'API</text>
  <line x1="320" y1="214" x2="546" y2="214" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="433" y="248" font-size="13" fill="#1f2328" text-anchor="middle">200 + xkey: calendar:c-1</text>
  <line x1="546" y1="256" x2="320" y2="256" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="208" y="272" width="220" height="30" rx="6" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="318" y="292" font-size="13" fill="#1f2328" text-anchor="middle">gardée 1 h sous calendar:c-1</text>
  <text x="201" y="326" font-size="13" fill="#1f2328" text-anchor="middle">200, xkey retiré</text>
  <line x1="316" y1="334" x2="86" y2="334" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="201" y="368" font-size="13" fill="#1f2328" text-anchor="middle">le même GET, plus tard</text>
  <line x1="86" y1="376" x2="316" y2="376" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="201" y="406" font-size="13" fill="#1f2328" text-anchor="middle">200 depuis le cache (HIT)</text>
  <line x1="316" y1="414" x2="86" y2="414" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- 2. a command, then the purge -->
  <line x1="24" y1="446" x2="938" y2="446" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="24" y="458" width="500" height="24" rx="6" fill="#ffffff"/>
  <text x="24" y="475" font-size="14" font-weight="700" fill="#1f2328">2. Une commande change le calendrier, puis le relais purge</text>
  <text x="201" y="500" font-size="13" fill="#1f2328" text-anchor="middle">PUT /calendars/c-1/opening-hours</text>
  <line x1="86" y1="508" x2="316" y2="508" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="433" y="538" font-size="13" fill="#1f2328" text-anchor="middle">transmise, jamais gardée</text>
  <line x1="320" y1="546" x2="546" y2="546" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="638" y="562" font-size="13" fill="#1f2328" text-anchor="middle">une transaction :</text>
  <text x="638" y="577" font-size="13" fill="#1f2328" text-anchor="middle">le calendrier</text>
  <text x="638" y="592" font-size="13" fill="#1f2328" text-anchor="middle">+ la demande de purge</text>
  <line x1="550" y1="602" x2="726" y2="602" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="803" y="640" font-size="13" fill="#1f2328" text-anchor="middle">réclame la demande</text>
  <line x1="876" y1="648" x2="730" y2="648" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="478" y="676" width="240" height="20" rx="4" fill="#ffffff"/>
  <text x="598" y="690" font-size="13" fill="#1f2328" text-anchor="middle">PURGE, xkey-purge: calendar:c-1</text>
  <line x1="876" y1="698" x2="320" y2="698" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="548" y="720" width="100" height="20" rx="4" fill="#ffffff"/>
  <text x="598" y="734" font-size="13" fill="#1f2328" text-anchor="middle">200 Purged 1</text>
  <line x1="320" y1="742" x2="876" y2="742" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="183" y="756" width="270" height="30" rx="6" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="318" y="776" font-size="13" fill="#1f2328" text-anchor="middle">réponses sous calendar:c-1 retirées</text>
  <text x="803" y="802" font-size="13" fill="#1f2328" text-anchor="middle">la marque publiée</text>
  <line x1="876" y1="810" x2="730" y2="810" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- what follows -->
  <text x="480" y="862" font-size="14" fill="#1f2328" text-anchor="middle">La lecture suivante n'est pas dans le cache : l'API renvoie les nouveaux horaires, rangés à nouveau sous calendar:c-1.</text>
</svg>
