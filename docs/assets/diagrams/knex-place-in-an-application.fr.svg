<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Une unité de travail, deux ports, une transaction</title>
  <desc id="desc">Le bus de commandes appelle run sur le port UnitOfWork. Les repositories et les lecteurs des contextes, les stores de @ddd-ts-kit/knex (outbox, événements traités, jobs, processus, event store) et le KnexAuditTrail appellent executor sur le port KnexContext. Les deux ports sont l'objet unique que renvoie createKnexUnitOfWork(db) : run ouvre une transaction knex et la garde dans un AsyncLocalStorage, executor la relit, et renvoie l'instance knex racine hors de run. Chaque requête SQL d'une commande s'exécute donc dans une seule transaction de PostgreSQL, où chaque contexte délimité a son propre schéma. La plateforme construit l'objet une fois et le lie aux deux ports.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="540" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Une unité de travail, deux ports, une transaction</text>
  <!-- column headings -->
  <text x="32" y="80" font-size="14" font-weight="600" fill="#5f6b73">le code, qui nomme un port</text>
  <text x="352" y="80" font-size="14" font-weight="600" fill="#5f6b73">@ddd-ts-kit/knex</text>
  <text x="712" y="80" font-size="14" font-weight="600" fill="#5f6b73">la base de données</text>
  <!-- left: the callers -->
  <rect x="20" y="156" width="290" height="56" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="34" y="180" font-size="16" font-weight="700" fill="#2b5d8a">bus de commandes</text>
  <text x="34" y="200" font-size="13" fill="#1f2328">unitOfWorkMiddleware, chaque commande</text>
  <rect x="20" y="240" width="290" height="52" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="34" y="262" font-size="15" font-weight="700" fill="#7a4f9a">repositories, lecteurs</text>
  <text x="34" y="282" font-size="13" fill="#1f2328">les adaptateurs de vos contextes</text>
  <rect x="20" y="304" width="290" height="52" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="34" y="326" font-size="15" font-weight="700" fill="#7a4f9a">les stores de ce package</text>
  <text x="34" y="346" font-size="13" fill="#1f2328">outbox, événements, jobs, processus</text>
  <rect x="20" y="368" width="290" height="52" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="34" y="390" font-size="15" font-weight="700" fill="#7a4f9a">KnexAuditTrail</text>
  <text x="34" y="410" font-size="13" fill="#1f2328">de @ddd-ts-kit/audit/knex</text>
  <!-- middle: the one object -->
  <rect x="352" y="96" width="272" height="340" rx="12" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="488" y="124" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">createKnexUnitOfWork(db)</text>
  <text x="488" y="144" font-size="13" fill="#1f2328" text-anchor="middle">un seul objet, lié à deux ports</text>
  <rect x="376" y="156" width="224" height="56" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="488" y="179" font-size="15" font-weight="700" fill="#2b5d8a" text-anchor="middle">UnitOfWork</text>
  <text x="488" y="199" font-size="13" fill="#1f2328" text-anchor="middle">run(work) : ouvre la transaction</text>
  <rect x="376" y="248" width="224" height="60" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="488" y="272" font-size="15" font-weight="700" fill="#5f6b73" text-anchor="middle">AsyncLocalStorage</text>
  <text x="488" y="293" font-size="13" fill="#1f2328" text-anchor="middle">la transaction en cours</text>
  <rect x="376" y="344" width="224" height="60" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="488" y="368" font-size="15" font-weight="700" fill="#2b5d8a" text-anchor="middle">KnexContext</text>
  <text x="488" y="389" font-size="13" fill="#1f2328" text-anchor="middle">executor() : elle, sinon db</text>
  <!-- inside: run keeps, executor reads -->
  <line x1="488" y1="214" x2="488" y2="246" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="498" y="235" font-size="13" fill="#1f2328">garde</text>
  <line x1="488" y1="342" x2="488" y2="310" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="498" y="331" font-size="13" fill="#1f2328">lit</text>
  <!-- left to middle -->
  <line x1="312" y1="184" x2="374" y2="184" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="312" y1="266" x2="330" y2="266" stroke="#3d4449" stroke-width="2"/>
  <line x1="312" y1="330" x2="330" y2="330" stroke="#3d4449" stroke-width="2"/>
  <line x1="312" y1="394" x2="330" y2="394" stroke="#3d4449" stroke-width="2"/>
  <line x1="330" y1="266" x2="330" y2="394" stroke="#3d4449" stroke-width="2"/>
  <line x1="330" y1="374" x2="374" y2="374" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- right: the database -->
  <rect x="712" y="156" width="224" height="248" rx="12" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="824" y="182" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">PostgreSQL</text>
  <rect x="732" y="198" width="184" height="34" rx="8" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="824" y="220" font-size="13" fill="#1f2328" text-anchor="middle">billing_core : invoices</text>
  <rect x="732" y="240" width="184" height="34" rx="8" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="824" y="262" font-size="13" fill="#1f2328" text-anchor="middle">scheduling : appointments</text>
  <rect x="732" y="282" width="184" height="34" rx="8" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="824" y="304" font-size="13" fill="#1f2328" text-anchor="middle">messaging : outbox</text>
  <rect x="732" y="324" width="184" height="34" rx="8" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="824" y="346" font-size="13" fill="#1f2328" text-anchor="middle">audit : audit_entries</text>
  <text x="824" y="388" font-size="13" font-style="italic" fill="#5f6b73" text-anchor="middle">un schéma par contexte</text>
  <!-- middle to right -->
  <line x1="626" y1="278" x2="710" y2="278" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="668" y="268" font-size="13" fill="#1f2328" text-anchor="middle">une</text>
  <text x="668" y="298" font-size="13" fill="#1f2328" text-anchor="middle">transaction</text>
  <!-- platform -->
  <rect x="32" y="456" width="904" height="60" rx="12" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="52" y="481" font-size="14" font-weight="600" fill="#5f6b73">platform/ : construit l'objet une fois et le lie à UnitOfWork et à KnexContext</text>
  <text x="52" y="502" font-size="13" fill="#1f2328">Un repository ne reçoit jamais de transaction : dans run, il obtient la transaction ; un run imbriqué la rejoint ; hors de run, db.</text>
</svg>
