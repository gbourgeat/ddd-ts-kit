<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 690" width="960" height="690" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Une livraison à travers consume</title>
  <desc id="desc">Une livraison venue du fournisseur est analysée par la déclaration de l'événement. Un autre type ou une autre version est ignoré, sans aucune marque. Une charge utile invalide lève InvalidEventPayloadError, si bien que le fournisseur retente la livraison ou l'envoie en file de rejet. Un événement valide entre dans une unité de travail : le stockage des événements traités marque la paire du nom du consommateur et de l'identifiant de l'événement. Quand la paire était déjà marquée, le gestionnaire est sauté. Sinon le gestionnaire s'exécute avec l'événement typé. S'il se termine, la marque et le changement d'état du consommateur sont validés ensemble ; s'il lève une erreur, les deux sont annulés, si bien que la nouvelle livraison est traitée. Quand une portée est donnée, tout s'exécute dans scope.run avec le contexte d'exécution de l'événement.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="690" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Une livraison à travers consume</text>

  <!-- the delivery -->
  <rect x="360" y="58" width="240" height="52" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="480" y="80" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">une livraison</text>
  <text x="480" y="100" font-size="13" fill="#1f2328" text-anchor="middle">un IntegrationEvent du fournisseur</text>
  <line x1="480" y1="112" x2="480" y2="136" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- parse -->
  <rect x="340" y="138" width="280" height="58" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="480" y="162" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">orderPlaced.parse(event)</text>
  <text x="480" y="183" font-size="13" fill="#1f2328" text-anchor="middle">le type, la version, puis la charge utile</text>

  <!-- branch: another type or version -->
  <path d="M338,167 H160 V222" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250" y="158" font-size="13" fill="#1f2328" text-anchor="middle">autre type ou version</text>
  <rect x="40" y="224" width="240" height="72" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="160" y="248" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">ignoré</text>
  <text x="160" y="268" font-size="13" fill="#1f2328" text-anchor="middle">sans marque : l'abonnement</text>
  <text x="160" y="286" font-size="13" fill="#1f2328" text-anchor="middle">de cette version le traite</text>

  <!-- branch: invalid payload -->
  <path d="M622,167 H800 V222" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="710" y="158" font-size="13" fill="#1f2328" text-anchor="middle">charge utile invalide</text>
  <rect x="680" y="224" width="240" height="86" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="800" y="246" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">lève une erreur</text>
  <text x="800" y="265" font-size="13" fill="#1f2328" text-anchor="middle">InvalidEventPayloadError :</text>
  <text x="800" y="282" font-size="13" fill="#1f2328" text-anchor="middle">le fournisseur retente ou</text>
  <text x="800" y="299" font-size="13" fill="#1f2328" text-anchor="middle">l'envoie en file de rejet</text>

  <!-- valid: into the unit of work -->
  <line x1="480" y1="198" x2="480" y2="362" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="490" y="270" font-size="13" fill="#1f2328">valide</text>

  <!-- the unit of work -->
  <rect x="150" y="318" width="660" height="352" rx="12" fill="none" stroke="#2b5d8a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="170" y="342" font-size="14" font-weight="600" fill="#2b5d8a">une unité de travail</text>

  <rect x="350" y="364" width="260" height="58" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="480" y="388" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">markProcessed(consumer, id)</text>
  <text x="480" y="409" font-size="13" fill="#1f2328" text-anchor="middle">le stockage des événements traités</text>

  <line x1="348" y1="393" x2="306" y2="393" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="164" y="358" width="140" height="70" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="234" y="380" font-size="14" font-weight="700" fill="#5f6b73" text-anchor="middle">false : déjà vu</text>
  <text x="234" y="400" font-size="13" fill="#1f2328" text-anchor="middle">le gestionnaire</text>
  <text x="234" y="418" font-size="13" fill="#1f2328" text-anchor="middle">est sauté</text>

  <line x1="480" y1="424" x2="480" y2="456" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="490" y="446" font-size="13" fill="#1f2328">true : première fois</text>

  <rect x="340" y="458" width="280" height="58" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="480" y="482" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">handler(event)</text>
  <text x="480" y="503" font-size="13" fill="#1f2328" text-anchor="middle">typé et validé</text>

  <line x1="420" y1="518" x2="420" y2="554" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="518" x2="540" y2="554" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="170" y="556" width="300" height="76" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="320" y="580" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">se termine : validation</text>
  <text x="320" y="600" font-size="13" fill="#1f2328" text-anchor="middle">la marque et le changement d'état</text>
  <text x="320" y="618" font-size="13" fill="#1f2328" text-anchor="middle">du consommateur, ensemble</text>

  <rect x="490" y="556" width="300" height="76" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="640" y="580" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">lève : annulation</text>
  <text x="640" y="600" font-size="13" fill="#1f2328" text-anchor="middle">la marque part avec le reste :</text>
  <text x="640" y="618" font-size="13" fill="#1f2328" text-anchor="middle">la nouvelle livraison est traitée</text>

  <text x="480" y="656" font-size="13" fill="#2b5d8a" text-anchor="middle">avec une portée : dans scope.run(...), dans le contexte d'exécution de l'événement</text>
</svg>
