<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Un échec, un rapport</title>
  <desc id="desc">Une requête HTTP atteint une route, qui envoie la commande PlaceOrder sur le bus de commandes. Le bus exécute le gestionnaire, qui lève une Error inattendue. errorReportingMiddleware, premier sur le bus, remonte l'erreur à l'ErrorReporter sous le nom de la commande et la marque, puis la relance. La route répond 500 et son onError, reportHttpErrors, reconnaît l'erreur marquée et n'envoie rien. L'outil de suivi reçoit un seul événement : opération PlaceOrder, origine http, l'identifiant de corrélation de la requête HTTP et l'identifiant de trace.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="520" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Un échec, un rapport</text>

  <!-- participants -->
  <rect x="40" y="62" width="180" height="56" rx="10" fill="#f6ede6" stroke="#9a5b2b" stroke-width="2"/>
  <text x="130" y="86" font-size="15" font-weight="700" fill="#9a5b2b" text-anchor="middle">route</text>
  <text x="130" y="106" font-size="13" fill="#1f2328" text-anchor="middle">onError: reportHttpErrors</text>
  <rect x="280" y="62" width="200" height="56" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="380" y="86" font-size="15" font-weight="700" fill="#2b5d8a" text-anchor="middle">bus de commandes</text>
  <text x="380" y="106" font-size="13" fill="#1f2328" text-anchor="middle">errorReportingMiddleware</text>
  <rect x="540" y="62" width="160" height="56" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="620" y="86" font-size="15" font-weight="700" fill="#2b5d8a" text-anchor="middle">gestionnaire</text>
  <text x="620" y="106" font-size="13" fill="#1f2328" text-anchor="middle">PlaceOrder</text>
  <rect x="760" y="62" width="168" height="56" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="844" y="86" font-size="15" font-weight="700" fill="#7a4f9a" text-anchor="middle">ErrorReporter</text>
  <text x="844" y="106" font-size="13" fill="#1f2328" text-anchor="middle">Sentry, GlitchTip</text>

  <!-- lifelines -->
  <line x1="130" y1="120" x2="130" y2="470" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="380" y1="120" x2="380" y2="470" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="620" y1="120" x2="620" y2="470" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="844" y1="120" x2="844" y2="470" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- messages -->
  <line x1="130" y1="160" x2="376" y2="160" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="140" y="152" font-size="13" fill="#1f2328">1. execute(PlaceOrder)</text>
  <line x1="380" y1="200" x2="616" y2="200" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="390" y="192" font-size="13" fill="#1f2328">2. exécute le gestionnaire</text>
  <line x1="620" y1="240" x2="384" y2="240" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="610" y="232" font-size="13" fill="#1f2328" text-anchor="end">3. lève une Error inattendue</text>
  <line x1="380" y1="290" x2="840" y2="290" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="390" y="282" font-size="13" fill="#1f2328">4. report(error), la marque</text>
  <line x1="380" y1="330" x2="134" y2="330" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="370" y="322" font-size="13" fill="#1f2328" text-anchor="end">5. relance la même Error</text>

  <!-- notes -->
  <rect x="40" y="356" width="260" height="78" rx="10" fill="#f6ede6" stroke="#9a5b2b" stroke-width="1.5"/>
  <text x="52" y="378" font-size="13" font-weight="700" fill="#9a5b2b">6. répond 500</text>
  <text x="52" y="398" font-size="13" fill="#1f2328">reportHttpErrors voit la marque :</text>
  <text x="52" y="418" font-size="13" fill="#1f2328">rien n'est envoyé une seconde fois</text>
  <rect x="680" y="312" width="248" height="122" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="1.5"/>
  <text x="692" y="334" font-size="13" font-weight="700" fill="#7a4f9a">un seul événement remonté</text>
  <text x="692" y="356" font-size="13" fill="#1f2328">operation: PlaceOrder</text>
  <text x="692" y="376" font-size="13" fill="#1f2328">origin: http</text>
  <text x="692" y="396" font-size="13" fill="#1f2328">id de corrélation de la requête</text>
  <text x="692" y="416" font-size="13" fill="#1f2328">id de trace du span actif</text>

  <!-- legend -->
  <line x1="40" y1="494" x2="84" y2="494" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="96" y="499" font-size="14" fill="#1f2328">appel</text>
  <line x1="160" y1="494" x2="204" y2="494" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="216" y="499" font-size="14" fill="#1f2328">une erreur relancée vers l'appelant</text>
</svg>
