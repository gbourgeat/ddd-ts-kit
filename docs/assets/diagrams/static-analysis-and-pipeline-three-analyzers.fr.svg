<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 528" width="960" height="528" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Une règle, layer/domain-purity, et ce que voit chaque analyseur</title>
  <desc id="desc">Quatre façons pour un fichier du domaine de dépendre de quelque chose d'extérieur, et ce que répondent le checker, le plugin ESLint et dependency-cruiser. L'import direct d'un package : les trois le signalent. Le même texte dans un commentaire ou une chaîne : aucun ne le signale, à raison, alors qu'une simple recherche textuelle le ferait. Un import par un chemin du tsconfig autre que l'alias du projet : le checker et le plugin ESLint le signalent comme un package, dependency-cruiser le résout et nomme le vrai fichier de l'infrastructure. Un package réexporté par le noyau partagé, que le domaine peut importer : aucun ne le signale, d'où une relecture humaine du noyau partagé.</desc>
  <rect width="960" height="528" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Une règle, layer/domain-purity, et ce que voit chaque analyseur</text>
  <!-- headers -->
  <rect x="24" y="56" width="360" height="40" rx="8" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="1.5"/>
  <text x="40" y="81" font-size="14" font-weight="700" fill="#2f6f4f">écrit dans domain/value-objects/email.vo.ts</text>
  <rect x="394" y="56" width="180" height="40" rx="8" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="484" y="81" font-size="14" font-weight="700" fill="#5f6b73" text-anchor="middle">ddd-ts-kit check</text>
  <rect x="584" y="56" width="180" height="40" rx="8" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="674" y="81" font-size="14" font-weight="700" fill="#5f6b73" text-anchor="middle">plugin ESLint</text>
  <rect x="774" y="56" width="162" height="40" rx="8" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="855" y="81" font-size="14" font-weight="700" fill="#5f6b73" text-anchor="middle">dependency-cruiser</text>
  <!-- row 1 -->
  <rect x="24" y="104" width="360" height="84" rx="8" fill="#ffffff" stroke="#2f6f4f" stroke-width="1.5"/>
  <text x="40" y="136" font-size="14" font-weight="600" fill="#1f2328">import { z } from 'zod';</text>
  <text x="40" y="162" font-size="13" fill="#3d4449">l'import direct d'un package</text>
  <rect x="394" y="104" width="180" height="84" rx="8" fill="#f3f4f5" stroke="#3d4449" stroke-width="1.5"/>
  <text x="484" y="151" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">le signale</text>
  <rect x="584" y="104" width="180" height="84" rx="8" fill="#f3f4f5" stroke="#3d4449" stroke-width="1.5"/>
  <text x="674" y="151" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">le signale</text>
  <rect x="774" y="104" width="162" height="84" rx="8" fill="#f3f4f5" stroke="#3d4449" stroke-width="1.5"/>
  <text x="855" y="151" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">le signale</text>
  <!-- row 2 -->
  <rect x="24" y="196" width="360" height="84" rx="8" fill="#ffffff" stroke="#2f6f4f" stroke-width="1.5"/>
  <text x="40" y="228" font-size="14" font-weight="600" fill="#1f2328">// import { z } from 'zod'</text>
  <text x="40" y="250" font-size="13" fill="#3d4449">le même texte en commentaire ou en chaîne :</text>
  <text x="40" y="268" font-size="13" fill="#3d4449">une recherche textuelle le signalerait</text>
  <rect x="394" y="196" width="180" height="84" rx="8" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="484" y="232" font-size="14" font-weight="700" fill="#5f6b73" text-anchor="middle">muet, à raison</text>
  <text x="484" y="254" font-size="13" fill="#1f2328" text-anchor="middle">son lexer saute</text>
  <text x="484" y="271" font-size="13" fill="#1f2328" text-anchor="middle">commentaires et chaînes</text>
  <rect x="584" y="196" width="180" height="84" rx="8" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="674" y="232" font-size="14" font-weight="700" fill="#5f6b73" text-anchor="middle">muet, à raison</text>
  <text x="674" y="254" font-size="13" fill="#1f2328" text-anchor="middle">l'arbre syntaxique</text>
  <text x="674" y="271" font-size="13" fill="#1f2328" text-anchor="middle">n'a pas d'import</text>
  <rect x="774" y="196" width="162" height="84" rx="8" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="855" y="232" font-size="14" font-weight="700" fill="#5f6b73" text-anchor="middle">muet, à raison</text>
  <text x="855" y="254" font-size="13" fill="#1f2328" text-anchor="middle">aucune arête</text>
  <text x="855" y="271" font-size="13" fill="#1f2328" text-anchor="middle">dans le graphe</text>
  <!-- row 3 -->
  <rect x="24" y="288" width="360" height="84" rx="8" fill="#ffffff" stroke="#2f6f4f" stroke-width="1.5"/>
  <text x="40" y="320" font-size="14" font-weight="600" fill="#1f2328">from '#billing-infra/invoice-row';</text>
  <text x="40" y="342" font-size="13" fill="#3d4449">un chemin du tsconfig autre que l'alias,</text>
  <text x="40" y="360" font-size="13" fill="#3d4449">qui mène à infrastructure/</text>
  <rect x="394" y="288" width="180" height="84" rx="8" fill="#f3f4f5" stroke="#3d4449" stroke-width="1.5"/>
  <text x="484" y="324" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">le signale</text>
  <text x="484" y="346" font-size="13" fill="#1f2328" text-anchor="middle">comme le package</text>
  <text x="484" y="363" font-size="13" fill="#1f2328" text-anchor="middle">"#billing-infra"</text>
  <rect x="584" y="288" width="180" height="84" rx="8" fill="#f3f4f5" stroke="#3d4449" stroke-width="1.5"/>
  <text x="674" y="324" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">le signale</text>
  <text x="674" y="346" font-size="13" fill="#1f2328" text-anchor="middle">comme le package</text>
  <text x="674" y="363" font-size="13" fill="#1f2328" text-anchor="middle">"#billing-infra"</text>
  <rect x="774" y="288" width="162" height="84" rx="8" fill="#f3f4f5" stroke="#3d4449" stroke-width="2.5"/>
  <text x="855" y="324" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">nomme le fichier</text>
  <text x="855" y="346" font-size="13" fill="#1f2328" text-anchor="middle">infrastructure/</text>
  <text x="855" y="363" font-size="13" fill="#1f2328" text-anchor="middle">invoice-row.ts</text>
  <!-- row 4 -->
  <rect x="24" y="380" width="360" height="84" rx="8" fill="#ffffff" stroke="#2f6f4f" stroke-width="1.5"/>
  <text x="40" y="412" font-size="14" font-weight="600" fill="#1f2328">from '@/shared-kernel/index';</text>
  <text x="40" y="434" font-size="13" fill="#3d4449">dont l'index réexporte un type de zod :</text>
  <text x="40" y="452" font-size="13" fill="#3d4449">le domaine peut importer le noyau partagé</text>
  <rect x="394" y="380" width="180" height="84" rx="8" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="484" y="416" font-size="14" font-weight="700" fill="#5f6b73" text-anchor="middle">muet</text>
  <text x="484" y="438" font-size="13" fill="#1f2328" text-anchor="middle">réexports d'une</text>
  <text x="484" y="455" font-size="13" fill="#1f2328" text-anchor="middle">couche permise</text>
  <rect x="584" y="380" width="180" height="84" rx="8" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="674" y="416" font-size="14" font-weight="700" fill="#5f6b73" text-anchor="middle">muet</text>
  <text x="674" y="438" font-size="13" fill="#1f2328" text-anchor="middle">un fichier à la fois :</text>
  <text x="674" y="455" font-size="13" fill="#1f2328" text-anchor="middle">un import permis</text>
  <rect x="774" y="380" width="162" height="84" rx="8" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="855" y="416" font-size="14" font-weight="700" fill="#5f6b73" text-anchor="middle">muet</text>
  <text x="855" y="438" font-size="13" fill="#1f2328" text-anchor="middle">chaque arête est</text>
  <text x="855" y="455" font-size="13" fill="#1f2328" text-anchor="middle">permise seule</text>
  <!-- conclusion -->
  <text x="32" y="496" font-size="14" font-weight="600" fill="#1f2328">L'outil le moins coûteux tourne le plus souvent, le plus exact a le dernier mot,</text>
  <text x="32" y="516" font-size="14" font-weight="600" fill="#1f2328">et ce qu'aucune règle ne contraint (shared-kernel/, platform/, main.ts) se relit à la main.</text>
</svg>
