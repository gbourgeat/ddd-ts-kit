<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">The same task, by searching or by reading the map</title>
  <desc id="desc">Left, an agent on an unstructured project lists directories, searches, opens candidate files, writes the handler, is refused by a check and rewrites it: six steps, and a rework loop. Right, on a project built with the kit, the agent reads the context as facts with describe, runs the generator which lists the places to fill, fills only those places, and checks what changed: four steps. Every tool result of either path stays in the conversation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="560" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">The same task, by searching or by reading the map</text>
  <text x="32" y="62" font-size="14" fill="#1f2328">Task: add the ability to cancel an appointment, in appointments, permission appointment.cancel</text>
  <!-- left column -->
  <text x="270" y="100" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">Without a map: search, then read</text>
  <rect x="70" y="116" width="400" height="56" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="88" y="139" font-size="14" font-weight="600" fill="#1f2328">1. list the directories</text>
  <text x="88" y="160" font-size="13" fill="#1f2328">ls, tree: every path of the project lands in context</text>
  <rect x="70" y="188" width="400" height="56" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="88" y="211" font-size="14" font-weight="600" fill="#1f2328">2. search for "cancel" and "appointment"</text>
  <text x="88" y="232" font-size="13" fill="#1f2328">every matching line, comments and tests included</text>
  <rect x="70" y="260" width="400" height="56" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="88" y="283" font-size="14" font-weight="600" fill="#1f2328">3. open the candidate files</text>
  <text x="88" y="304" font-size="13" fill="#1f2328">whole files, to learn the conventions by example</text>
  <rect x="70" y="332" width="400" height="56" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="88" y="355" font-size="14" font-weight="600" fill="#1f2328">4. write the command, the handler, the route</text>
  <text x="88" y="376" font-size="13" fill="#1f2328">boilerplate written by hand, in a guessed place</text>
  <rect x="70" y="404" width="400" height="56" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="88" y="427" font-size="14" font-weight="600" fill="#1f2328">5. a check or a reviewer refuses it</text>
  <text x="88" y="448" font-size="13" fill="#1f2328">the whole test log, read for one failure</text>
  <rect x="70" y="476" width="400" height="56" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="88" y="499" font-size="14" font-weight="600" fill="#1f2328">6. read the rule, rewrite</text>
  <text x="88" y="520" font-size="13" fill="#1f2328">the cost of step 4, paid a second time</text>
  <line x1="270" y1="172" x2="270" y2="186" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="270" y1="244" x2="270" y2="258" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="270" y1="316" x2="270" y2="330" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="270" y1="388" x2="270" y2="402" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="270" y1="460" x2="270" y2="474" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- rework loop -->
  <path d="M70,504 H44 V360 H66" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="36" y="432" font-size="13" font-weight="600" fill="#3d4449" text-anchor="middle" transform="rotate(-90 36 432)">rework</text>
  <!-- right column -->
  <text x="710" y="100" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">With the kit: read the map, then the places</text>
  <rect x="510" y="116" width="400" height="72" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="1.5"/>
  <text x="528" y="139" font-size="14" font-weight="600" fill="#1f2328">1. npx ddd-ts-kit describe appointments --json</text>
  <text x="528" y="160" font-size="13" fill="#1f2328">use cases, routes, ports and events, as facts;</text>
  <text x="528" y="178" font-size="13" fill="#1f2328">then the CONTEXT.md of the context</text>
  <rect x="510" y="208" width="400" height="72" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="1.5"/>
  <text x="528" y="231" font-size="14" font-weight="600" fill="#1f2328">2. npx ddd-ts-kit generate command ... --json</text>
  <text x="528" y="252" font-size="13" fill="#1f2328">the files at their computed paths, wired;</text>
  <text x="528" y="270" font-size="13" fill="#1f2328">"todos": the file:line of each decision left</text>
  <rect x="510" y="300" width="400" height="72" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="1.5"/>
  <text x="528" y="323" font-size="14" font-weight="600" fill="#1f2328">3. fill each TODO(domain), replace each it.todo</text>
  <text x="528" y="344" font-size="13" fill="#1f2328">only the places listed under "todos"; the plugin's</text>
  <text x="528" y="362" font-size="13" fill="#1f2328">hook checks each file as it is written</text>
  <rect x="510" y="392" width="400" height="72" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="1.5"/>
  <text x="528" y="415" font-size="14" font-weight="600" fill="#1f2328">4. npx ddd-ts-kit check --changed-since origin/main</text>
  <text x="528" y="436" font-size="13" fill="#1f2328">the changed files only; a violation carries its fix,</text>
  <text x="528" y="454" font-size="13" fill="#1f2328">then the tests of one context</text>
  <line x1="710" y1="188" x2="710" y2="206" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="710" y1="280" x2="710" y2="298" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="710" y1="372" x2="710" y2="390" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="710" y="500" font-size="14" font-style="italic" fill="#2b5d8a" text-anchor="middle">no search, no boilerplate written by hand,</text>
  <text x="710" y="520" font-size="14" font-style="italic" fill="#2b5d8a" text-anchor="middle">the rules checked at each write</text>
</svg>
