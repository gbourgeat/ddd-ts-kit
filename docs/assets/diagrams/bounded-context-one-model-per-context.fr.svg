<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Un mot, trois modèles : chaque contexte garde le modèle qui le sert</title>
  <desc id="desc">Trois contextes délimités ont chacun leur propre modèle d'un rendez-vous. appointments porte Appointment, avec son créneau, son statut, son cycle de vie et ses règles d'annulation. notifications porte un Reminder avec un destinataire, une heure d'envoi et un canal. analytics porte un fait de visite avec un praticien, une durée et une issue. appointments publie l'événement d'intégration appointments.appointment.booked, que les deux autres consomment.</desc>
  <defs>
    <marker id="arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="430" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Un mot, trois modèles : chaque contexte garde le modèle qui le sert</text>
  <rect x="32" y="64" width="330" height="300" rx="12" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="52" y="92" font-size="14" font-weight="600" fill="#5f6b73">contexte délimité : appointments</text>
  <rect x="56" y="112" width="282" height="228" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="197" y="140" font-size="16" font-weight="700" fill="#2f6f4f" text-anchor="middle">Appointment</text>
  <line x1="70" y1="152" x2="324" y2="152" stroke="#2f6f4f" stroke-opacity="0.35"/>
  <text x="197" y="176" font-size="13" fill="#1f2328" text-anchor="middle">slot, status</text>
  <text x="197" y="202" font-size="13" fill="#1f2328" text-anchor="middle">cycle de vie</text>
  <text x="197" y="228" font-size="13" fill="#1f2328" text-anchor="middle">règles d'annulation</text>
  <text x="197" y="254" font-size="13" fill="#1f2328" text-anchor="middle">pas de double réservation</text>
  <rect x="598" y="64" width="330" height="140" rx="12" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="618" y="92" font-size="14" font-weight="600" fill="#5f6b73">contexte délimité : notifications</text>
  <rect x="618" y="104" width="290" height="88" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="763" y="130" font-size="16" font-weight="700" fill="#2f6f4f" text-anchor="middle">Reminder</text>
  <line x1="632" y1="142" x2="894" y2="142" stroke="#2f6f4f" stroke-opacity="0.35"/>
  <text x="763" y="166" font-size="13" fill="#1f2328" text-anchor="middle">recipient, sendAt</text>
  <text x="763" y="186" font-size="13" fill="#1f2328" text-anchor="middle">channel</text>
  <rect x="598" y="224" width="330" height="140" rx="12" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="618" y="252" font-size="14" font-weight="600" fill="#5f6b73">contexte délimité : analytics</text>
  <rect x="618" y="264" width="290" height="88" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="763" y="290" font-size="16" font-weight="700" fill="#2f6f4f" text-anchor="middle">VisitFact</text>
  <line x1="632" y1="302" x2="894" y2="302" stroke="#2f6f4f" stroke-opacity="0.35"/>
  <text x="763" y="326" font-size="13" fill="#1f2328" text-anchor="middle">practitioner, duration</text>
  <text x="763" y="346" font-size="13" fill="#1f2328" text-anchor="middle">outcome</text>
  <line x1="364" y1="148" x2="594" y2="148" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-neutral)"/>
  <text x="480" y="138" font-size="13" fill="#1f2328" text-anchor="middle">appointments.appointment.booked</text>
  <line x1="364" y1="308" x2="594" y2="308" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-neutral)"/>
  <text x="480" y="298" font-size="13" fill="#1f2328" text-anchor="middle">appointments.appointment.booked</text>
  <line x1="32" y1="398" x2="76" y2="398" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-neutral)"/>
  <text x="88" y="403" font-size="14" fill="#1f2328">un événement d'intégration : un fait publié comme contrat, jamais une classe ou une table partagée</text>
</svg>
