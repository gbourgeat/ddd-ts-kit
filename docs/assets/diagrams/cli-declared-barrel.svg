<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 572" width="960" height="572" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">How a declared context reaches the composition root</title>
  <desc id="desc">On the left, the role files of the billing context: the command carries @Requires, the handler @CommandHandler with a constructor typed by InvoiceRepository, IdGenerator and Clock, the repository adapter @Repository with a constructor typed by Database, ExecutionScope and Clock. generate, docs and the dev script read these signatures with the scanner of the checker, without a compiler, and write the declarations of each layer: application/application.declarations.ts and infrastructure/infrastructure.declarations.ts each export the role files of their layer, sorted by path, then hold one injected statement per class of the layer whose constructor takes something; billing.declarations.ts at the root of the context only re-exports these files. The composition root includes billing.declarations.ts with contextModule, and @ddd-ts-kit/di binds each class and injects what the declarations list. Below, check with declarations/barrel-current and docs --check compare each generated file with the role files and report a stale one.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="572" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">How a declared context reaches the composition root</text>
  <!-- role files -->
  <rect x="24" y="64" width="332" height="356" rx="12" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="40" y="90" font-size="14" font-weight="600" fill="#5f6b73">role files of src/contexts/billing/</text>
  <rect x="40" y="104" width="300" height="72" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="56" y="130" font-size="14" font-weight="700" fill="#2b5d8a">issue-invoice.command.ts</text>
  <text x="56" y="154" font-size="13" fill="#1f2328">@Requires(billingPermissions[...])</text>
  <rect x="40" y="188" width="300" height="102" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="56" y="214" font-size="14" font-weight="700" fill="#2b5d8a">issue-invoice.handler.ts</text>
  <text x="56" y="238" font-size="13" fill="#1f2328">@CommandHandler(IssueInvoiceCommand)</text>
  <text x="56" y="258" font-size="13" fill="#1f2328">constructor(InvoiceRepository,</text>
  <text x="72" y="278" font-size="13" fill="#1f2328">IdGenerator, Clock)</text>
  <rect x="40" y="302" width="300" height="102" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="56" y="328" font-size="14" font-weight="700" fill="#7a4f9a">drizzle-invoice.repository.ts</text>
  <text x="56" y="352" font-size="13" fill="#1f2328">@Repository(InvoiceRepository)</text>
  <text x="56" y="372" font-size="13" fill="#1f2328">constructor(Database,</text>
  <text x="72" y="392" font-size="13" fill="#1f2328">ExecutionScope, Clock)</text>
  <!-- scanner -->
  <line x1="358" y1="140" x2="378" y2="140" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="382" y="96" width="264" height="88" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="396" y="122" font-size="15" font-weight="700" fill="#5f6b73">generate, docs, the dev script</text>
  <text x="396" y="146" font-size="13" fill="#1f2328">read the constructor signatures with</text>
  <text x="396" y="166" font-size="13" fill="#1f2328">the scanner of the checker, no compiler</text>
  <line x1="514" y1="186" x2="514" y2="216" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="524" y="206" font-size="13" fill="#1f2328">write</text>
  <!-- declarations of each layer, then their summary -->
  <rect x="382" y="220" width="264" height="66" rx="10" fill="#ffffff" stroke="#3d4449" stroke-width="2"/>
  <text x="396" y="242" font-size="14" font-weight="700" fill="#1f2328">application.declarations.ts</text>
  <text x="396" y="261" font-size="13" fill="#5f6b73">application/, generated</text>
  <text x="396" y="279" font-size="13" fill="#1f2328">injected(IssueInvoiceHandler, ...);</text>
  <rect x="382" y="294" width="264" height="66" rx="10" fill="#ffffff" stroke="#3d4449" stroke-width="2"/>
  <text x="396" y="316" font-size="14" font-weight="700" fill="#1f2328">infrastructure.declarations.ts</text>
  <text x="396" y="335" font-size="13" fill="#5f6b73">infrastructure/, generated</text>
  <text x="396" y="353" font-size="13" fill="#1f2328">injected(DrizzleInvoiceRepository, ...);</text>
  <rect x="382" y="368" width="264" height="52" rx="10" fill="#ffffff" stroke="#3d4449" stroke-width="2.5"/>
  <text x="396" y="390" font-size="15" font-weight="700" fill="#1f2328">billing.declarations.ts</text>
  <text x="396" y="410" font-size="13" fill="#1f2328">export * from each layer file</text>
  <!-- composition root -->
  <path d="M648,394 H660 V270 H672" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="676" y="220" width="260" height="96" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="692" y="246" font-size="15" font-weight="700" fill="#5f6b73">compose-application.ts</text>
  <text x="692" y="268" font-size="13" fill="#1f2328">src/platform/: the one line</text>
  <text x="692" y="292" font-size="13" fill="#1f2328">contextModule('billing',</text>
  <text x="708" y="310" font-size="13" fill="#1f2328">billingDeclarations)</text>
  <line x1="806" y1="318" x2="806" y2="340" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="676" y="344" width="260" height="76" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="692" y="370" font-size="15" font-weight="700" fill="#5f6b73">@ddd-ts-kit/di</text>
  <text x="692" y="394" font-size="13" fill="#1f2328">binds each class to its token,</text>
  <text x="692" y="412" font-size="13" fill="#1f2328">injects what the declarations list</text>
  <!-- check -->
  <line x1="514" y1="456" x2="514" y2="424" stroke="#3d4449" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="524" y="446" font-size="13" fill="#1f2328">compare</text>
  <rect x="24" y="460" width="912" height="64" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="40" y="486" font-size="15" font-weight="700" fill="#5f6b73">check (declarations/barrel-current) and docs --check</text>
  <text x="40" y="510" font-size="13" fill="#1f2328">a role file written by hand, or a constructor changed since: the declarations of its layer are stale, the finding names the class</text>
  <!-- legend -->
  <line x1="40" y1="550" x2="84" y2="550" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="96" y="555" font-size="13" fill="#1f2328">reads, writes, imports</text>
  <line x1="300" y1="550" x2="344" y2="550" stroke="#3d4449" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="356" y="555" font-size="13" fill="#1f2328">compares, writes nothing</text>
</svg>
