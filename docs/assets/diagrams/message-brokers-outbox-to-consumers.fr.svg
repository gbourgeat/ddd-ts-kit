<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 476" width="960" height="476" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">De la commande aux consommateurs, par l'outbox et un broker</title>
  <desc id="desc">Le gestionnaire de BookAppointment écrit le rendez-vous et une ligne d'outbox dans une seule transaction. Le relais de l'outbox lit la ligne après la validation et la publie au broker, en attendant son acquittement ; il peut publier deux fois. Le broker donne à chaque contexte consommateur son propre abonnement et peut livrer deux fois. Chaque consommateur, notifications et analytics, écrit sa marque d'événement traité et sa modification d'état dans une unité de travail de sa propre base, si bien qu'une seconde livraison ne change rien.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="476" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Au moins une fois de bout en bout, dédoublonné par chaque consommateur</text>
  <!-- producer -->
  <rect x="24" y="60" width="300" height="300" rx="12" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="42" y="86" font-size="14" font-weight="600" fill="#5f6b73">producteur : appointments</text>
  <rect x="48" y="102" width="252" height="56" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="174" y="127" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">BookAppointment</text>
  <text x="174" y="147" font-size="13" fill="#1f2328" text-anchor="middle">le gestionnaire (handler)</text>
  <rect x="40" y="196" width="268" height="148" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="56" y="218" font-size="13" font-weight="600" fill="#5f6b73">une transaction de la base</text>
  <rect x="56" y="232" width="236" height="44" rx="8" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="174" y="259" font-size="14" fill="#1f2328" text-anchor="middle">la ligne du rendez-vous</text>
  <rect x="56" y="286" width="236" height="44" rx="8" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="174" y="313" font-size="14" fill="#1f2328" text-anchor="middle">la ligne d'outbox</text>
  <line x1="174" y1="160" x2="174" y2="192" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- relay -->
  <rect x="336" y="270" width="158" height="80" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="415" y="298" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">relais d'outbox</text>
  <text x="415" y="320" font-size="13" fill="#1f2328" text-anchor="middle">après validation ;</text>
  <text x="415" y="338" font-size="13" fill="#1f2328" text-anchor="middle">peut publier deux fois</text>
  <line x1="294" y1="308" x2="332" y2="308" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- broker -->
  <rect x="580" y="255" width="144" height="110" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="652" y="283" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">broker</text>
  <text x="652" y="307" font-size="13" fill="#1f2328" text-anchor="middle">un abonnement</text>
  <text x="652" y="325" font-size="13" fill="#1f2328" text-anchor="middle">par consommateur ;</text>
  <text x="652" y="343" font-size="13" fill="#1f2328" text-anchor="middle">peut relivrer</text>
  <line x1="496" y1="310" x2="576" y2="310" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="536" y="282" font-size="13" fill="#1f2328" text-anchor="middle">publie,</text>
  <text x="536" y="300" font-size="13" fill="#1f2328" text-anchor="middle">attend l'ack</text>
  <!-- consumers -->
  <rect x="750" y="52" width="186" height="148" rx="12" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="764" y="72" font-size="13" font-weight="600" fill="#5f6b73">consommateur :</text>
  <text x="764" y="90" font-size="13" font-weight="600" fill="#5f6b73">notifications</text>
  <rect x="764" y="102" width="158" height="84" rx="8" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="843" y="126" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">une unité de travail</text>
  <text x="843" y="148" font-size="13" fill="#1f2328" text-anchor="middle">la marque « traité »</text>
  <text x="843" y="168" font-size="13" fill="#1f2328" text-anchor="middle">+ la ligne du rappel</text>
  <rect x="750" y="212" width="186" height="148" rx="12" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="764" y="232" font-size="13" font-weight="600" fill="#5f6b73">consommateur :</text>
  <text x="764" y="250" font-size="13" font-weight="600" fill="#5f6b73">analytics</text>
  <rect x="764" y="262" width="158" height="84" rx="8" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="843" y="286" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">une unité de travail</text>
  <text x="843" y="308" font-size="13" fill="#1f2328" text-anchor="middle">la marque « traité »</text>
  <text x="843" y="328" font-size="13" fill="#1f2328" text-anchor="middle">+ la ligne statistique</text>
  <line x1="700" y1="253" x2="746" y2="160" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="726" y1="300" x2="746" y2="300" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- note -->
  <text x="32" y="400" font-size="14" fill="#1f2328">Le broker ne garde jamais la marque : elle est validée avec sa modification, dans la base du consommateur.</text>
  <text x="32" y="424" font-size="14" fill="#1f2328">Une seconde publication ou une seconde livraison trouve la marque et ne change rien.</text>
  <text x="32" y="456" font-size="13" fill="#5f6b73">Règles : events/outbox-required côté producteur, events/consumer-idempotent côté consommateur.</text>
</svg>
