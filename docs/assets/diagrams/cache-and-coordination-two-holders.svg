<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Two holders of one lock, and the fencing token</title>
  <desc id="desc">Instance A acquires the lock with a time to live of 60 seconds and receives token 41, then is paused for 90 seconds. The key expires. Instance B acquires the lock and receives token 42, then writes to a store with token 42. A resumes and writes with token 41: both instances believe they hold the lock, and only a store that remembers the highest token it has seen refuses the stale write.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="520" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">A pause longer than the time to live: two holders</text>
  <!-- participants -->
  <rect x="40" y="58" width="160" height="44" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="120" y="86" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">instance A</text>
  <rect x="280" y="58" width="160" height="44" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="360" y="86" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">lock server</text>
  <rect x="520" y="58" width="160" height="44" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="600" y="86" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">instance B</text>
  <rect x="760" y="58" width="160" height="44" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="840" y="86" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">fenced store</text>
  <!-- lifelines -->
  <line x1="120" y1="104" x2="120" y2="452" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="360" y1="104" x2="360" y2="452" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="600" y1="104" x2="600" y2="452" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="840" y1="104" x2="840" y2="452" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="4 4"/>
  <!-- A acquires -->
  <line x1="122" y1="136" x2="356" y2="136" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="240" y="128" font-size="13" fill="#1f2328" text-anchor="middle">acquire(job, ttl 60 s)</text>
  <line x1="358" y1="170" x2="124" y2="170" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="240" y="162" font-size="13" fill="#1f2328" text-anchor="middle">held, token 41</text>
  <!-- A paused -->
  <rect x="64" y="188" width="112" height="100" rx="6" fill="#f3f4f5" stroke="#5f6b73"/>
  <text x="120" y="232" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">paused 90 s</text>
  <text x="120" y="252" font-size="13" fill="#1f2328" text-anchor="middle">(GC, disk)</text>
  <!-- key expires -->
  <rect x="296" y="196" width="128" height="34" rx="6" fill="#ffffff" stroke="#5f6b73"/>
  <text x="360" y="218" font-size="13" fill="#1f2328" text-anchor="middle">key expires</text>
  <!-- B acquires -->
  <line x1="598" y1="252" x2="364" y2="252" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="480" y="244" font-size="13" fill="#1f2328" text-anchor="middle">acquire(job, ttl 60 s)</text>
  <line x1="362" y1="286" x2="596" y2="286" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="480" y="278" font-size="13" fill="#1f2328" text-anchor="middle">held, token 42</text>
  <!-- B writes -->
  <line x1="602" y1="326" x2="836" y2="326" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="720" y="318" font-size="13" fill="#1f2328" text-anchor="middle">write, token 42: accepted</text>
  <!-- A resumes and writes -->
  <line x1="122" y1="376" x2="836" y2="376" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="240" y="368" font-size="13" fill="#1f2328" text-anchor="middle">resumes: write, token 41</text>
  <line x1="838" y1="420" x2="124" y2="420" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="720" y="412" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">refused: 41 is below 42</text>
  <!-- conclusion -->
  <text x="32" y="484" font-size="14" fill="#1f2328">Both instances believed they held the lock. Only the store, which remembers the highest token it saw,</text>
  <text x="32" y="504" font-size="14" fill="#1f2328">stopped the stale write; a resource that cannot compare tokens takes both.</text>
</svg>
