<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Retries with a fixed delay, then the dead destination</title>
  <desc id="desc">When a handler throws, the provider delivers the event again after a fixed delay, up to maxAttempts deliveries. After the last failed attempt the event goes to the dead destination of the provider: a dead queue for RabbitMQ, a dead-letter topic for Kafka, a dead-letter stream for NATS, a dead stream for Redis Streams. It is reported once to the error tracker when the platform wires DeadLetterReports. Once the cause is fixed, replayDead delivers it again.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="400" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">A handler that keeps failing: a fixed delay, bounded attempts, a dead destination</text>
  <!-- attempts -->
  <rect x="32" y="100" width="150" height="64" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="107" y="128" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">attempt 1</text>
  <text x="107" y="150" font-size="13" fill="#1f2328" text-anchor="middle">the handler throws</text>
  <rect x="242" y="100" width="150" height="64" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="317" y="128" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">attempt 2</text>
  <text x="317" y="150" font-size="13" fill="#1f2328" text-anchor="middle">throws again</text>
  <rect x="452" y="100" width="150" height="64" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="527" y="128" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">attempt 5</text>
  <text x="527" y="150" font-size="13" fill="#1f2328" text-anchor="middle">maxAttempts reached</text>
  <line x1="184" y1="132" x2="238" y2="132" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="211" y="92" font-size="13" fill="#1f2328" text-anchor="middle">delayMs</text>
  <line x1="394" y1="132" x2="448" y2="132" stroke="#3d4449" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrow)"/>
  <text x="421" y="92" font-size="13" fill="#1f2328" text-anchor="middle">...</text>
  <line x1="604" y1="132" x2="658" y2="132" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- dead destination -->
  <rect x="662" y="64" width="266" height="176" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="795" y="92" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">dead destination</text>
  <text x="680" y="118" font-size="13" fill="#1f2328">RabbitMQ: a dead queue</text>
  <text x="680" y="140" font-size="13" fill="#1f2328">Kafka: a dead-letter topic</text>
  <text x="680" y="162" font-size="13" fill="#1f2328">NATS: a dead-letter stream</text>
  <text x="680" y="184" font-size="13" fill="#1f2328">Redis Streams: a dead stream</text>
  <text x="680" y="208" font-size="13" font-weight="600" fill="#1f2328">reported once, with</text>
  <text x="680" y="228" font-size="13" font-weight="600" fill="#1f2328">DeadLetterReports wired</text>
  <!-- replay -->
  <path d="M795,242 V292 H107 V168" fill="none" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="451" y="284" font-size="14" fill="#1f2328" text-anchor="middle">replayDead(), once the cause is fixed</text>
  <!-- notes -->
  <text x="32" y="336" font-size="14" fill="#1f2328">Defaults: 5 deliveries, 5 seconds apart, on all four brokers. A dependency down for an hour sends every</text>
  <text x="32" y="358" font-size="14" fill="#1f2328">event to the dead destination after about 20 seconds: size both, and keep the dead destination empty.</text>
  <text x="32" y="384" font-size="13" fill="#5f6b73">Only the error code of each failure travels with the event, never its message.</text>
</svg>
