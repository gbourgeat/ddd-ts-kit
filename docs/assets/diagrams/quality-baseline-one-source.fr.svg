<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Chaque partie de la base est écrite une seule fois</title>
  <desc id="desc">Deux panneaux. À gauche, la liste des portes BASELINE, dans packages/cli/src/init/manifest/baseline.ts : le script verify d'un projet est construit à partir d'elle, et un test de la CLI tient le workflow GitHub et le pipeline GitLab à chacune de ses portes. À droite, biome.json à la racine du kit : le template biome.json.tpl qu'init copie dans un projet lui est tenu identique par un test, octet pour octet sauf une exclusion du kit (les sources des clients générés), et examples/scheduling/biome.json l'étend. Chaque flèche part de la source vers ce qui en découle.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="400" rx="16" fill="#ffffff"/>
  <text x="24" y="36" font-size="18" font-weight="600" fill="#1f2328">Chaque partie de la base est écrite une seule fois</text>
  <line x1="480" y1="60" x2="480" y2="320" stroke="#d0d7de" stroke-width="1.5"/>
  <!-- left: the gates -->
  <text x="24" y="74" font-size="16" font-weight="700" fill="#1f2328">Une seule liste de portes</text>
  <rect x="56" y="92" width="380" height="64" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="246" y="118" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">BASELINE</text>
  <text x="246" y="140" font-size="13" fill="#1f2328" text-anchor="middle">packages/cli/src/init/manifest/baseline.ts</text>
  <rect x="24" y="228" width="140" height="62" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="94" y="254" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">verify</text>
  <text x="94" y="276" font-size="13" fill="#1f2328" text-anchor="middle">script npm</text>
  <rect x="178" y="228" width="140" height="62" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="248" y="254" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">GitHub</text>
  <text x="248" y="276" font-size="13" fill="#1f2328" text-anchor="middle">le workflow</text>
  <rect x="332" y="228" width="140" height="62" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="402" y="254" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">GitLab</text>
  <text x="402" y="276" font-size="13" fill="#1f2328" text-anchor="middle">.gitlab-ci.yml</text>
  <line x1="100" y1="158" x2="95" y2="226" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="248" y1="158" x2="248" y2="226" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <line x1="396" y1="158" x2="401" y2="226" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="108" y="196" font-size="13" fill="#1f2328">en est construit</text>
  <text x="258" y="196" font-size="13" fill="#1f2328">tenu à chaque porte</text>
  <text x="258" y="212" font-size="13" fill="#1f2328">par un test</text>
  <!-- right: the formatter -->
  <text x="504" y="74" font-size="16" font-weight="700" fill="#1f2328">Une seule configuration du formateur</text>
  <rect x="580" y="92" width="280" height="64" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="720" y="118" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">biome.json</text>
  <text x="720" y="140" font-size="13" fill="#1f2328" text-anchor="middle">à la racine du kit</text>
  <rect x="504" y="228" width="196" height="62" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="602" y="254" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">biome.json.tpl</text>
  <text x="602" y="276" font-size="13" fill="#1f2328" text-anchor="middle">copié par init</text>
  <rect x="720" y="228" width="216" height="62" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="828" y="254" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">l'exemple</text>
  <text x="828" y="276" font-size="13" fill="#1f2328" text-anchor="middle">"extends": "//"</text>
  <line x1="680" y1="158" x2="644" y2="226" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <line x1="780" y1="158" x2="800" y2="226" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="512" y="180" font-size="13" fill="#1f2328">octet pour octet sauf</text>
  <text x="512" y="196" font-size="13" fill="#1f2328">une ligne du kit,</text>
  <text x="512" y="212" font-size="13" fill="#1f2328">tenu par un test</text>
  <text x="806" y="190" font-size="13" fill="#1f2328">étendu par</text>
  <text x="806" y="206" font-size="13" fill="#1f2328">l'exemple</text>
  <!-- legend -->
  <line x1="24" y1="350" x2="68" y2="350" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="80" y="355" font-size="14" fill="#1f2328">construit à partir de la source, ou la lit (chaque flèche part de la source)</text>
  <line x1="24" y1="376" x2="68" y2="376" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="80" y="381" font-size="14" fill="#1f2328">écrit à part, et tenu à la source par un test de la CLI : il ne peut pas dériver en silence</text>
</svg>
