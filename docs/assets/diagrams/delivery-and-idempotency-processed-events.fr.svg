<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Le registre des événements traités dans trois cas</title>
  <desc id="desc">Trois panneaux. Première livraison de e1 : dans une seule unité de travail, la marque du consommateur pour e1 est posée, le gestionnaire insère le rappel, et les deux sont validés ensemble ; l'événement est ensuite acquitté. Nouvelle livraison de e1 : la marque existe déjà, le gestionnaire est sauté, rien ne change, l'événement est acquitté. Le gestionnaire échoue : la marque était posée, le gestionnaire lève une erreur, l'annulation retire la marque avec le reste, l'événement n'est pas acquitté et sa nouvelle livraison est traitée.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="470" rx="16" fill="#ffffff"/>
  <text x="32" y="36" font-size="18" font-weight="600" fill="#1f2328">La marque et le travail sont validés ensemble</text>
  <rect x="24" y="56" width="296" height="356" rx="14" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="40" y="82" font-size="16" font-weight="700" fill="#1f2328">Première livraison de e1</text>
  <text x="40" y="102" font-size="13" fill="#5f6b73">un nouvel événement</text>
  <rect x="36" y="114" width="272" height="196" rx="10" fill="#ffffff" stroke="#2b5d8a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="48" y="134" font-size="13" font-style="italic" fill="#2b5d8a">une unité de travail</text>
  <rect x="48" y="146" width="248" height="38" rx="8" fill="#e7eef5" stroke="#2b5d8a" stroke-width="1.5"/>
  <text x="172" y="170" font-size="13" fill="#1f2328" text-anchor="middle">marque (consommateur, e1) : posée</text>
  <line x1="172" y1="186" x2="172" y2="198" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="48" y="200" width="248" height="38" rx="8" fill="#e7eef5" stroke="#2b5d8a" stroke-width="1.5"/>
  <text x="172" y="224" font-size="13" fill="#1f2328" text-anchor="middle">gestionnaire : insère le rappel</text>
  <line x1="172" y1="240" x2="172" y2="252" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="48" y="254" width="248" height="38" rx="8" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="1.5"/>
  <text x="172" y="278" font-size="13" fill="#1f2328" text-anchor="middle">validation : marque et rappel</text>
  <line x1="172" y1="294" x2="172" y2="326" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="48" y="328" width="248" height="38" rx="8" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="172" y="352" font-size="13" fill="#1f2328" text-anchor="middle">acquittement au broker</text>
  <text x="172" y="396" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">un rappel</text>
  <rect x="332" y="56" width="296" height="356" rx="14" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="348" y="82" font-size="16" font-weight="700" fill="#1f2328">Nouvelle livraison de e1</text>
  <text x="348" y="102" font-size="13" fill="#5f6b73">après un acquittement perdu</text>
  <rect x="344" y="114" width="272" height="196" rx="10" fill="#ffffff" stroke="#2b5d8a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="356" y="134" font-size="13" font-style="italic" fill="#2b5d8a">une unité de travail</text>
  <rect x="356" y="146" width="248" height="38" rx="8" fill="#e7eef5" stroke="#2b5d8a" stroke-width="1.5"/>
  <text x="480" y="170" font-size="13" fill="#1f2328" text-anchor="middle">marque (consommateur, e1) : déjà là</text>
  <line x1="480" y1="186" x2="480" y2="198" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="356" y="200" width="248" height="38" rx="8" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="480" y="224" font-size="13" fill="#1f2328" text-anchor="middle">gestionnaire sauté</text>
  <line x1="480" y1="240" x2="480" y2="252" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="356" y="254" width="248" height="38" rx="8" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="1.5"/>
  <text x="480" y="278" font-size="13" fill="#1f2328" text-anchor="middle">validation : rien n'a changé</text>
  <line x1="480" y1="294" x2="480" y2="326" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="356" y="328" width="248" height="38" rx="8" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="480" y="352" font-size="13" fill="#1f2328" text-anchor="middle">acquittement au broker</text>
  <text x="480" y="396" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">toujours un rappel</text>
  <rect x="640" y="56" width="296" height="356" rx="14" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="656" y="82" font-size="16" font-weight="700" fill="#1f2328">Le gestionnaire échoue</text>
  <text x="656" y="102" font-size="13" fill="#5f6b73">un bug, un délai dépassé, un verrou</text>
  <rect x="652" y="114" width="272" height="196" rx="10" fill="#ffffff" stroke="#2b5d8a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="664" y="134" font-size="13" font-style="italic" fill="#2b5d8a">une unité de travail</text>
  <rect x="664" y="146" width="248" height="38" rx="8" fill="#e7eef5" stroke="#2b5d8a" stroke-width="1.5"/>
  <text x="788" y="170" font-size="13" fill="#1f2328" text-anchor="middle">marque (consommateur, e1) : posée</text>
  <line x1="788" y1="186" x2="788" y2="198" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="664" y="200" width="248" height="38" rx="8" fill="#e7eef5" stroke="#2b5d8a" stroke-width="1.5"/>
  <text x="788" y="224" font-size="13" fill="#1f2328" text-anchor="middle">le gestionnaire lève une erreur</text>
  <line x1="788" y1="240" x2="788" y2="252" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="664" y="254" width="248" height="38" rx="8" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="1.5"/>
  <text x="788" y="278" font-size="13" fill="#1f2328" text-anchor="middle">annulation : la marque part aussi</text>
  <line x1="788" y1="294" x2="788" y2="326" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="664" y="328" width="248" height="38" rx="8" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="788" y="352" font-size="13" fill="#1f2328" text-anchor="middle">pas d'acquittement : il revient</text>
  <text x="788" y="396" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">aucun rappel jusqu'au retour de e1</text>
  <text x="32" y="446" font-size="14" fill="#1f2328">L'acquittement au broker vient après la validation, jamais avant.</text>
</svg>
