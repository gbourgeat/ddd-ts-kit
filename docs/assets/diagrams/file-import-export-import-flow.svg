<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 624" width="960" height="624" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">An import: one transaction to start it, then one unit of work per batch</title>
  <desc id="desc">First the request. The client uploads the file, which the bus stages and scans. The handler of StartImport saves the Import aggregate with its StoredFile and the status running, and enqueues ImportRows with the import id, in the same transaction; after the commit the file moves to its final key. Then the worker. It claims the job; ImportRowsBackgroundJob opens the file from the file storage as a stream, a row reader yields its rows from the checkpoint, each batch of 200 rows is one command and one unit of work, then the job saves its checkpoint and reports its progress, and starts the next batch. Rejected rows go to a part of the rejection report. At the end of the file the job sends CompleteImport.</desc>
  <defs>
    <marker id="arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="624" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">An import: one transaction to start it, then one unit of work per batch</text>
  <text x="32" y="74" font-size="15" font-weight="700" fill="#5f6b73">1. the request: one transaction</text>
  <rect x="32" y="100" width="150" height="76" rx="10" fill="#f6ede6" stroke="#9a5b2b" stroke-width="2"/>
  <text x="107" y="128" font-size="16" font-weight="700" fill="#9a5b2b" text-anchor="middle">client</text>
  <line x1="46" y1="140" x2="168" y2="140" stroke="#9a5b2b" stroke-opacity="0.35"/>
  <text x="107" y="164" font-size="13" fill="#1f2328" text-anchor="middle">uploads the file</text>
  <rect x="222" y="100" width="150" height="76" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="297" y="128" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">StartImport</text>
  <line x1="236" y1="140" x2="358" y2="140" stroke="#2b5d8a" stroke-opacity="0.35"/>
  <text x="297" y="164" font-size="13" fill="#1f2328" text-anchor="middle">handler</text>
  <line x1="184" y1="138" x2="218" y2="138" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow-neutral)"/>
  <rect x="412" y="84" width="516" height="112" rx="12" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="428" y="104" font-size="13" font-weight="600" font-style="italic" fill="#5f6b73">one transaction</text>
  <rect x="428" y="112" width="220" height="76" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="538" y="134" font-size="16" font-weight="700" fill="#2f6f4f" text-anchor="middle">Import</text>
  <text x="538" y="162" font-size="13" fill="#1f2328" text-anchor="middle">StoredFile, owner,</text>
  <text x="538" y="180" font-size="13" fill="#1f2328" text-anchor="middle">status running</text>
  <rect x="668" y="112" width="244" height="76" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="790" y="134" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">job queue</text>
  <text x="790" y="162" font-size="13" fill="#1f2328" text-anchor="middle">ImportRows { importId }</text>
  <text x="790" y="180" font-size="13" fill="#1f2328" text-anchor="middle">enqueued with it</text>
  <line x1="374" y1="138" x2="408" y2="138" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow-neutral)"/>
  <text x="428" y="218" font-size="13" fill="#1f2328">after the commit: the file moves</text>
  <text x="428" y="236" font-size="13" fill="#1f2328">to its final key (promoteOnCommit)</text>
  <text x="32" y="272" font-size="15" font-weight="700" fill="#5f6b73">2. the worker: ImportRowsBackgroundJob, at least once</text>
  <rect x="24" y="284" width="912" height="322" rx="14" fill="#ffffff" stroke="#2b5d8a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="790" y1="190" x2="790" y2="280" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow-neutral)"/>
  <text x="780" y="262" font-size="13" fill="#1f2328" text-anchor="end">a worker claims the job</text>
  <rect x="44" y="310" width="160" height="112" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="124" y="338" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">file storage</text>
  <line x1="58" y1="350" x2="190" y2="350" stroke="#5f6b73" stroke-opacity="0.35"/>
  <text x="124" y="374" font-size="13" fill="#1f2328" text-anchor="middle">get(key):</text>
  <text x="124" y="394" font-size="13" fill="#1f2328" text-anchor="middle">a stream</text>
  <rect x="240" y="310" width="190" height="112" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="335" y="338" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">row reader</text>
  <line x1="254" y1="350" x2="416" y2="350" stroke="#7a4f9a" stroke-opacity="0.35"/>
  <text x="335" y="374" font-size="13" fill="#1f2328" text-anchor="middle">one row at a time,</text>
  <text x="335" y="394" font-size="13" fill="#1f2328" text-anchor="middle">from the checkpoint</text>
  <text x="335" y="414" font-size="13" font-weight="600" font-style="italic" fill="#7a4f9a" text-anchor="middle">to be added</text>
  <rect x="466" y="310" width="210" height="112" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="571" y="338" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">one batch: 200 rows</text>
  <line x1="480" y1="350" x2="662" y2="350" stroke="#2b5d8a" stroke-opacity="0.35"/>
  <text x="571" y="374" font-size="13" fill="#1f2328" text-anchor="middle">one command,</text>
  <text x="571" y="394" font-size="13" fill="#1f2328" text-anchor="middle">one unit of work,</text>
  <text x="571" y="414" font-size="13" fill="#1f2328" text-anchor="middle">its counts on the Import</text>
  <rect x="712" y="310" width="204" height="112" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="814" y="338" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">checkpoint</text>
  <line x1="726" y1="350" x2="902" y2="350" stroke="#2b5d8a" stroke-opacity="0.35"/>
  <text x="814" y="374" font-size="13" fill="#1f2328" text-anchor="middle">saveCheckpoint({ row })</text>
  <text x="814" y="394" font-size="13" fill="#1f2328" text-anchor="middle">reportProgress({ done })</text>
  <line x1="206" y1="366" x2="236" y2="366" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow-neutral)"/>
  <line x1="432" y1="366" x2="462" y2="366" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow-neutral)"/>
  <line x1="678" y1="366" x2="708" y2="366" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow-neutral)"/>
  <path d="M740,424 V452 H571 V426" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow-neutral)"/>
  <text x="655" y="472" font-size="13" fill="#1f2328" text-anchor="middle">next batch, until the end of the file</text>
  <path d="M520,424 V500 H430" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow-neutral)"/>
  <text x="476" y="518" font-size="13" fill="#1f2328" text-anchor="middle">rejected rows</text>
  <rect x="220" y="478" width="206" height="100" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="323" y="506" font-size="15" font-weight="700" fill="#5f6b73" text-anchor="middle">rejection report</text>
  <line x1="234" y1="518" x2="412" y2="518" stroke="#5f6b73" stroke-opacity="0.35"/>
  <text x="323" y="542" font-size="13" fill="#1f2328" text-anchor="middle">imports/&lt;id&gt;/rejected/</text>
  <text x="323" y="562" font-size="13" fill="#1f2328" text-anchor="middle">&lt;batch&gt;.csv, one part per batch</text>
  <line x1="880" y1="424" x2="880" y2="490" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow-neutral)"/>
  <text x="872" y="462" font-size="13" fill="#1f2328" text-anchor="end">end of the file</text>
  <rect x="712" y="494" width="204" height="100" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="814" y="522" font-size="15" font-weight="700" fill="#2b5d8a" text-anchor="middle">CompleteImport</text>
  <line x1="726" y1="534" x2="902" y2="534" stroke="#2b5d8a" stroke-opacity="0.35"/>
  <text x="814" y="558" font-size="13" fill="#1f2328" text-anchor="middle">records the report key,</text>
  <text x="814" y="578" font-size="13" fill="#1f2328" text-anchor="middle">the Import ends</text>
</svg>
