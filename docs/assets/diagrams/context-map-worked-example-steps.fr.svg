<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">D'une expression des besoins à une carte des contextes, en sept étapes</title>
  <desc id="desc">Sept étapes, chacune avec ce qu'elle produit : l'expression des besoins, un paragraphe ; sa lecture pour le langage, noms, verbes, faits et règles ; les contextes candidats, chaque frontière passée aux quatre tests ; la classification, cœur, de soutien ou générique ; les relations, un patron par dépendance et aucun cycle ; l'écriture, glossaires, configuration et carte des contextes ; puis les signaux qui changeraient la carte.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="330" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">D'une expression des besoins à une carte des contextes, en sept étapes</text>
  <rect x="20" y="64" width="116" height="236" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="78" y="94" font-size="18" font-weight="700" fill="#5f6b73" text-anchor="middle">1</text>
  <text x="78" y="118" font-size="14" font-weight="700" fill="#5f6b73" text-anchor="middle">expression</text>
  <text x="78" y="136" font-size="14" font-weight="700" fill="#5f6b73" text-anchor="middle">des besoins</text>
  <line x1="32" y1="150" x2="124" y2="150" stroke="#5f6b73" stroke-opacity="0.35"/>
  <text x="78" y="174" font-size="13" fill="#1f2328" text-anchor="middle">un paragraphe,</text>
  <text x="78" y="194" font-size="13" fill="#1f2328" text-anchor="middle">écrit par une</text>
  <text x="78" y="214" font-size="13" fill="#1f2328" text-anchor="middle">personne</text>
  <text x="78" y="234" font-size="13" fill="#1f2328" text-anchor="middle">du produit</text>
  <line x1="137" y1="182" x2="152" y2="182" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="154" y="64" width="116" height="236" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="212" y="94" font-size="18" font-weight="700" fill="#5f6b73" text-anchor="middle">2</text>
  <text x="212" y="118" font-size="14" font-weight="700" fill="#5f6b73" text-anchor="middle">la lire pour</text>
  <text x="212" y="136" font-size="14" font-weight="700" fill="#5f6b73" text-anchor="middle">le langage</text>
  <line x1="166" y1="150" x2="258" y2="150" stroke="#5f6b73" stroke-opacity="0.35"/>
  <text x="212" y="174" font-size="13" fill="#1f2328" text-anchor="middle">noms, verbes,</text>
  <text x="212" y="194" font-size="13" fill="#1f2328" text-anchor="middle">faits, règles ;</text>
  <text x="212" y="214" font-size="13" fill="#1f2328" text-anchor="middle">préciser</text>
  <text x="212" y="234" font-size="13" fill="#1f2328" text-anchor="middle">les mots</text>
  <line x1="271" y1="182" x2="286" y2="182" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="288" y="64" width="116" height="236" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="346" y="94" font-size="18" font-weight="700" fill="#5f6b73" text-anchor="middle">3</text>
  <text x="346" y="118" font-size="14" font-weight="700" fill="#5f6b73" text-anchor="middle">contextes</text>
  <text x="346" y="136" font-size="14" font-weight="700" fill="#5f6b73" text-anchor="middle">candidats</text>
  <line x1="300" y1="150" x2="392" y2="150" stroke="#5f6b73" stroke-opacity="0.35"/>
  <text x="346" y="174" font-size="13" fill="#1f2328" text-anchor="middle">quatre tests</text>
  <text x="346" y="194" font-size="13" fill="#1f2328" text-anchor="middle">par frontière :</text>
  <text x="346" y="214" font-size="13" fill="#1f2328" text-anchor="middle">langage,</text>
  <text x="346" y="234" font-size="13" fill="#1f2328" text-anchor="middle">autonomie,</text>
  <text x="346" y="254" font-size="13" fill="#1f2328" text-anchor="middle">cohérence,</text>
  <text x="346" y="274" font-size="13" fill="#1f2328" text-anchor="middle">taille</text>
  <line x1="405" y1="182" x2="420" y2="182" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="422" y="64" width="116" height="236" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="480" y="94" font-size="18" font-weight="700" fill="#5f6b73" text-anchor="middle">4</text>
  <text x="480" y="118" font-size="14" font-weight="700" fill="#5f6b73" text-anchor="middle">classer</text>
  <line x1="434" y1="150" x2="526" y2="150" stroke="#5f6b73" stroke-opacity="0.35"/>
  <text x="480" y="174" font-size="13" fill="#1f2328" text-anchor="middle">cœur,</text>
  <text x="480" y="194" font-size="13" fill="#1f2328" text-anchor="middle">de soutien ou</text>
  <text x="480" y="214" font-size="13" fill="#1f2328" text-anchor="middle">générique</text>
  <line x1="539" y1="182" x2="554" y2="182" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="556" y="64" width="116" height="236" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="614" y="94" font-size="18" font-weight="700" fill="#5f6b73" text-anchor="middle">5</text>
  <text x="614" y="118" font-size="14" font-weight="700" fill="#5f6b73" text-anchor="middle">choisir les</text>
  <text x="614" y="136" font-size="14" font-weight="700" fill="#5f6b73" text-anchor="middle">relations</text>
  <line x1="568" y1="150" x2="660" y2="150" stroke="#5f6b73" stroke-opacity="0.35"/>
  <text x="614" y="174" font-size="13" fill="#1f2328" text-anchor="middle">un patron par</text>
  <text x="614" y="194" font-size="13" fill="#1f2328" text-anchor="middle">dépendance,</text>
  <text x="614" y="214" font-size="13" fill="#1f2328" text-anchor="middle">aucun cycle</text>
  <line x1="673" y1="182" x2="688" y2="182" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="690" y="64" width="116" height="236" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="748" y="94" font-size="18" font-weight="700" fill="#5f6b73" text-anchor="middle">6</text>
  <text x="748" y="118" font-size="14" font-weight="700" fill="#5f6b73" text-anchor="middle">l'écrire</text>
  <line x1="702" y1="150" x2="794" y2="150" stroke="#5f6b73" stroke-opacity="0.35"/>
  <text x="748" y="174" font-size="13" fill="#1f2328" text-anchor="middle">glossaires,</text>
  <text x="748" y="194" font-size="13" fill="#1f2328" text-anchor="middle">configuration,</text>
  <text x="748" y="214" font-size="13" fill="#1f2328" text-anchor="middle">context-map.md</text>
  <line x1="807" y1="182" x2="822" y2="182" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="824" y="64" width="116" height="236" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="882" y="94" font-size="18" font-weight="700" fill="#5f6b73" text-anchor="middle">7</text>
  <text x="882" y="118" font-size="14" font-weight="700" fill="#5f6b73" text-anchor="middle">guetter les</text>
  <text x="882" y="136" font-size="14" font-weight="700" fill="#5f6b73" text-anchor="middle">signaux</text>
  <line x1="836" y1="150" x2="928" y2="150" stroke="#5f6b73" stroke-opacity="0.35"/>
  <text x="882" y="174" font-size="13" fill="#1f2328" text-anchor="middle">ce qui</text>
  <text x="882" y="194" font-size="13" fill="#1f2328" text-anchor="middle">changerait</text>
  <text x="882" y="214" font-size="13" fill="#1f2328" text-anchor="middle">la carte</text>
</svg>
