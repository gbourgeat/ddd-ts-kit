<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Where the four signals are produced</title>
  <desc id="desc">Nested boxes around one use case. The HTTP boundary, with tracedRoutes, opens the span of the request and reports every 5xx answer. Inside it, the middlewares of the command and query buses open the span of the use case, write one log entry, record the use_case duration and count, and report a failure that is not a DomainError. In the middle, the handler, the aggregate and the ports are business code and produce no signal: they throw. The handler calls an adapter through its port; the adapter is wrapped where the platform binds it, which gives the span of the call, its log entries and the dependency_call metrics.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="470" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Where the four signals are produced</text>
  <!-- HTTP boundary -->
  <rect x="24" y="60" width="912" height="340" rx="14" fill="#f6ede6" stroke="#9a5b2b" stroke-width="2"/>
  <text x="44" y="88" font-size="16" font-weight="700" fill="#9a5b2b">HTTP boundary: around: tracedRoutes()</text>
  <text x="44" y="110" font-size="13" fill="#1f2328">span POST /appointments (SERVER), with the correlation id and the origin; a report for every 5xx</text>
  <!-- buses -->
  <rect x="48" y="128" width="560" height="248" rx="12" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="68" y="156" font-size="16" font-weight="700" fill="#2b5d8a">command and query buses: middlewares</text>
  <text x="68" y="178" font-size="13" fill="#1f2328">span command BookAppointment; one log entry per use case;</text>
  <text x="68" y="198" font-size="13" fill="#1f2328">use_case_duration_ms and use_case_total; a report for</text>
  <text x="68" y="218" font-size="13" fill="#1f2328">anything but a DomainError</text>
  <!-- business code -->
  <rect x="72" y="238" width="360" height="118" rx="10" fill="#ffffff" stroke="#2f6f4f" stroke-width="2"/>
  <text x="92" y="266" font-size="16" font-weight="700" fill="#2f6f4f">handler, aggregate, ports</text>
  <text x="92" y="290" font-size="13" fill="#1f2328">business code: no span, no log line,</text>
  <text x="92" y="310" font-size="13" fill="#1f2328">no metric, no report</text>
  <text x="92" y="336" font-size="13" font-style="italic" font-weight="600" fill="#2f6f4f">it throws, and that is all it says</text>
  <!-- adapter -->
  <rect x="656" y="200" width="256" height="156" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="676" y="228" font-size="16" font-weight="700" fill="#7a4f9a">adapter</text>
  <text x="676" y="250" font-size="13" fill="#1f2328">wrapped where it is bound:</text>
  <text x="676" y="272" font-size="13" fill="#1f2328">span &lt;kind&gt; &lt;Port&gt;.&lt;method&gt;;</text>
  <text x="676" y="292" font-size="13" fill="#1f2328">logged and timed aspects:</text>
  <text x="676" y="312" font-size="13" fill="#1f2328">log entries and</text>
  <text x="676" y="332" font-size="13" fill="#1f2328">dependency_call metrics</text>
  <!-- call through the port -->
  <path d="M434,290 H652" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="446" y="280" font-size="13" fill="#1f2328">through its port</text>
  <!-- legend -->
  <text x="32" y="432" font-size="14" fill="#1f2328">Consumers and jobs have their own boundary: a span process &lt;consumer&gt; or job &lt;name&gt;, and a report</text>
  <text x="32" y="454" font-size="14" fill="#1f2328">when an event is given up or a run fails. Every signal carries names from the code, never arguments.</text>
</svg>
