<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Un mock vérifie des appels, un fake vérifie un résultat</title>
  <desc id="desc">À gauche, une spec avec un mock appelle le gestionnaire puis vérifie l'appel qu'il a fait à un repository simulé : elle est couplée à la façon dont le gestionnaire travaille. À droite, une spec avec un fake envoie la commande par le bus de commandes au vrai gestionnaire, qui enregistre dans un repository en mémoire et publie sur le bus d'événements ; la spec lit ensuite l'état du fake et les événements publiés : elle vérifie ce qui est vrai après coup.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
    <marker id="arrow-reads" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5f6b73"/>
    </marker>
  </defs>
  <rect width="960" height="470" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Un mock vérifie des appels, un fake vérifie un résultat</text>
  <!-- with a mock -->
  <rect x="24" y="56" width="448" height="350" rx="14" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="44" y="82" font-size="14" font-weight="600" fill="#5f6b73">au lieu de : un mock (vi.fn)</text>
  <rect x="64" y="100" width="170" height="44" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="149" y="127" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">spec</text>
  <rect x="64" y="196" width="170" height="44" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="149" y="223" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">gestionnaire</text>
  <rect x="64" y="292" width="170" height="56" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="149" y="316" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">repository simulé</text>
  <text x="149" y="336" font-size="13" fill="#1f2328" text-anchor="middle">répond ce qu'on lui dit</text>
  <line x1="149" y1="146" x2="149" y2="194" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="157" y="174" font-size="13" fill="#1f2328">execute(command)</text>
  <line x1="149" y1="242" x2="149" y2="290" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="157" y="270" font-size="13" fill="#1f2328">save(...)</text>
  <path d="M236,122 H300 V266 H226" fill="none" stroke="#5f6b73" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-reads)"/>
  <text x="312" y="190" font-size="13" font-weight="600" fill="#1f2328">vérifie l'appel :</text>
  <text x="312" y="210" font-size="13" fill="#1f2328">save appelé avec</text>
  <text x="312" y="230" font-size="13" fill="#1f2328">status 'cancelled'</text>
  <text x="248" y="376" font-size="13" fill="#1f2328" text-anchor="middle">casse quand le gestionnaire est remanié,</text>
  <text x="248" y="394" font-size="13" fill="#1f2328" text-anchor="middle">passe quand le mock répond un mensonge</text>
  <!-- with a fake -->
  <rect x="488" y="56" width="448" height="350" rx="14" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="508" y="82" font-size="14" font-weight="600" fill="#5f6b73">écrivez : un fake, par l'application de test</text>
  <rect x="528" y="100" width="170" height="44" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="613" y="127" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">spec</text>
  <rect x="528" y="196" width="170" height="44" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="613" y="223" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">gestionnaire</text>
  <rect x="528" y="292" width="170" height="56" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="613" y="316" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">repository fake</text>
  <text x="613" y="336" font-size="13" fill="#1f2328" text-anchor="middle">fonctionne, en mémoire</text>
  <rect x="740" y="292" width="172" height="56" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="826" y="316" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">bus d'événements</text>
  <text x="826" y="336" font-size="13" fill="#1f2328" text-anchor="middle">de l'application de test</text>
  <line x1="613" y1="146" x2="613" y2="194" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="621" y="174" font-size="13" fill="#1f2328">commandBus.execute</text>
  <line x1="613" y1="242" x2="613" y2="290" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="621" y="270" font-size="13" fill="#1f2328">save</text>
  <path d="M700,218 H780 V290" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="704" y="210" font-size="13" fill="#1f2328">publie</text>
  <path d="M700,122 H880 V290" fill="none" stroke="#5f6b73" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-reads)"/>
  <path d="M528,122 H508 V320 H526" fill="none" stroke="#5f6b73" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-reads)"/>
  <text x="712" y="376" font-size="13" fill="#1f2328" text-anchor="middle">vérifie ce qui est vrai après coup : le rendez-vous</text>
  <text x="712" y="394" font-size="13" fill="#1f2328" text-anchor="middle">est annulé, l'événement a été publié</text>
  <!-- legend -->
  <line x1="32" y1="440" x2="76" y2="440" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="88" y="445" font-size="13" fill="#1f2328">un appel fait par le code testé</text>
  <line x1="420" y1="440" x2="464" y2="440" stroke="#5f6b73" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-reads)"/>
  <text x="476" y="445" font-size="13" fill="#1f2328">ce que la spec vérifie</text>
</svg>
