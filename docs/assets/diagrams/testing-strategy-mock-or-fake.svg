<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">A mock asserts calls, a fake asserts outcomes</title>
  <desc id="desc">On the left, a spec with a mock calls the handler and then asserts the call the handler made to a mocked repository: it is coupled to how the handler works. On the right, a spec with a fake sends the command through the command bus to the real handler, which saves into an in-memory repository and publishes on the event bus; the spec then reads the state of the fake and the published events: it asserts what is true afterwards.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
    <marker id="arrow-reads" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5f6b73"/>
    </marker>
  </defs>
  <rect width="960" height="470" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">A mock asserts calls, a fake asserts outcomes</text>
  <!-- with a mock -->
  <rect x="24" y="56" width="448" height="350" rx="14" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="44" y="82" font-size="14" font-weight="600" fill="#5f6b73">instead of: a mock (vi.fn)</text>
  <rect x="64" y="100" width="170" height="44" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="149" y="127" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">spec</text>
  <rect x="64" y="196" width="170" height="44" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="149" y="223" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">handler</text>
  <rect x="64" y="292" width="170" height="56" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="149" y="316" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">mocked repository</text>
  <text x="149" y="336" font-size="13" fill="#1f2328" text-anchor="middle">answers what it is told</text>
  <line x1="149" y1="146" x2="149" y2="194" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="157" y="174" font-size="13" fill="#1f2328">execute(command)</text>
  <line x1="149" y1="242" x2="149" y2="290" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="157" y="270" font-size="13" fill="#1f2328">save(...)</text>
  <path d="M236,122 H300 V266 H226" fill="none" stroke="#5f6b73" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-reads)"/>
  <text x="312" y="190" font-size="13" font-weight="600" fill="#1f2328">asserts the call:</text>
  <text x="312" y="210" font-size="13" fill="#1f2328">save was called with</text>
  <text x="312" y="230" font-size="13" fill="#1f2328">status 'cancelled'</text>
  <text x="248" y="376" font-size="13" fill="#1f2328" text-anchor="middle">breaks when the handler is refactored,</text>
  <text x="248" y="394" font-size="13" fill="#1f2328" text-anchor="middle">passes when the mock answers a lie</text>
  <!-- with a fake -->
  <rect x="488" y="56" width="448" height="350" rx="14" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="508" y="82" font-size="14" font-weight="600" fill="#5f6b73">write: a fake, through the test application</text>
  <rect x="528" y="100" width="170" height="44" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="613" y="127" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">spec</text>
  <rect x="528" y="196" width="170" height="44" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="613" y="223" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">handler</text>
  <rect x="528" y="292" width="170" height="56" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="613" y="316" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">fake repository</text>
  <text x="613" y="336" font-size="13" fill="#1f2328" text-anchor="middle">works, in memory</text>
  <rect x="740" y="292" width="172" height="56" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="826" y="316" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">event bus</text>
  <text x="826" y="336" font-size="13" fill="#1f2328" text-anchor="middle">of the test application</text>
  <line x1="613" y1="146" x2="613" y2="194" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="621" y="174" font-size="13" fill="#1f2328">commandBus.execute</text>
  <line x1="613" y1="242" x2="613" y2="290" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="621" y="270" font-size="13" fill="#1f2328">save</text>
  <path d="M700,218 H780 V290" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="704" y="210" font-size="13" fill="#1f2328">publish</text>
  <path d="M700,122 H880 V290" fill="none" stroke="#5f6b73" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-reads)"/>
  <path d="M528,122 H508 V320 H526" fill="none" stroke="#5f6b73" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-reads)"/>
  <text x="712" y="376" font-size="13" fill="#1f2328" text-anchor="middle">asserts what is true afterwards: the appointment</text>
  <text x="712" y="394" font-size="13" fill="#1f2328" text-anchor="middle">is cancelled, the event was published</text>
  <!-- legend -->
  <line x1="32" y1="440" x2="76" y2="440" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="88" y="445" font-size="13" fill="#1f2328">a call made by the code under test</text>
  <line x1="420" y1="440" x2="464" y2="440" stroke="#5f6b73" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-reads)"/>
  <text x="476" y="445" font-size="13" fill="#1f2328">what the spec asserts on</text>
</svg>
