<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 544" width="960" height="544" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Quelle stratégie pour une lecture qui a besoin des données d'un autre contexte</title>
  <desc id="desc">Un arbre de décision. Si la lecture filtre ou trie par les données étrangères, ou les lit en longues listes très souvent, utilisez une projection, le choix par défaut : le consommateur garde les champs dont il a besoin, à partir des événements, au prix de la cohérence à terme et d'un chemin de reconstruction. Sinon, si l'écran est vraiment deux vues de deux contextes côte à côte, composez deux requêtes au-dessus des contextes. Sinon, hydratez à la requête par un port gateway : des données fraîches, au prix de la latence et de la dépendance à l'autre côté.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="544" rx="16" fill="#ffffff"/>
  <text x="32" y="34" font-size="18" font-weight="600" fill="#1f2328">Quelle stratégie pour une lecture qui a besoin des données d'un autre contexte</text>
  <rect x="330" y="52" width="300" height="56" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="480" y="74" font-size="16" font-weight="700" text-anchor="middle" fill="#5f6b73">une lecture a besoin de données</text>
  <text x="480" y="96" font-size="13" text-anchor="middle" fill="#1f2328">détenues par un autre contexte</text>
  <line x1="480" y1="108" x2="480" y2="138" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="250" y="140" width="460" height="72" rx="10" fill="#ffffff" stroke="#3d4449" stroke-width="2"/>
  <text x="480" y="171" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2328">Filtrée ou triée par ces données,</text>
  <text x="480" y="193" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2328">ou lue en longues listes, très souvent ?</text>
  <path d="M250,176 H168 V382" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="210" y="168" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">oui</text>
  <line x1="480" y1="212" x2="480" y2="260" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="492" y="241" font-size="13" font-weight="600" fill="#1f2328">non</text>
  <rect x="290" y="262" width="380" height="72" rx="10" fill="#ffffff" stroke="#3d4449" stroke-width="2"/>
  <text x="480" y="293" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2328">L'écran est-il vraiment deux vues</text>
  <text x="480" y="315" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2328">de deux contextes, côte à côte ?</text>
  <path d="M670,298 H792 V382" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="730" y="290" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">oui</text>
  <line x1="480" y1="334" x2="480" y2="382" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="492" y="363" font-size="13" font-weight="600" fill="#1f2328">non</text>
  <rect x="24" y="384" width="288" height="133" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="168" y="410" font-size="16" font-weight="700" text-anchor="middle" fill="#2b5d8a">projection (par défaut)</text>
  <text x="168" y="432" font-size="13" text-anchor="middle" fill="#1f2328">tenue par le consommateur</text>
  <text x="168" y="453" font-size="13" text-anchor="middle" fill="#1f2328">à partir des événements</text>
  <text x="168" y="474" font-size="13" text-anchor="middle" fill="#1f2328">apporte : filtres, tris, gros volume</text>
  <text x="168" y="495" font-size="13" text-anchor="middle" fill="#1f2328">coûte : cohérence à terme, reconstruction</text>
  <rect x="336" y="384" width="288" height="133" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="480" y="410" font-size="16" font-weight="700" text-anchor="middle" fill="#2b5d8a">hydratation</text>
  <text x="480" y="432" font-size="13" text-anchor="middle" fill="#1f2328">à la requête,</text>
  <text x="480" y="453" font-size="13" text-anchor="middle" fill="#1f2328">par une gateway</text>
  <text x="480" y="474" font-size="13" text-anchor="middle" fill="#1f2328">apporte : fraîcheur, rien à stocker</text>
  <text x="480" y="495" font-size="13" text-anchor="middle" fill="#1f2328">coûte : latence, dépend de l'autre côté</text>
  <rect x="648" y="384" width="288" height="133" rx="10" fill="#f6ede6" stroke="#9a5b2b" stroke-width="2"/>
  <text x="792" y="410" font-size="16" font-weight="700" text-anchor="middle" fill="#9a5b2b">composition</text>
  <text x="792" y="432" font-size="13" text-anchor="middle" fill="#1f2328">au-dessus des contextes :</text>
  <text x="792" y="453" font-size="13" text-anchor="middle" fill="#1f2328">deux requêtes</text>
  <text x="792" y="474" font-size="13" text-anchor="middle" fill="#1f2328">apporte : contextes inchangés</text>
  <text x="792" y="495" font-size="13" text-anchor="middle" fill="#1f2328">coûte : orchestration hors des contextes</text>
</svg>
