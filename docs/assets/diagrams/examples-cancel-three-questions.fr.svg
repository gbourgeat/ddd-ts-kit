<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Une requête HTTP, trois questions : annuler un rendez-vous</title>
  <desc id="desc">Le chemin de POST /appointments/:id/cancellation dans l'exemple scheduling, de haut en bas. Le groupe de routes ne laisse passer qu'un appelant authentifié (401 sinon). Avant le gestionnaire, l'autorisateur vérifie la permission appointment.cancel sur le rendez-vous, par les rôles du jeton puis les relations (403). Dans le gestionnaire, le rendez-vous est chargé (404 s'il n'existe pas) et la politique scheduling.patient-cancels-until-notice est interrogée avec lui (403 pour un patient à moins de 24 heures du début). Le domaine tient ensuite ses invariants : le cabinet donne un motif (422 REASON_REQUIRED), un rendez-vous terminé ne change plus (409 APPOINTMENT_ENDED). Enfin, une unité de travail valide ensemble (commit) le rendez-vous, les réactions à AppointmentCancelled (le créneau libéré offert à la liste d'attente, la note de présence quand le patient a annulé) et la ligne d'outbox, et la réponse est 201.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="660" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Une requête HTTP, trois questions : annuler un rendez-vous</text>
  <text x="24" y="72" font-size="13" font-weight="600" fill="#5f6b73">la question</text>
  <text x="236" y="72" font-size="13" font-weight="600" fill="#5f6b73">ce qui s'exécute, dans cet ordre</text>
  <text x="676" y="72" font-size="13" font-weight="600" fill="#5f6b73">la réponse quand c'est non</text>

  <!-- the questions -->
  <text x="24" y="122" font-size="15" font-weight="700" fill="#1f2328">Qui appelle ?</text>
  <text x="24" y="144" font-size="13" fill="#1f2328">un jeton Keycloak,</text>
  <text x="24" y="162" font-size="13" fill="#1f2328">vérifié à l'entrée</text>
  <line x1="214" y1="192" x2="214" y2="360" stroke="#2b5d8a" stroke-width="2"/>
  <text x="24" y="262" font-size="15" font-weight="700" fill="#1f2328">Peut-il faire cela,</text>
  <text x="24" y="282" font-size="15" font-weight="700" fill="#1f2328">sur cet élément ?</text>
  <text x="24" y="304" font-size="13" fill="#1f2328">l'application décide,</text>
  <text x="24" y="322" font-size="13" fill="#1f2328">avant tout changement</text>
  <text x="24" y="422" font-size="15" font-weight="700" fill="#1f2328">Est-ce valide en soi ?</text>
  <text x="24" y="444" font-size="13" fill="#1f2328">le domaine, quel que</text>
  <text x="24" y="462" font-size="13" fill="#1f2328">soit l'appelant</text>
  <text x="24" y="522" font-size="15" font-weight="700" fill="#1f2328">Puis c'est enregistré</text>
  <text x="24" y="544" font-size="13" fill="#1f2328">tout est validé ensemble</text>
  <text x="24" y="562" font-size="13" fill="#1f2328">(commit), ou rien</text>

  <!-- 1. presentation -->
  <rect x="236" y="88" width="400" height="76" rx="10" fill="#f6ede6" stroke="#9a5b2b" stroke-width="2"/>
  <text x="252" y="114" font-size="15" font-weight="700" fill="#9a5b2b">POST /appointments/:id/cancellation</text>
  <text x="252" y="136" font-size="13" fill="#1f2328">la garde Authenticated du groupe de routes,</text>
  <text x="252" y="154" font-size="13" fill="#1f2328">puis le contrôleur envoie CancelAppointmentCommand</text>
  <!-- 2. permission -->
  <rect x="236" y="188" width="400" height="76" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="252" y="214" font-size="15" font-weight="700" fill="#2b5d8a">permission, avant le gestionnaire</text>
  <text x="252" y="236" font-size="13" fill="#1f2328">@Requires : appointment.cancel sur appointment:&lt;id&gt;</text>
  <text x="252" y="254" font-size="13" fill="#1f2328">l'autorisateur lit les rôles du jeton, puis les relations</text>
  <!-- 3. policy -->
  <rect x="236" y="288" width="400" height="76" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="252" y="314" font-size="15" font-weight="700" fill="#2b5d8a">politique, dans le gestionnaire</text>
  <text x="252" y="336" font-size="13" fill="#1f2328">charger le rendez-vous, puis Access.authorize avec lui</text>
  <text x="252" y="354" font-size="13" fill="#1f2328">scheduling.patient-cancels-until-notice</text>
  <!-- 4. domain -->
  <rect x="236" y="388" width="400" height="76" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="252" y="414" font-size="15" font-weight="700" fill="#2f6f4f">invariants, dans le domaine</text>
  <text x="252" y="436" font-size="13" fill="#1f2328">Cancellation.create : le cabinet donne un motif</text>
  <text x="252" y="454" font-size="13" fill="#1f2328">appointment.cancel : seulement s'il est demandé ou réservé</text>
  <!-- 5. unit of work -->
  <rect x="236" y="488" width="400" height="94" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="252" y="514" font-size="15" font-weight="700" fill="#7a4f9a">une unité de travail</text>
  <text x="252" y="536" font-size="13" fill="#1f2328">le rendez-vous, les réactions à AppointmentCancelled</text>
  <text x="252" y="554" font-size="13" fill="#1f2328">(le créneau libéré offert à la liste d'attente, la note</text>
  <text x="252" y="572" font-size="13" fill="#1f2328">de présence si le patient a annulé) et la ligne d'outbox</text>

  <!-- yes: down -->
  <line x1="436" y1="164" x2="436" y2="184" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="436" y1="264" x2="436" y2="284" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="436" y1="364" x2="436" y2="384" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="436" y1="464" x2="436" y2="484" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- no: right -->
  <line x1="636" y1="126" x2="672" y2="126" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="654" y="118" font-size="13" fill="#1f2328" text-anchor="middle">non</text>
  <line x1="636" y1="226" x2="672" y2="226" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="654" y="218" font-size="13" fill="#1f2328" text-anchor="middle">non</text>
  <line x1="636" y1="326" x2="672" y2="326" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="654" y="318" font-size="13" fill="#1f2328" text-anchor="middle">non</text>
  <line x1="636" y1="426" x2="672" y2="426" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="654" y="418" font-size="13" fill="#1f2328" text-anchor="middle">non</text>
  <line x1="636" y1="526" x2="672" y2="526" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- the answers -->
  <rect x="676" y="88" width="260" height="76" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="692" y="114" font-size="15" font-weight="700" fill="#5f6b73">401 UNAUTHORIZED</text>
  <text x="692" y="136" font-size="13" fill="#1f2328">appelant anonyme</text>
  <rect x="676" y="188" width="260" height="76" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="692" y="214" font-size="15" font-weight="700" fill="#5f6b73">403 FORBIDDEN</text>
  <text x="692" y="236" font-size="13" fill="#1f2328">aucun rôle ni aucune relation</text>
  <text x="692" y="254" font-size="13" fill="#1f2328">n'accorde la permission</text>
  <rect x="676" y="288" width="260" height="76" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="692" y="314" font-size="15" font-weight="700" fill="#5f6b73">403 FORBIDDEN</text>
  <text x="692" y="336" font-size="13" fill="#1f2328">un patient, moins de 24 h avant ;</text>
  <text x="692" y="354" font-size="13" fill="#1f2328">404 APPOINTMENT_NOT_FOUND</text>
  <rect x="676" y="388" width="260" height="76" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="692" y="414" font-size="15" font-weight="700" fill="#5f6b73">422 REASON_REQUIRED</text>
  <text x="692" y="436" font-size="13" fill="#1f2328">le cabinet n'a donné aucun motif ;</text>
  <text x="692" y="454" font-size="13" fill="#1f2328">409 APPOINTMENT_ENDED</text>
  <rect x="676" y="488" width="260" height="94" rx="10" fill="#ffffff" stroke="#3d4449" stroke-width="2"/>
  <text x="692" y="514" font-size="15" font-weight="700" fill="#1f2328">201 { id }</text>
  <text x="692" y="536" font-size="13" fill="#1f2328">le rendez-vous est annulé</text>

  <text x="32" y="618" font-size="14" fill="#1f2328">Après le commit, le relais publie scheduling.appointment.cancelled : notification prévient le</text>
  <text x="32" y="638" font-size="14" fill="#1f2328">patient, analytics enregistre l'issue. Aucun des deux ne s'exécute dans cette requête HTTP.</text>
</svg>
