<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 548" width="960" height="548" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Choisir comment câbler l'application</title>
  <desc id="desc">Un arbre de décision. Si NestJS est déjà le framework, utilisez son conteneur, dans le style explicite, avec des providers par fabrique. Sinon, pour un service de quelques classes, câblez à la main et renoncez aux vérifications au démarrage. Sinon, utilisez @ddd-ts-kit/di dans le style déclaré, sur tsyringe ou, sous une politique contre les dépendances peu actives, sur Awilix, avec un module explicite pour un contexte au câblage inhabituel. Une application passée par un bundler ou serverless assemble chaque contexte depuis son barrel généré ; sinon le barrel est le défaut et la découverte l'alternative.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="548" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Choisir comment câbler l'application</text>
  <!-- Q1 -->
  <rect x="32" y="64" width="420" height="64" rx="10" fill="#ffffff" stroke="#3d4449" stroke-width="2"/>
  <text x="242" y="101" font-size="14" fill="#1f2328" text-anchor="middle">NestJS est-il déjà le framework de l'application ?</text>
  <line x1="454" y1="96" x2="518" y2="96" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="484" y="88" font-size="13" fill="#1f2328" text-anchor="middle">oui</text>
  <rect x="520" y="64" width="408" height="64" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="724" y="91" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">conteneur de NestJS</text>
  <text x="724" y="113" font-size="13" fill="#1f2328" text-anchor="middle">style explicite, providers par fabrique</text>
  <line x1="242" y1="130" x2="242" y2="162" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="254" y="151" font-size="13" fill="#1f2328">non</text>
  <!-- Q2 -->
  <rect x="32" y="164" width="420" height="64" rx="10" fill="#ffffff" stroke="#3d4449" stroke-width="2"/>
  <text x="242" y="191" font-size="14" fill="#1f2328" text-anchor="middle">Un service de quelques classes,</text>
  <text x="242" y="211" font-size="14" fill="#1f2328" text-anchor="middle">sans besoin des vérifications au démarrage ?</text>
  <line x1="454" y1="196" x2="518" y2="196" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="484" y="188" font-size="13" fill="#1f2328" text-anchor="middle">oui</text>
  <rect x="520" y="164" width="408" height="64" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="724" y="191" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">câblage manuel</text>
  <text x="724" y="213" font-size="13" fill="#1f2328" text-anchor="middle">on renonce aux vérifications au démarrage</text>
  <line x1="242" y1="230" x2="242" y2="262" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="254" y="251" font-size="13" fill="#1f2328">non</text>
  <!-- tsyringe -->
  <rect x="32" y="264" width="420" height="64" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="242" y="291" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">@ddd-ts-kit/di, style déclaré</text>
  <text x="242" y="313" font-size="13" fill="#1f2328" text-anchor="middle">sur tsyringe, ou sur Awilix sous une politique de dépendances</text>
  <line x1="454" y1="296" x2="518" y2="296" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="520" y="264" width="408" height="64" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="724" y="291" font-size="13" fill="#1f2328" text-anchor="middle">un contexte avec fabriques ou liaisons conditionnelles :</text>
  <text x="724" y="313" font-size="13" fill="#1f2328" text-anchor="middle">un module explicite, ou include() dans un module mixte</text>
  <line x1="242" y1="330" x2="242" y2="354" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Q3 -->
  <rect x="32" y="356" width="420" height="64" rx="10" fill="#ffffff" stroke="#3d4449" stroke-width="2"/>
  <text x="242" y="383" font-size="14" fill="#1f2328" text-anchor="middle">L'application passe-t-elle par un bundler,</text>
  <text x="242" y="403" font-size="14" fill="#1f2328" text-anchor="middle">ou tourne-t-elle en fonction serverless ?</text>
  <line x1="454" y1="388" x2="518" y2="388" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="484" y="380" font-size="13" fill="#1f2328" text-anchor="middle">oui</text>
  <rect x="520" y="356" width="408" height="64" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="724" y="383" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">le barrel généré</text>
  <text x="724" y="405" font-size="13" fill="#1f2328" text-anchor="middle">contextModule, que le bundler suit ; pas de découverte</text>
  <line x1="242" y1="422" x2="242" y2="450" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="254" y="441" font-size="13" fill="#1f2328">non</text>
  <!-- R3b -->
  <rect x="32" y="452" width="420" height="64" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="242" y="479" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">le barrel, par défaut</text>
  <text x="242" y="501" font-size="13" fill="#1f2328" text-anchor="middle">ou la découverte, quand ajouter un fichier doit suffire</text>
</svg>
