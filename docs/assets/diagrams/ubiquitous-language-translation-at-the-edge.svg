<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Translation at the edge: each context keeps its own words</title>
  <desc id="desc">The appointments context publishes appointments.appointment.booked, version 1, in its published language. The integration event handler of notifications translates it into a command of its own vocabulary, ScheduleReminder, and the Reminder decides when it is due. The handler of ScheduleReminder sends through a port of notifications; the anti-corruption layer that implements it translates into the words of an SMS provider, which never reach the domain.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="540" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Translation at the edge: each context keeps its own words</text>
  <!-- appointments, the upstream -->
  <rect x="24" y="64" width="460" height="176" rx="12" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="40" y="90" font-size="14" font-weight="600" fill="#5f6b73">appointments</text>
  <rect x="36" y="104" width="160" height="112" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="116.0" y="130" font-size="16" font-weight="700" fill="#2f6f4f" text-anchor="middle">Appointment</text>
  <line x1="50" y1="140" x2="182" y2="140" stroke="#2f6f4f" stroke-opacity="0.35"/>
  <text x="116.0" y="160" font-size="13" fill="#1f2328" text-anchor="middle">book(slot)</text>
  <text x="116.0" y="180" font-size="13" fill="#1f2328" text-anchor="middle">records</text>
  <text x="116.0" y="200" font-size="13" fill="#1f2328" text-anchor="middle">AppointmentBooked</text>
  <!-- the published language -->
  <rect x="240" y="104" width="232" height="112" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="356.0" y="130" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">Published language</text>
  <line x1="254" y1="140" x2="458" y2="140" stroke="#5f6b73" stroke-opacity="0.35"/>
  <text x="356.0" y="160" font-size="13" fill="#1f2328" text-anchor="middle">the contract, in its words:</text>
  <text x="356.0" y="180" font-size="13" fill="#1f2328" text-anchor="middle">appointments.appointment</text>
  <text x="356.0" y="200" font-size="13" fill="#1f2328" text-anchor="middle">.booked, version 1</text>
  <!-- notifications, the downstream -->
  <rect x="504" y="64" width="432" height="368" rx="12" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="520" y="90" font-size="14" font-weight="600" fill="#5f6b73">notifications</text>
  <rect x="520" y="104" width="180" height="112" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="610.0" y="130" font-size="15" font-weight="700" fill="#2b5d8a" text-anchor="middle">Event handler</text>
  <line x1="534" y1="140" x2="686" y2="140" stroke="#2b5d8a" stroke-opacity="0.35"/>
  <text x="610.0" y="160" font-size="13" fill="#1f2328" text-anchor="middle">of the integration</text>
  <text x="610.0" y="180" font-size="13" fill="#1f2328" text-anchor="middle">event: it only</text>
  <text x="610.0" y="200" font-size="13" fill="#1f2328" text-anchor="middle">translates</text>
  <rect x="520" y="244" width="180" height="72" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="610.0" y="270" font-size="15" font-weight="700" fill="#2b5d8a" text-anchor="middle">ScheduleReminder</text>
  <line x1="534" y1="280" x2="686" y2="280" stroke="#2b5d8a" stroke-opacity="0.35"/>
  <text x="610.0" y="300" font-size="13" fill="#1f2328" text-anchor="middle">in its own words</text>
  <rect x="520" y="344" width="180" height="72" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="610.0" y="370" font-size="15" font-weight="700" fill="#2f6f4f" text-anchor="middle">Reminder</text>
  <line x1="534" y1="380" x2="686" y2="380" stroke="#2f6f4f" stroke-opacity="0.35"/>
  <text x="610.0" y="400" font-size="13" fill="#1f2328" text-anchor="middle">decides when it is due</text>
  <rect x="748" y="244" width="176" height="72" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="836.0" y="270" font-size="15" font-weight="700" fill="#2b5d8a" text-anchor="middle">Sender port</text>
  <line x1="762" y1="280" x2="910" y2="280" stroke="#2b5d8a" stroke-opacity="0.35"/>
  <text x="836.0" y="300" font-size="13" fill="#1f2328" text-anchor="middle">send in our words</text>
  <rect x="748" y="344" width="176" height="72" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="836.0" y="370" font-size="14" font-weight="700" fill="#7a4f9a" text-anchor="middle">Anti-corruption layer</text>
  <line x1="762" y1="380" x2="910" y2="380" stroke="#7a4f9a" stroke-opacity="0.35"/>
  <text x="836.0" y="400" font-size="13" fill="#1f2328" text-anchor="middle">the vendor's words</text>
  <rect x="748" y="452" width="176" height="66" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="836.0" y="478" font-size="14" font-weight="700" fill="#5f6b73" text-anchor="middle">SMS provider</text>
  <line x1="762" y1="488" x2="910" y2="488" stroke="#5f6b73" stroke-opacity="0.35"/>
  <text x="836.0" y="508" font-size="13" fill="#1f2328" text-anchor="middle">its own vocabulary</text>
  <!-- messages and calls -->
  <line x1="198" y1="160" x2="236" y2="160" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <line x1="474" y1="160" x2="516" y2="160" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <line x1="610" y1="218" x2="610" y2="240" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="610" y1="318" x2="610" y2="340" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="702" y1="280" x2="744" y2="280" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="836" y1="342" x2="836" y2="320" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="846" y="336" font-size="13" font-style="italic" fill="#1f2328">implements</text>
  <line x1="836" y1="418" x2="836" y2="448" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- legend -->
  <line x1="40" y1="472" x2="84" y2="472" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="96" y="477" font-size="14" fill="#1f2328">an integration event: asynchronous, through the outbox</text>
  <line x1="40" y1="498" x2="84" y2="498" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="96" y="503" font-size="14" fill="#1f2328">a call or a command, inside one context</text>
</svg>
