<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Trois ajouts en même temps : une chaîne attend, l'autre non</title>
  <desc id="desc">Trois transactions ajoutent une entrée en même temps. T1 et T2 ajoutent à la chaîne tenant:acme, T3 à tenant:globex. T1 verrouille la ligne de tête de tenant:acme dans audit_chains par SELECT FOR UPDATE et lit la séquence 41, insère l'entrée 42 et avance la tête à 42, puis valide, ce qui libère le verrou. T2 demande la même ligne et attend la validation de T1, puis lit 42 et écrit l'entrée 43 : la chaîne ne peut pas bifurquer. T3 verrouille la tête de tenant:globex, que personne ne tient, et écrit l'entrée 8 sans attendre. En REPEATABLE READ ou SERIALIZABLE, T2 échoue sur une erreur de sérialisation au lieu d'attendre, et son appelant rejoue l'unité de travail.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="440" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Trois ajouts en même temps : une chaîne attend, l'autre non</text>
  <!-- time axis -->
  <line x1="200" y1="70" x2="930" y2="70" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="200" y="62" font-size="13" fill="#5f6b73">temps</text>

  <!-- lane labels -->
  <text x="32" y="114" font-size="15" font-weight="700" fill="#1f2328">T1</text>
  <text x="32" y="134" font-size="13" fill="#5f6b73">tenant:acme</text>
  <text x="32" y="204" font-size="15" font-weight="700" fill="#1f2328">T2</text>
  <text x="32" y="224" font-size="13" fill="#5f6b73">tenant:acme</text>
  <text x="32" y="294" font-size="15" font-weight="700" fill="#1f2328">T3</text>
  <text x="32" y="314" font-size="13" fill="#5f6b73">tenant:globex</text>

  <!-- T1 -->
  <rect x="200" y="96" width="150" height="44" rx="8" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="1.5"/>
  <text x="275" y="123" font-size="13" fill="#1f2328" text-anchor="middle">verrou tête : 41</text>
  <rect x="360" y="96" width="150" height="44" rx="8" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="1.5"/>
  <text x="435" y="123" font-size="13" fill="#1f2328" text-anchor="middle">entrée 42, tête 42</text>
  <rect x="520" y="96" width="90" height="44" rx="8" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="565" y="123" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">validation</text>
  <line x1="200" y1="150" x2="610" y2="150" stroke="#7a4f9a" stroke-width="4" stroke-opacity="0.5"/>
  <text x="200" y="170" font-size="13" fill="#7a4f9a">verrou de ligne sur la tête de tenant:acme, jusqu'à la validation</text>

  <!-- T2 -->
  <rect x="230" y="186" width="380" height="44" rx="8" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="420" y="213" font-size="13" font-style="italic" fill="#5f6b73" text-anchor="middle">verrou tête : attend T1</text>
  <rect x="620" y="186" width="110" height="44" rx="8" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="1.5"/>
  <text x="675" y="213" font-size="13" fill="#1f2328" text-anchor="middle">tête : 42</text>
  <rect x="740" y="186" width="100" height="44" rx="8" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="1.5"/>
  <text x="790" y="213" font-size="13" fill="#1f2328" text-anchor="middle">entrée 43</text>
  <rect x="850" y="186" width="80" height="44" rx="8" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="890" y="213" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">validation</text>
  <!-- T1 commit releases T2 -->
  <path d="M610,140 L640,184" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- T3 -->
  <rect x="230" y="276" width="150" height="44" rx="8" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="1.5"/>
  <text x="305" y="303" font-size="13" fill="#1f2328" text-anchor="middle">verrou tête : 7</text>
  <rect x="390" y="276" width="130" height="44" rx="8" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="1.5"/>
  <text x="455" y="303" font-size="13" fill="#1f2328" text-anchor="middle">entrée 8, tête 8</text>
  <rect x="530" y="276" width="90" height="44" rx="8" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="575" y="303" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">validation</text>
  <text x="640" y="303" font-size="13" fill="#1f2328">une autre chaîne : aucune attente</text>

  <!-- what an append does -->
  <rect x="24" y="346" width="912" height="74" rx="12" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="44" y="370" font-size="13" font-weight="600" fill="#5f6b73">Un ajout : insère la ligne de tête de la chaîne si elle manque, la sélectionne FOR UPDATE, en scelle l'entrée,</text>
  <text x="44" y="390" font-size="13" font-weight="600" fill="#5f6b73">l'insère dans audit_entries, avance la tête dans audit_chains. Le verrou dure jusqu'à la fin de la transaction.</text>
  <text x="44" y="410" font-size="13" fill="#1f2328">En REPEATABLE READ ou SERIALIZABLE, T2 échoue sur une erreur de sérialisation au lieu d'attendre : son appelant rejoue.</text>
</svg>
