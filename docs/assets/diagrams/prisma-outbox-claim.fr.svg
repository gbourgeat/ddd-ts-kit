<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 664" width="960" height="664" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Les deux stratégies de réclamation de PrismaOutboxStore</title>
  <desc id="desc">Avec skip-locked, une transaction courte verrouille les lignes dues par un select for update skip locked en SQL brut, les lit et leur donne un bail ; les relais sautent les lignes des autres. Avec compare-and-set, le registre lit les lignes dues, puis prend chacune par un updateMany gardé par le nombre de tentatives lu, et relit pour remplacer les lignes qu'un autre relais a prises. Dans les deux cas, un enregistrement réclamé reçoit un bail de leaseMs, si bien que les enregistrements d'un relais mort reviennent.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="664" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Les deux stratégies de réclamation de PrismaOutboxStore</text>

  <!-- left panel: skip-locked -->
  <text x="40" y="76" font-size="16" font-weight="700" fill="#7a4f9a">'skip-locked'</text>
  <text x="160" y="76" font-size="14" fill="#5f6b73">PostgreSQL ou MySQL 8</text>
  <rect x="24" y="92" width="444" height="334" rx="12" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="44" y="116" font-size="14" font-weight="600" fill="#5f6b73">une transaction courte (ou l'unité de travail en cours)</text>

  <rect x="44" y="132" width="404" height="76" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="246" y="156" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">1. verrouiller les lignes dues</text>
  <text x="246" y="178" font-size="13" fill="#1f2328" text-anchor="middle">select id ... for update skip locked limit n</text>
  <text x="246" y="198" font-size="13" fill="#1f2328" text-anchor="middle">SQL brut, l'instruction que Prisma ne sait pas écrire</text>

  <rect x="44" y="232" width="404" height="76" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="246" y="256" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">2. les lire</text>
  <text x="246" y="278" font-size="13" fill="#1f2328" text-anchor="middle">findMany({ where: { id: { in: ids } } })</text>
  <text x="246" y="298" font-size="13" fill="#1f2328" text-anchor="middle">Prisma Client</text>

  <rect x="44" y="332" width="404" height="76" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="246" y="356" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">3. leur donner un bail</text>
  <text x="246" y="378" font-size="13" fill="#1f2328" text-anchor="middle">updateMany : attempts + 1, nextAttemptAt = now + leaseMs</text>
  <text x="246" y="398" font-size="13" fill="#1f2328" text-anchor="middle">Prisma Client</text>

  <line x1="246" y1="210" x2="246" y2="230" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="246" y1="310" x2="246" y2="330" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="40" y="452" font-size="14" fill="#1f2328">Validation : les verrous tombent aussitôt, le bail reste.</text>
  <text x="40" y="484" font-size="14" fill="#1f2328"><tspan font-weight="700">Gain :</tspan> les relais sautent les lignes prises, sans attendre.</text>
  <text x="40" y="508" font-size="14" fill="#1f2328"><tspan font-weight="700">Coût :</tspan> nomme le dialecte, le schéma et la table.</text>

  <!-- right panel: compare-and-set -->
  <text x="512" y="76" font-size="16" font-weight="700" fill="#7a4f9a">'compare-and-set'</text>
  <text x="672" y="76" font-size="14" fill="#5f6b73">toute base de données</text>

  <rect x="512" y="132" width="384" height="76" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="704" y="156" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">1. lire les lignes dues</text>
  <text x="704" y="178" font-size="13" fill="#1f2328" text-anchor="middle">findMany : status pending, nextAttemptAt &lt;= now</text>
  <text x="704" y="198" font-size="13" fill="#1f2328" text-anchor="middle">triées par nextAttemptAt, puis par sequence</text>

  <rect x="512" y="232" width="384" height="76" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="704" y="256" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">2. prendre chacune</text>
  <text x="704" y="278" font-size="13" fill="#1f2328" text-anchor="middle">updateMany où id et attempts sont ceux lus</text>
  <text x="704" y="298" font-size="13" fill="#1f2328" text-anchor="middle">count 1 : prise ; count 0 : un autre relais l'a prise</text>

  <rect x="512" y="332" width="384" height="76" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="704" y="356" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">3. remplacer les perdues</text>
  <text x="704" y="378" font-size="13" fill="#1f2328" text-anchor="middle">moins que demandé, et d'autres étaient dues :</text>
  <text x="704" y="398" font-size="13" fill="#1f2328" text-anchor="middle">relire</text>

  <line x1="704" y1="210" x2="704" y2="230" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="704" y1="310" x2="704" y2="330" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M898,370 H922 V170 H900" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="512" y="452" font-size="14" fill="#1f2328">Aucune transaction : la garde est le nombre de tentatives.</text>
  <text x="512" y="484" font-size="14" fill="#1f2328"><tspan font-weight="700">Gain :</tspan> Prisma Client seul, toute base de données.</text>
  <text x="512" y="508" font-size="14" fill="#1f2328"><tspan font-weight="700">Coût :</tspan> une instruction par enregistrement.</text>

  <!-- both -->
  <rect x="24" y="536" width="912" height="104" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="44" y="562" font-size="14" font-weight="600" fill="#5f6b73">Les deux stratégies</text>
  <text x="44" y="584" font-size="14" fill="#1f2328">Un enregistrement réclamé est caché des autres réclamations pendant leaseMs (30 s par défaut).</text>
  <text x="44" y="604" font-size="14" fill="#1f2328">Le relais le publie, puis le marque publié ; si le relais meurt avant, le bail expire et l'enregistrement</text>
  <text x="44" y="624" font-size="14" fill="#1f2328">est réclamé de nouveau : au moins une fois.</text>
</svg>
