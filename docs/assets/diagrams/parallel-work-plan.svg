<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Four contexts, four workers: two short sequential phases first</title>
  <desc id="desc">Phase 0, one worker: the bootstrap, init with four contexts, their relationships and glossaries, verify green, merged. Phase 1, in sequence: calendars publishes working-hours-changed and time-off-added, then appointments publishes booked, rescheduled and cancelled. Phase 2, four workers in parallel: W1 calendars, W2 appointments, W3 availability, W4 notifications. Phase 3, one worker: merge in the order of the map, regenerate, add the end-to-end specs that cross contexts.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="540" rx="16" fill="#ffffff"/>
  <text x="32" y="34" font-size="18" font-weight="600" fill="#1f2328">Four contexts, four workers: two short sequential phases first</text>
  <rect x="24" y="50" width="912" height="90" rx="12" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="40" y="76" font-size="14" font-weight="700" fill="#5f6b73">phase 0</text>
  <text x="40" y="96" font-size="13" fill="#1f2328">one worker,</text>
  <text x="40" y="114" font-size="13" fill="#1f2328">nobody else</text>
  <rect x="24" y="156" width="912" height="96" rx="12" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="40" y="182" font-size="14" font-weight="700" fill="#5f6b73">phase 1</text>
  <text x="40" y="202" font-size="13" fill="#1f2328">contracts,</text>
  <text x="40" y="220" font-size="13" fill="#1f2328">in sequence</text>
  <rect x="24" y="276" width="912" height="118" rx="12" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="40" y="302" font-size="14" font-weight="700" fill="#5f6b73">phase 2</text>
  <text x="40" y="322" font-size="13" fill="#1f2328">four workers,</text>
  <text x="40" y="340" font-size="13" fill="#1f2328">in parallel</text>
  <rect x="24" y="414" width="912" height="80" rx="12" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="40" y="440" font-size="14" font-weight="700" fill="#5f6b73">phase 3</text>
  <text x="40" y="460" font-size="13" fill="#1f2328">one worker</text>
  <rect x="330" y="66" width="480" height="58" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="570" y="88" font-size="16" font-weight="700" text-anchor="middle" fill="#5f6b73">bootstrap</text>
  <text x="570" y="110" font-size="13" text-anchor="middle" fill="#1f2328">init, four contexts, relationships, glossaries, verify green</text>
  <rect x="230" y="172" width="300" height="64" rx="10" fill="#ffffff" stroke="#3d4449" stroke-width="2"/>
  <text x="380" y="196" font-size="16" font-weight="700" text-anchor="middle" fill="#3d4449">calendars publishes</text>
  <text x="380" y="218" font-size="13" text-anchor="middle" fill="#1f2328">working-hours-changed, time-off-added</text>
  <rect x="610" y="172" width="300" height="64" rx="10" fill="#ffffff" stroke="#3d4449" stroke-width="2"/>
  <text x="760" y="196" font-size="16" font-weight="700" text-anchor="middle" fill="#3d4449">appointments publishes</text>
  <text x="760" y="218" font-size="13" text-anchor="middle" fill="#1f2328">booked, rescheduled, cancelled</text>
  <path d="M570,124 V148 H380 V170" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="530" y1="204" x2="608" y2="204" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M760,236 V262 M289,262 H835" fill="none" stroke="#3d4449" stroke-width="2"/>
  <line x1="289" y1="262" x2="289" y2="292" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="206" y="294" width="166" height="86" rx="10" fill="#ffffff" stroke="#3d4449" stroke-width="2"/>
  <text x="289" y="320" font-size="16" font-weight="700" text-anchor="middle" fill="#3d4449">W1 calendars</text>
  <text x="289" y="342" font-size="13" text-anchor="middle" fill="#1f2328">SetWorkingHours,</text>
  <text x="289" y="362" font-size="13" text-anchor="middle" fill="#1f2328">AddTimeOff</text>
  <path d="M289,380 V404" fill="none" stroke="#3d4449" stroke-width="2"/>
  <line x1="471" y1="262" x2="471" y2="292" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="388" y="294" width="166" height="86" rx="10" fill="#ffffff" stroke="#3d4449" stroke-width="2"/>
  <text x="471" y="320" font-size="16" font-weight="700" text-anchor="middle" fill="#3d4449">W2 appointments</text>
  <text x="471" y="342" font-size="13" text-anchor="middle" fill="#1f2328">Book, Reschedule,</text>
  <text x="471" y="362" font-size="13" text-anchor="middle" fill="#1f2328">Cancel, Get, Search</text>
  <path d="M471,380 V404" fill="none" stroke="#3d4449" stroke-width="2"/>
  <line x1="653" y1="262" x2="653" y2="292" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="570" y="294" width="166" height="86" rx="10" fill="#ffffff" stroke="#3d4449" stroke-width="2"/>
  <text x="653" y="320" font-size="16" font-weight="700" text-anchor="middle" fill="#3d4449">W3 availability</text>
  <text x="653" y="342" font-size="13" text-anchor="middle" fill="#1f2328">its projection,</text>
  <text x="653" y="362" font-size="13" text-anchor="middle" fill="#1f2328">FindOpenSlots</text>
  <path d="M653,380 V404" fill="none" stroke="#3d4449" stroke-width="2"/>
  <line x1="835" y1="262" x2="835" y2="292" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="752" y="294" width="166" height="86" rx="10" fill="#ffffff" stroke="#3d4449" stroke-width="2"/>
  <text x="835" y="320" font-size="16" font-weight="700" text-anchor="middle" fill="#3d4449">W4 notifications</text>
  <text x="835" y="342" font-size="13" text-anchor="middle" fill="#1f2328">confirmation, reminders,</text>
  <text x="835" y="362" font-size="13" text-anchor="middle" fill="#1f2328">provider ACL</text>
  <path d="M835,380 V404" fill="none" stroke="#3d4449" stroke-width="2"/>
  <path d="M289,404 H835" fill="none" stroke="#3d4449" stroke-width="2"/>
  <line x1="570" y1="404" x2="570" y2="428" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="250" y="430" width="640" height="56" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="570" y="452" font-size="16" font-weight="700" text-anchor="middle" fill="#5f6b73">integration</text>
  <text x="570" y="474" font-size="13" text-anchor="middle" fill="#1f2328">merge in map order, regenerate, cross-context end-to-end specs</text>
  <text x="32" y="522" font-size="14" font-style="italic" fill="#1f2328">Phases 0 and 1 are short, and they remove nearly every collision from phases 2 and 3.</text>
</svg>
