  <text x="264" y="479" font-size="14" fill="#1f2328" text-anchor="start">contexte de soutien</text>
  <rect x="452" y="466" width="22" height="16" rx="4" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="484" y="479" font-size="14" fill="#1f2328" text-anchor="start">système externe</text>
  <line x1="672" y1="474" x2="716" y2="474" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="728" y="479" font-size="14" fill="#1f2328" text-anchor="start">de l'amont vers l'aval</text>
  <line x1="32" y1="506" x2="76" y2="506" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="88" y="511" font-size="14" fill="#1f2328" text-anchor="start">depuis un système externe</text>
  <text x="32" y="540" font-size="14" fill="#1f2328" text-anchor="start">PL langage publié, CF conformiste, ACL couche anticorruption, OIDC jetons OpenID Connect</text>
