  <text x="365" y="259" font-size="16" font-weight="700" fill="#2f6f4f" text-anchor="middle">appointments</text>
  <text x="365" y="285" font-size="13" fill="#1f2328" text-anchor="middle">cœur</text>
  <rect x="534" y="96" width="182" height="76" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="2"/>
  <text x="625" y="129" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">availability</text>
  <text x="625" y="155" font-size="13" fill="#1f2328" text-anchor="middle">de soutien</text>
  <rect x="534" y="226" width="182" height="76" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="2"/>
  <text x="625" y="259" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">notifications</text>
  <text x="625" y="285" font-size="13" fill="#1f2328" text-anchor="middle">de soutien</text>
  <rect x="534" y="356" width="182" height="76" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="2"/>
  <text x="625" y="389" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">analytics</text>
  <text x="625" y="415" font-size="13" fill="#1f2328" text-anchor="middle">de soutien</text>
  <rect x="784" y="226" width="152" height="76" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="860" y="259" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">Courriel, SMS</text>
  <text x="860" y="285" font-size="13" fill="#1f2328" text-anchor="middle">fournisseur externe</text>
  <rect x="264" y="356" width="202" height="76" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="365" y="389" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">Fournisseur d'identité</text>
  <text x="365" y="415" font-size="13" fill="#1f2328" text-anchor="middle">générique, externe</text>
