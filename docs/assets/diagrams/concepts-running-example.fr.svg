<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">L'exemple suivi : une application de prise de rendez-vous</title>
  <desc id="desc">Cinq contextes délimités et deux systèmes externes, de l'amont vers l'aval. calendars publie son langage vers appointments et availability. appointments, le contexte cœur, publie vers availability et notifications, et analytics s'y conforme. Le fournisseur de courriel et de SMS, externe, est en amont de notifications, qui protège son modèle derrière une couche anticorruption. Le fournisseur d'identité, générique et acheté, émet les jetons OpenID Connect de chaque contexte, que la plateforme traduit une fois. Les flèches pleines vont de l'amont vers l'aval ; les flèches en tirets viennent d'un système externe.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="560" rx="16" fill="#ffffff"/>
