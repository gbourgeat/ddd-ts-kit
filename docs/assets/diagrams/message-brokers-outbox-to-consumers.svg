<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 476" width="960" height="476" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">From the command to the consumers, through the outbox and a broker</title>
  <desc id="desc">The handler of BookAppointment writes the appointment and an outbox row in one transaction. The outbox relay reads the row after the commit and publishes it to the broker, waiting for its acknowledgement; it may publish twice. The broker gives each consuming context its own subscription and may deliver twice. Each consumer, notifications and analytics, writes its processed-event mark and its state change in one unit of work of its own database, so a second delivery changes nothing.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="476" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">At least once from end to end, deduplicated by each consumer</text>
  <!-- producer -->
  <rect x="24" y="60" width="300" height="300" rx="12" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="42" y="86" font-size="14" font-weight="600" fill="#5f6b73">producer: appointments</text>
  <rect x="48" y="102" width="252" height="56" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="174" y="136" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">BookAppointment handler</text>
  <rect x="40" y="196" width="268" height="148" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="56" y="218" font-size="13" font-weight="600" fill="#5f6b73">one database transaction</text>
  <rect x="56" y="232" width="236" height="44" rx="8" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="174" y="259" font-size="14" fill="#1f2328" text-anchor="middle">the appointment row</text>
  <rect x="56" y="286" width="236" height="44" rx="8" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="174" y="313" font-size="14" fill="#1f2328" text-anchor="middle">the outbox row</text>
  <line x1="174" y1="160" x2="174" y2="192" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- relay -->
  <rect x="350" y="270" width="140" height="80" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="420" y="298" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">outbox relay</text>
  <text x="420" y="320" font-size="13" fill="#1f2328" text-anchor="middle">after the commit;</text>
  <text x="420" y="338" font-size="13" fill="#1f2328" text-anchor="middle">may publish twice</text>
  <line x1="294" y1="308" x2="346" y2="308" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- broker -->
  <rect x="590" y="255" width="130" height="110" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="655" y="283" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">broker</text>
  <text x="655" y="307" font-size="13" fill="#1f2328" text-anchor="middle">a subscription</text>
  <text x="655" y="325" font-size="13" fill="#1f2328" text-anchor="middle">per consumer;</text>
  <text x="655" y="343" font-size="13" fill="#1f2328" text-anchor="middle">may deliver twice</text>
  <line x1="492" y1="310" x2="586" y2="310" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="540" y="282" font-size="13" fill="#1f2328" text-anchor="middle">publish, wait</text>
  <text x="540" y="300" font-size="13" fill="#1f2328" text-anchor="middle">for the ack</text>
  <!-- consumers -->
  <rect x="750" y="60" width="186" height="140" rx="12" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="764" y="86" font-size="13" font-weight="600" fill="#5f6b73">consumer: notifications</text>
  <rect x="764" y="100" width="158" height="84" rx="8" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="843" y="124" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">one unit of work</text>
  <text x="843" y="146" font-size="13" fill="#1f2328" text-anchor="middle">processed-event mark</text>
  <text x="843" y="166" font-size="13" fill="#1f2328" text-anchor="middle">+ the reminder row</text>
  <rect x="750" y="220" width="186" height="140" rx="12" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="764" y="246" font-size="13" font-weight="600" fill="#5f6b73">consumer: analytics</text>
  <rect x="764" y="260" width="158" height="84" rx="8" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="843" y="284" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">one unit of work</text>
  <text x="843" y="306" font-size="13" fill="#1f2328" text-anchor="middle">processed-event mark</text>
  <text x="843" y="326" font-size="13" fill="#1f2328" text-anchor="middle">+ the statistics row</text>
  <line x1="700" y1="253" x2="746" y2="160" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="722" y1="300" x2="746" y2="300" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- note -->
  <text x="32" y="400" font-size="14" fill="#1f2328">The broker never holds the mark: it commits with the change it stands for, in the consumer's database.</text>
  <text x="32" y="424" font-size="14" fill="#1f2328">A second publication or a second delivery finds the mark and changes nothing.</text>
  <text x="32" y="456" font-size="13" fill="#5f6b73">Rules: events/outbox-required on the producer side, events/consumer-idempotent on the consumer side.</text>
</svg>
