<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">The three states of a circuit breaker</title>
  <desc id="desc">A circuit starts closed: every call goes through and consecutive failures are counted. After failureThreshold consecutive failures it opens: every call is refused at once with CircuitOpenError, code CIRCUIT_OPEN. Once resetAfterMs has elapsed, the next call finds it half-open: up to halfOpenMax trial calls go through, the others are refused. A trial call that answers closes the circuit; a trial call that fails opens it again. The gauge circuit_breaker_state is 0 closed, 1 half-open, 2 open.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="470" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">The three states of a circuit breaker</text>

  <!-- closed -->
  <rect x="60" y="80" width="250" height="120" rx="12" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="185" y="110" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">closed</text>
  <line x1="76" y1="122" x2="294" y2="122" stroke="#7a4f9a" stroke-opacity="0.35"/>
  <g font-size="13" fill="#1f2328" text-anchor="middle">
    <text x="185" y="144">every call goes through</text>
    <text x="185" y="164">consecutive failures counted</text>
    <text x="185" y="188" fill="#5f6b73">gauge 0</text>
  </g>

  <!-- open -->
  <rect x="650" y="80" width="250" height="120" rx="12" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="3"/>
  <text x="775" y="110" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">open</text>
  <line x1="666" y1="122" x2="884" y2="122" stroke="#7a4f9a" stroke-opacity="0.35"/>
  <g font-size="13" fill="#1f2328" text-anchor="middle">
    <text x="775" y="144">every call refused at once:</text>
    <text x="775" y="164">CircuitOpenError (CIRCUIT_OPEN)</text>
    <text x="775" y="188" fill="#5f6b73">gauge 2</text>
  </g>

  <!-- half-open -->
  <rect x="355" y="290" width="250" height="120" rx="12" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="480" y="320" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">half-open</text>
  <line x1="371" y1="332" x2="589" y2="332" stroke="#7a4f9a" stroke-opacity="0.35"/>
  <g font-size="13" fill="#1f2328" text-anchor="middle">
    <text x="480" y="354">halfOpenMax trial calls (1)</text>
    <text x="480" y="374">go through, the others refused</text>
    <text x="480" y="398" fill="#5f6b73">gauge 1</text>
  </g>

  <!-- transitions -->
  <line x1="312" y1="140" x2="646" y2="140" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="479" y="130" font-size="13" fill="#1f2328" text-anchor="middle">failureThreshold consecutive failures</text>
  <path d="M800,202 V350 H609" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="812" y="262" font-size="13" fill="#1f2328">resetAfterMs elapsed:</text>
  <text x="812" y="280" font-size="13" fill="#1f2328">the next call finds</text>
  <text x="812" y="298" font-size="13" fill="#1f2328">it half-open</text>
  <path d="M520,288 V244 H700 V206" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="610" y="236" font-size="13" fill="#1f2328" text-anchor="middle">a trial call fails</text>
  <path d="M353,350 H185 V206" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="197" y="262" font-size="13" fill="#1f2328">a trial call answers</text>

  <text x="32" y="438" font-size="13" fill="#1f2328">A DomainError is not a failure: the dependency answered. One circuit per instance and method (scope: 'instance' shares one).</text>
  <text x="32" y="458" font-size="13" fill="#1f2328">onStateChange is told every transition; circuitStateGauge() publishes the state as circuit_breaker_state.</text>
</svg>
