<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 306" width="960" height="306" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Glossary first: the term, then the name, then the code</title>
  <desc id="desc">A term agreed with the domain expert becomes a row of the glossary in CONTEXT.md, then the names of the code, then the code and its tests. The generator refuses a name whose words the glossary does not define, the checker reports one. A missing word sends you back to the domain expert.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="306" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Glossary first: the term, then the name, then the code</text>
  <rect x="32" y="110" width="194" height="112" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="129.0" y="136" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">Term</text>
  <line x1="46" y1="146" x2="212" y2="146" stroke="#5f6b73" stroke-opacity="0.35"/>
  <text x="129.0" y="166" font-size="13" fill="#1f2328" text-anchor="middle">agreed with the</text>
  <text x="129.0" y="186" font-size="13" fill="#1f2328" text-anchor="middle">domain expert</text>
  <rect x="266" y="110" width="194" height="112" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="363.0" y="136" font-size="16" font-weight="700" fill="#2f6f4f" text-anchor="middle">Glossary</text>
  <line x1="280" y1="146" x2="446" y2="146" stroke="#2f6f4f" stroke-opacity="0.35"/>
  <text x="363.0" y="166" font-size="13" fill="#1f2328" text-anchor="middle">a row of the table</text>
  <text x="363.0" y="186" font-size="13" fill="#1f2328" text-anchor="middle">in CONTEXT.md</text>
  <rect x="500" y="110" width="194" height="112" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="597.0" y="136" font-size="16" font-weight="700" fill="#2f6f4f" text-anchor="middle">Names</text>
  <line x1="514" y1="146" x2="680" y2="146" stroke="#2f6f4f" stroke-opacity="0.35"/>
  <text x="597.0" y="166" font-size="13" fill="#1f2328" text-anchor="middle">class, method, event,</text>
  <text x="597.0" y="186" font-size="13" fill="#1f2328" text-anchor="middle">permission, error,</text>
  <text x="597.0" y="206" font-size="13" fill="#1f2328" text-anchor="middle">use case</text>
  <rect x="734" y="110" width="194" height="112" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="831.0" y="136" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">Code and tests</text>
  <line x1="748" y1="146" x2="914" y2="146" stroke="#2b5d8a" stroke-opacity="0.35"/>
  <text x="831.0" y="166" font-size="13" fill="#1f2328" text-anchor="middle">aggregate, handler,</text>
  <text x="831.0" y="186" font-size="13" fill="#1f2328" text-anchor="middle">specs named as rules</text>
  <line x1="228" y1="166" x2="264" y2="166" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="462" y1="166" x2="498" y2="166" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="696" y1="166" x2="732" y2="166" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- where the kit holds the order -->
  <text x="480" y="66" font-size="13" font-weight="600" fill="#5f6b73" text-anchor="middle">generate</text>
  <text x="480" y="82" font-size="13" fill="#5f6b73" text-anchor="middle">refuses an undefined word</text>
  <line x1="480" y1="90" x2="480" y2="158" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="2 3"/>
  <circle cx="480" cy="162" r="4" fill="#5f6b73"/>
  <text x="714" y="66" font-size="13" font-weight="600" fill="#5f6b73" text-anchor="middle">check and ESLint</text>
  <text x="714" y="82" font-size="13" fill="#5f6b73" text-anchor="middle">language/glossary-term</text>
  <line x1="714" y1="90" x2="714" y2="158" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="2 3"/>
  <circle cx="714" cy="162" r="4" fill="#5f6b73"/>
  <!-- a missing word sends you back -->
  <path d="M831,224 V262 H129 V226" fill="none" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="480" y="290" font-size="14" font-style="italic" fill="#1f2328" text-anchor="middle">a missing word sends you back to the domain expert, not to a placeholder name</text>
</svg>
