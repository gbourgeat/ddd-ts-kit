<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">A projection as the read model of availability</title>
  <desc id="desc">The calendars context publishes working-hours-changed and the appointments context publishes booked and cancelled, as integration events. Inside availability, a projector applies them to its own open slots table, writing a row only when the event is newer. The FindOpenSlots query reads that table alone. The answer can be a moment late, so appointments, not availability, refuses a double booking.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="430" rx="16" fill="#ffffff"/>
  <text x="32" y="36" font-size="18" font-weight="600" fill="#1f2328">FindOpenSlots reads a table that events keep current</text>
  <!-- upstream contexts -->
  <rect x="32" y="90" width="204" height="70" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="134" y="118" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">calendars</text>
  <text x="134" y="142" font-size="13" fill="#1f2328" text-anchor="middle">working-hours-changed</text>
  <rect x="32" y="230" width="204" height="70" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="134" y="258" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">appointments</text>
  <text x="134" y="282" font-size="13" fill="#1f2328" text-anchor="middle">booked, cancelled</text>
  <!-- availability -->
  <rect x="300" y="60" width="636" height="290" rx="14" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="320" y="88" font-size="14" font-weight="600" fill="#5f6b73">availability</text>
  <rect x="330" y="150" width="184" height="80" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="422" y="182" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">projector</text>
  <text x="422" y="206" font-size="13" fill="#1f2328" text-anchor="middle">OpenSlotsProjection</text>
  <rect x="566" y="150" width="160" height="80" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="646" y="182" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">open slots</text>
  <text x="646" y="206" font-size="13" fill="#1f2328" text-anchor="middle">its own table</text>
  <rect x="772" y="150" width="148" height="80" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="846" y="182" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">FindOpenSlots</text>
  <text x="846" y="206" font-size="13" fill="#1f2328" text-anchor="middle">one local query</text>
  <!-- events, asynchronous -->
  <path d="M238,125 H272 V176 H326" fill="none" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <path d="M238,265 H272 V204 H326" fill="none" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <!-- calls -->
  <line x1="516" y1="190" x2="562" y2="190" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="539" y="140" font-size="13" fill="#1f2328" text-anchor="middle">writes</text>
  <text x="539" y="250" font-size="13" fill="#1f2328" text-anchor="middle">if newer</text>
  <line x1="770" y1="190" x2="730" y2="190" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="749" y="140" font-size="13" fill="#1f2328" text-anchor="middle">reads</text>
  <!-- note -->
  <rect x="330" y="270" width="590" height="62" rx="8" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="346" y="295" font-size="13" fill="#1f2328">The answer can be a moment late: a slot shown as open may have been taken a</text>
  <text x="346" y="315" font-size="13" fill="#1f2328">second ago. appointments refuses the double booking, not availability.</text>
  <!-- legend -->
  <line x1="40" y1="382" x2="84" y2="382" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="96" y="387" font-size="14" fill="#1f2328">integration event: asynchronous, through the outbox of the producer, at least once</text>
  <line x1="40" y1="408" x2="84" y2="408" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="96" y="413" font-size="14" fill="#1f2328">call inside the context</text>
</svg>
