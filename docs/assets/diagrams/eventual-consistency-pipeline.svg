<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Where the window comes from, and what to measure</title>
  <desc id="desc">The path of an integration event. The handler of appointments saves the aggregate and the outbox record in one transaction. The relay publishes pending records after the commit, at its interval or on a wake-up signal. The broker queues the event for each consumer. The consumer in availability handles it in its own transaction, idempotently, and updates its projection; failures are retried, then go to a dead letter. Under each step: what stretches the window and what to measure.</desc>
  <defs>
    <marker id="arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="470" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Where the window comes from, and what to measure</text>
  <rect x="32" y="64" width="220" height="136" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="142" y="92" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">appointments</text>
  <line x1="46" y1="104" x2="238" y2="104" stroke="#2b5d8a" stroke-opacity="0.35"/>
  <text x="142" y="128" font-size="13" fill="#1f2328" text-anchor="middle">one transaction:</text>
  <text x="142" y="148" font-size="13" fill="#1f2328" text-anchor="middle">the aggregate and</text>
  <text x="142" y="168" font-size="13" fill="#1f2328" text-anchor="middle">the outbox record</text>
  <rect x="300" y="64" width="176" height="136" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="388" y="92" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">relay</text>
  <line x1="314" y1="104" x2="462" y2="104" stroke="#7a4f9a" stroke-opacity="0.35"/>
  <text x="388" y="128" font-size="13" fill="#1f2328" text-anchor="middle">publishes after</text>
  <text x="388" y="148" font-size="13" fill="#1f2328" text-anchor="middle">the commit</text>
  <rect x="524" y="64" width="176" height="136" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="612" y="92" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">broker</text>
  <line x1="538" y1="104" x2="686" y2="104" stroke="#5f6b73" stroke-opacity="0.35"/>
  <text x="612" y="128" font-size="13" fill="#1f2328" text-anchor="middle">one queue</text>
  <text x="612" y="148" font-size="13" fill="#1f2328" text-anchor="middle">per consumer</text>
  <rect x="748" y="64" width="180" height="136" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="838" y="92" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">availability</text>
  <line x1="762" y1="104" x2="914" y2="104" stroke="#2b5d8a" stroke-opacity="0.35"/>
  <text x="838" y="128" font-size="13" fill="#1f2328" text-anchor="middle">own transaction,</text>
  <text x="838" y="148" font-size="13" fill="#1f2328" text-anchor="middle">idempotent handler,</text>
  <text x="838" y="168" font-size="13" fill="#1f2328" text-anchor="middle">projection updated</text>
  <line x1="254" y1="132" x2="296" y2="132" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-neutral)"/>
  <line x1="478" y1="132" x2="520" y2="132" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-neutral)"/>
  <line x1="702" y1="132" x2="744" y2="132" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-neutral)"/>
  <text x="32" y="236" font-size="14" font-weight="600" fill="#5f6b73">stretches the window</text>
  <line x1="32" y1="246" x2="928" y2="246" stroke="#5f6b73" stroke-opacity="0.35"/>
  <text x="32" y="352" font-size="14" font-weight="600" fill="#5f6b73">measure</text>
  <line x1="32" y1="362" x2="928" y2="362" stroke="#5f6b73" stroke-opacity="0.35"/>
  <text x="142.0" y="270" font-size="13" fill="#1f2328" text-anchor="middle">nothing: the change</text>
  <text x="142.0" y="290" font-size="13" fill="#1f2328" text-anchor="middle">and the event commit</text>
  <text x="142.0" y="310" font-size="13" fill="#1f2328" text-anchor="middle">together</text>
  <text x="142.0" y="386" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">nothing specific</text>
  <text x="388.0" y="270" font-size="13" fill="#1f2328" text-anchor="middle">its interval, or</text>
  <text x="388.0" y="290" font-size="13" fill="#1f2328" text-anchor="middle">its wake-up signal</text>
  <text x="388.0" y="386" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">age of the oldest</text>
  <text x="388.0" y="406" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">pending record</text>
  <text x="612.0" y="270" font-size="13" fill="#1f2328" text-anchor="middle">a slow or stopped</text>
  <text x="612.0" y="290" font-size="13" fill="#1f2328" text-anchor="middle">consumer</text>
  <text x="612.0" y="386" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">depth or lag of</text>
  <text x="612.0" y="406" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">each consumer</text>
  <text x="838.0" y="270" font-size="13" fill="#1f2328" text-anchor="middle">retries, then a</text>
  <text x="838.0" y="290" font-size="13" fill="#1f2328" text-anchor="middle">dead letter that</text>
  <text x="838.0" y="310" font-size="13" fill="#1f2328" text-anchor="middle">needs an operator</text>
  <text x="838.0" y="386" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">dead letters:</text>
  <text x="838.0" y="406" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">must stay empty</text>
  <line x1="32" y1="448" x2="76" y2="448" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-neutral)"/>
  <text x="88" y="453" font-size="14" fill="#1f2328">an asynchronous message, after the commit</text>
</svg>
