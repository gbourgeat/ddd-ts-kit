<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Two channels: the actor travels in the message, the execution scope surrounds the work</title>
  <desc id="desc">The boundaries (an HTTP request, a consumed event, a scheduled job) do two things. They build the command or query, whose first argument is the actor: the handler reads only its command, and the domain receives identifiers as arguments, never an actor. And they open the execution scope of the unit of work, with the correlation and causation ids, the tenant, the session, the origin, the deadline and the instant a job was due. Only infrastructure and the platform read the scope: repository adapters for audit columns and the tenant condition, loggers and tracing, the publisher decorator that stamps the correlation on events, the audit trail. Handlers and the domain never read it.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="520" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Two channels: the actor in the message, the scope around the work</text>
  <!-- boundaries -->
  <rect x="24" y="78" width="240" height="372" rx="10" fill="#f6ede6" stroke="#9a5b2b" stroke-width="2"/>
  <text x="144" y="106" font-size="16" font-weight="700" fill="#9a5b2b" text-anchor="middle">boundaries</text>
  <line x1="40" y1="118" x2="248" y2="118" stroke="#9a5b2b" stroke-opacity="0.35"/>
  <text x="144" y="160" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">HTTP request</text>
  <text x="144" y="180" font-size="13" fill="#1f2328" text-anchor="middle">the actor from the token</text>
  <text x="144" y="250" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">consumed event</text>
  <text x="144" y="270" font-size="13" fill="#1f2328" text-anchor="middle">the system actor of the consumer,</text>
  <text x="144" y="288" font-size="13" fill="#1f2328" text-anchor="middle">the correlation of the event</text>
  <text x="144" y="358" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">scheduled job</text>
  <text x="144" y="378" font-size="13" fill="#1f2328" text-anchor="middle">the system actor of the job,</text>
  <text x="144" y="396" font-size="13" fill="#1f2328" text-anchor="middle">a fresh correlation</text>
  <!-- explicit lane -->
  <text x="320" y="68" font-size="14" font-weight="600" fill="#2b5d8a">explicit: the actor travels in the message</text>
  <rect x="320" y="78" width="220" height="80" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="430" y="106" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">command or query</text>
  <text x="430" y="130" font-size="13" fill="#1f2328" text-anchor="middle">its first argument: the actor</text>
  <rect x="600" y="78" width="164" height="80" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="682" y="106" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">handler</text>
  <text x="682" y="130" font-size="13" fill="#1f2328" text-anchor="middle">reads its command</text>
  <rect x="800" y="78" width="136" height="80" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="868" y="106" font-size="16" font-weight="700" fill="#2f6f4f" text-anchor="middle">domain</text>
  <text x="868" y="128" font-size="13" fill="#1f2328" text-anchor="middle">no actor: ids</text>
  <text x="868" y="146" font-size="13" fill="#1f2328" text-anchor="middle">as arguments</text>
  <line x1="266" y1="118" x2="316" y2="118" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="542" y1="118" x2="596" y2="118" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="766" y1="118" x2="796" y2="118" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- ambient lane -->
  <text x="320" y="320" font-size="14" font-weight="600" fill="#5f6b73">ambient: opened once, read by infrastructure only</text>
  <rect x="320" y="330" width="220" height="104" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="430" y="358" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">execution scope</text>
  <text x="430" y="382" font-size="13" fill="#1f2328" text-anchor="middle">correlationId, causationId</text>
  <text x="430" y="402" font-size="13" fill="#1f2328" text-anchor="middle">tenantId, session, origin</text>
  <text x="430" y="422" font-size="13" fill="#1f2328" text-anchor="middle">deadline, scheduledAt</text>
  <rect x="600" y="330" width="336" height="120" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="768" y="358" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">infrastructure and platform</text>
  <text x="616" y="382" font-size="13" fill="#1f2328">repositories: audit columns, tenant condition</text>
  <text x="616" y="402" font-size="13" fill="#1f2328">loggers, tracing: correlation, actor id</text>
  <text x="616" y="422" font-size="13" fill="#1f2328">publisher: correlation stamped on events</text>
  <text x="616" y="442" font-size="13" fill="#1f2328">audit trail: actor, session, origin</text>
  <line x1="266" y1="382" x2="316" y2="382" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="542" y1="382" x2="596" y2="382" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- never read by the handler and the domain -->
  <line x1="510" y1="300" x2="672" y2="160" stroke="#5f6b73" stroke-width="2" stroke-dasharray="3 5"/>
  <text x="620" y="252" font-size="13" font-style="italic" fill="#5f6b73">never read by handlers</text>
  <text x="620" y="270" font-size="13" font-style="italic" fill="#5f6b73">nor by the domain</text>
  <!-- legend -->
  <line x1="40" y1="492" x2="84" y2="492" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="96" y="497" font-size="14" fill="#1f2328">builds, opens, passes or reads</text>
  <line x1="420" y1="492" x2="464" y2="492" stroke="#5f6b73" stroke-width="2" stroke-dasharray="3 5"/>
  <text x="476" y="497" font-size="14" fill="#1f2328">no access</text>
</svg>
