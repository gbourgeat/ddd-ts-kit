<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Comment la documentation est organisée</title>
  <desc id="desc">En haut, la référence normative : ARCHITECTURE.md, CONFIG.md, le README du pipeline et les README des packages. En dessous, les pages qui expliquent et enseignent : concepts (pourquoi, une page par idée), outils (lequel, une page par décision), guides (comment, travailler sur un projet) et propositions (la suite, des conceptions pas toutes construites). Chacune pointe vers la référence qu'elle explique, dont elle choisit une valeur, qu'elle applique ou qu'elle pourrait changer. Quand une page et la référence divergent, la référence a raison.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="480" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Comment la documentation est organisée</text>
  <rect x="24" y="58" width="912" height="144" rx="10" fill="#ffffff" stroke="#3d4449" stroke-width="2.5"/>
  <text x="44" y="86" font-size="16" font-weight="700" fill="#3d4449">Référence (normative)</text>
  <text x="240" y="86" font-size="13" fill="#5f6b73">ce que le checker et la CLI tiennent</text>
  <rect x="44" y="102" width="212" height="84" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="58" y="128" font-size="14" font-weight="700" fill="#1f2328">ARCHITECTURE.md</text>
  <text x="58" y="150" font-size="13" fill="#1f2328">arbre, identifiants de règle,</text>
  <text x="58" y="170" font-size="13" fill="#1f2328">règles, tests</text>
  <rect x="268" y="102" width="212" height="84" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="282" y="128" font-size="14" font-weight="700" fill="#1f2328">CONFIG.md</text>
  <text x="282" y="150" font-size="13" fill="#1f2328">chaque clé du fichier</text>
  <rect x="492" y="102" width="212" height="84" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="506" y="128" font-size="14" font-weight="700" fill="#1f2328">pipeline/README.md</text>
  <text x="506" y="150" font-size="13" fill="#1f2328">portes de qualité, hooks git</text>
  <rect x="716" y="102" width="212" height="84" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="730" y="128" font-size="14" font-weight="700" fill="#1f2328">README des packages</text>
  <text x="730" y="150" font-size="13" fill="#1f2328">ce que fait chaque package</text>
  <rect x="24" y="266" width="216" height="148" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="40" y="294" font-size="16" font-weight="700" fill="#5f6b73">Concepts</text>
  <text x="40" y="316" font-size="13" font-weight="600" fill="#1f2328">pourquoi : une page par idée</text>
  <text x="40" y="342" font-size="13" fill="#1f2328">36 pages, un parcours de</text>
  <text x="40" y="362" font-size="13" fill="#1f2328">lecture : agrégats, événements,</text>
  <text x="40" y="382" font-size="13" fill="#1f2328">outbox, contrôle d'accès...</text>
  <line x1="132" y1="264" x2="132" y2="205" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="122" y="232" font-size="13" font-weight="600" fill="#1f2328" text-anchor="end">expliquent</text>
  <rect x="256" y="266" width="216" height="148" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="272" y="294" font-size="16" font-weight="700" fill="#5f6b73">Outils</text>
  <text x="272" y="316" font-size="13" font-weight="600" fill="#1f2328">lequel : une page par décision</text>
  <text x="272" y="342" font-size="13" fill="#1f2328">17 pages : comparaisons,</text>
  <text x="272" y="362" font-size="13" fill="#1f2328">critères, ce qui a été vérifié,</text>
  <text x="272" y="382" font-size="13" fill="#1f2328">limites, recommandation</text>
  <line x1="364" y1="264" x2="364" y2="205" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="354" y="226" font-size="13" font-weight="600" fill="#1f2328" text-anchor="end">choisissent une</text>
  <text x="354" y="244" font-size="13" font-weight="600" fill="#1f2328" text-anchor="end">valeur de stack</text>
  <rect x="488" y="266" width="216" height="148" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="504" y="294" font-size="16" font-weight="700" fill="#5f6b73">Guides</text>
  <text x="504" y="316" font-size="13" font-weight="600" fill="#1f2328">comment : travailler</text>
  <text x="504" y="334" font-size="13" font-weight="600" fill="#1f2328">sur un projet</text>
  <text x="504" y="358" font-size="13" fill="#1f2328">méthode, commandes, équipe,</text>
  <text x="504" y="378" font-size="13" fill="#1f2328">travail en parallèle, commits,</text>
  <text x="504" y="398" font-size="13" fill="#1f2328">agents, traduction</text>
  <line x1="596" y1="264" x2="596" y2="205" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="586" y="232" font-size="13" font-weight="600" fill="#1f2328" text-anchor="end">appliquent</text>
  <rect x="720" y="266" width="216" height="148" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="736" y="294" font-size="16" font-weight="700" fill="#5f6b73">Propositions</text>
  <text x="736" y="316" font-size="13" font-weight="600" fill="#1f2328">la suite : pas tout construit</text>
  <text x="736" y="342" font-size="13" fill="#1f2328">le côté lecture : ce qui est</text>
  <text x="736" y="362" font-size="13" fill="#1f2328">construit, ce que la CLI</text>
  <text x="736" y="382" font-size="13" fill="#1f2328">ne génère pas encore</text>
  <line x1="828" y1="264" x2="828" y2="205" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="818" y="232" font-size="13" font-weight="600" fill="#1f2328" text-anchor="end">peuvent changer</text>
  <text x="480" y="452" font-size="15" font-weight="700" fill="#3d4449" text-anchor="middle">Quand une page et la référence divergent, la référence a raison.</text>
</svg>
