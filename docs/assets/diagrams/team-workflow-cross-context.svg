<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="840" height="400" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">A change that crosses two contexts: a proposal, then three pull requests, upstream first</title>
  <desc id="desc">Two lanes, the owner of appointments and the owner of analytics. 1: appointments proposes an additive change, an optional field late, and analytics agrees. 2: appointments merges its published language, publisher and catalog, in the same version. Then, in parallel: 3, appointments makes the aggregate compute late, with its tests; 4, analytics merges a handler that reads late and tolerates its absence. Each pull request is green and deployable alone.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="840" height="400" rx="16" fill="#ffffff"/>
  <text x="32" y="34" font-size="18" font-weight="600" fill="#1f2328">A change that crosses two contexts: a proposal, then three pull requests, upstream first</text>
  <rect x="24" y="52" width="792" height="136" rx="12" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="40" y="74" font-size="14" font-weight="600" fill="#5f6b73">appointments owner</text>
  <rect x="24" y="200" width="792" height="136" rx="12" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="40" y="222" font-size="14" font-weight="600" fill="#5f6b73">analytics owner</text>
  <rect x="48" y="86" width="200" height="90" rx="10" fill="#ffffff" stroke="#3d4449" stroke-width="2"/>
  <text x="148" y="120" font-size="16" font-weight="700" text-anchor="middle" fill="#3d4449">1. propose</text>
  <text x="148" y="142" font-size="13" text-anchor="middle" fill="#1f2328">an optional field late</text>
  <rect x="48" y="234" width="200" height="90" rx="10" fill="#ffffff" stroke="#3d4449" stroke-width="2"/>
  <text x="148" y="268" font-size="16" font-weight="700" text-anchor="middle" fill="#3d4449">1. agree</text>
  <text x="148" y="290" font-size="13" text-anchor="middle" fill="#1f2328">the need is covered</text>
  <rect x="300" y="86" width="220" height="90" rx="10" fill="#ffffff" stroke="#3d4449" stroke-width="2"/>
  <text x="410" y="112" font-size="16" font-weight="700" text-anchor="middle" fill="#3d4449">2. pull request</text>
  <text x="410" y="134" font-size="13" text-anchor="middle" fill="#1f2328">published language,</text>
  <text x="410" y="153" font-size="13" text-anchor="middle" fill="#1f2328">publisher, catalog</text>
  <rect x="572" y="86" width="220" height="90" rx="10" fill="#ffffff" stroke="#3d4449" stroke-width="2"/>
  <text x="682" y="112" font-size="16" font-weight="700" text-anchor="middle" fill="#3d4449">3. pull request</text>
  <text x="682" y="134" font-size="13" text-anchor="middle" fill="#1f2328">the aggregate computes</text>
  <text x="682" y="153" font-size="13" text-anchor="middle" fill="#1f2328">late, with its tests</text>
  <rect x="572" y="234" width="220" height="90" rx="10" fill="#ffffff" stroke="#3d4449" stroke-width="2"/>
  <text x="682" y="260" font-size="16" font-weight="700" text-anchor="middle" fill="#3d4449">4. pull request</text>
  <text x="682" y="282" font-size="13" text-anchor="middle" fill="#1f2328">the handler reads late,</text>
  <text x="682" y="301" font-size="13" text-anchor="middle" fill="#1f2328">tolerates its absence</text>
  <line x1="226" y1="176" x2="226" y2="232" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M248,279 H274 V131 H298" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="520" y1="131" x2="570" y2="131" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M410,176 V279 H570" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="32" y="362" font-size="14" fill="#1f2328">Each pull request is green and deployable alone. Step 4 does not wait for step 3: until appointments</text>
  <text x="32" y="384" font-size="14" fill="#1f2328">is deployed everywhere, events without late keep arriving, from the outbox and from the queues.</text>
</svg>
