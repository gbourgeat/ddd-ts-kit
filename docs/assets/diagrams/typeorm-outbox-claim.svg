<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 562" width="960" height="562" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">How two relays share the outbox: skip-locked and compare-and-set</title>
  <desc id="desc">Left, skip-locked: each relay selects the due rows FOR UPDATE SKIP LOCKED in a short transaction, so relay A takes rows 1 to 3 and relay B passes over them and takes rows 4 to 6, then each pushes next_attempt_at forward by the lease and commits. Right, compare-and-set: both relays read row 7 with attempts 0, both try an update guarded by attempts = 0; the first writes one row and takes it, the second writes none and reads again. In both cases a claimed row stays hidden until its lease ends, so the rows of a relay that died come back.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="562" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">How two relays share the outbox: the two claim strategies</text>
  <!-- left panel: skip-locked -->
  <rect x="24" y="58" width="444" height="380" rx="12" fill="#ffffff" stroke="#7a4f9a" stroke-width="1.5"/>
  <text x="44" y="86" font-size="16" font-weight="700" fill="#7a4f9a">skip-locked</text>
  <text x="44" y="106" font-size="13" fill="#1f2328">default with postgres, mysql, cockroachdb (and aurora)</text>
  <rect x="40" y="150" width="112" height="56" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="96" y="183" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">relay A</text>
  <rect x="340" y="214" width="112" height="56" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="396" y="247" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">relay B</text>
  <text x="246" y="132" font-size="13" font-weight="600" fill="#7a4f9a" text-anchor="middle">outbox, due rows</text>
  <rect x="190" y="140" width="112" height="28" fill="#f1ebf5" stroke="#7a4f9a"/>
  <text x="246" y="159" font-size="13" fill="#1f2328" text-anchor="middle">1: taken by A</text>
  <rect x="190" y="168" width="112" height="28" fill="#f1ebf5" stroke="#7a4f9a"/>
  <text x="246" y="187" font-size="13" fill="#1f2328" text-anchor="middle">2: taken by A</text>
  <rect x="190" y="196" width="112" height="28" fill="#f1ebf5" stroke="#7a4f9a"/>
  <text x="246" y="215" font-size="13" fill="#1f2328" text-anchor="middle">3: taken by A</text>
  <rect x="190" y="224" width="112" height="28" fill="#ffffff" stroke="#7a4f9a"/>
  <text x="246" y="243" font-size="13" fill="#1f2328" text-anchor="middle">4: taken by B</text>
  <rect x="190" y="252" width="112" height="28" fill="#ffffff" stroke="#7a4f9a"/>
  <text x="246" y="271" font-size="13" fill="#1f2328" text-anchor="middle">5: taken by B</text>
  <rect x="190" y="280" width="112" height="28" fill="#ffffff" stroke="#7a4f9a"/>
  <text x="246" y="299" font-size="13" fill="#1f2328" text-anchor="middle">6: taken by B</text>
  <line x1="154" y1="178" x2="186" y2="178" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="338" y1="262" x2="306" y2="262" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="396" y="290" font-size="13" fill="#1f2328" text-anchor="middle">passes over the</text>
  <text x="396" y="308" font-size="13" fill="#1f2328" text-anchor="middle">rows A has locked</text>
  <text x="44" y="344" font-size="13" font-weight="600" fill="#1f2328">One short transaction per relay:</text>
  <text x="44" y="366" font-size="13" fill="#1f2328">1. SELECT the due rows FOR UPDATE SKIP LOCKED</text>
  <text x="44" y="386" font-size="13" fill="#1f2328">2. UPDATE attempts + 1, next_attempt_at = now + leaseMs</text>
  <text x="44" y="406" font-size="13" fill="#1f2328">3. COMMIT: the row locks go, the lease stays</text>
  <text x="44" y="426" font-size="13" fill="#1f2328">Two statements, whatever the size of the batch.</text>
  <!-- right panel: compare-and-set -->
  <rect x="492" y="58" width="444" height="380" rx="12" fill="#ffffff" stroke="#7a4f9a" stroke-width="1.5"/>
  <text x="512" y="86" font-size="16" font-weight="700" fill="#7a4f9a">compare-and-set</text>
  <text x="512" y="106" font-size="13" fill="#1f2328">default on every other driver (SQLite...), or claim: 'compare-and-set'</text>
  <rect x="508" y="150" width="112" height="56" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="564" y="183" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">relay A</text>
  <rect x="508" y="236" width="112" height="56" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="564" y="269" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">relay B</text>
  <rect x="808" y="192" width="112" height="56" fill="#f1ebf5" stroke="#7a4f9a"/>
  <text x="864" y="215" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">row 7</text>
  <text x="864" y="235" font-size="13" fill="#1f2328" text-anchor="middle">attempts 0 → 1</text>
  <line x1="622" y1="178" x2="804" y2="204" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="712" y="164" font-size="13" fill="#1f2328" text-anchor="middle">WHERE attempts = 0: 1 row,</text>
  <text x="712" y="182" font-size="13" fill="#1f2328" text-anchor="middle">taken</text>
  <line x1="622" y1="264" x2="804" y2="238" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="712" y="280" font-size="13" fill="#1f2328" text-anchor="middle">same update, later: 0 rows,</text>
  <text x="712" y="298" font-size="13" fill="#1f2328" text-anchor="middle">B reads the due rows again</text>
  <text x="512" y="344" font-size="13" font-weight="600" fill="#1f2328">No lock clause, so it runs on any database:</text>
  <text x="512" y="366" font-size="13" fill="#1f2328">1. SELECT the due rows, as they are</text>
  <text x="512" y="386" font-size="13" fill="#1f2328">2. per row, UPDATE attempts + 1 and the lease</text>
  <text x="530" y="406" font-size="13" fill="#1f2328">WHERE id, pending, attempts = the count it read</text>
  <text x="512" y="426" font-size="13" fill="#1f2328">One statement per record.</text>
  <!-- both -->
  <rect x="24" y="456" width="912" height="86" rx="12" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="44" y="482" font-size="14" fill="#1f2328">Both: a claimed row stays hidden until its lease ends (leaseMs, default 30 s), so the rows of a relay that</text>
  <text x="44" y="504" font-size="14" fill="#1f2328">died come back by themselves.</text>
  <text x="44" y="526" font-size="14" fill="#1f2328">Delivery is at least once: a consumer deduplicates with the processed events.</text>
</svg>
