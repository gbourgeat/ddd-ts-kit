<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">La place de @ddd-ts-kit/typeorm dans une application</title>
  <desc id="desc">Un contexte délimité contient un gestionnaire, le port de repository du domaine et le repository TypeORM qui l'implémente. Le package donne un seul objet, à la fois le UnitOfWork dans lequel le bus de commandes exécute chaque commande et le TypeOrmContext dont le manager() sert aux requêtes du repository et des stores ; cet objet ouvre dataSource.transaction() sur la DataSource TypeORM, qui écrit dans PostgreSQL les tables du contexte, l'outbox et les événements traités. La plateforme lie le tout au démarrage.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
    <marker id="arrow-infrastructure" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a4f9a"/>
    </marker>
  </defs>
  <rect width="960" height="500" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">La place de @ddd-ts-kit/typeorm dans une application</text>
  <!-- platform -->
  <rect x="16" y="56" width="928" height="372" rx="14" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="36" y="84" font-size="14" font-weight="600" fill="#5f6b73">plateforme (src/platform) : lie l'unité de travail à UnitOfWork et TypeOrmContext, chaque store à son port</text>
  <!-- bounded context -->
  <rect x="32" y="102" width="244" height="308" rx="12" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="48" y="126" font-size="14" font-weight="600" fill="#5f6b73">contexte délimité : billing-core</text>
  <rect x="46" y="142" width="216" height="60" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="154" y="168" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">gestionnaire</text>
  <text x="154" y="189" font-size="13" fill="#1f2328" text-anchor="middle">application</text>
  <rect x="46" y="236" width="216" height="60" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="154" y="262" font-size="16" font-weight="700" fill="#2f6f4f" text-anchor="middle">InvoiceRepository</text>
  <text x="154" y="283" font-size="13" fill="#1f2328" text-anchor="middle">port du domaine</text>
  <rect x="46" y="330" width="216" height="64" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="154" y="356" font-size="15" font-weight="700" fill="#7a4f9a" text-anchor="middle">TypeOrmInvoiceRepository</text>
  <text x="154" y="378" font-size="13" fill="#1f2328" text-anchor="middle">adaptateur, infrastructure</text>
  <line x1="154" y1="204" x2="154" y2="234" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="154" y1="328" x2="154" y2="298" stroke="#7a4f9a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-infrastructure)"/>
  <!-- the package -->
  <rect x="300" y="102" width="344" height="308" rx="12" fill="#ffffff" stroke="#7a4f9a" stroke-width="1.5"/>
  <text x="316" y="126" font-size="14" font-weight="700" fill="#7a4f9a">@ddd-ts-kit/typeorm</text>
  <rect x="318" y="142" width="308" height="112" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="472" y="168" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">createTypeOrmUnitOfWork()</text>
  <line x1="334" y1="180" x2="610" y2="180" stroke="#7a4f9a" stroke-opacity="0.35"/>
  <text x="472" y="202" font-size="13" fill="#1f2328" text-anchor="middle">un seul objet, deux ports :</text>
  <text x="472" y="222" font-size="13" fill="#1f2328" text-anchor="middle">UnitOfWork : run(work) exécute le gestionnaire</text>
  <text x="472" y="242" font-size="13" fill="#1f2328" text-anchor="middle">TypeOrmContext : manager()</text>
  <rect x="318" y="296" width="308" height="106" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="472" y="322" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">les stores</text>
  <text x="472" y="346" font-size="13" fill="#1f2328" text-anchor="middle">TypeOrmOutboxStore</text>
  <text x="472" y="366" font-size="13" fill="#1f2328" text-anchor="middle">TypeOrmProcessedEventStore</text>
  <text x="472" y="386" font-size="13" fill="#1f2328" text-anchor="middle">event store, store de modèle de lecture</text>
  <!-- calls -->
  <line x1="316" y1="168" x2="264" y2="168" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M264,362 H288 V230 H316" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="472" y1="294" x2="472" y2="256" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="482" y="280" font-size="13" fill="#1f2328">manager()</text>
  <!-- TypeORM and the database -->
  <rect x="712" y="142" width="216" height="112" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="2"/>
  <text x="820" y="168" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">DataSource</text>
  <line x1="728" y1="180" x2="912" y2="180" stroke="#5f6b73" stroke-opacity="0.35"/>
  <text x="820" y="202" font-size="13" fill="#1f2328" text-anchor="middle">TypeORM, entités :</text>
  <text x="820" y="222" font-size="13" fill="#1f2328" text-anchor="middle">invoices, outboxEntity(),</text>
  <text x="820" y="242" font-size="13" fill="#1f2328" text-anchor="middle">processedEventEntity()</text>
  <rect x="712" y="296" width="216" height="106" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="2"/>
  <text x="820" y="322" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">PostgreSQL</text>
  <text x="820" y="346" font-size="13" fill="#1f2328" text-anchor="middle">billing_core.invoices</text>
  <text x="820" y="366" font-size="13" fill="#1f2328" text-anchor="middle">messaging.outbox</text>
  <text x="820" y="386" font-size="13" fill="#1f2328" text-anchor="middle">messaging.processed_events</text>
  <line x1="628" y1="198" x2="710" y2="198" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="669" y="190" font-size="13" fill="#1f2328" text-anchor="middle">transaction()</text>
  <line x1="820" y1="256" x2="820" y2="294" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- legend -->
  <line x1="32" y1="452" x2="76" y2="452" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="88" y="457" font-size="14" fill="#1f2328">dépend de ou appelle : toute instruction passe par manager(), la transaction de l'unité de travail s'il y en a une</text>
  <line x1="32" y1="480" x2="76" y2="480" stroke="#7a4f9a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-infrastructure)"/>
  <text x="88" y="485" font-size="14" fill="#1f2328">implémente un port du domaine</text>
</svg>
