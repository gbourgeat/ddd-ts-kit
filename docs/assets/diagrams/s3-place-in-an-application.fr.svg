<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 648" width="960" height="648" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">La place de @ddd-ts-kit/s3 dans une application</title>
  <desc id="desc">Dans le processus de l'API, les cas d'usage et FileStaging du noyau ne dépendent que du port FileStorage. S3FileStorage implémente ce port, et la plateforme le lie au démarrage. Il fait de chaque clé du port une clé d'objet sous son préfixe, envoie les contenus en flux par parties de 8 Mio avec une seule partie en mémoire, et passe ses commandes par un S3Client construit par s3ClientOf, avec l'adressage par chemin et des empreintes seulement quand elles sont requises. Le client envoie une requête HTTP à l'API, reçoit des liens signés et envoie ou télécharge directement vers le bucket, si bien qu'aucun octet d'un fichier ne passe par l'API ; le fournisseur vérifie la signature. Le bucket, créé par le code d'infrastructure, peut être AWS S3, MinIO, OVHcloud, Scaleway, Cloudflare R2 ou Garage. Il garde les fichiers promus sous leurs clés définitives et les fichiers mis en attente sous staging/, purgés périodiquement.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
    <marker id="arrow-infrastructure" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a4f9a"/>
    </marker>
  </defs>
  <rect width="960" height="648" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">La place de @ddd-ts-kit/s3 dans une application</text>

  <!-- the application -->
  <rect x="24" y="58" width="580" height="356" rx="14" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="44" y="84" font-size="14" font-weight="600" fill="#5f6b73">votre application : le processus de l'API</text>

  <rect x="44" y="104" width="248" height="64" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="168" y="130" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">cas d'usage</text>
  <text x="168" y="152" font-size="13" fill="#1f2328" text-anchor="middle">put, get, liens signés</text>

  <rect x="324" y="104" width="260" height="64" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="454" y="130" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">FileStaging</text>
  <text x="454" y="152" font-size="13" fill="#1f2328" text-anchor="middle">met en attente, confirme, promeut</text>

  <rect x="170" y="212" width="280" height="60" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="310" y="238" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">FileStorage</text>
  <text x="310" y="260" font-size="13" fill="#1f2328" text-anchor="middle">port du noyau</text>

  <rect x="44" y="316" width="256" height="78" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="172" y="342" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">S3FileStorage</text>
  <text x="172" y="363" font-size="13" fill="#1f2328" text-anchor="middle">clé d'objet = préfixe + clé</text>
  <text x="172" y="382" font-size="13" fill="#1f2328" text-anchor="middle">parties de 8 Mio, une en mémoire</text>

  <rect x="332" y="316" width="252" height="78" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="458" y="342" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">S3Client</text>
  <text x="458" y="363" font-size="13" fill="#1f2328" text-anchor="middle">construit par s3ClientOf(settings)</text>
  <text x="458" y="382" font-size="13" fill="#1f2328" text-anchor="middle">par chemin, empreintes si requises</text>

  <!-- the client -->
  <rect x="644" y="104" width="292" height="64" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="790" y="130" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">client</text>
  <text x="790" y="152" font-size="13" fill="#1f2328" text-anchor="middle">navigateur ou application mobile</text>

  <text x="736" y="244" font-size="13" fill="#1f2328">PUT et GET directs vers le</text>
  <text x="736" y="262" font-size="13" fill="#1f2328">bucket, par un lien signé :</text>
  <text x="736" y="280" font-size="13" fill="#1f2328">aucun octet ne passe par</text>
  <text x="736" y="298" font-size="13" fill="#1f2328">l'API ; le fournisseur</text>
  <text x="736" y="316" font-size="13" fill="#1f2328">vérifie le lien</text>

  <!-- the bucket -->
  <rect x="24" y="450" width="912" height="122" rx="14" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="44" y="476" font-size="14" font-weight="600" fill="#5f6b73">un bucket, créé par le code d'infrastructure</text>
  <text x="44" y="496" font-size="13" fill="#1f2328">AWS S3, MinIO, OVHcloud, Scaleway, Cloudflare R2, Garage</text>
  <rect x="44" y="510" width="420" height="50" rx="8" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="254" y="530" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">scheduling/appointment-documents/2026/10/7f3c</text>
  <text x="254" y="549" font-size="13" fill="#1f2328" text-anchor="middle">promu : sa ligne est validée</text>
  <rect x="488" y="510" width="428" height="50" rx="8" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="702" y="530" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">scheduling/staging/appointment-documents/2026/10/9a1b</text>
  <text x="702" y="549" font-size="13" fill="#1f2328" text-anchor="middle">en attente : attend sa validation, purgé périodiquement</text>

  <!-- arrows -->
  <line x1="240" y1="170" x2="240" y2="210" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="170" x2="400" y2="210" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="240" y1="314" x2="240" y2="274" stroke="#7a4f9a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-infrastructure)"/>
  <line x1="302" y1="355" x2="330" y2="355" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="458" y1="396" x2="458" y2="448" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="586" y1="136" x2="642" y2="136" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="626" y="128" font-size="13" fill="#1f2328" text-anchor="middle">lien</text>
  <line x1="720" y1="170" x2="720" y2="448" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- legend -->
  <line x1="40" y1="602" x2="84" y2="602" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="96" y="607" font-size="14" fill="#1f2328">appelle, envoie ou répond</text>
  <line x1="40" y1="628" x2="84" y2="628" stroke="#7a4f9a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-infrastructure)"/>
  <text x="96" y="633" font-size="14" fill="#1f2328">implémente le port : la plateforme lie S3FileStorage à FileStorage au démarrage</text>
</svg>
