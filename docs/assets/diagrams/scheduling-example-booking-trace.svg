<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 774" width="960" height="774" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">One booking, one trace</title>
  <desc id="desc">The span tree of one booking, in two parts. In the request, before the answer 201: POST /appointments contains the command BookAppointmentCommand, its repository calls and its unit of work, in which the domain event scheduling.appointment.booked runs its handlers: the relationships of the appointment, the confirmation deadline, the agenda and the outbox append. After the response, in the same trace: the outbox relay publishes the event, notification processes it, sends the mail through its mailer and plans the reminder, and analytics processes it and writes the outcome of the appointment.</desc>
  <rect width="960" height="774" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">One booking, one trace: <tspan font-weight="400">POST /appointments</tspan></text>
  <!-- the two parts of the trace -->
  <rect x="24" y="74" width="912" height="314" rx="12" fill="#ffffff" stroke="#9a5b2b" stroke-width="1.5"/>
  <rect x="24" y="414" width="912" height="264" rx="12" fill="#ffffff" stroke="#7a4f9a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="24" y1="406" x2="936" y2="406" stroke="#3d4449" stroke-width="1.5" stroke-dasharray="3 4"/>
  <rect x="310" y="393" width="340" height="26" rx="13" fill="#ffffff" stroke="#3d4449" stroke-width="1.5"/>
  <text x="480" y="411" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">the commit, then the answer 201</text>
  <text x="700" y="100" font-size="14" font-weight="700" fill="#1f2328">In the request</text>
  <text x="700" y="122" font-size="13" fill="#5f6b73">one transaction: the appointment,</text>
  <text x="700" y="142" font-size="13" fill="#5f6b73">its relationships, its agenda and</text>
  <text x="700" y="162" font-size="13" fill="#5f6b73">the event in the outbox</text>
  <text x="700" y="440" font-size="14" font-weight="700" fill="#1f2328">Later, by the outbox relay</text>
  <text x="700" y="462" font-size="13" fill="#5f6b73">in the same trace, under the same</text>
  <text x="700" y="482" font-size="13" fill="#5f6b73">correlation id; one transaction</text>
  <text x="700" y="502" font-size="13" fill="#5f6b73">per consumer</text>
