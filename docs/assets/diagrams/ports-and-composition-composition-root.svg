<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 536" width="960" height="536" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">The composition root of the example application</title>
  <desc id="desc">main.ts imports tracing first, loads the configuration and opens the storage, then calls composeApplication of src/platform/composition/compose-application.ts. It hands createApplication the modules: the kernel module, the platform module, the authorization and audit modules, the files module, and one module per bounded context, identity, scheduling, notification and analytics, each built from the generated declarations of its context. The container checks the whole graph before it builds anything.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="536" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">The composition root: one place knows every layer</text>
  <rect x="32" y="206" width="156" height="104" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="110" y="234" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">main.ts</text>
  <text x="110" y="256" font-size="13" fill="#1f2328" text-anchor="middle">tracing first,</text>
  <text x="110" y="274" font-size="13" fill="#1f2328" text-anchor="middle">configuration,</text>
  <text x="110" y="292" font-size="13" fill="#1f2328" text-anchor="middle">storage</text>
  <rect x="220" y="206" width="196" height="104" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="318" y="234" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">composeApplication</text>
  <text x="318" y="256" font-size="13" fill="#1f2328" text-anchor="middle">src/platform/</text>
  <text x="318" y="274" font-size="13" fill="#1f2328" text-anchor="middle">compose-application.ts</text>
  <line x1="190" y1="258" x2="218" y2="258" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="418" y1="258" x2="446" y2="258" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="448" y="60" width="488" height="420" rx="12" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="468" y="86" font-size="14" font-weight="600" fill="#5f6b73">createApplication({ modules: [...] })</text>
  <text x="468" y="114" font-size="13" fill="#5f6b73">shared modules</text>
  <rect x="468" y="124" width="216" height="96" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="576" y="152" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">kernel module</text>
  <text x="576" y="174" font-size="13" fill="#1f2328" text-anchor="middle">buses, clock, ids,</text>
  <text x="576" y="192" font-size="13" fill="#1f2328" text-anchor="middle">in-memory defaults</text>
  <rect x="700" y="124" width="216" height="96" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="808" y="152" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">platform module</text>
  <text x="808" y="174" font-size="13" fill="#1f2328" text-anchor="middle">storage, event provider,</text>
  <text x="808" y="192" font-size="13" fill="#1f2328" text-anchor="middle">policy of outbound calls</text>
  <rect x="468" y="232" width="216" height="80" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="576" y="260" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">authorization, audit</text>
  <text x="576" y="282" font-size="13" fill="#1f2328" text-anchor="middle">the guard of use cases,</text>
  <text x="576" y="300" font-size="13" fill="#1f2328" text-anchor="middle">the audit trail</text>
  <rect x="700" y="232" width="216" height="80" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="808" y="260" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">files module</text>
  <text x="808" y="282" font-size="13" fill="#1f2328" text-anchor="middle">when the project</text>
  <text x="808" y="300" font-size="13" fill="#1f2328" text-anchor="middle">stores files</text>
  <text x="468" y="350" font-size="13" fill="#5f6b73">one module per context: contextModule('&lt;context&gt;', declarations)</text>
  <rect x="468" y="360" width="216" height="44" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="576" y="388" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">identity</text>
  <rect x="700" y="360" width="216" height="44" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="808" y="388" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">scheduling</text>
  <rect x="468" y="416" width="216" height="44" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="576" y="444" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">notification</text>
  <rect x="700" y="416" width="216" height="44" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="808" y="444" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">analytics</text>
  <text x="32" y="508" font-size="14" fill="#1f2328">Before it builds anything, the container checks the whole graph: duplicate bindings, unbound</text>
  <text x="32" y="528" font-size="14" fill="#1f2328">dependencies and cycles stop the start with a WiringError that names the port and the module.</text>
</svg>
