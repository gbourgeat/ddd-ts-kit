<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Des classes d'un contexte à l'application qui tourne</title>
  <desc id="desc">À gauche, ce que dit un contexte délimité : dans le style déclaré, ses ports en classes abstraites, ses classes qui se déclarent par un décorateur, et le fichier généré qui enregistre ce que prend chaque constructeur ; dans le style explicite, un fichier de module écrit à la main. Au milieu, un module par contexte : le style déclaré, pris en entier, va soit à contextModule, qui lit le barrel généré, soit à discoverContext, qui charge les fichiers du disque ; le style explicite va à defineContextModule. À droite, createApplication appelle la fonction register de chaque module, vérifie tout le graphe et lève une WiringError avant de construire la moindre instance, lie tout dans un conteneur enfant de tsyringe, les gestionnaires sur les bus et les jobs sur le planificateur, et ne démarre rien. app.start est un appel à part, fait ensuite : il abonne les consommateurs et démarre les jobs.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="620" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Des classes d'un contexte à l'application qui tourne</text>
  <!-- column headings -->
  <text x="24" y="76" font-size="14" font-weight="600" fill="#1f2328">1. Ce que dit le contexte</text>
  <text x="316" y="76" font-size="14" font-weight="600" fill="#1f2328">2. Un module par contexte</text>
  <text x="624" y="76" font-size="14" font-weight="600" fill="#1f2328">3. createApplication({ modules })</text>
  <!-- declared style: the group as a whole feeds a module -->
  <rect x="24" y="92" width="244" height="282" rx="12" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="40" y="115" font-size="13" font-weight="600" fill="#5f6b73">style déclaré</text>
  <rect x="40" y="128" width="212" height="70" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="146" y="156" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">ports</text>
  <text x="146" y="180" font-size="13" fill="#1f2328" text-anchor="middle">classes abstraites</text>
  <rect x="40" y="210" width="212" height="70" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="146" y="238" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">classes déclarées</text>
  <text x="146" y="262" font-size="13" fill="#1f2328" text-anchor="middle">@Repository, @Gateway...</text>
  <rect x="40" y="292" width="212" height="70" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="146" y="320" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">fichier généré</text>
  <text x="146" y="344" font-size="13" fill="#1f2328" text-anchor="middle">injected(Class, [ports])</text>
  <!-- explicit style -->
  <rect x="24" y="402" width="244" height="74" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="146" y="432" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">module explicite</text>
  <text x="146" y="456" font-size="13" fill="#1f2328" text-anchor="middle">&lt;context&gt;.module.ts, à la main</text>
  <!-- modules -->
  <rect x="316" y="128" width="260" height="70" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="446" y="156" font-size="15" font-weight="700" fill="#5f6b73" text-anchor="middle">contextModule(name, barrel)</text>
  <text x="446" y="180" font-size="13" fill="#1f2328" text-anchor="middle">le barrel généré les liste</text>
  <rect x="316" y="292" width="260" height="70" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="446" y="320" font-size="15" font-weight="700" fill="#5f6b73" text-anchor="middle">discoverContext(name, dir)</text>
  <text x="446" y="344" font-size="13" fill="#1f2328" text-anchor="middle">charge les fichiers de rôle</text>
  <rect x="316" y="402" width="260" height="74" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="446" y="432" font-size="15" font-weight="700" fill="#5f6b73" text-anchor="middle">defineContextModule({ ... })</text>
  <text x="446" y="456" font-size="13" fill="#1f2328" text-anchor="middle">chaque liaison écrite à la main</text>
  <!-- context to module: from the dashed group as a whole -->
  <circle cx="268" cy="245" r="4" fill="#3d4449"/>
  <line x1="268" y1="245" x2="284" y2="245" stroke="#3d4449" stroke-width="2"/>
  <line x1="284" y1="245" x2="314" y2="172" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="284" y1="245" x2="314" y2="318" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="446" y="250" font-size="13" font-style="italic" fill="#5f6b73" text-anchor="middle">au choix</text>
  <line x1="270" y1="439" x2="314" y2="439" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- createApplication: synchronous, starts nothing -->
  <rect x="624" y="92" width="312" height="384" rx="12" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <circle cx="652" cy="130" r="12" fill="#5f6b73"/>
  <text x="652" y="135" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="676" y="135" font-size="14" font-weight="600" fill="#1f2328">appelle register() des modules</text>
  <circle cx="652" cy="214" r="12" fill="#5f6b73"/>
  <text x="652" y="219" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="676" y="219" font-size="14" font-weight="600" fill="#1f2328">vérifie tout le graphe</text>
  <text x="676" y="241" font-size="13" fill="#1f2328">une erreur lève une WiringError,</text>
  <text x="676" y="261" font-size="13" fill="#1f2328">avant toute construction</text>
  <circle cx="652" cy="318" r="12" fill="#5f6b73"/>
  <text x="652" y="323" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="676" y="323" font-size="14" font-weight="600" fill="#1f2328">lie dans un conteneur enfant</text>
  <text x="676" y="345" font-size="13" fill="#1f2328">les gestionnaires sur les bus,</text>
  <text x="676" y="365" font-size="13" fill="#1f2328">les jobs sur le planificateur</text>
  <line x1="652" y1="144" x2="652" y2="198" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="652" y1="228" x2="652" y2="302" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="410" x2="920" y2="410" stroke="#5f6b73" stroke-opacity="0.35"/>
  <text x="780" y="446" font-size="13" font-style="italic" fill="#5f6b73" text-anchor="middle">synchrone : ne démarre rien</text>
  <!-- module to createApplication -->
  <line x1="578" y1="163" x2="622" y2="163" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="578" y1="327" x2="622" y2="327" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="578" y1="439" x2="622" y2="439" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- app.start: a separate call, afterwards -->
  <line x1="780" y1="478" x2="780" y2="506" stroke="#3d4449" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <rect x="624" y="510" width="312" height="84" rx="12" fill="#ffffff" stroke="#5f6b73" stroke-width="2"/>
  <circle cx="652" cy="538" r="12" fill="#5f6b73"/>
  <text x="652" y="543" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="676" y="543" font-size="14" font-weight="600" fill="#1f2328">app.start(), un appel à part</text>
  <text x="676" y="565" font-size="13" fill="#1f2328">abonne les consommateurs,</text>
  <text x="676" y="584" font-size="13" fill="#1f2328">démarre les jobs</text>
  <!-- note -->
  <text x="32" y="536" font-size="14" fill="#1f2328">Les trois sortes de module se mélangent dans une application,</text>
  <text x="32" y="558" font-size="14" fill="#1f2328">et chaque vérification les couvre toutes.</text>
</svg>
