  <rect x="285" y="94" width="160" height="34" rx="8" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="365" y="116" font-size="13" font-weight="600" fill="#5f6b73" text-anchor="middle">amont</text>
