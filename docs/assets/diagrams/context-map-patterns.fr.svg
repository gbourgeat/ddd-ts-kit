<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" width="960" height="510" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Les patrons de relation entre deux contextes</title>
  <desc id="desc">Huit panneaux. Langage publié : l'amont publie un contrat versionné, fait pour ses consommateurs. Client-fournisseur : les besoins de l'aval entrent dans le plan de l'amont. Conformiste : l'aval prend le modèle de l'amont tel quel. Couche anticorruption : l'aval traduit à sa frontière. Service hôte ouvert : un seul protocole sert tous les consommateurs. Noyau partagé : deux contextes possèdent ensemble un petit modèle. Partenariat : deux équipes planifient ensemble, sans amont ; la configuration n'a pas de valeur pour lui. Chemins séparés : aucune intégration ; ne rien déclarer.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="510" rx="16" fill="#ffffff"/>
  <text x="32" y="36" font-size="18" font-weight="600" fill="#1f2328">Qui s'adapte à qui : les huit patrons</text>
  <rect x="24" y="56" width="222" height="214" rx="12" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="38" y="80" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start">Langage publié</text>
