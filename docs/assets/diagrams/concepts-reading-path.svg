<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">The reading path of the concepts</title>
  <desc id="desc">Six sections, read in order. 1, strategic design, pages 1 to 5: where the boundaries are. 2, tactical design, pages 6 to 11: what is inside a context. 3, architecture, pages 12 to 15: how the code is arranged. 4, messaging and consistency, pages 16 to 22: how contexts collaborate. 5, cross-cutting concerns, pages 23 to 34: what surrounds the use cases. 6, code and tests, pages 35 and 36: how the code reads and how it is tested.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="380" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">The reading path of the concepts</text>
  <rect x="32" y="64" width="272" height="104" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="2"/>
  <text x="168" y="101" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">1. Strategic design</text>
  <text x="168" y="127" font-size="13" fill="#1f2328" text-anchor="middle">where the boundaries are</text>
  <text x="168" y="147" font-size="13" fill="#1f2328" text-anchor="middle">pages 1 to 5</text>
  <rect x="344" y="64" width="272" height="104" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="2"/>
  <text x="480" y="101" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">2. Tactical design</text>
  <text x="480" y="127" font-size="13" fill="#1f2328" text-anchor="middle">what is inside a context</text>
  <text x="480" y="147" font-size="13" fill="#1f2328" text-anchor="middle">pages 6 to 11</text>
  <rect x="656" y="64" width="272" height="104" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="2"/>
  <text x="792" y="101" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">3. Architecture</text>
  <text x="792" y="127" font-size="13" fill="#1f2328" text-anchor="middle">how the code is arranged</text>
  <text x="792" y="147" font-size="13" fill="#1f2328" text-anchor="middle">pages 12 to 15</text>
  <rect x="656" y="240" width="272" height="104" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="2"/>
  <text x="792" y="277" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">4. Messaging and consistency</text>
  <text x="792" y="303" font-size="13" fill="#1f2328" text-anchor="middle">how contexts collaborate</text>
  <text x="792" y="323" font-size="13" fill="#1f2328" text-anchor="middle">pages 16 to 22</text>
  <rect x="344" y="240" width="272" height="104" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="2"/>
  <text x="480" y="277" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">5. Cross-cutting concerns</text>
  <text x="480" y="303" font-size="13" fill="#1f2328" text-anchor="middle">what surrounds the use cases</text>
  <text x="480" y="323" font-size="13" fill="#1f2328" text-anchor="middle">pages 23 to 34</text>
  <rect x="32" y="240" width="272" height="104" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="2"/>
  <text x="168" y="277" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">6. Code and tests</text>
  <text x="168" y="303" font-size="13" fill="#1f2328" text-anchor="middle">how the code reads and is tested</text>
  <text x="168" y="323" font-size="13" fill="#1f2328" text-anchor="middle">pages 35 and 36</text>
  <line x1="306" y1="116.0" x2="342" y2="116.0" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="618" y1="116.0" x2="654" y2="116.0" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="792.0" y1="170" x2="792.0" y2="238" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="654" y1="292.0" x2="618" y2="292.0" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="342" y1="292.0" x2="306" y2="292.0" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
