<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Une valeur, plusieurs représentations</title>
  <desc id="desc">Un gestionnaire répond une valeur typée. Le schéma de réponse la vérifie et fait le contrat. L'accès aux champs écarte ensuite ce que cet appelant ne peut pas lire, décidé par l'autorisation de l'application. La négociation sur l'en-tête Accept choisit un type de média parmi ceux que la route produit : application/json par défaut, application/xml avec des noms tirés du schéma, ou text/csv, une ligne par élément, en flux. Quand aucun type de média n'est en commun, la requête HTTP est refusée par un 406 NOT_ACCEPTABLE avant que le gestionnaire ne s'exécute. Les mêmes règles de sérialisation valent dans chaque représentation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="470" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Une valeur, plusieurs représentations</text>
  <rect x="24" y="72" width="180" height="96" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="114.0" y="115" font-size="16" fill="#2b5d8a" text-anchor="middle" font-weight="700">Gestionnaire</text>
  <text x="114.0" y="139" font-size="13" fill="#1f2328" text-anchor="middle">répond une valeur typée</text>
  <rect x="240" y="72" width="200" height="96" rx="10" fill="#f6ede6" stroke="#9a5b2b" stroke-width="2"/>
  <text x="340.0" y="105" font-size="16" fill="#9a5b2b" text-anchor="middle" font-weight="700">Schéma de réponse</text>
  <text x="340.0" y="129" font-size="13" fill="#1f2328" text-anchor="middle">vérifie la valeur,</text>
  <text x="340.0" y="149" font-size="13" fill="#1f2328" text-anchor="middle">fait le contrat</text>
  <rect x="476" y="72" width="210" height="96" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="581.0" y="105" font-size="16" fill="#2b5d8a" text-anchor="middle" font-weight="700">Accès aux champs</text>
  <text x="581.0" y="129" font-size="13" fill="#1f2328" text-anchor="middle">écarte ce que cet appelant</text>
  <text x="581.0" y="149" font-size="13" fill="#1f2328" text-anchor="middle">ne peut pas lire</text>
  <rect x="722" y="72" width="214" height="96" rx="10" fill="#f6ede6" stroke="#9a5b2b" stroke-width="2"/>
  <text x="829.0" y="105" font-size="16" fill="#9a5b2b" text-anchor="middle" font-weight="700">Négociation</text>
  <text x="829.0" y="129" font-size="13" fill="#1f2328" text-anchor="middle">sur l'en-tête Accept, parmi</text>
  <text x="829.0" y="149" font-size="13" fill="#1f2328" text-anchor="middle">ce que produit la route</text>
  <line x1="206" y1="120" x2="238" y2="120" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="442" y1="120" x2="474" y2="120" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="688" y1="120" x2="720" y2="120" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="24" y="262" width="210" height="96" rx="10" fill="#fdeceb" stroke="#b42318" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="129.0" y="295" font-size="16" fill="#b42318" text-anchor="middle" font-weight="700">Aucun en commun</text>
  <text x="129.0" y="319" font-size="13" fill="#1f2328" text-anchor="middle">406 NOT_ACCEPTABLE,</text>
  <text x="129.0" y="339" font-size="13" fill="#1f2328" text-anchor="middle">avant le gestionnaire</text>
  <line x1="829" y1="170" x2="129" y2="260" stroke="#3d4449" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <rect x="258" y="262" width="210" height="96" rx="10" fill="#f6ede6" stroke="#9a5b2b" stroke-width="2"/>
  <text x="363.0" y="295" font-size="16" fill="#9a5b2b" text-anchor="middle" font-weight="700">application/json</text>
  <text x="363.0" y="319" font-size="13" fill="#1f2328" text-anchor="middle">par défaut, toujours premier</text>
  <text x="363.0" y="339" font-size="13" fill="#1f2328" text-anchor="middle">un grand entier en texte</text>
  <line x1="829" y1="170" x2="363" y2="260" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="492" y="262" width="210" height="96" rx="10" fill="#f6ede6" stroke="#9a5b2b" stroke-width="2"/>
  <text x="597.0" y="295" font-size="16" fill="#9a5b2b" text-anchor="middle" font-weight="700">application/xml</text>
  <text x="597.0" y="319" font-size="13" fill="#1f2328" text-anchor="middle">des noms tirés du schéma,</text>
  <text x="597.0" y="339" font-size="13" fill="#1f2328" text-anchor="middle">relu s'il est consommé</text>
  <line x1="829" y1="170" x2="597" y2="260" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="726" y="262" width="210" height="96" rx="10" fill="#f6ede6" stroke="#9a5b2b" stroke-width="2"/>
  <text x="831.0" y="295" font-size="16" fill="#9a5b2b" text-anchor="middle" font-weight="700">text/csv</text>
  <text x="831.0" y="319" font-size="13" fill="#1f2328" text-anchor="middle">une ligne par élément,</text>
  <text x="831.0" y="339" font-size="13" fill="#1f2328" text-anchor="middle">en flux, jamais lu</text>
  <line x1="829" y1="170" x2="831" y2="260" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="32" y="390" font-size="13" fill="#1f2328" text-anchor="start">Les mêmes règles dans chaque représentation : un instant en ISO 8601 UTC, un montant en chaîne décimale avec sa devise,</text>
  <text x="32" y="410" font-size="13" fill="#1f2328" text-anchor="start">un identifiant en chaîne, un vocabulaire fermé par son code. Un fichier n'est pas une représentation : il part tel qu'il a été stocké.</text>
  <rect x="32" y="436" width="22" height="16" rx="4" fill="#f6ede6" stroke="#9a5b2b" stroke-width="2"/>
  <text x="64" y="449" font-size="14" fill="#1f2328" text-anchor="start">couche présentation</text>
  <rect x="272" y="436" width="22" height="16" rx="4" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="304" y="449" font-size="14" fill="#1f2328" text-anchor="start">couche application</text>
  <rect x="512" y="436" width="22" height="16" rx="4" fill="#fdeceb" stroke="#b42318" stroke-width="2"/>
  <text x="544" y="449" font-size="14" fill="#1f2328" text-anchor="start">refusé</text>
</svg>
