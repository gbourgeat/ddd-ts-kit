<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 456" width="960" height="456" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Un job planifié ne fait que déclencher un cas d'usage</title>
  <desc id="desc">Le planificateur de la plateforme calcule les instants, ouvre une portée d'exécution, prend le verrou de l'occurrence et exécute le job. Le job de l'application ne décide rien : il envoie une commande. Un opérateur, par un point d'accès, et une spec du cas d'usage envoient la même commande au même gestionnaire, qui charge les rappels et laisse le domaine décider lesquels sont dus.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="456" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Un job planifié ne fait que déclencher un cas d'usage</text>
  <!-- planificateur (plateforme) -->
  <rect x="24" y="72" width="210" height="296" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="129" y="102" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">planificateur</text>
  <line x1="40" y1="114" x2="218" y2="114" stroke="#5f6b73" stroke-opacity="0.35"/>
  <text x="40" y="138" font-size="13" fill="#1f2328">calcule les instants</text>
  <text x="40" y="160" font-size="13" fill="#1f2328">ouvre une portée</text>
  <text x="40" y="182" font-size="13" fill="#1f2328">d'exécution :</text>
  <text x="52" y="204" font-size="13" fill="#1f2328">origine schedule,</text>
  <text x="52" y="226" font-size="13" fill="#1f2328">acteur système du job,</text>
  <text x="52" y="248" font-size="13" fill="#1f2328">nouvel identifiant</text>
  <text x="52" y="270" font-size="13" fill="#1f2328">de corrélation</text>
  <text x="40" y="292" font-size="13" fill="#1f2328">prend le verrou</text>
  <text x="40" y="314" font-size="13" fill="#1f2328">de l'occurrence</text>
  <text x="40" y="336" font-size="13" fill="#1f2328">enregistre le résultat</text>
  <text x="129" y="390" font-size="13" font-style="italic" fill="#5f6b73" text-anchor="middle">plateforme</text>
  <!-- job (application) -->
  <rect x="280" y="72" width="190" height="130" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="375" y="102" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">job</text>
  <line x1="296" y1="114" x2="454" y2="114" stroke="#2b5d8a" stroke-opacity="0.35"/>
  <text x="375" y="138" font-size="13" fill="#1f2328" text-anchor="middle">SendRemindersJob</text>
  <text x="375" y="160" font-size="13" fill="#1f2328" text-anchor="middle">run(execution)</text>
  <text x="375" y="186" font-size="13" font-style="italic" font-weight="600" fill="#2b5d8a" text-anchor="middle">ne décide rien</text>
  <!-- autres émetteurs -->
  <rect x="280" y="232" width="190" height="56" rx="10" fill="#f6ede6" stroke="#9a5b2b" stroke-width="2"/>
  <text x="375" y="256" font-size="13" font-weight="700" fill="#9a5b2b" text-anchor="middle">point d'accès opérateur</text>
  <text x="375" y="276" font-size="13" fill="#1f2328" text-anchor="middle">rejoue un matin donné</text>
  <rect x="280" y="312" width="190" height="56" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="375" y="336" font-size="14" font-weight="700" fill="#5f6b73" text-anchor="middle">spec</text>
  <text x="375" y="356" font-size="13" fill="#1f2328" text-anchor="middle">du cas d'usage</text>
  <!-- cas d'usage (application) -->
  <rect x="570" y="72" width="190" height="296" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="665" y="102" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">cas d'usage</text>
  <line x1="586" y1="114" x2="744" y2="114" stroke="#2b5d8a" stroke-opacity="0.35"/>
  <text x="665" y="138" font-size="13" fill="#1f2328" text-anchor="middle">SendReminders</text>
  <text x="665" y="160" font-size="13" fill="#1f2328" text-anchor="middle">et son gestionnaire</text>
  <text x="665" y="196" font-size="13" fill="#1f2328" text-anchor="middle">quels rappels,</text>
  <text x="665" y="218" font-size="13" fill="#1f2328" text-anchor="middle">pour quels clients,</text>
  <text x="665" y="240" font-size="13" fill="#1f2328" text-anchor="middle">ce qui compte comme</text>
  <text x="665" y="262" font-size="13" fill="#1f2328" text-anchor="middle">déjà envoyé</text>
  <text x="665" y="300" font-size="13" font-style="italic" font-weight="600" fill="#2b5d8a" text-anchor="middle">le seul endroit</text>
  <text x="665" y="320" font-size="13" font-style="italic" font-weight="600" fill="#2b5d8a" text-anchor="middle">de la règle</text>
  <!-- domaine -->
  <rect x="796" y="72" width="140" height="130" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="866" y="102" font-size="16" font-weight="700" fill="#2f6f4f" text-anchor="middle">domaine</text>
  <line x1="812" y1="114" x2="920" y2="114" stroke="#2f6f4f" stroke-opacity="0.35"/>
  <text x="866" y="138" font-size="13" fill="#1f2328" text-anchor="middle">Reminder</text>
  <text x="866" y="160" font-size="13" fill="#1f2328" text-anchor="middle">isDue(asOf)</text>
  <text x="866" y="182" font-size="13" fill="#1f2328" text-anchor="middle">send(asOf)</text>
  <!-- flèches -->
  <line x1="236" y1="150" x2="278" y2="150" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="472" y1="150" x2="568" y2="150" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="520" y="122" font-size="13" fill="#1f2328" text-anchor="middle">une</text>
  <text x="520" y="140" font-size="13" fill="#1f2328" text-anchor="middle">commande</text>
  <line x1="472" y1="260" x2="568" y2="260" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="472" y1="340" x2="568" y2="340" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="520" y="302" font-size="13" fill="#1f2328" text-anchor="middle">la même</text>
  <text x="520" y="320" font-size="13" fill="#1f2328" text-anchor="middle">commande</text>
  <line x1="762" y1="150" x2="794" y2="150" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- légende -->
  <text x="32" y="420" font-size="14" fill="#1f2328">SendReminders(systemActor('notifications.send-reminders'), execution.scheduledAt) : le job transmet l'instant</text>
  <text x="32" y="442" font-size="14" fill="#1f2328">où l'exécution était due ; le gestionnaire trouve sur quoi agir, et le domaine décide.</text>
</svg>
