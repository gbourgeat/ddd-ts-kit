<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Where @ddd-ts-kit/scheduling sits in an application</title>
  <desc id="desc">The application layer of a bounded context declares scheduled and background jobs against the kernel, which holds the declarations and the JobScheduler, JobQueue and ProcessRunner ports; layer/application-inward lets it import only the kernel (and auth), never the scheduling package. The scheduling package implements those ports with InProcessJobScheduler, StoredJobQueue with QueueWorker, and StoredProcessRunner, runs the jobs, and calls the stores the platform binds: a Lock, a JobStore and optional JobCheckpoints. The kernel module of @ddd-ts-kit/di binds every port to its implementation and registers the declared jobs.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
    <marker id="arrow-infrastructure" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a4f9a"/>
    </marker>
    <marker id="arrow-platform" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5f6b73"/>
    </marker>
  </defs>
  <rect width="960" height="600" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Where @ddd-ts-kit/scheduling sits in an application</text>
  <!-- the application layer of a context -->
  <rect x="40" y="60" width="620" height="112" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="60" y="88" font-size="16" font-weight="700" fill="#2b5d8a">your bounded context: application/</text>
  <text x="60" y="114" font-size="13" fill="#1f2328">scheduling/*.job.ts: a @Scheduled class that sends one command</text>
  <text x="60" y="136" font-size="13" fill="#1f2328">background/*: a @Background class, run later by a worker</text>
  <text x="60" y="158" font-size="13" fill="#1f2328">a command handler: jobs.enqueue(Job, payload) on the JobQueue port</text>
  <!-- note -->
  <text x="690" y="98" font-size="13" font-style="italic" fill="#2b5d8a">application/ never imports</text>
  <text x="690" y="120" font-size="13" font-style="italic" fill="#2b5d8a">@ddd-ts-kit/scheduling</text>
  <text x="690" y="142" font-size="13" font-style="italic" fill="#2b5d8a">(layer/application-inward):</text>
  <text x="690" y="164" font-size="13" font-style="italic" fill="#2b5d8a">only the kernel (and auth)</text>
  <!-- kernel -->
  <rect x="40" y="232" width="240" height="190" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="160" y="260" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">@ddd-ts-kit/kernel</text>
  <line x1="56" y1="272" x2="264" y2="272" stroke="#5f6b73" stroke-opacity="0.35"/>
  <text x="160" y="296" font-size="13" fill="#1f2328" text-anchor="middle">@Scheduled, @Background</text>
  <text x="160" y="318" font-size="13" fill="#1f2328" text-anchor="middle">JobScheduler port</text>
  <text x="160" y="340" font-size="13" fill="#1f2328" text-anchor="middle">JobQueue port</text>
  <text x="160" y="362" font-size="13" fill="#1f2328" text-anchor="middle">ProcessRunner port</text>
  <text x="160" y="384" font-size="13" fill="#1f2328" text-anchor="middle">Lock, Clock, ExecutionScope</text>
  <!-- this package -->
  <rect x="380" y="232" width="280" height="190" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="520" y="260" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">@ddd-ts-kit/scheduling</text>
  <line x1="396" y1="272" x2="644" y2="272" stroke="#7a4f9a" stroke-opacity="0.35"/>
  <text x="520" y="296" font-size="13" fill="#1f2328" text-anchor="middle">InProcessJobScheduler</text>
  <text x="520" y="318" font-size="13" fill="#1f2328" text-anchor="middle">StoredJobQueue, QueueWorker</text>
  <text x="520" y="340" font-size="13" fill="#1f2328" text-anchor="middle">StoredProcessRunner</text>
  <text x="520" y="362" font-size="13" fill="#1f2328" text-anchor="middle">ports: JobStore, JobCheckpoints</text>
  <text x="520" y="384" font-size="13" fill="#1f2328" text-anchor="middle">/testing: ManualJobScheduler</text>
  <!-- stores -->
  <rect x="740" y="232" width="180" height="190" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="830" y="260" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">stores you bind</text>
  <line x1="756" y1="272" x2="904" y2="272" stroke="#7a4f9a" stroke-opacity="0.35"/>
  <text x="830" y="296" font-size="13" fill="#1f2328" text-anchor="middle">Lock: InMemoryLock,</text>
  <text x="830" y="316" font-size="13" fill="#1f2328" text-anchor="middle">RedisLock</text>
  <text x="830" y="342" font-size="13" fill="#1f2328" text-anchor="middle">JobStore: in memory,</text>
  <text x="830" y="362" font-size="13" fill="#1f2328" text-anchor="middle">Knex, Drizzle, Redis</text>
  <text x="830" y="388" font-size="13" fill="#1f2328" text-anchor="middle">JobCheckpoints: yours</text>
  <!-- context imports the kernel -->
  <line x1="160" y1="174" x2="160" y2="228" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="172" y="206" font-size="13" fill="#1f2328">imports</text>
  <!-- the package runs the jobs -->
  <line x1="520" y1="230" x2="520" y2="176" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="532" y="206" font-size="13" fill="#1f2328">runs the jobs at their instants</text>
  <!-- implements the kernel ports -->
  <line x1="378" y1="330" x2="284" y2="330" stroke="#7a4f9a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-infrastructure)"/>
  <text x="330" y="318" font-size="13" fill="#7a4f9a" text-anchor="middle">implements</text>
  <!-- calls the stores -->
  <line x1="662" y1="330" x2="736" y2="330" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="700" y="318" font-size="13" fill="#1f2328" text-anchor="middle">calls</text>
  <!-- composition -->
  <rect x="40" y="474" width="880" height="64" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="480" y="500" font-size="14" font-weight="600" fill="#5f6b73" text-anchor="middle">@ddd-ts-kit/di, kernelModule(): binds each port to its implementation, registers every declared job</text>
  <text x="480" y="524" font-size="13" fill="#1f2328" text-anchor="middle">application.start() starts the scheduler and the worker, unless jobs: { start: false }</text>
  <line x1="520" y1="472" x2="520" y2="426" stroke="#5f6b73" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-platform)"/>
  <text x="532" y="454" font-size="13" fill="#5f6b73">binds</text>
  <line x1="830" y1="472" x2="830" y2="426" stroke="#5f6b73" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-platform)"/>
  <text x="842" y="454" font-size="13" fill="#5f6b73">binds</text>
  <!-- legend -->
  <line x1="40" y1="566" x2="84" y2="566" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="96" y="571" font-size="14" fill="#1f2328">imports or calls</text>
  <line x1="300" y1="566" x2="344" y2="566" stroke="#7a4f9a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-infrastructure)"/>
  <text x="356" y="571" font-size="14" fill="#1f2328">implements a port</text>
  <line x1="560" y1="566" x2="604" y2="566" stroke="#5f6b73" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-platform)"/>
  <text x="616" y="571" font-size="14" fill="#1f2328">binds a port to it at start-up</text>
</svg>
