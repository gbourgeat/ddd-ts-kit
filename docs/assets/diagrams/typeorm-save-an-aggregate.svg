<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Saving an aggregate with optimisticUpdate</title>
  <desc id="desc">optimisticUpdate reads the version the aggregate was loaded with and computes the next one. A first save inserts with insertIgnoringConflict, a later save runs an update guarded by the expected version. One row written moves the version of the aggregate on; no row written raises ConcurrencyError and rolls the transaction back. Beside it, why manager.save is not used: it reads, then decides between insert and update by itself, so two concurrent saves both succeed and the second erases the first.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="560" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Saving an aggregate: optimisticUpdate and its guarded statement</text>
  <!-- step 1 -->
  <rect x="130" y="60" width="380" height="74" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="320" y="86" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">optimisticUpdate(invoice, write)</text>
  <text x="320" y="108" font-size="13" fill="#1f2328" text-anchor="middle">expected = invoice.version, the version it was read at</text>
  <text x="320" y="126" font-size="13" fill="#1f2328" text-anchor="middle">next = expected + 1, the version to write</text>
  <line x1="320" y1="136" x2="320" y2="160" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- decision: first save? -->
  <polygon points="320,162 410,194 320,226 230,194" fill="#ffffff" stroke="#3d4449" stroke-width="2"/>
  <text x="320" y="199" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">expected = 0 ?</text>
  <path d="M230,194 H172 V256" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="180" y="184" font-size="13" fill="#1f2328" text-anchor="middle">yes: first save</text>
  <path d="M410,194 H468 V256" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="456" y="184" font-size="13" fill="#1f2328" text-anchor="middle">no</text>
  <!-- the two statements -->
  <rect x="32" y="258" width="280" height="80" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="172" y="284" font-size="15" font-weight="700" fill="#7a4f9a" text-anchor="middle">insertIgnoringConflict()</text>
  <text x="172" y="306" font-size="13" fill="#1f2328" text-anchor="middle">INSERT ... ON CONFLICT DO NOTHING</text>
  <text x="172" y="325" font-size="13" fill="#1f2328" text-anchor="middle">a taken id writes no row</text>
  <rect x="328" y="258" width="280" height="80" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="468" y="284" font-size="15" font-weight="700" fill="#7a4f9a" text-anchor="middle">manager.update()</text>
  <text x="468" y="306" font-size="13" fill="#1f2328" text-anchor="middle">UPDATE ... SET version = next</text>
  <text x="468" y="325" font-size="13" fill="#1f2328" text-anchor="middle">WHERE id = ... AND version = expected</text>
  <path d="M172,340 V398 H226" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M468,340 V398 H414" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- decision: rows written -->
  <polygon points="320,366 412,398 320,430 228,398" fill="#ffffff" stroke="#3d4449" stroke-width="2"/>
  <text x="320" y="403" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">rows written</text>
  <path d="M320,432 V448 H172 V466" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="236" y="442" font-size="13" fill="#1f2328" text-anchor="middle">1</text>
  <path d="M320,448 H468 V466" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="404" y="442" font-size="13" fill="#1f2328" text-anchor="middle">0</text>
  <!-- outcomes -->
  <rect x="32" y="468" width="280" height="68" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="172" y="494" font-size="15" font-weight="700" fill="#2b5d8a" text-anchor="middle">invoice.version = next</text>
  <text x="172" y="516" font-size="13" fill="#1f2328" text-anchor="middle">the same object can be saved again</text>
  <rect x="328" y="468" width="280" height="68" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="468" y="494" font-size="15" font-weight="700" fill="#2f6f4f" text-anchor="middle">ConcurrencyError</text>
  <text x="468" y="516" font-size="13" fill="#1f2328" text-anchor="middle">CONCURRENCY_CONFLICT, rolled back</text>
  <!-- instead of -->
  <rect x="648" y="60" width="280" height="476" rx="12" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="668" y="88" font-size="16" font-weight="700" fill="#5f6b73">Instead of manager.save</text>
  <line x1="668" y1="100" x2="908" y2="100" stroke="#5f6b73" stroke-opacity="0.35"/>
  <text x="668" y="126" font-size="13" fill="#1f2328">manager.save(invoices, row) reads</text>
  <text x="668" y="146" font-size="13" fill="#1f2328">the row, then picks insert or update</text>
  <text x="668" y="166" font-size="13" fill="#1f2328">by itself, with no version guard:</text>
  <text x="668" y="198" font-size="13" fill="#1f2328">1. A and B both read inv-1 at version 3</text>
  <text x="668" y="220" font-size="13" fill="#1f2328">2. A saves: UPDATE ... WHERE id</text>
  <text x="668" y="242" font-size="13" fill="#1f2328">3. B saves: UPDATE ... WHERE id</text>
  <text x="668" y="264" font-size="13" fill="#1f2328">4. both succeed, B erases A</text>
  <text x="668" y="296" font-size="13" fill="#1f2328">With optimisticUpdate, B's update</text>
  <text x="668" y="316" font-size="13" fill="#1f2328">finds no row at version 3: B gets</text>
  <text x="668" y="336" font-size="13" fill="#1f2328">ConcurrencyError, A's write stays.</text>
  <text x="668" y="378" font-size="14" font-weight="600" fill="#5f6b73">Nor @VersionColumn</text>
  <text x="668" y="402" font-size="13" fill="#1f2328">The version belongs to the aggregate:</text>
  <text x="668" y="422" font-size="13" fill="#1f2328">the mapper sets it when it loads,</text>
  <text x="668" y="442" font-size="13" fill="#1f2328">optimisticUpdate moves it on when</text>
  <text x="668" y="462" font-size="13" fill="#1f2328">the guarded statement wrote its row.</text>
</svg>
