<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">What S3FileStorage.put does with a stream</title>
  <desc id="desc">The content arrives as a stream. FileInspection counts and hashes every chunk on its way. The Upload of @aws-sdk/lib-storage sends it in parts of 8 MiB, one held in memory at a time, and the bucket assembles the object only when the last part is sent, so the object appears whole. put then answers the StoredFile: key, size, media type and the sha256 checksum computed on the way. Beyond maxBytes, FileInspection fails with FILE_TOO_LARGE: the upload is aborted, no part is left, and the object that was under the key stays as it was.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="480" rx="16" fill="#ffffff"/>
  <text x="24" y="36" font-size="18" font-weight="600" fill="#1f2328">What S3FileStorage.put does with a stream</text>
  <!-- the stream -->
  <rect x="24" y="64" width="160" height="96" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="104" y="92" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">FileSource</text>
  <text x="104" y="116" font-size="13" fill="#1f2328" text-anchor="middle">a stream of chunks,</text>
  <text x="104" y="136" font-size="13" fill="#1f2328" text-anchor="middle">never a whole file</text>
  <!-- inspection -->
  <rect x="224" y="64" width="200" height="96" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="324" y="92" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">FileInspection</text>
  <text x="324" y="116" font-size="13" fill="#1f2328" text-anchor="middle">counts every byte,</text>
  <text x="324" y="136" font-size="13" fill="#1f2328" text-anchor="middle">hashes it (sha256)</text>
  <!-- upload -->
  <rect x="464" y="64" width="200" height="96" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="564" y="92" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">Upload</text>
  <text x="564" y="116" font-size="13" fill="#1f2328" text-anchor="middle">@aws-sdk/lib-storage</text>
  <text x="564" y="136" font-size="13" fill="#1f2328" text-anchor="middle">8 MiB parts, one at a time</text>
  <!-- bucket -->
  <rect x="704" y="64" width="232" height="186" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="820" y="92" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">bucket</text>
  <rect x="724" y="106" width="60" height="30" rx="4" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="754" y="126" font-size="13" fill="#1f2328" text-anchor="middle">part 1</text>
  <rect x="790" y="106" width="60" height="30" rx="4" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="820" y="126" font-size="13" fill="#1f2328" text-anchor="middle">part 2</text>
  <rect x="856" y="106" width="60" height="30" rx="4" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="886" y="126" font-size="13" fill="#1f2328" text-anchor="middle">part 3</text>
  <line x1="820" y1="140" x2="820" y2="176" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="830" y="164" font-size="13" fill="#1f2328">assembled</text>
  <rect x="724" y="180" width="192" height="54" rx="6" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="820" y="202" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">the object, whole</text>
  <text x="820" y="222" font-size="13" fill="#1f2328" text-anchor="middle">under its key</text>
  <!-- flow -->
  <line x1="186" y1="112" x2="222" y2="112" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="426" y1="112" x2="462" y2="112" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="666" y1="112" x2="702" y2="112" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- success -->
  <line x1="564" y1="162" x2="564" y2="290" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="574" y="232" font-size="13" fill="#1f2328">done</text>
  <rect x="464" y="292" width="300" height="80" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="614" y="318" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">StoredFile, answered by put</text>
  <text x="614" y="342" font-size="13" fill="#1f2328" text-anchor="middle">key, size, mediaType,</text>
  <text x="614" y="362" font-size="13" fill="#1f2328" text-anchor="middle">checksum: sha256 of what streamed</text>
  <!-- refusal -->
  <line x1="324" y1="162" x2="324" y2="290" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="314" y="224" font-size="13" fill="#1f2328" text-anchor="end">beyond</text>
  <text x="314" y="242" font-size="13" fill="#1f2328" text-anchor="end">maxBytes</text>
  <rect x="24" y="292" width="400" height="80" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="224" y="318" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">FILE_TOO_LARGE</text>
  <text x="224" y="342" font-size="13" fill="#1f2328" text-anchor="middle">the upload is aborted, no part is left behind,</text>
  <text x="224" y="362" font-size="13" fill="#1f2328" text-anchor="middle">the previous object under the key is untouched</text>
  <!-- footer -->
  <text x="24" y="412" font-size="14" fill="#1f2328">Memory per upload: one part (partSize, 8 MiB by default, 5 MiB at least), whatever the size of the file.</text>
  <text x="24" y="434" font-size="14" fill="#1f2328">A file smaller than one part is sent in one request. The bucket assembles the parts only after the last one.</text>
  <text x="24" y="456" font-size="14" fill="#1f2328">The bucket does not keep the checksum: stat does not answer one, put does.</text>
</svg>
