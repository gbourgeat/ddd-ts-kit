<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Who wraps whom around one instance, outermost first</title>
  <desc id="desc">Six nested layers around the method of one instance, an adapter or a repository, from the outside in: first the decorate hook of createApplication, applied to every binding; second the span the kernel module puts with its instrumentation; third, for a repository only (absent around an adapter), the hand-over of its domain events; fourth the aspects the platform module puts with builder.around, as a generated project does; fifth the aspects of the binding itself, .with or the aspects of an Adapter declaration; sixth the decorators written on the method of the class. A call enters through the outermost layer first and its answer leaves through it last.</desc>
  <rect width="960" height="500" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Who wraps whom around one instance, outermost first</text>
  <rect x="32" y="64" width="896" height="344" rx="12" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="46" y="87" font-size="14" font-weight="600" fill="#5f6b73"><tspan fill="#1f2328">1.</tspan> decorate hook of createApplication: aspects(...)</text>
  <text x="914" y="87" font-size="13" font-style="italic" fill="#5f6b73" text-anchor="end">every binding of the application</text>
  <rect x="54" y="98" width="852" height="296" rx="11" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="68" y="121" font-size="14" font-weight="600" fill="#5f6b73"><tspan fill="#1f2328">2.</tspan> kernelModule({ instrumentation }): the span of the call</text>
  <text x="892" y="121" font-size="13" font-style="italic" fill="#5f6b73" text-anchor="end">builder.around, kernel module</text>
  <rect x="76" y="132" width="808" height="248" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="90" y="155" font-size="14" font-weight="600" fill="#5f6b73"><tspan fill="#1f2328">3.</tspan> repository only: hand-over of its domain events</text>
  <text x="870" y="155" font-size="13" font-style="italic" fill="#5f6b73" text-anchor="end">kernelModule(), absent for an adapter</text>
  <rect x="98" y="166" width="764" height="200" rx="9" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="112" y="189" font-size="14" font-weight="600" fill="#5f6b73"><tspan fill="#1f2328">4.</tspan> platform module: builder.around([&apos;external&apos;, &apos;gateway&apos;], ...)</text>
  <text x="848" y="189" font-size="13" font-style="italic" fill="#5f6b73" text-anchor="end">a generated project</text>
  <rect x="120" y="200" width="720" height="152" rx="8" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="134" y="223" font-size="14" font-weight="600" fill="#5f6b73"><tspan fill="#1f2328">5.</tspan> the binding: .with(...), or aspects of @Adapter(...)</text>
  <text x="826" y="223" font-size="13" font-style="italic" fill="#5f6b73" text-anchor="end">one binding</text>
  <rect x="142" y="234" width="676" height="104" rx="7" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="156" y="257" font-size="14" font-weight="600" fill="#7a4f9a"><tspan fill="#1f2328">6.</tspan> decorators on the method: @Retry(...), @Timeout(...)</text>
  <text x="804" y="257" font-size="13" font-style="italic" fill="#5f6b73" text-anchor="end">the class itself</text>
  <rect x="164" y="268" width="632" height="56" rx="8" fill="#ffffff" stroke="#7a4f9a" stroke-width="2.5"/>
  <text x="480" y="302" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">the method of the instance: an adapter or a repository</text>
  <text x="32" y="446" font-size="14" fill="#1f2328">A call enters through layer 1 first and reaches the method last; its answer, or its error, leaves the other way.</text>
  <text x="32" y="470" font-size="14" fill="#1f2328">Inside one layer the same rule holds: compose(a, b), .with(a, b), aspects(a, b) and stacked decorators put a around b.</text>
</svg>
