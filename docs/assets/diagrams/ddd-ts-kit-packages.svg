<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 556" width="960" height="556" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Which packages each part of an application imports</title>
  <desc id="desc">Inside a bounded context, the domain imports only the kernel; the application adds auth; the presentation imports http and validation; the infrastructure imports one ORM package; the published language imports the kernel, events and validation. The platform composes the contexts with di and the packages of its technical capabilities: http, events, the brokers, redis, auth, openfga, aspects, tracing, audit, scheduling, the loggers, sentry and s3. The tests use testing. Every name stands for @ddd-ts-kit/&lt;name&gt;.</desc>
  <rect width="960" height="556" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Which packages each part of an application imports</text>
  <text x="928" y="38" font-size="13" fill="#1f2328" text-anchor="end">each name is @ddd-ts-kit/&lt;name&gt;</text>
  <rect x="24" y="58" width="912" height="478" rx="14" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="44" y="86" font-size="14" font-weight="600" fill="#5f6b73">platform (src/platform): composition root, configuration, servers, worker</text>
  <rect x="44" y="102" width="872" height="212" rx="12" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="64" y="130" font-size="14" font-weight="600" fill="#5f6b73">bounded context: src/contexts/&lt;context&gt;/</text>
  <rect x="60" y="146" width="150" height="152" rx="10" fill="#f6ede6" stroke="#9a5b2b" stroke-width="2"/>
  <text x="135" y="174" font-size="16" font-weight="700" fill="#9a5b2b" text-anchor="middle">presentation</text>
  <line x1="74" y1="186" x2="196" y2="186" stroke="#9a5b2b" stroke-opacity="0.35"/>
  <text x="135" y="210" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">http</text>
  <text x="135" y="232" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">validation</text>
  <text x="135" y="254" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">kernel</text>
  <rect x="222" y="146" width="150" height="152" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="297" y="174" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">application</text>
  <line x1="236" y1="186" x2="358" y2="186" stroke="#2b5d8a" stroke-opacity="0.35"/>
  <text x="297" y="210" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">kernel</text>
  <text x="297" y="232" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">auth</text>
  <text x="297" y="254" font-size="13" fill="#1f2328" text-anchor="middle">(permissions)</text>
  <rect x="384" y="146" width="150" height="152" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="459" y="174" font-size="16" font-weight="700" fill="#2f6f4f" text-anchor="middle">domain</text>
  <line x1="398" y1="186" x2="520" y2="186" stroke="#2f6f4f" stroke-opacity="0.35"/>
  <text x="459" y="210" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">kernel</text>
  <text x="459" y="232" font-size="13" font-style="italic" font-weight="600" fill="#2f6f4f" text-anchor="middle">and nothing else</text>
  <rect x="546" y="146" width="170" height="152" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="631" y="174" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">infrastructure</text>
  <line x1="560" y1="186" x2="702" y2="186" stroke="#7a4f9a" stroke-opacity="0.35"/>
  <text x="631" y="210" font-size="13" fill="#1f2328" text-anchor="middle">one ORM package:</text>
  <text x="631" y="232" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">drizzle, knex,</text>
  <text x="631" y="254" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">prisma or typeorm</text>
  <text x="631" y="276" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">kernel</text>
  <rect x="726" y="146" width="182" height="152" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="2"/>
  <text x="817" y="174" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">published language</text>
  <line x1="740" y1="186" x2="894" y2="186" stroke="#5f6b73" stroke-opacity="0.35"/>
  <text x="817" y="210" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">kernel</text>
  <text x="817" y="232" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">events</text>
  <text x="817" y="254" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">validation</text>
  <text x="44" y="344" font-size="14" font-weight="600" fill="#5f6b73">composed by the platform, with the packages of its technical capabilities:</text>
  <rect x="52" y="360" width="164" height="48" rx="8" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="134" y="380" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">di</text>
  <text x="134" y="398" font-size="13" fill="#1f2328" text-anchor="middle">wiring of the contexts</text>
  <rect x="228" y="360" width="164" height="48" rx="8" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="310" y="380" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">http</text>
  <text x="310" y="398" font-size="13" fill="#1f2328" text-anchor="middle">server, OpenAPI</text>
  <rect x="404" y="360" width="164" height="48" rx="8" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="486" y="380" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">events</text>
  <text x="486" y="398" font-size="13" fill="#1f2328" text-anchor="middle">outbox and relay</text>
  <rect x="580" y="360" width="164" height="48" rx="8" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="662" y="380" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">rabbitmq, kafka, nats</text>
  <text x="662" y="398" font-size="13" fill="#1f2328" text-anchor="middle">brokers</text>
  <rect x="756" y="360" width="164" height="48" rx="8" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="838" y="380" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">redis</text>
  <text x="838" y="398" font-size="13" fill="#1f2328" text-anchor="middle">cache, lock, streams</text>
  <rect x="52" y="418" width="164" height="48" rx="8" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="134" y="438" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">auth</text>
  <text x="134" y="456" font-size="13" fill="#1f2328" text-anchor="middle">JWT, authorizers</text>
  <rect x="228" y="418" width="164" height="48" rx="8" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="310" y="438" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">openfga</text>
  <text x="310" y="456" font-size="13" fill="#1f2328" text-anchor="middle">relationships</text>
  <rect x="404" y="418" width="164" height="48" rx="8" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="486" y="438" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">aspects</text>
  <text x="486" y="456" font-size="13" fill="#1f2328" text-anchor="middle">logs, resilience</text>
  <rect x="580" y="418" width="164" height="48" rx="8" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="662" y="438" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">tracing</text>
  <text x="662" y="456" font-size="13" fill="#1f2328" text-anchor="middle">OpenTelemetry</text>
  <rect x="756" y="418" width="164" height="48" rx="8" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="838" y="438" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">audit</text>
  <text x="838" y="456" font-size="13" fill="#1f2328" text-anchor="middle">audit trail</text>
  <rect x="52" y="476" width="164" height="48" rx="8" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="134" y="496" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">scheduling</text>
  <text x="134" y="514" font-size="13" fill="#1f2328" text-anchor="middle">scheduled jobs</text>
  <rect x="228" y="476" width="164" height="48" rx="8" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="310" y="496" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">pino, winston</text>
  <text x="310" y="514" font-size="13" fill="#1f2328" text-anchor="middle">Logger</text>
  <rect x="404" y="476" width="164" height="48" rx="8" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="486" y="496" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">sentry</text>
  <text x="486" y="514" font-size="13" fill="#1f2328" text-anchor="middle">ErrorReporter</text>
  <rect x="580" y="476" width="164" height="48" rx="8" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="662" y="496" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">s3</text>
  <text x="662" y="514" font-size="13" fill="#1f2328" text-anchor="middle">FileStorage</text>
  <rect x="756" y="476" width="164" height="48" rx="8" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="838" y="496" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">testing</text>
  <text x="838" y="514" font-size="13" fill="#1f2328" text-anchor="middle">tests: builders, fakes</text>
</svg>
