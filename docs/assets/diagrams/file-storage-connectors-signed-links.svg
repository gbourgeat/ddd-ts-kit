<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Who answers a signed link: the application, or the bucket</title>
  <desc id="desc">Two panels. On the left, a storage the application serves, the local directory or the memory: 1, the client asks a use case for a link; 2, LocalFileStorage signs a token and the API answers a link to its own /files route carrying it; 3, the client follows it, signedFileRoutes checks the token and reads the file from LocalFileStorage through openSigned, so every byte passes through the API. On the right, an object store: 1, the client asks a use case for a link; 2, S3FileStorage presigns the URL without any request to the bucket and the API answers it; 3, the client downloads straight from the bucket, which checks the signature and the expiry, and no byte passes through the API.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="440" rx="16" fill="#ffffff"/>
  <text x="24" y="36" font-size="18" font-weight="600" fill="#1f2328">Who answers a signed link: the application, or the bucket</text>
  <line x1="480" y1="56" x2="480" y2="420" stroke="#d0d7de" stroke-width="1.5"/>
  <!-- left panel: a served storage -->
  <text x="24" y="70" font-size="16" font-weight="700" fill="#1f2328">A served storage: directory, memory</text>
  <rect x="24" y="88" width="96" height="164" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="72" y="176" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">client</text>
  <rect x="236" y="88" width="228" height="164" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="350" y="108" font-size="14" font-weight="600" fill="#5f6b73" text-anchor="middle">API</text>
  <rect x="258" y="118" width="184" height="44" rx="8" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="350" y="145" font-size="14" font-weight="700" fill="#2b5d8a" text-anchor="middle">use case</text>
  <rect x="258" y="192" width="184" height="44" rx="8" fill="#f6ede6" stroke="#9a5b2b" stroke-width="2"/>
  <text x="350" y="219" font-size="14" font-weight="700" fill="#9a5b2b" text-anchor="middle">signedFileRoutes</text>
  <rect x="236" y="300" width="228" height="58" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="350" y="324" font-size="15" font-weight="700" fill="#7a4f9a" text-anchor="middle">LocalFileStorage</text>
  <text x="350" y="346" font-size="13" fill="#1f2328" text-anchor="middle">the directory</text>
  <text x="178" y="124" font-size="13" fill="#1f2328" text-anchor="middle">1 ask</text>
  <line x1="122" y1="132" x2="256" y2="132" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="188" y="160" font-size="13" fill="#1f2328" text-anchor="middle">2 /files?token=</text>
  <line x1="256" y1="168" x2="122" y2="168" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="178" y="206" font-size="13" fill="#1f2328" text-anchor="middle">3 GET the link</text>
  <line x1="122" y1="214" x2="256" y2="214" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="350" y1="238" x2="350" y2="298" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M444,140 H454 V298" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="446" y="274" font-size="13" fill="#1f2328" text-anchor="end">signs a token</text>
  <text x="342" y="274" font-size="13" fill="#1f2328" text-anchor="end">openSigned(token)</text>
  <text x="24" y="392" font-size="14" fill="#1f2328">Every byte passes through the API, under /files.</text>
  <text x="24" y="414" font-size="14" fill="#1f2328">One machine; with Express, mounted before express.json().</text>
  <!-- right panel: an object store -->
  <text x="504" y="70" font-size="16" font-weight="700" fill="#1f2328">An object store: S3FileStorage</text>
  <rect x="504" y="88" width="96" height="164" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="552" y="176" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">client</text>
  <rect x="712" y="88" width="224" height="164" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="824" y="108" font-size="14" font-weight="600" fill="#5f6b73" text-anchor="middle">API</text>
  <rect x="728" y="118" width="192" height="44" rx="8" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="824" y="145" font-size="14" font-weight="700" fill="#2b5d8a" text-anchor="middle">use case</text>
  <rect x="728" y="192" width="192" height="44" rx="8" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="824" y="212" font-size="14" font-weight="700" fill="#7a4f9a" text-anchor="middle">S3FileStorage</text>
  <text x="824" y="229" font-size="13" fill="#1f2328" text-anchor="middle">presigns, no request</text>
  <line x1="824" y1="164" x2="824" y2="190" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="712" y="300" width="224" height="58" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="824" y="324" font-size="15" font-weight="700" fill="#5f6b73" text-anchor="middle">bucket</text>
  <text x="824" y="346" font-size="13" fill="#1f2328" text-anchor="middle">checks signature, expiry</text>
  <text x="656" y="124" font-size="13" fill="#1f2328" text-anchor="middle">1 ask</text>
  <line x1="602" y1="132" x2="726" y2="132" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="666" y="160" font-size="13" fill="#1f2328" text-anchor="middle">2 presigned URL</text>
  <line x1="726" y1="168" x2="602" y2="168" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M552,254 V329 H710" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="566" y="318" font-size="13" fill="#1f2328">3 GET, straight to it</text>
  <text x="504" y="392" font-size="14" fill="#1f2328">No byte passes through the API.</text>
  <text x="504" y="414" font-size="14" fill="#1f2328">Any number of instances sign the same links.</text>
</svg>
