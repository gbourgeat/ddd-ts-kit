<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="960" height="680" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Une tranche de bout en bout : POST /orders dans le contexte ordering</title>
  <desc id="desc">Un diagramme de séquence. Le client HTTP envoie POST /orders ; le contrôleur de la couche présentation envoie PlaceOrderCommand sur le bus de commandes de la plateforme, qui vérifie la permission order.place et ouvre l'unité de travail ; le gestionnaire de la couche application demande à l'agrégat Order du domaine de passer la commande (Order.place), qui enregistre OrderPlaced ; le gestionnaire sauvegarde par le repository, dont l'adaptateur Drizzle écrit la ligne ; l'unité de travail distribue OrderPlaced puis valide ; l'identifiant revient au contrôleur, qui répond 201.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="680" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Une tranche de bout en bout : POST /orders dans le contexte ordering</text>
  <line x1="59" y1="118" x2="59" y2="606" stroke="#5f6b73" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="179" y1="118" x2="179" y2="606" stroke="#9a5b2b" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="346" y1="118" x2="346" y2="606" stroke="#5f6b73" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="513" y1="118" x2="513" y2="606" stroke="#2b5d8a" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="673" y1="118" x2="673" y2="606" stroke="#2f6f4f" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="848" y1="118" x2="848" y2="606" stroke="#7a4f9a" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="24" y="58" width="70" height="60" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="59" y="83" font-size="15" font-weight="700" fill="#5f6b73" text-anchor="middle">client</text>
  <text x="59" y="105" font-size="13" fill="#1f2328" text-anchor="middle">HTTP</text>
  <rect x="104" y="58" width="150" height="60" rx="10" fill="#f6ede6" stroke="#9a5b2b" stroke-width="2"/>
  <text x="179" y="83" font-size="15" font-weight="700" fill="#9a5b2b" text-anchor="middle">contrôleur</text>
  <text x="179" y="105" font-size="13" fill="#1f2328" text-anchor="middle">PlaceOrderController</text>
  <rect x="264" y="58" width="164" height="60" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="346" y="83" font-size="15" font-weight="700" fill="#5f6b73" text-anchor="middle">bus de commandes</text>
  <text x="346" y="105" font-size="13" fill="#1f2328" text-anchor="middle">de la plateforme</text>
  <rect x="438" y="58" width="150" height="60" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="513" y="83" font-size="15" font-weight="700" fill="#2b5d8a" text-anchor="middle">gestionnaire</text>
  <text x="513" y="105" font-size="13" fill="#1f2328" text-anchor="middle">PlaceOrderHandler</text>
  <rect x="598" y="58" width="150" height="60" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="673" y="83" font-size="15" font-weight="700" fill="#2f6f4f" text-anchor="middle">agrégat</text>
  <text x="673" y="105" font-size="13" fill="#1f2328" text-anchor="middle">Order</text>
  <rect x="760" y="58" width="176" height="60" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="848" y="83" font-size="15" font-weight="700" fill="#7a4f9a" text-anchor="middle">repository</text>
  <text x="848" y="105" font-size="13" fill="#1f2328" text-anchor="middle">DrizzleOrderRepository</text>
  <rect x="236" y="252" width="698" height="282" rx="12" fill="none" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="922" y="272" font-size="13" font-weight="600" fill="#5f6b73" text-anchor="end">unité de travail : une transaction</text>
  <line x1="61" y1="152" x2="176" y2="152" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="119" y="144" font-size="13" fill="#1f2328" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"><tspan font-weight="700">1</tspan>  POST /orders</text>
  <line x1="181" y1="192" x2="343" y2="192" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="262.5" y="184" font-size="13" fill="#1f2328" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"><tspan font-weight="700">2</tspan>  PlaceOrderCommand</text>
  <rect x="241" y="206" width="210" height="50" rx="8" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="346" y="228" font-size="13" fill="#1f2328" text-anchor="middle"><tspan font-weight="700">3</tspan>  vérifie order.place,</text>
  <text x="346" y="246" font-size="13" fill="#1f2328" text-anchor="middle">ouvre l'unité de travail</text>
  <line x1="348" y1="292" x2="510" y2="292" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="429.5" y="284" font-size="13" fill="#1f2328" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"><tspan font-weight="700">4</tspan>  execute(command)</text>
  <line x1="515" y1="330" x2="670" y2="330" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="593" y="322" font-size="13" fill="#1f2328" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"><tspan font-weight="700">5</tspan>  Order.place(...)</text>
  <rect x="585" y="344" width="176" height="32" rx="8" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="1.5"/>
  <text x="673" y="366" font-size="13" fill="#1f2328" text-anchor="middle"><tspan font-weight="700">6</tspan>  enregistre OrderPlaced</text>
  <line x1="515" y1="410" x2="845" y2="410" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="680.5" y="402" font-size="13" fill="#1f2328" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"><tspan font-weight="700">7</tspan>  save(order)</text>
  <rect x="773" y="422" width="150" height="32" rx="8" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="1.5"/>
  <text x="848" y="444" font-size="13" fill="#1f2328" text-anchor="middle"><tspan font-weight="700">8</tspan>  écrit la ligne</text>
  <rect x="246" y="470" width="200" height="50" rx="8" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="346" y="492" font-size="13" fill="#1f2328" text-anchor="middle"><tspan font-weight="700">9</tspan>  distribue OrderPlaced,</text>
  <text x="346" y="510" font-size="13" fill="#1f2328" text-anchor="middle">puis valide</text>
  <line x1="344" y1="562" x2="182" y2="562" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="262.5" y="554" font-size="13" fill="#1f2328" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"><tspan font-weight="700">10</tspan>  identifiant</text>
  <line x1="177" y1="596" x2="62" y2="596" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="119" y="588" font-size="13" fill="#1f2328" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"><tspan font-weight="700">11</tspan>  201 { id }</text>
  <line x1="32" y1="640" x2="76" y2="640" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="86" y="645" font-size="14" fill="#1f2328">un appel</text>
  <line x1="32" y1="664" x2="76" y2="664" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="86" y="669" font-size="14" fill="#1f2328">sa réponse</text>
  <rect x="236" y="644" width="16" height="16" rx="4" fill="#f6ede6" stroke="#9a5b2b" stroke-width="2"/>
  <text x="260" y="657" font-size="14" fill="#1f2328">présentation</text>
  <rect x="380" y="644" width="16" height="16" rx="4" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="404" y="657" font-size="14" fill="#1f2328">application</text>
  <rect x="517" y="644" width="16" height="16" rx="4" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="541" y="657" font-size="14" fill="#1f2328">domaine</text>
  <rect x="624" y="644" width="16" height="16" rx="4" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="648" y="657" font-size="14" fill="#1f2328">infrastructure</text>
  <rect x="783" y="644" width="16" height="16" rx="4" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="807" y="657" font-size="14" fill="#1f2328">plateforme</text>
