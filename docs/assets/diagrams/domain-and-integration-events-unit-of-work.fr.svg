<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Une commande, deux enregistrements : quand les événements du domaine d'une unité de travail sont traités</title>
  <desc id="desc">La chronologie d'une commande. Dans une transaction : le gestionnaire de commande enregistre les agrégats a et b, et leurs événements attendent dans une file ; une fois le gestionnaire terminé, les gestionnaires before-commit traitent la file dans l'ordre de consignation et voient les deux enregistrements, et le publisher ajoute la ligne d'outbox ; puis la transaction valide ensemble l'état, ce que les gestionnaires ont écrit et la ligne d'outbox. Après la validation, les gestionnaires after-commit traitent les mêmes événements dans le même ordre, au plus une fois, avant que la commande réponde. Plus tard, le relais lit la ligne d'outbox et la publie, au moins une fois.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="440" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Une commande, deux enregistrements : quand les événements du domaine sont traités</text>
  <!-- the transaction -->
  <rect x="24" y="60" width="516" height="244" rx="12" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="40" y="84" font-size="14" fill="#5f6b73">une transaction : validée ou annulée en entier</text>
  <rect x="36" y="104" width="144" height="180" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="108" y="134" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">gestionnaire</text>
  <line x1="48" y1="146" x2="168" y2="146" stroke="#2b5d8a" stroke-opacity="0.35"/>
  <text x="108" y="170" font-size="13" fill="#1f2328" text-anchor="middle">de la commande</text>
  <text x="108" y="190" font-size="13" fill="#1f2328" text-anchor="middle">save(a)</text>
  <text x="108" y="210" font-size="13" fill="#1f2328" text-anchor="middle">save(b)</text>
  <text x="108" y="230" font-size="13" fill="#1f2328" text-anchor="middle">leurs événements</text>
  <text x="108" y="250" font-size="13" fill="#1f2328" text-anchor="middle">attendent en file</text>
  <rect x="208" y="104" width="144" height="180" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="280" y="134" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">before-commit</text>
  <line x1="220" y1="146" x2="340" y2="146" stroke="#2b5d8a" stroke-opacity="0.35"/>
  <text x="280" y="166" font-size="13" fill="#1f2328" text-anchor="middle">les gestionnaires</text>
  <text x="280" y="184" font-size="13" fill="#1f2328" text-anchor="middle">traitent la file</text>
  <text x="280" y="202" font-size="13" fill="#1f2328" text-anchor="middle">dans l'ordre</text>
  <text x="280" y="220" font-size="13" fill="#1f2328" text-anchor="middle">de consignation,</text>
  <text x="280" y="238" font-size="13" fill="#1f2328" text-anchor="middle">voient a et b ;</text>
  <text x="280" y="256" font-size="13" fill="#1f2328" text-anchor="middle">le publisher écrit</text>
  <text x="280" y="274" font-size="13" fill="#1f2328" text-anchor="middle">la ligne d'outbox</text>
  <rect x="380" y="104" width="144" height="180" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="452" y="134" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">validation</text>
  <line x1="392" y1="146" x2="512" y2="146" stroke="#7a4f9a" stroke-opacity="0.35"/>
  <text x="452" y="170" font-size="13" fill="#1f2328" text-anchor="middle">l'état, ce que les</text>
  <text x="452" y="190" font-size="13" fill="#1f2328" text-anchor="middle">gestionnaires</text>
  <text x="452" y="210" font-size="13" fill="#1f2328" text-anchor="middle">ont écrit et la</text>
  <text x="452" y="230" font-size="13" fill="#1f2328" text-anchor="middle">ligne d'outbox,</text>
  <text x="452" y="250" font-size="13" fill="#1f2328" text-anchor="middle">ensemble</text>
  <rect x="580" y="104" width="144" height="180" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="652" y="134" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">after-commit</text>
  <line x1="592" y1="146" x2="712" y2="146" stroke="#2b5d8a" stroke-opacity="0.35"/>
  <text x="652" y="170" font-size="13" fill="#1f2328" text-anchor="middle">les gestionnaires</text>
  <text x="652" y="190" font-size="13" fill="#1f2328" text-anchor="middle">traitent les mêmes</text>
  <text x="652" y="210" font-size="13" fill="#1f2328" text-anchor="middle">événements, dans</text>
  <text x="652" y="230" font-size="13" fill="#1f2328" text-anchor="middle">le même ordre,</text>
  <text x="652" y="250" font-size="13" fill="#1f2328" text-anchor="middle">au plus une fois</text>
  <rect x="792" y="104" width="144" height="180" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="864" y="134" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">relais</text>
  <line x1="804" y1="146" x2="924" y2="146" stroke="#5f6b73" stroke-opacity="0.35"/>
  <text x="864" y="170" font-size="13" fill="#1f2328" text-anchor="middle">lit la ligne</text>
  <text x="864" y="190" font-size="13" fill="#1f2328" text-anchor="middle">d'outbox, la publie,</text>
  <text x="864" y="210" font-size="13" fill="#1f2328" text-anchor="middle">au moins une fois</text>
  <!-- one step after the other -->
  <line x1="182" y1="194" x2="206" y2="194" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="354" y1="194" x2="378" y2="194" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="526" y1="194" x2="578" y2="194" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="726" y1="194" x2="790" y2="194" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="758" y="182" font-size="13" fill="#1f2328" text-anchor="middle">plus tard</text>
  <!-- time axis -->
  <line x1="24" y1="330" x2="934" y2="330" stroke="#3d4449" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="934" y="352" font-size="13" fill="#5f6b73" text-anchor="end">temps</text>
  <line x1="195" y1="322" x2="195" y2="338" stroke="#3d4449" stroke-width="2"/>
  <text x="195" y="356" font-size="13" fill="#1f2328" text-anchor="middle">le gestionnaire rend la main</text>
  <line x1="552" y1="322" x2="552" y2="338" stroke="#3d4449" stroke-width="2"/>
  <text x="552" y="356" font-size="13" fill="#1f2328" text-anchor="middle">la transaction se termine</text>
  <line x1="758" y1="322" x2="758" y2="338" stroke="#3d4449" stroke-width="2"/>
  <text x="758" y="356" font-size="13" fill="#1f2328" text-anchor="middle">la commande répond</text>
  <!-- legend -->
  <line x1="40" y1="396" x2="84" y2="396" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="96" y="401" font-size="14" fill="#1f2328">ensuite, attendu par la commande</text>
  <line x1="40" y1="420" x2="84" y2="420" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="96" y="425" font-size="14" fill="#1f2328">plus tard, hors de la commande, de façon asynchrone</text>
</svg>
