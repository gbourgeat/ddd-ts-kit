<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Enregistrer un agrégat avec optimisticUpdate</title>
  <desc id="desc">optimisticUpdate lit la version à laquelle l'agrégat a été chargé et calcule la suivante. Un premier enregistrement insère avec insertIgnoringConflict, un enregistrement ultérieur exécute une mise à jour gardée par la version attendue. Une ligne écrite fait avancer la version de l'agrégat ; aucune ligne écrite lève ConcurrencyError et annule la transaction. À côté, pourquoi manager.save n'est pas utilisé : il lit, puis choisit seul entre insertion et mise à jour, si bien que deux enregistrements concurrents réussissent tous deux et que le second efface le premier.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="560" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Enregistrer un agrégat : optimisticUpdate et son instruction gardée</text>
  <!-- step 1 -->
  <rect x="130" y="60" width="380" height="74" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="320" y="86" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">optimisticUpdate(invoice, write)</text>
  <text x="320" y="108" font-size="13" fill="#1f2328" text-anchor="middle">expected = invoice.version, la version lue</text>
  <text x="320" y="126" font-size="13" fill="#1f2328" text-anchor="middle">next = expected + 1, la version à écrire</text>
  <line x1="320" y1="136" x2="320" y2="160" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- decision: first save? -->
  <polygon points="320,162 410,194 320,226 230,194" fill="#ffffff" stroke="#3d4449" stroke-width="2"/>
  <text x="320" y="199" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">expected = 0 ?</text>
  <path d="M230,194 H172 V256" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="130" y="184" font-size="13" fill="#1f2328" text-anchor="middle">oui : jamais enregistré</text>
  <path d="M410,194 H468 V256" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="456" y="184" font-size="13" fill="#1f2328" text-anchor="middle">non</text>
  <!-- the two statements -->
  <rect x="32" y="258" width="280" height="80" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="172" y="284" font-size="15" font-weight="700" fill="#7a4f9a" text-anchor="middle">insertIgnoringConflict()</text>
  <text x="172" y="306" font-size="13" fill="#1f2328" text-anchor="middle">INSERT ... ON CONFLICT DO NOTHING</text>
  <text x="172" y="325" font-size="13" fill="#1f2328" text-anchor="middle">un id déjà pris n'écrit aucune ligne</text>
  <rect x="328" y="258" width="280" height="80" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="468" y="284" font-size="15" font-weight="700" fill="#7a4f9a" text-anchor="middle">manager.update()</text>
  <text x="468" y="306" font-size="13" fill="#1f2328" text-anchor="middle">UPDATE ... SET version = next</text>
  <text x="468" y="325" font-size="13" fill="#1f2328" text-anchor="middle">WHERE id = ... AND version = expected</text>
  <path d="M172,340 V398 H226" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M468,340 V398 H414" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- decision: rows written -->
  <polygon points="320,366 412,398 320,430 228,398" fill="#ffffff" stroke="#3d4449" stroke-width="2"/>
  <text x="320" y="403" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">lignes écrites</text>
  <path d="M320,432 V448 H172 V466" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="236" y="442" font-size="13" fill="#1f2328" text-anchor="middle">1</text>
  <path d="M320,448 H468 V466" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="404" y="442" font-size="13" fill="#1f2328" text-anchor="middle">0</text>
  <!-- outcomes -->
  <rect x="32" y="468" width="280" height="68" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="172" y="494" font-size="15" font-weight="700" fill="#2b5d8a" text-anchor="middle">invoice.version = next</text>
  <text x="172" y="516" font-size="13" fill="#1f2328" text-anchor="middle">le même objet peut être réenregistré</text>
  <rect x="328" y="468" width="280" height="68" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="468" y="494" font-size="15" font-weight="700" fill="#2f6f4f" text-anchor="middle">ConcurrencyError</text>
  <text x="468" y="516" font-size="13" fill="#1f2328" text-anchor="middle">CONCURRENCY_CONFLICT, annulation</text>
  <!-- instead of -->
  <rect x="648" y="60" width="280" height="476" rx="12" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="668" y="88" font-size="16" font-weight="700" fill="#5f6b73">Plutôt que manager.save</text>
  <line x1="668" y1="100" x2="908" y2="100" stroke="#5f6b73" stroke-opacity="0.35"/>
  <text x="668" y="126" font-size="13" fill="#1f2328">manager.save(invoices, row) lit la</text>
  <text x="668" y="146" font-size="13" fill="#1f2328">ligne, puis choisit seul insertion ou</text>
  <text x="668" y="166" font-size="13" fill="#1f2328">mise à jour, sans garde de version :</text>
  <text x="668" y="198" font-size="13" fill="#1f2328">1. A et B lisent inv-1 en version 3</text>
  <text x="668" y="220" font-size="13" fill="#1f2328">2. A enregistre : UPDATE ... WHERE id</text>
  <text x="668" y="242" font-size="13" fill="#1f2328">3. B enregistre : UPDATE ... WHERE id</text>
  <text x="668" y="264" font-size="13" fill="#1f2328">4. les deux réussissent, B efface A</text>
  <text x="668" y="296" font-size="13" fill="#1f2328">Avec optimisticUpdate, la mise à jour</text>
  <text x="668" y="316" font-size="13" fill="#1f2328">de B ne trouve aucune ligne en</text>
  <text x="668" y="336" font-size="13" fill="#1f2328">version 3 : B reçoit ConcurrencyError,</text>
  <text x="668" y="356" font-size="13" fill="#1f2328">l'écriture de A demeure.</text>
  <text x="668" y="394" font-size="14" font-weight="600" fill="#5f6b73">Ni @VersionColumn</text>
  <text x="668" y="418" font-size="13" fill="#1f2328">La version appartient à l'agrégat :</text>
  <text x="668" y="438" font-size="13" fill="#1f2328">le mapper la pose au chargement,</text>
  <text x="668" y="458" font-size="13" fill="#1f2328">optimisticUpdate la fait avancer quand</text>
  <text x="668" y="478" font-size="13" fill="#1f2328">l'instruction gardée a écrit sa ligne.</text>
</svg>
