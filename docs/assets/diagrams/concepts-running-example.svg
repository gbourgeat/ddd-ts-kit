<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">The running example: an appointment scheduling application</title>
  <desc id="desc">Five bounded contexts and two external systems, upstream to downstream. calendars publishes its language to appointments and availability. appointments, the core context, publishes to availability and notifications, and analytics conforms to it. The email and SMS provider, external, is upstream of notifications, which protects its model behind an anticorruption layer. The identity provider, generic and bought, issues the OpenID Connect tokens of every context, which the platform maps once. Solid arrows run from upstream to downstream; dashed arrows come from an external system.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="560" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">The running example: an appointment scheduling application</text>
  <rect x="24" y="226" width="172" height="76" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="2"/>
  <text x="110" y="259" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">calendars</text>
  <text x="110" y="285" font-size="13" fill="#1f2328" text-anchor="middle">supporting</text>
  <rect x="274" y="226" width="182" height="76" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="3"/>
  <text x="365" y="259" font-size="16" font-weight="700" fill="#2f6f4f" text-anchor="middle">appointments</text>
  <text x="365" y="285" font-size="13" fill="#1f2328" text-anchor="middle">core</text>
  <rect x="534" y="96" width="182" height="76" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="2"/>
  <text x="625" y="129" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">availability</text>
  <text x="625" y="155" font-size="13" fill="#1f2328" text-anchor="middle">supporting</text>
  <rect x="534" y="226" width="182" height="76" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="2"/>
  <text x="625" y="259" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">notifications</text>
  <text x="625" y="285" font-size="13" fill="#1f2328" text-anchor="middle">supporting</text>
  <rect x="534" y="356" width="182" height="76" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="2"/>
  <text x="625" y="389" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">analytics</text>
  <text x="625" y="415" font-size="13" fill="#1f2328" text-anchor="middle">supporting</text>
  <rect x="784" y="226" width="152" height="76" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="860" y="259" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">Email, SMS</text>
  <text x="860" y="285" font-size="13" fill="#1f2328" text-anchor="middle">provider, external</text>
  <rect x="264" y="356" width="202" height="76" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="365" y="389" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">Identity provider</text>
  <text x="365" y="415" font-size="13" fill="#1f2328" text-anchor="middle">generic, external</text>
  <line x1="198" y1="264" x2="272" y2="264" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="235" y="256" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="600">PL</text>
  <path d="M110,224 V120 H532" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="112" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="600">PL</text>
  <path d="M365,224 V150 H532" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="450" y="142" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="600">PL</text>
  <line x1="458" y1="256" x2="532" y2="256" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="495" y="248" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="600">PL</text>
  <path d="M458,286 H494 V394 H532" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="486" y="352" font-size="13" fill="#1f2328" text-anchor="end" font-weight="600">CF</text>
  <line x1="782" y1="264" x2="718" y2="264" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="750" y="256" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="600">ACL</text>
  <line x1="365" y1="354" x2="365" y2="304" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="355" y="334" font-size="13" fill="#1f2328" text-anchor="end" font-weight="600">OIDC, every context</text>
  <rect x="32" y="466" width="22" height="16" rx="4" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="64" y="479" font-size="14" fill="#1f2328" text-anchor="start">core context</text>
  <rect x="232" y="466" width="22" height="16" rx="4" fill="#ffffff" stroke="#5f6b73" stroke-width="2"/>
  <text x="264" y="479" font-size="14" fill="#1f2328" text-anchor="start">supporting context</text>
  <rect x="452" y="466" width="22" height="16" rx="4" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="484" y="479" font-size="14" fill="#1f2328" text-anchor="start">external system</text>
  <line x1="672" y1="474" x2="716" y2="474" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="728" y="479" font-size="14" fill="#1f2328" text-anchor="start">upstream to downstream</text>
  <line x1="32" y1="506" x2="76" y2="506" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="88" y="511" font-size="14" fill="#1f2328" text-anchor="start">from an external system</text>
  <text x="32" y="540" font-size="14" fill="#1f2328" text-anchor="start">PL published language, CF conformist, ACL anticorruption layer, OIDC OpenID Connect tokens</text>
</svg>
