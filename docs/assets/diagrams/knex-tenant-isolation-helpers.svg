<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">The four tenant isolation strategies, and the helpers of each</title>
  <desc id="desc">Four cards, from the most shared to the most separated. Shared tables: one table and a tenant_id column; tenantColumn in the migration, tenantTable for reads, ownTenantTable for updates and deletes, tenantRow for inserts, whereTenant for a builder of your own. Row-level security: the same tables plus PostgreSQL policies; enableTenantIsolation or tenantIsolationStatements in the migration, tenantSession as the begin of the unit of work, and an application role that is not a superuser and has no BYPASSRLS. Schema per tenant: one schema per tenant named schema__tenant; tenantSchemaOf names it, tenantSchemaTable reaches the table, tenantOfMigration and migrateTenantSchema run the tenant migrations, tenantSearchPath is a begin. Database per tenant: one knex and one bounded pool per tenant; TenantDatabases leases them under maxTenants, createTenantRoutedUnitOfWork is the unit of work, migrateEveryTenant migrates them all. From left to right, sharing decreases while separation and the cost per tenant grow. Each strategy passes tenantIsolationContract of @ddd-ts-kit/testing/contracts.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="520" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Tenant isolation: four strategies, the helpers of each</text>

  <!-- card 1: shared tables -->
  <rect x="22" y="60" width="220" height="352" rx="12" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="132" y="88" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">Shared tables</text>
  <text x="132" y="108" font-size="13" fill="#1f2328" text-anchor="middle">one table, a tenant_id column</text>
  <line x1="38" y1="122" x2="226" y2="122" stroke="#7a4f9a" stroke-opacity="0.35"/>
  <text x="38" y="146" font-size="13" font-weight="600" fill="#5f6b73">migration</text>
  <text x="38" y="165" font-size="13" fill="#1f2328">tenantColumn(table)</text>
  <text x="38" y="193" font-size="13" font-weight="600" fill="#5f6b73">reads</text>
  <text x="38" y="212" font-size="13" fill="#1f2328">tenantTable(...)</text>
  <text x="38" y="240" font-size="13" font-weight="600" fill="#5f6b73">updates, deletes</text>
  <text x="38" y="259" font-size="13" fill="#1f2328">ownTenantTable(...)</text>
  <text x="38" y="287" font-size="13" font-weight="600" fill="#5f6b73">inserts</text>
  <text x="38" y="306" font-size="13" fill="#1f2328">tenantRow(tenantScopeOf(...))</text>
  <text x="38" y="334" font-size="13" font-weight="600" fill="#5f6b73">a builder of your own</text>
  <text x="38" y="353" font-size="13" fill="#1f2328">whereTenant(builder, scope)</text>
  <text x="132" y="392" font-size="13" font-style="italic" fill="#7a4f9a" text-anchor="middle">the kit writes the condition</text>

  <!-- card 2: row-level security -->
  <rect x="254" y="60" width="220" height="352" rx="12" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="364" y="88" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">Row-level security</text>
  <text x="364" y="108" font-size="13" fill="#1f2328" text-anchor="middle">shared tables, plus policies</text>
  <line x1="270" y1="122" x2="458" y2="122" stroke="#7a4f9a" stroke-opacity="0.35"/>
  <text x="270" y="146" font-size="13" font-weight="600" fill="#5f6b73">migration</text>
  <text x="270" y="165" font-size="13" fill="#1f2328">enableTenantIsolation(...)</text>
  <text x="270" y="193" font-size="13" font-weight="600" fill="#5f6b73">migration written by hand</text>
  <text x="270" y="212" font-size="13" fill="#1f2328">tenantIsolationStatements</text>
  <text x="270" y="240" font-size="13" font-weight="600" fill="#5f6b73">begin of the unit of work</text>
  <text x="270" y="259" font-size="13" fill="#1f2328">tenantSession(scope)</text>
  <text x="270" y="287" font-size="13" font-weight="600" fill="#5f6b73">role of the application</text>
  <text x="270" y="306" font-size="13" fill="#1f2328">no superuser, no BYPASSRLS</text>
  <text x="270" y="334" font-size="13" font-weight="600" fill="#5f6b73">every statement</text>
  <text x="270" y="353" font-size="13" fill="#1f2328">inside the unit of work</text>
  <text x="364" y="392" font-size="13" font-style="italic" fill="#7a4f9a" text-anchor="middle">the database refuses the row</text>

  <!-- card 3: schema per tenant -->
  <rect x="486" y="60" width="220" height="352" rx="12" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="596" y="88" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">Schema per tenant</text>
  <text x="596" y="108" font-size="13" fill="#1f2328" text-anchor="middle">billing__acme, billing__globex</text>
  <line x1="502" y1="122" x2="690" y2="122" stroke="#7a4f9a" stroke-opacity="0.35"/>
  <text x="502" y="146" font-size="13" font-weight="600" fill="#5f6b73">name of the schema</text>
  <text x="502" y="165" font-size="13" fill="#1f2328">tenantSchemaOf(schema, id)</text>
  <text x="502" y="193" font-size="13" font-weight="600" fill="#5f6b73">queries</text>
  <text x="502" y="212" font-size="13" fill="#1f2328">tenantSchemaTable(...)</text>
  <text x="502" y="240" font-size="13" font-weight="600" fill="#5f6b73">tenant migrations</text>
  <text x="502" y="259" font-size="13" fill="#1f2328">tenantOfMigration(knex)</text>
  <text x="502" y="287" font-size="13" font-weight="600" fill="#5f6b73">migrate one tenant</text>
  <text x="502" y="306" font-size="13" fill="#1f2328">migrateTenantSchema(...)</text>
  <text x="502" y="334" font-size="13" font-weight="600" fill="#5f6b73">begin: SQL without a schema</text>
  <text x="502" y="353" font-size="13" fill="#1f2328">tenantSearchPath(scope, [...])</text>
  <text x="596" y="392" font-size="13" font-style="italic" fill="#7a4f9a" text-anchor="middle">one copy of the tables each</text>

  <!-- card 4: database per tenant -->
  <rect x="718" y="60" width="220" height="352" rx="12" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="828" y="88" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">Database per tenant</text>
  <text x="828" y="108" font-size="13" fill="#1f2328" text-anchor="middle">one knex, one pool per tenant</text>
  <line x1="734" y1="122" x2="922" y2="122" stroke="#7a4f9a" stroke-opacity="0.35"/>
  <text x="734" y="146" font-size="13" font-weight="600" fill="#5f6b73">connections, bounded</text>
  <text x="734" y="165" font-size="13" fill="#1f2328">TenantDatabases</text>
  <text x="734" y="184" font-size="13" fill="#1f2328">lease(...), maxTenants</text>
  <text x="734" y="212" font-size="13" font-weight="600" fill="#5f6b73">unit of work, KnexContext</text>
  <text x="734" y="231" font-size="13" fill="#1f2328">createTenantRouted-</text>
  <text x="734" y="250" font-size="13" fill="#1f2328">UnitOfWork(databases, scope)</text>
  <text x="734" y="278" font-size="13" font-weight="600" fill="#5f6b73">migrate every tenant</text>
  <text x="734" y="297" font-size="13" fill="#1f2328">migrateEveryTenant(...)</text>
  <text x="734" y="325" font-size="13" font-weight="600" fill="#5f6b73">another tenant's work</text>
  <text x="734" y="344" font-size="13" fill="#1f2328">never joins the transaction</text>
  <text x="828" y="392" font-size="13" font-style="italic" fill="#7a4f9a" text-anchor="middle">one database each</text>

  <!-- the axis -->
  <line x1="40" y1="444" x2="918" y2="444" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="480" y="468" font-size="14" fill="#1f2328" text-anchor="middle">sharing decreases; separation and cost per tenant grow</text>
  <text x="480" y="496" font-size="13" fill="#5f6b73" text-anchor="middle">Each strategy passes tenantIsolationContract of @ddd-ts-kit/testing/contracts.</text>
</svg>
