<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Pourquoi le bus retente sur place, et non par un topic de nouvelles tentatives</title>
  <desc id="desc">Deux enregistrements de la commande 1 sur la partition P0 : placée, puis payée. Avec un topic de nouvelles tentatives, l'enregistrement placée en échec est mis de côté, payée est traitée, et placée l'est plus tard : payée avant placée, l'ordre de la clé est perdu. Avec la nouvelle tentative sur place de ce bus, la partition P0 est mise en pause pendant retry.delayMs tandis que les autres partitions continuent, placée est relue et traitée, puis payée est traitée après elle. Après retry.maxAttempts livraisons en échec, l'enregistrement part dans le topic de rejet et la partition avance.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="560" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Pourquoi le bus retente sur place, et non par un topic de nouvelles tentatives</text>

  <!-- panel A: retry topic -->
  <rect x="24" y="58" width="912" height="190" rx="12" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="44" y="84" font-size="14" font-weight="600" fill="#5f6b73">Avec un topic de nouvelles tentatives (pas ce bus) : la partition avance dès le premier échec</text>

  <rect x="44" y="100" width="190" height="94" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="139" y="126" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">placée, commande 1</text>
  <text x="139" y="148" font-size="13" fill="#1f2328" text-anchor="middle">échoue : déplacée</text>
  <text x="139" y="166" font-size="13" fill="#1f2328" text-anchor="middle">dans le topic de</text>
  <text x="139" y="184" font-size="13" fill="#1f2328" text-anchor="middle">nouvelles tentatives</text>

  <rect x="274" y="100" width="190" height="94" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="369" y="126" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">payée, commande 1</text>
  <text x="369" y="148" font-size="13" fill="#1f2328" text-anchor="middle">traitée aussitôt</text>

  <rect x="504" y="100" width="190" height="94" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="599" y="126" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">placée, commande 1</text>
  <text x="599" y="148" font-size="13" fill="#1f2328" text-anchor="middle">traitée plus tard,</text>
  <text x="599" y="166" font-size="13" fill="#1f2328" text-anchor="middle">depuis le topic de</text>
  <text x="599" y="184" font-size="13" fill="#1f2328" text-anchor="middle">nouvelles tentatives</text>

  <rect x="734" y="100" width="182" height="94" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="2"/>
  <text x="825" y="126" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">ordre perdu</text>
  <text x="825" y="148" font-size="13" fill="#1f2328" text-anchor="middle">payée a été appliquée</text>
  <text x="825" y="166" font-size="13" fill="#1f2328" text-anchor="middle">avant placée</text>

  <line x1="236" y1="142" x2="272" y2="142" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="466" y1="142" x2="502" y2="142" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="696" y1="142" x2="732" y2="142" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="44" y1="216" x2="900" y2="216" stroke="#5f6b73" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="908" y="236" font-size="13" fill="#5f6b73" text-anchor="end">temps</text>

  <!-- panel B: retry in place -->
  <rect x="24" y="268" width="912" height="190" rx="12" fill="#f1ebf5" fill-opacity="0.35" stroke="#7a4f9a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="44" y="294" font-size="14" font-weight="600" fill="#7a4f9a">Nouvelle tentative sur place (ce bus) : la partition de l'enregistrement l'attend</text>

  <rect x="44" y="310" width="190" height="94" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="139" y="336" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">placée, commande 1</text>
  <text x="139" y="358" font-size="13" fill="#1f2328" text-anchor="middle">la tentative 1 échoue :</text>
  <text x="139" y="376" font-size="13" fill="#1f2328" text-anchor="middle">rien n'est validé</text>

  <rect x="274" y="310" width="190" height="94" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="2"/>
  <text x="369" y="336" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">P0 en pause</text>
  <text x="369" y="358" font-size="13" fill="#1f2328" text-anchor="middle">pendant retry.delayMs ;</text>
  <text x="369" y="376" font-size="13" fill="#1f2328" text-anchor="middle">P1 et P2 continuent</text>

  <rect x="504" y="310" width="190" height="94" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="599" y="336" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">placée, commande 1</text>
  <text x="599" y="358" font-size="13" fill="#1f2328" text-anchor="middle">relue, tentative 2 :</text>
  <text x="599" y="376" font-size="13" fill="#1f2328" text-anchor="middle">traitée, offset validé</text>

  <rect x="734" y="310" width="182" height="94" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="825" y="336" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">payée, commande 1</text>
  <text x="825" y="358" font-size="13" fill="#1f2328" text-anchor="middle">traitée après elle :</text>
  <text x="825" y="376" font-size="13" fill="#1f2328" text-anchor="middle">l'ordre est tenu</text>

  <line x1="236" y1="352" x2="272" y2="352" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="466" y1="352" x2="502" y2="352" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="696" y1="352" x2="732" y2="352" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="44" y1="426" x2="900" y2="426" stroke="#5f6b73" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="908" y="446" font-size="13" fill="#5f6b73" text-anchor="end">temps</text>

  <!-- the bound -->
  <text x="32" y="490" font-size="14" fill="#1f2328">Si chaque tentative échoue : à la retry.maxAttempts-ième livraison en échec, l'enregistrement est copié dans le</text>
  <text x="32" y="512" font-size="14" fill="#1f2328">topic de rejet, son offset est validé et la partition avance. L'attente est bornée : (maxAttempts - 1) x delayMs plus</text>
  <text x="32" y="534" font-size="14" fill="#1f2328">le temps des gestionnaires, soit 20 s avec les valeurs par défaut (5 tentatives, 5 s).</text>
</svg>
