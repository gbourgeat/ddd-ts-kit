<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 316" width="960" height="316" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Un mot, deux sens, deux contextes délimités</title>
  <desc id="desc">Dans availability, un Slot est un intervalle qu'un praticien peut encore proposer et que personne n'a encore réservé. Dans appointments, un Slot est l'intervalle qu'occupe un rendez-vous. Chaque glossaire dit avec quoi le mot ne doit pas être confondu.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="316" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Un mot, deux sens, deux contextes délimités</text>
  <rect x="32" y="60" width="434" height="214" rx="12" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="52" y="88" font-size="14" font-weight="600" fill="#5f6b73">contexte délimité : availability</text>
  <rect x="52" y="104" width="394" height="152" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="72" y="132" font-size="16" font-weight="700" fill="#2f6f4f">Slot</text>
  <line x1="66" y1="142" x2="432" y2="142" stroke="#2f6f4f" stroke-opacity="0.35"/>
  <text x="72" y="164" font-size="13" fill="#1f2328">Un intervalle qu'un praticien peut encore</text>
  <text x="72" y="184" font-size="13" fill="#1f2328">proposer. Personne ne l'a encore réservé.</text>
  <text x="72" y="216" font-size="13" font-weight="600" fill="#2f6f4f">À ne pas confondre avec</text>
  <text x="72" y="236" font-size="13" fill="#1f2328">le Slot d'un rendez-vous, qui est réservé.</text>
  <rect x="494" y="60" width="434" height="214" rx="12" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="514" y="88" font-size="14" font-weight="600" fill="#5f6b73">contexte délimité : appointments</text>
  <rect x="514" y="104" width="394" height="152" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="534" y="132" font-size="16" font-weight="700" fill="#2f6f4f">Slot</text>
  <line x1="528" y1="142" x2="894" y2="142" stroke="#2f6f4f" stroke-opacity="0.35"/>
  <text x="534" y="164" font-size="13" fill="#1f2328">L'intervalle, début et fin, qu'occupe</text>
  <text x="534" y="184" font-size="13" fill="#1f2328">un rendez-vous.</text>
  <text x="534" y="216" font-size="13" font-weight="600" fill="#2f6f4f">À ne pas confondre avec</text>
  <text x="534" y="236" font-size="13" fill="#1f2328">un Slot libre de availability.</text>
  <text x="480" y="302" font-size="14" font-style="italic" fill="#1f2328" text-anchor="middle">Les deux définitions sont justes, chacune dans sa frontière : pas de définition de compromis.</text>
</svg>
