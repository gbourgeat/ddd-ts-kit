<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Ce que fait getOrLoad sur un défaut de cache</title>
  <desc id="desc">getOrLoad lit l'entrée et la renvoie quand elle est là. Sur un défaut de cache, un calcul déjà en cours dans ce processus est partagé. Sinon, sans l'option lock de RedisCache, il exécute load et écrit la valeur avec sa durée de vie. Avec l'option lock, il prend le verrou en attendant au plus waitMs, et relit l'entrée : si un autre processus l'a remplie entre-temps, il la renvoie. Sinon, il exécute load, écrit la valeur avec sa durée de vie et libère le verrou. Il n'échoue jamais à cause du verrou ou du serveur.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="560" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">getOrLoad sur un défaut : un calcul par processus, ou entre processus avec un verrou</text>
  <!-- column of steps -->
  <rect x="160" y="60" width="400" height="48" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="360" y="90" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">cache.getOrLoad(key, load, { ttlMs })</text>
  <rect x="160" y="136" width="400" height="48" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="2"/>
  <text x="360" y="166" font-size="14" fill="#1f2328" text-anchor="middle">l'entrée est-elle dans le cache ?</text>
  <rect x="160" y="212" width="400" height="48" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="2"/>
  <text x="360" y="242" font-size="14" fill="#1f2328" text-anchor="middle">ce processus la calcule-t-il déjà ?</text>
  <rect x="160" y="288" width="400" height="48" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="360" y="308" font-size="14" fill="#1f2328" text-anchor="middle">prendre le verrou, attendre au plus waitMs (2 s)</text>
  <text x="360" y="327" font-size="13" fill="#5f6b73" text-anchor="middle">seulement avec l'option lock de RedisCache</text>
  <rect x="160" y="364" width="400" height="48" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="2"/>
  <text x="360" y="384" font-size="14" fill="#1f2328" text-anchor="middle">l'entrée est-elle dans le cache, maintenant ?</text>
  <text x="360" y="403" font-size="13" fill="#5f6b73" text-anchor="middle">seulement avec l'option lock</text>
  <rect x="160" y="440" width="400" height="48" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="360" y="470" font-size="14" fill="#1f2328" text-anchor="middle">load(), l'écrire avec ttlMs, libérer le verrou éventuel</text>
  <!-- down arrows -->
  <line x1="360" y1="110" x2="360" y2="132" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="360" y1="186" x2="360" y2="208" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="372" y="202" font-size="13" fill="#1f2328">non</text>
  <line x1="360" y1="262" x2="360" y2="284" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="372" y="278" font-size="13" fill="#1f2328">non</text>
  <line x1="360" y1="338" x2="360" y2="360" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="372" y="354" font-size="13" fill="#1f2328">pris, ou non après waitMs</text>
  <line x1="360" y1="414" x2="360" y2="436" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="372" y="430" font-size="13" fill="#1f2328">non</text>
  <!-- sans l'option lock -->
  <path d="M158,248 H128 V464 H156" fill="none" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="120" y="350" font-size="13" fill="#1f2328" text-anchor="end">non, sans</text>
  <text x="120" y="368" font-size="13" fill="#1f2328" text-anchor="end">l'option lock</text>
  <!-- outcomes -->
  <rect x="640" y="136" width="288" height="48" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="784" y="166" font-size="14" fill="#1f2328" text-anchor="middle">renvoyer l'entrée</text>
  <rect x="640" y="212" width="288" height="48" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="784" y="242" font-size="14" fill="#1f2328" text-anchor="middle">partager ce calcul</text>
  <rect x="640" y="364" width="288" height="48" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="784" y="386" font-size="14" fill="#1f2328" text-anchor="middle">la renvoyer : un autre processus</text>
  <text x="784" y="404" font-size="14" fill="#1f2328" text-anchor="middle">l'a calculée entre-temps</text>
  <line x1="562" y1="160" x2="636" y2="160" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="598" y="152" font-size="13" fill="#1f2328" text-anchor="middle">oui</text>
  <line x1="562" y1="236" x2="636" y2="236" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="598" y="228" font-size="13" fill="#1f2328" text-anchor="middle">oui</text>
  <line x1="562" y1="388" x2="636" y2="388" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="598" y="380" font-size="13" fill="#1f2328" text-anchor="middle">oui</text>
  <!-- note -->
  <text x="32" y="520" font-size="14" fill="#1f2328">Un verrou ou un serveur en panne est ignoré : au pire, le calcul se fait sans protection.</text>
  <text x="32" y="542" font-size="14" fill="#1f2328">Un load en échec n'est pas mis en cache.</text>
</svg>
