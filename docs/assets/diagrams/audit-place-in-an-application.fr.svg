<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Les pièces de @ddd-ts-kit/audit dans une application</title>
  <desc id="desc">Cinq sources écrivent sur le port AuditTrail du noyau : auditGuardRefusals sur le hook onGuardRefusal du pipeline HTTP, auditDecisions sur le hook onDecision du middleware d'autorisation, auditMiddleware sur les bus de commandes et de requêtes, auditIntegrationEvents abonné aux événements d'intégration, et auditRecordOf pour la rare entrée écrite à la main dans l'infrastructure. Un store implémente le port : InMemoryAuditTrail, KnexAuditTrail ou DrizzleAuditTrail. Il scelle chaque enregistrement avec sa chaîne, sa séquence, le hachage de l'entrée précédente et son propre hachage, et les stores SQL l'écrivent dans les tables audit_entries et audit_chains de PostgreSQL, gardées par des triggers d'ajout seul. Le même store implémente le port AuditReader, que lisent le gestionnaire de SearchAuditEntriesQuery et verifyChain. Avec sealing, le store remet un point de contrôle toutes les N entrées à un endroit où l'application ne peut pas écrire. Chaque source lit l'acteur, le tenant, la session et la corrélation dans le contexte d'exécution du travail, jamais dans un cas d'usage.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
    <marker id="arrow-infrastructure" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a4f9a"/>
    </marker>
  </defs>
  <rect width="960" height="640" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Les pièces de @ddd-ts-kit/audit dans une application</text>
  <text x="24" y="76" font-size="14" font-weight="600" fill="#5f6b73">écritures : les sources</text>

  <!-- sources -->
  <rect x="24" y="90" width="244" height="56" rx="10" fill="#f6ede6" stroke="#9a5b2b" stroke-width="2"/>
  <text x="40" y="113" font-size="15" font-weight="700" fill="#9a5b2b">auditGuardRefusals</text>
  <text x="40" y="133" font-size="13" fill="#1f2328">pipeline HTTP : onGuardRefusal</text>
  <rect x="24" y="158" width="244" height="56" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="40" y="181" font-size="15" font-weight="700" fill="#2b5d8a">auditDecisions</text>
  <text x="40" y="201" font-size="13" fill="#1f2328">autorisation : onDecision</text>
  <rect x="24" y="226" width="244" height="56" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="40" y="249" font-size="15" font-weight="700" fill="#2b5d8a">auditMiddleware</text>
  <text x="40" y="269" font-size="13" fill="#1f2328">bus de commandes et de requêtes</text>
  <rect x="24" y="294" width="244" height="56" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="40" y="317" font-size="15" font-weight="700" fill="#2b5d8a">auditIntegrationEvents</text>
  <text x="40" y="337" font-size="13" fill="#1f2328">bus d'événements : subscribeAll</text>
  <rect x="24" y="362" width="244" height="56" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="40" y="385" font-size="15" font-weight="700" fill="#7a4f9a">auditRecordOf</text>
  <text x="40" y="405" font-size="13" fill="#1f2328">à la main, en infrastructure</text>
  <!-- spine to AuditTrail -->
  <line x1="270" y1="118" x2="290" y2="118" stroke="#3d4449" stroke-width="2"/>
  <line x1="270" y1="186" x2="290" y2="186" stroke="#3d4449" stroke-width="2"/>
  <line x1="270" y1="254" x2="290" y2="254" stroke="#3d4449" stroke-width="2"/>
  <line x1="270" y1="322" x2="290" y2="322" stroke="#3d4449" stroke-width="2"/>
  <line x1="270" y1="390" x2="290" y2="390" stroke="#3d4449" stroke-width="2"/>
  <line x1="290" y1="118" x2="290" y2="390" stroke="#3d4449" stroke-width="2"/>
  <line x1="290" y1="254" x2="318" y2="254" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- AuditTrail port -->
  <rect x="320" y="214" width="170" height="80" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="405" y="242" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">AuditTrail</text>
  <text x="405" y="262" font-size="13" fill="#1f2328" text-anchor="middle">port du noyau</text>
  <text x="405" y="281" font-size="13" fill="#1f2328" text-anchor="middle">record(record)</text>

  <!-- the store -->
  <rect x="534" y="166" width="196" height="176" rx="12" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="632" y="192" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">le store</text>
  <text x="632" y="214" font-size="13" fill="#1f2328" text-anchor="middle">InMemoryAuditTrail</text>
  <text x="632" y="233" font-size="13" fill="#1f2328" text-anchor="middle">KnexAuditTrail</text>
  <text x="632" y="252" font-size="13" fill="#1f2328" text-anchor="middle">DrizzleAuditTrail</text>
  <line x1="550" y1="266" x2="714" y2="266" stroke="#7a4f9a" stroke-opacity="0.35"/>
  <text x="632" y="288" font-size="13" font-weight="600" fill="#7a4f9a" text-anchor="middle">scelle chaque entrée :</text>
  <text x="632" y="307" font-size="13" fill="#1f2328" text-anchor="middle">chain, sequence,</text>
  <text x="632" y="326" font-size="13" fill="#1f2328" text-anchor="middle">previousHash, hash</text>
  <!-- store implements AuditTrail -->
  <line x1="532" y1="254" x2="494" y2="254" stroke="#7a4f9a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-infrastructure)"/>

  <!-- PostgreSQL -->
  <rect x="800" y="190" width="136" height="128" rx="12" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="868" y="216" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">PostgreSQL</text>
  <text x="868" y="240" font-size="13" fill="#1f2328" text-anchor="middle">audit_entries</text>
  <text x="868" y="259" font-size="13" fill="#1f2328" text-anchor="middle">audit_chains</text>
  <text x="868" y="284" font-size="13" fill="#1f2328" text-anchor="middle">triggers</text>
  <text x="868" y="303" font-size="13" fill="#1f2328" text-anchor="middle">d'ajout seul</text>
  <line x1="732" y1="254" x2="798" y2="254" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="765" y="228" font-size="13" fill="#1f2328" text-anchor="middle">Knex,</text>
  <text x="765" y="246" font-size="13" fill="#1f2328" text-anchor="middle">Drizzle</text>
  <text x="765" y="274" font-size="13" fill="#1f2328" text-anchor="middle">seuls</text>

  <!-- reads -->
  <line x1="24" y1="438" x2="936" y2="438" stroke="#5f6b73" stroke-opacity="0.35"/>
  <text x="24" y="464" font-size="14" font-weight="600" fill="#5f6b73">lectures</text>
  <rect x="24" y="476" width="244" height="52" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="40" y="498" font-size="15" font-weight="700" fill="#2b5d8a">SearchAuditEntriesHandler</text>
  <text x="40" y="518" font-size="13" fill="#1f2328">requête protégée et auditée</text>
  <rect x="24" y="540" width="244" height="52" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="40" y="562" font-size="15" font-weight="700" fill="#5f6b73">verifyChain</text>
  <text x="40" y="582" font-size="13" fill="#1f2328">nomme la première rupture</text>
  <line x1="270" y1="502" x2="290" y2="502" stroke="#3d4449" stroke-width="2"/>
  <line x1="270" y1="566" x2="290" y2="566" stroke="#3d4449" stroke-width="2"/>
  <line x1="290" y1="502" x2="290" y2="566" stroke="#3d4449" stroke-width="2"/>
  <line x1="290" y1="534" x2="318" y2="534" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- AuditReader port -->
  <rect x="320" y="498" width="170" height="72" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="405" y="526" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">AuditReader</text>
  <text x="405" y="548" font-size="13" fill="#1f2328" text-anchor="middle">search(filter, page)</text>
  <!-- store implements AuditReader -->
  <path d="M600,344 V534 H494" fill="none" stroke="#7a4f9a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-infrastructure)"/>
  <!-- sealing -->
  <rect x="770" y="470" width="166" height="96" rx="12" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="853" y="496" font-size="15" font-weight="700" fill="#5f6b73" text-anchor="middle">points de contrôle</text>
  <text x="853" y="518" font-size="13" fill="#1f2328" text-anchor="middle">gardés là où</text>
  <text x="853" y="537" font-size="13" fill="#1f2328" text-anchor="middle">l'application ne peut</text>
  <text x="853" y="556" font-size="13" fill="#1f2328" text-anchor="middle">pas écrire</text>
  <path d="M680,344 V518 H768" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="690" y="404" font-size="13" fill="#1f2328">sealing.onSeal</text>

  <!-- legend and note -->
  <line x1="24" y1="614" x2="64" y2="614" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="74" y="619" font-size="13" fill="#1f2328">appelle</text>
  <line x1="136" y1="614" x2="176" y2="614" stroke="#7a4f9a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-infrastructure)"/>
  <text x="186" y="619" font-size="13" fill="#1f2328">implémente</text>
  <text x="284" y="619" font-size="13" fill="#5f6b73">Chaque source lit qui a agi, le tenant et la corrélation dans le contexte d'exécution.</text>
</svg>
