<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">L'esquisse d'un fournisseur sur SQS et SNS</title>
  <desc id="desc">Le relais de l'outbox publie vers un seul topic SNS, par lots de dix, avec le type de l'événement comme attribut de message type. Chaque abonnement du topic porte une politique de filtre sur type et livre des messages bruts à une file SQS par consommateur et par type : billing-ordering_order_placed et notifications-ordering_order_placed. Chaque consommateur interroge sa file en long polling et supprime un message après la résolution de son gestionnaire. Un message en échec réapparaît après son délai de visibilité. Après maxReceiveCount réceptions, la politique de redrive de la file le déplace vers sa file de rejet.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="500" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">SQS et SNS : une esquisse, rien de construit</text>

  <!-- relay -->
  <rect x="24" y="196" width="150" height="108" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="99" y="222" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">relais</text>
  <text x="99" y="241" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">de l'outbox</text>
  <text x="99" y="264" font-size="13" fill="#1f2328" text-anchor="middle">PublishBatch,</text>
  <text x="99" y="284" font-size="13" fill="#1f2328" text-anchor="middle">dix entrées par appel</text>

  <!-- topic -->
  <rect x="214" y="196" width="180" height="108" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="304" y="224" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">topic SNS</text>
  <text x="304" y="248" font-size="13" fill="#1f2328" text-anchor="middle">chaque événement, avec</text>
  <text x="304" y="268" font-size="13" fill="#1f2328" text-anchor="middle">l'attribut type</text>
  <line x1="176" y1="250" x2="210" y2="250" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- subscriptions -->
  <path d="M396,226 C430,226 430,132 450,132" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M396,274 C430,274 430,352 450,352" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="304" y="334" font-size="13" fill="#1f2328" text-anchor="middle">chaque abonnement filtre</text>
  <text x="304" y="354" font-size="13" fill="#1f2328" text-anchor="middle">sur l'attribut type</text>

  <!-- billing -->
  <rect x="454" y="90" width="268" height="84" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="588" y="114" font-size="14" font-weight="700" fill="#5f6b73" text-anchor="middle">billing-ordering_order_placed</text>
  <text x="588" y="138" font-size="13" fill="#1f2328" text-anchor="middle">file SQS, livraison brute ; un message</text>
  <text x="588" y="158" font-size="13" fill="#1f2328" text-anchor="middle">en échec réapparaît après son délai</text>
  <rect x="454" y="200" width="268" height="54" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="588" y="222" font-size="13" font-weight="700" fill="#5f6b73" text-anchor="middle">file de rejet de billing</text>
  <text x="588" y="242" font-size="13" fill="#1f2328" text-anchor="middle">redrive après maxReceiveCount</text>
  <line x1="588" y1="176" x2="588" y2="196" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="764" y="90" width="172" height="84" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="850" y="114" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">billing</text>
  <text x="850" y="138" font-size="13" fill="#1f2328" text-anchor="middle">long polling ; suppression</text>
  <text x="850" y="158" font-size="13" fill="#1f2328" text-anchor="middle">après le gestionnaire</text>
  <line x1="724" y1="132" x2="760" y2="132" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- notifications -->
  <rect x="454" y="310" width="268" height="84" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="588" y="334" font-size="14" font-weight="700" fill="#5f6b73" text-anchor="middle">notifications-ordering_order_placed</text>
  <text x="588" y="358" font-size="13" fill="#1f2328" text-anchor="middle">file SQS, livraison brute ; un message</text>
  <text x="588" y="378" font-size="13" fill="#1f2328" text-anchor="middle">en échec réapparaît après son délai</text>
  <rect x="454" y="420" width="268" height="54" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="588" y="442" font-size="13" font-weight="700" fill="#5f6b73" text-anchor="middle">file de rejet de notifications</text>
  <text x="588" y="462" font-size="13" fill="#1f2328" text-anchor="middle">redrive après maxReceiveCount</text>
  <line x1="588" y1="396" x2="588" y2="416" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="764" y="310" width="172" height="84" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="850" y="334" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">notifications</text>
  <text x="850" y="358" font-size="13" fill="#1f2328" text-anchor="middle">long polling ; suppression</text>
  <text x="850" y="378" font-size="13" fill="#1f2328" text-anchor="middle">après le gestionnaire</text>
  <line x1="724" y1="352" x2="760" y2="352" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>

</svg>
