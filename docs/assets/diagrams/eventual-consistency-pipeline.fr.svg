<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">D'où vient la fenêtre, et ce qu'il faut mesurer</title>
  <desc id="desc">Le chemin d'un événement d'intégration. Le gestionnaire d'appointments enregistre l'agrégat et l'enregistrement d'outbox dans une transaction. Le relais publie les enregistrements en attente après la validation, à son intervalle ou sur un signal de réveil. Le broker met l'événement en file pour chaque consommateur. Le consommateur dans availability le traite dans sa propre transaction, de façon idempotente, et met à jour sa projection ; les échecs sont retentés, puis vont en file de rejet. Sous chaque étape : ce qui allonge la fenêtre et ce qu'il faut mesurer.</desc>
  <defs>
    <marker id="arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="470" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">D'où vient la fenêtre, et ce qu'il faut mesurer</text>
  <rect x="32" y="64" width="220" height="136" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="142" y="92" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">appointments</text>
  <line x1="46" y1="104" x2="238" y2="104" stroke="#2b5d8a" stroke-opacity="0.35"/>
  <text x="142" y="128" font-size="13" fill="#1f2328" text-anchor="middle">une transaction :</text>
  <text x="142" y="148" font-size="13" fill="#1f2328" text-anchor="middle">l'agrégat et</text>
  <text x="142" y="168" font-size="13" fill="#1f2328" text-anchor="middle">l'enregistrement d'outbox</text>
  <rect x="300" y="64" width="176" height="136" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="388" y="92" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">relais</text>
  <line x1="314" y1="104" x2="462" y2="104" stroke="#7a4f9a" stroke-opacity="0.35"/>
  <text x="388" y="128" font-size="13" fill="#1f2328" text-anchor="middle">publie après</text>
  <text x="388" y="148" font-size="13" fill="#1f2328" text-anchor="middle">la validation</text>
  <rect x="524" y="64" width="176" height="136" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="612" y="92" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">broker</text>
  <line x1="538" y1="104" x2="686" y2="104" stroke="#5f6b73" stroke-opacity="0.35"/>
  <text x="612" y="128" font-size="13" fill="#1f2328" text-anchor="middle">une file</text>
  <text x="612" y="148" font-size="13" fill="#1f2328" text-anchor="middle">par consommateur</text>
  <rect x="748" y="64" width="180" height="136" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="838" y="92" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">availability</text>
  <line x1="762" y1="104" x2="914" y2="104" stroke="#2b5d8a" stroke-opacity="0.35"/>
  <text x="838" y="128" font-size="13" fill="#1f2328" text-anchor="middle">sa propre transaction,</text>
  <text x="838" y="148" font-size="13" fill="#1f2328" text-anchor="middle">gestionnaire idempotent,</text>
  <text x="838" y="168" font-size="13" fill="#1f2328" text-anchor="middle">projection à jour</text>
  <line x1="254" y1="132" x2="296" y2="132" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-neutral)"/>
  <line x1="478" y1="132" x2="520" y2="132" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-neutral)"/>
  <line x1="702" y1="132" x2="744" y2="132" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-neutral)"/>
  <text x="32" y="236" font-size="14" font-weight="600" fill="#5f6b73">allonge la fenêtre</text>
  <line x1="32" y1="246" x2="928" y2="246" stroke="#5f6b73" stroke-opacity="0.35"/>
  <text x="32" y="352" font-size="14" font-weight="600" fill="#5f6b73">mesurer</text>
  <line x1="32" y1="362" x2="928" y2="362" stroke="#5f6b73" stroke-opacity="0.35"/>
  <text x="142.0" y="270" font-size="13" fill="#1f2328" text-anchor="middle">rien : le changement</text>
  <text x="142.0" y="290" font-size="13" fill="#1f2328" text-anchor="middle">et l'événement sont</text>
  <text x="142.0" y="310" font-size="13" fill="#1f2328" text-anchor="middle">validés ensemble</text>
  <text x="142.0" y="386" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">rien de particulier</text>
  <text x="388.0" y="270" font-size="13" fill="#1f2328" text-anchor="middle">son intervalle, ou</text>
  <text x="388.0" y="290" font-size="13" fill="#1f2328" text-anchor="middle">son signal de réveil</text>
  <text x="388.0" y="386" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">l'âge du plus ancien</text>
  <text x="388.0" y="406" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">enregistrement en attente</text>
  <text x="612.0" y="270" font-size="13" fill="#1f2328" text-anchor="middle">un consommateur</text>
  <text x="612.0" y="290" font-size="13" fill="#1f2328" text-anchor="middle">lent ou arrêté</text>
  <text x="612.0" y="386" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">profondeur ou retard</text>
  <text x="612.0" y="406" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">de chaque consommateur</text>
  <text x="838.0" y="270" font-size="13" fill="#1f2328" text-anchor="middle">nouvelles tentatives,</text>
  <text x="838.0" y="290" font-size="13" fill="#1f2328" text-anchor="middle">puis file de rejet</text>
  <text x="838.0" y="310" font-size="13" fill="#1f2328" text-anchor="middle">à traiter à la main</text>
  <text x="838.0" y="386" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">files de rejet :</text>
  <text x="838.0" y="406" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">toujours vides</text>
  <line x1="32" y1="448" x2="76" y2="448" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-neutral)"/>
  <text x="88" y="453" font-size="14" fill="#1f2328">un message asynchrone, après la validation (commit)</text>
</svg>
