<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Two TypeScript compilers side by side in a generated project</title>
  <desc id="desc">typescript 6 is loaded as a library by the tools that read sources through the compiler API: ESLint with types, through typescript-eslint, and dependency-cruiser. @typescript/native, an npm alias of typescript 7, the native compiler without a JavaScript API, runs the type check and the build, the clients included. Both packages declare a tsc binary, so the scripts call the native one by its path.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="420" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Two TypeScript compilers side by side in a generated project</text>
  <!-- typescript 6 -->
  <rect x="40" y="64" width="400" height="112" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="240" y="94" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">typescript ~6.0.3</text>
  <line x1="56" y1="106" x2="424" y2="106" stroke="#5f6b73" stroke-opacity="0.35"/>
  <text x="240" y="130" font-size="13" fill="#1f2328" text-anchor="middle">the compiler API, loaded as a library</text>
  <text x="240" y="152" font-size="13" fill="#1f2328" text-anchor="middle">by the tools that read sources through it</text>
  <!-- typescript 7 -->
  <rect x="520" y="64" width="400" height="112" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="720" y="94" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">@typescript/native</text>
  <line x1="536" y1="106" x2="904" y2="106" stroke="#5f6b73" stroke-opacity="0.35"/>
  <text x="720" y="130" font-size="13" fill="#1f2328" text-anchor="middle">npm:typescript@~7.0.2, the native compiler</text>
  <text x="720" y="152" font-size="13" fill="#1f2328" text-anchor="middle">much faster, no JavaScript API yet</text>
  <!-- tools on 6 -->
  <rect x="40" y="244" width="190" height="70" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="135" y="270" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">ESLint with types</text>
  <text x="135" y="292" font-size="13" fill="#1f2328" text-anchor="middle">typescript-eslint 8.71:</text>
  <text x="135" y="308" font-size="13" fill="#1f2328" text-anchor="middle">peer &lt;6.1.0</text>
  <rect x="250" y="244" width="190" height="70" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="345" y="270" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">dependency-cruiser</text>
  <text x="345" y="292" font-size="13" fill="#1f2328" text-anchor="middle">resolves the imports</text>
  <text x="345" y="308" font-size="13" fill="#1f2328" text-anchor="middle">of TypeScript sources</text>
  <line x1="135" y1="242" x2="135" y2="180" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="345" y1="242" x2="345" y2="180" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="148" y="216" font-size="13" fill="#3d4449">loads</text>
  <text x="358" y="216" font-size="13" fill="#3d4449">loads</text>
  <!-- tools on 7 -->
  <rect x="520" y="244" width="190" height="70" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="615" y="270" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">npm run typecheck</text>
  <text x="615" y="292" font-size="13" fill="#1f2328" text-anchor="middle">pre-push and</text>
  <text x="615" y="308" font-size="13" fill="#1f2328" text-anchor="middle">ci:typecheck</text>
  <rect x="730" y="244" width="190" height="70" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="825" y="270" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">npm run build</text>
  <text x="825" y="292" font-size="13" fill="#1f2328" text-anchor="middle">and sdk:build</text>
  <text x="825" y="308" font-size="13" fill="#1f2328" text-anchor="middle">for the clients</text>
  <line x1="615" y1="242" x2="615" y2="180" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="825" y1="242" x2="825" y2="180" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="628" y="216" font-size="13" fill="#3d4449">runs</text>
  <text x="838" y="216" font-size="13" fill="#3d4449">runs</text>
  <!-- note -->
  <text x="40" y="356" font-size="14" fill="#1f2328">Both packages declare a tsc binary: the scripts call node node_modules/@typescript/native/bin/tsc,</text>
  <text x="40" y="378" font-size="14" fill="#1f2328">never npx tsc. Refuse a bump of typescript to 7 until the lint tools accept it.</text>
</svg>
