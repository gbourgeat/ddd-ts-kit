<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 690" width="960" height="690" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Le côté lecture à côté du côté écriture</title>
  <desc id="desc">En haut, le côté écriture : une commande modifie un agrégat, et ses événements sont enregistrés dans l'outbox dans la même transaction. L'outbox livre les événements d'intégration à un projecteur, qui écrit un modèle de lecture avec upsertIfNewer. En bas, le côté lecture : une route confie une requête à son gestionnaire, qui joint les critères et le périmètre d'accès et appelle le port de lecture ; le port de lecture cherche dans le modèle de lecture. Le gestionnaire complète les lignes par hydratation, à travers un port gateway vers un autre contexte. La table SQL, JSON, XML, CSV et les formulaires sont construits ; un index de recherche est proposé.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="690" rx="16" fill="#ffffff"/>
  <text x="32" y="36" font-size="18" font-weight="600" fill="#1f2328">Le côté lecture à côté du côté écriture</text>
  <rect x="24" y="52" width="566" height="124" rx="12" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="40" y="74" font-size="14" font-weight="600" fill="#5f6b73">côté écriture : un agrégat, une transaction</text>
  <rect x="40" y="88" width="150" height="72" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="115" y="116" font-size="16" font-weight="700" text-anchor="middle" fill="#2b5d8a">commande</text>
  <text x="115" y="138" font-size="13" text-anchor="middle" fill="#1f2328">BookAppointment</text>
  <rect x="226" y="88" width="150" height="72" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="301" y="116" font-size="16" font-weight="700" text-anchor="middle" fill="#2f6f4f">agrégat</text>
  <text x="301" y="138" font-size="13" text-anchor="middle" fill="#1f2328">Appointment</text>
  <rect x="412" y="88" width="160" height="72" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="492" y="116" font-size="16" font-weight="700" text-anchor="middle" fill="#7a4f9a">outbox</text>
  <text x="492" y="138" font-size="13" text-anchor="middle" fill="#1f2328">même transaction</text>
  <line x1="190" y1="124" x2="224" y2="124" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="376" y1="124" x2="410" y2="124" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="572" y1="124" x2="698" y2="124" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="636" y="100" font-size="13" text-anchor="middle" fill="#1f2328">événements</text>
  <text x="636" y="115" font-size="13" text-anchor="middle" fill="#1f2328">d'intégration</text>
  <rect x="700" y="88" width="230" height="72" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="815" y="116" font-size="16" font-weight="700" text-anchor="middle" fill="#2b5d8a">projecteur</text>
  <text x="815" y="138" font-size="13" text-anchor="middle" fill="#1f2328">@Projection</text>
  <line x1="815" y1="160" x2="815" y2="230" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="805" y="200" font-size="13" text-anchor="end" fill="#1f2328">upsertIfNewer(clé, estampille)</text>
  <rect x="700" y="232" width="230" height="108" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="815" y="262" font-size="16" font-weight="700" text-anchor="middle" fill="#7a4f9a">modèle de lecture</text>
  <text x="815" y="284" font-size="13" text-anchor="middle" fill="#1f2328">table SQL : construite</text>
  <text x="815" y="305" font-size="13" text-anchor="middle" fill="#1f2328">index de recherche : proposé</text>
  <rect x="24" y="372" width="912" height="244" rx="12" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="40" y="394" font-size="14" font-weight="600" fill="#5f6b73">côté lecture : des critères, le périmètre de l'acteur, une page</text>
  <rect x="40" y="408" width="240" height="80" rx="10" fill="#f6ede6" stroke="#9a5b2b" stroke-width="2"/>
  <text x="160" y="432" font-size="16" font-weight="700" text-anchor="middle" fill="#9a5b2b">route</text>
  <text x="160" y="454" font-size="13" text-anchor="middle" fill="#1f2328">JSON, XML, CSV : construits</text>
  <text x="160" y="473" font-size="13" text-anchor="middle" fill="#1f2328">formulaires par appelant : construits</text>
  <rect x="330" y="408" width="300" height="80" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="480" y="440" font-size="16" font-weight="700" text-anchor="middle" fill="#2b5d8a">gestionnaire de requête</text>
  <text x="480" y="462" font-size="13" text-anchor="middle" fill="#1f2328">critères + périmètre d'accès</text>
  <rect x="700" y="408" width="230" height="80" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="815" y="440" font-size="16" font-weight="700" text-anchor="middle" fill="#2b5d8a">port de lecture</text>
  <text x="815" y="462" font-size="13" text-anchor="middle" fill="#1f2328">search(critères + périmètre)</text>
  <line x1="280" y1="448" x2="328" y2="448" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="630" y1="448" x2="698" y2="448" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="815" y1="408" x2="815" y2="342" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="330" y="520" width="240" height="76" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="450" y="550" font-size="16" font-weight="700" text-anchor="middle" fill="#2b5d8a">hydratation</text>
  <text x="450" y="572" font-size="13" text-anchor="middle" fill="#1f2328">hydrate(page).with(...)</text>
  <rect x="604" y="520" width="164" height="76" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="686" y="550" font-size="16" font-weight="700" text-anchor="middle" fill="#2b5d8a">port gateway</text>
  <text x="686" y="572" font-size="13" text-anchor="middle" fill="#1f2328">détenu par ce contexte</text>
  <rect x="802" y="520" width="128" height="76" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="866" y="550" font-size="15" font-weight="700" text-anchor="middle" fill="#5f6b73">autre contexte</text>
  <text x="866" y="572" font-size="13" text-anchor="middle" fill="#1f2328">sa propre API</text>
  <line x1="450" y1="488" x2="450" y2="518" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="558" x2="602" y2="558" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="768" y1="558" x2="800" y2="558" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="40" y1="646" x2="84" y2="646" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="96" y="651" font-size="14" fill="#1f2328">un appel ou une écriture</text>
  <line x1="40" y1="672" x2="84" y2="672" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="96" y="677" font-size="14" fill="#1f2328">un message asynchrone, livré après la validation (commit)</text>
</svg>
