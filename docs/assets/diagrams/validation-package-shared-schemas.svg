<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">A shared schema is documented once</title>
  <desc id="desc">The schema slot is shared under the name Slot: its JSON Schema is a reference to its own definition, $ref to #/$defs/Slot with Slot under $defs. Two routes use it: rescheduleAppointment takes it as its whole body, bookAppointment nests it in its body next to patientId. The OpenAPI generator writes Slot once under components.schemas, and both operations point at it with $ref instead of carrying a copy.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="440" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">A shared schema is documented once</text>

  <!-- the schema -->
  <rect x="24" y="150" width="236" height="120" rx="10" fill="#f6ede6" stroke="#9a5b2b" stroke-width="2"/>
  <text x="142" y="176" font-size="16" font-weight="700" fill="#9a5b2b" text-anchor="middle">slot, shared as Slot</text>
  <text x="40" y="202" font-size="13" fill="#1f2328">toJsonSchema():</text>
  <text x="40" y="224" font-size="13" fill="#1f2328">$ref: '#/$defs/Slot'</text>
  <text x="40" y="246" font-size="13" fill="#1f2328">$defs: { Slot: { ... } }</text>

  <!-- routes -->
  <rect x="320" y="80" width="260" height="84" rx="10" fill="#f6ede6" stroke="#9a5b2b" stroke-width="2"/>
  <text x="450" y="106" font-size="15" font-weight="700" fill="#9a5b2b" text-anchor="middle">rescheduleAppointment</text>
  <text x="450" y="130" font-size="13" fill="#1f2328" text-anchor="middle">body: slot</text>
  <text x="450" y="150" font-size="13" fill="#1f2328" text-anchor="middle">the whole body</text>
  <rect x="320" y="256" width="260" height="84" rx="10" fill="#f6ede6" stroke="#9a5b2b" stroke-width="2"/>
  <text x="450" y="282" font-size="15" font-weight="700" fill="#9a5b2b" text-anchor="middle">bookAppointment</text>
  <text x="450" y="306" font-size="13" fill="#1f2328" text-anchor="middle">body: { patientId, slot }</text>
  <text x="450" y="326" font-size="13" fill="#1f2328" text-anchor="middle">nested in the body</text>
  <path d="M262,190 C290,190 290,122 316,122" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M262,230 C290,230 290,298 316,298" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- OpenAPI -->
  <rect x="640" y="64" width="296" height="348" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="788" y="92" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">OpenAPI document</text>
  <rect x="656" y="104" width="264" height="68" rx="8" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="668" y="124" font-size="13" font-weight="700" fill="#5f6b73">rescheduleAppointment</text>
  <text x="668" y="144" font-size="13" fill="#1f2328">requestBody:</text>
  <text x="668" y="162" font-size="13" fill="#1f2328">$ref: '#/components/schemas/Slot'</text>
  <rect x="656" y="268" width="264" height="72" rx="8" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="668" y="290" font-size="13" font-weight="700" fill="#5f6b73">bookAppointment</text>
  <text x="668" y="310" font-size="13" fill="#1f2328">requestBody: { patientId, slot:</text>
  <text x="668" y="330" font-size="13" fill="#1f2328">$ref: '#/components/schemas/Slot' }</text>
  <rect x="656" y="200" width="264" height="40" rx="8" fill="#ffffff" stroke="#9a5b2b" stroke-width="2"/>
  <text x="788" y="225" font-size="13" fill="#1f2328" text-anchor="middle">components.schemas.Slot, once</text>
  <line x1="582" y1="122" x2="652" y2="122" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="582" y1="298" x2="652" y2="298" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="788" y="368" font-size="13" fill="#1f2328" text-anchor="middle">generated by generateOpenApi:</text>
  <text x="788" y="388" font-size="13" fill="#1f2328" text-anchor="middle">both operations point at one Slot</text>

  <!-- refs inside the document -->
  <line x1="900" y1="174" x2="900" y2="196" stroke="#3d4449" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="900" y1="266" x2="900" y2="244" stroke="#3d4449" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
</svg>
