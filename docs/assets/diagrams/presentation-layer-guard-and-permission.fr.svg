<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 584" width="960" height="584" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Une garde protège les routes, une permission protège le cas d'usage</title>
  <desc id="desc">Trois émetteurs de la même commande. Une requête HTTP passe les gardes de ses routes, puis son contrôleur et son mapper, avant d'atteindre le bus de commandes. Un job planifié et un gestionnaire d'événement envoient la même commande directement au bus, sans garde. Le bus vérifie, pour chaque émetteur, la permission que la commande déclare avec @Requires, puis exécute le gestionnaire du cas d'usage.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="584" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Une garde protège les routes, une permission protège le cas d'usage</text>
  <rect x="24" y="72" width="234" height="80" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="141" y="107" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">Requête HTTP</text>
  <text x="141" y="133" font-size="13" fill="#1f2328" text-anchor="middle">un client de l'API</text>
  <rect x="24" y="216" width="234" height="80" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="141" y="241" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">Job planifié</text>
  <text x="141" y="267" font-size="13" fill="#1f2328" text-anchor="middle">envoie la commande</text>
  <text x="141" y="287" font-size="13" fill="#1f2328" text-anchor="middle">lui-même</text>
  <rect x="24" y="360" width="234" height="80" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="141" y="385" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">Gestionnaire d'événement</text>
  <text x="141" y="411" font-size="13" fill="#1f2328" text-anchor="middle">réagit à un fait</text>
  <text x="141" y="431" font-size="13" fill="#1f2328" text-anchor="middle">d'un autre agrégat</text>
  <rect x="286" y="72" width="196" height="80" rx="10" fill="#f6ede6" stroke="#9a5b2b" stroke-width="2"/>
  <text x="384" y="97" font-size="16" font-weight="700" fill="#9a5b2b" text-anchor="middle">Gardes des routes</text>
  <text x="384" y="123" font-size="13" fill="#1f2328" text-anchor="middle">cet appelant peut-il</text>
  <text x="384" y="143" font-size="13" fill="#1f2328" text-anchor="middle">utiliser ces routes ?</text>
  <rect x="510" y="72" width="174" height="80" rx="10" fill="#f6ede6" stroke="#9a5b2b" stroke-width="2"/>
  <text x="597" y="97" font-size="16" font-weight="700" fill="#9a5b2b" text-anchor="middle">Contrôleur</text>
  <text x="597" y="123" font-size="13" fill="#1f2328" text-anchor="middle">et son mapper de</text>
  <text x="597" y="143" font-size="13" fill="#1f2328" text-anchor="middle">requête HTTP</text>
  <rect x="716" y="72" width="220" height="368" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="826" y="191" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">Bus de commandes</text>
  <text x="826" y="217" font-size="13" fill="#1f2328" text-anchor="middle">vérifie la permission</text>
  <text x="826" y="237" font-size="13" fill="#1f2328" text-anchor="middle">de @Requires,</text>
  <text x="826" y="257" font-size="13" fill="#1f2328" text-anchor="middle">pour chaque émetteur :</text>
  <text x="826" y="277" font-size="13" fill="#1f2328" text-anchor="middle"></text>
  <text x="826" y="297" font-size="13" fill="#1f2328" text-anchor="middle">cet acteur peut-il</text>
  <text x="826" y="317" font-size="13" fill="#1f2328" text-anchor="middle">faire cela</text>
  <text x="826" y="337" font-size="13" fill="#1f2328" text-anchor="middle">à cet élément ?</text>
  <line x1="260" y1="112.0" x2="284" y2="112.0" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="484" y1="112.0" x2="508" y2="112.0" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="686" y1="112.0" x2="714" y2="112.0" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="260" y1="256.0" x2="714" y2="256.0" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="487.0" y="246.0" font-size="13" fill="#1f2328" text-anchor="middle" font-style="italic">la même commande, sans garde</text>
  <line x1="260" y1="400.0" x2="714" y2="400.0" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="487.0" y="390.0" font-size="13" fill="#1f2328" text-anchor="middle" font-style="italic">la même commande, sans garde</text>
  <rect x="716" y="480" width="220" height="64" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="826" y="507" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">Gestionnaire</text>
  <text x="826" y="533" font-size="13" fill="#1f2328" text-anchor="middle">le cas d'usage</text>
  <line x1="826.0" y1="442" x2="826.0" y2="478" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="32" y="548" width="22" height="16" rx="4" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="64" y="561" font-size="14" fill="#1f2328" text-anchor="start">hors du contexte</text>
  <rect x="272" y="548" width="22" height="16" rx="4" fill="#f6ede6" stroke="#9a5b2b" stroke-width="2"/>
  <text x="304" y="561" font-size="14" fill="#1f2328" text-anchor="start">couche présentation</text>
  <rect x="512" y="548" width="22" height="16" rx="4" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="544" y="561" font-size="14" fill="#1f2328" text-anchor="start">couche application</text>
</svg>
