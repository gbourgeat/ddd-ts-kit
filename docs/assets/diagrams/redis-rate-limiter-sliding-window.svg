<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 456" width="960" height="456" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">A sliding window of three calls per minute</title>
  <desc id="desc">A limit of 3 calls per 60 seconds on one key. Calls at 20, 30 and 45 seconds are allowed, leaving 2, 1 and 0 places; each allowed call is one member of the sorted set of the key. The call at 60 seconds sees the window from 0 to 60 seconds, which holds 3 calls: it is refused, not counted, and told to retry after 20 seconds, when the call at 20 seconds leaves the window. The call at 82 seconds sees the window from 22 to 82 seconds, which holds 2 calls: it is allowed.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="456" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">A sliding window: limit 3, windowMs 60 000, one key</text>

  <!-- windows -->
  <rect x="80" y="64" width="480" height="40" rx="8" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="96" y="89" font-size="13" fill="#1f2328"><tspan font-weight="700" fill="#5f6b73">seen by the call at 60 s</tspan>: 20, 30, 45 s, 3 calls: refused</text>
  <rect x="256" y="116" width="480" height="40" rx="8" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="272" y="141" font-size="13" fill="#1f2328"><tspan font-weight="700" fill="#5f6b73">seen by the call at 82 s</tspan>: 30, 45 s, 2 calls: allowed</text>

  <!-- window edges down to the axis -->
  <g stroke="#5f6b73" stroke-width="1" stroke-dasharray="3 3">
    <line x1="80" y1="104" x2="80" y2="236"/>
    <line x1="560" y1="104" x2="560" y2="114"/>
    <line x1="560" y1="158" x2="560" y2="200"/>
    <line x1="256" y1="156" x2="256" y2="236"/>
    <line x1="736" y1="156" x2="736" y2="200"/>
  </g>

  <!-- axis -->
  <line x1="60" y1="236" x2="904" y2="236" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <g stroke="#3d4449" stroke-width="1.5">
    <line x1="80" y1="230" x2="80" y2="242"/>
    <line x1="240" y1="230" x2="240" y2="242"/>
    <line x1="400" y1="230" x2="400" y2="242"/>
    <line x1="560" y1="230" x2="560" y2="242"/>
    <line x1="720" y1="230" x2="720" y2="242"/>
    <line x1="880" y1="230" x2="880" y2="242"/>
  </g>
  <g font-size="13" fill="#5f6b73" text-anchor="middle">
    <text x="80" y="260">0 s</text>
    <text x="400" y="260">40 s</text>
    <text x="720" y="260">80 s</text>
    <text x="880" y="260">100 s</text>
  </g>
  <text x="904" y="216" font-size="13" fill="#5f6b73" text-anchor="end">time</text>

  <!-- calls -->
  <g fill="#7a4f9a" stroke="#7a4f9a" stroke-width="2">
    <circle cx="240" cy="212" r="10"/>
    <circle cx="320" cy="212" r="10"/>
    <circle cx="440" cy="212" r="10"/>
    <circle cx="736" cy="212" r="10"/>
  </g>
  <circle cx="560" cy="212" r="10" fill="#ffffff" stroke="#5f6b73" stroke-width="2"/>
  <path d="M554,206 L566,218 M566,206 L554,218" stroke="#5f6b73" stroke-width="2"/>

  <g font-size="13" fill="#1f2328" text-anchor="middle">
    <text x="240" y="284" font-weight="700" fill="#7a4f9a">20 s</text>
    <text x="240" y="302">allowed</text>
    <text x="240" y="320">2 left</text>
    <text x="320" y="284" font-weight="700" fill="#7a4f9a">30 s</text>
    <text x="320" y="302">allowed</text>
    <text x="320" y="320">1 left</text>
    <text x="440" y="284" font-weight="700" fill="#7a4f9a">45 s</text>
    <text x="440" y="302">allowed</text>
    <text x="440" y="320">0 left</text>
    <text x="560" y="284" font-weight="700" fill="#5f6b73">60 s</text>
    <text x="560" y="302">refused,</text>
    <text x="560" y="320">not counted</text>
    <text x="736" y="284" font-weight="700" fill="#7a4f9a">82 s</text>
    <text x="736" y="302">allowed</text>
    <text x="736" y="320">0 left</text>
  </g>

  <!-- retry after -->
  <line x1="560" y1="350" x2="716" y2="350" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="720" y1="340" x2="720" y2="360" stroke="#3d4449" stroke-width="1.5"/>
  <text x="640" y="376" font-size="13" fill="#1f2328" text-anchor="middle">retryAfterMs: 20 000</text>
  <text x="640" y="394" font-size="13" fill="#1f2328" text-anchor="middle">until the call at 20 s leaves</text>

  <!-- legend -->
  <circle cx="44" cy="420" r="8" fill="#7a4f9a"/>
  <text x="60" y="425" font-size="14" fill="#1f2328">an allowed call: one member of the sorted set of the key</text>
  <circle cx="520" cy="420" r="8" fill="#ffffff" stroke="#5f6b73" stroke-width="2"/>
  <text x="536" y="425" font-size="14" fill="#1f2328">a refused call: nothing written</text>
</svg>
