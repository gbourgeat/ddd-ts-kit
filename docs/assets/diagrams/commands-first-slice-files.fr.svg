<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 744" width="960" height="744" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Ce qu'écrivent les cinq générateurs d'une première tranche</title>
  <desc id="desc">Les fichiers écrits par generate aggregate, generate repository, generate command, generate route et generate e2e pour la tranche PlaceOrder d'un contexte ordering, avec Drizzle choisi à l'init. Chaque fichier porte le numéro du générateur qui l'a écrit et se trouve dans sa couche : présentation, application, domaine, infrastructure, les tests du contexte, et la spec de bout en bout hors du contexte.</desc>
  <rect width="960" height="744" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Ce qu'écrivent les cinq générateurs d'une première tranche</text>
  <!-- legend of the generators -->
  <circle cx="46" cy="70" r="11" fill="#3d4449"/>
  <text x="46" y="75" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="66" y="75" font-size="14" fill="#1f2328">npx ddd-ts-kit generate aggregate ordering Order</text>
  <circle cx="46" cy="98" r="11" fill="#3d4449"/>
  <text x="46" y="103" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="66" y="103" font-size="14" fill="#1f2328">npx ddd-ts-kit generate repository ordering Order</text>
  <circle cx="46" cy="126" r="11" fill="#3d4449"/>
  <text x="46" y="131" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="66" y="131" font-size="14" fill="#1f2328">npx ddd-ts-kit generate command ordering PlaceOrder --permission order.place --aggregate Order</text>
  <circle cx="46" cy="154" r="11" fill="#3d4449"/>
  <text x="46" y="159" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="66" y="159" font-size="14" fill="#1f2328">npx ddd-ts-kit generate route ordering PlaceOrder --method POST --path /orders</text>
  <circle cx="46" cy="182" r="11" fill="#3d4449"/>
  <text x="46" y="187" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <text x="66" y="187" font-size="14" fill="#1f2328">npx ddd-ts-kit generate e2e ordering PlaceOrder</text>
  <!-- context -->
  <rect x="24" y="210" width="912" height="430" rx="14" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="44" y="238" font-size="14" font-weight="600" fill="#5f6b73">src/contexts/ordering/ (Drizzle choisi à l'init)</text>
  <!-- presentation -->
  <rect x="44" y="252" width="206" height="196" rx="10" fill="#f6ede6" stroke="#9a5b2b" stroke-width="2"/>
  <text x="147" y="278" font-size="16" font-weight="700" fill="#9a5b2b" text-anchor="middle">présentation</text>
  <text x="58" y="304" font-size="13" font-style="italic" fill="#5f6b73">http/</text>
  <circle cx="68" cy="323" r="9" fill="#3d4449"/>
  <text x="68" y="328" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="84" y="328" font-size="13" fill="#1f2328">orders.routes.ts</text>
  <text x="58" y="356" font-size="13" font-style="italic" fill="#5f6b73">http/orders/place-order/</text>
  <circle cx="68" cy="375" r="9" fill="#3d4449"/>
  <text x="68" y="380" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="84" y="380" font-size="13" fill="#1f2328">place-order.controller.ts</text>
  <!-- application -->
  <rect x="266" y="252" width="206" height="196" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="369" y="278" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">application</text>
  <text x="280" y="304" font-size="13" font-style="italic" fill="#5f6b73">authorization/</text>
  <circle cx="290" cy="323" r="9" fill="#3d4449"/>
  <text x="290" y="328" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="306" y="328" font-size="13" fill="#1f2328">ordering.permissions.ts</text>
  <text x="280" y="356" font-size="13" font-style="italic" fill="#5f6b73">commands/place-order/</text>
  <circle cx="290" cy="375" r="9" fill="#3d4449"/>
  <text x="290" y="380" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="306" y="380" font-size="13" fill="#1f2328">place-order.command.ts</text>
  <circle cx="290" cy="401" r="9" fill="#3d4449"/>
  <text x="290" y="406" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="306" y="406" font-size="13" fill="#1f2328">place-order.handler.ts</text>
  <!-- domain -->
  <rect x="488" y="252" width="206" height="196" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="591" y="278" font-size="16" font-weight="700" fill="#2f6f4f" text-anchor="middle">domaine</text>
  <text x="502" y="304" font-size="13" font-style="italic" fill="#5f6b73">aggregates/</text>
  <circle cx="512" cy="323" r="9" fill="#3d4449"/>
  <text x="512" y="328" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="528" y="328" font-size="13" fill="#1f2328">order.aggregate.ts</text>
  <text x="502" y="356" font-size="13" font-style="italic" fill="#5f6b73">repositories/</text>
  <circle cx="512" cy="375" r="9" fill="#3d4449"/>
  <text x="512" y="380" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="528" y="380" font-size="13" fill="#1f2328">order.repository.ts (port)</text>
  <!-- infrastructure -->
  <rect x="710" y="252" width="206" height="196" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="813" y="278" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">infrastructure</text>
  <text x="724" y="304" font-size="13" font-style="italic" fill="#5f6b73">persistence/</text>
  <circle cx="734" cy="323" r="9" fill="#3d4449"/>
  <text x="734" y="328" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="750" y="328" font-size="13" fill="#1f2328">drizzle-order.repository.ts</text>
  <circle cx="734" cy="349" r="9" fill="#3d4449"/>
  <text x="734" y="354" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="750" y="354" font-size="13" fill="#1f2328">order.mapper.ts</text>
  <circle cx="734" cy="375" r="9" fill="#3d4449"/>
  <text x="734" y="380" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="750" y="380" font-size="13" fill="#1f2328">ordering.schema.ts</text>
  <!-- tests of the context -->
  <rect x="44" y="464" width="872" height="124" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="58" y="490" font-size="16" font-weight="700" fill="#5f6b73">test/</text>
  <circle cx="68" cy="511" r="9" fill="#3d4449"/>
  <text x="68" y="516" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="84" y="516" font-size="13" fill="#1f2328">builders/order.builder.ts</text>
  <circle cx="68" cy="537" r="9" fill="#3d4449"/>
  <text x="68" y="542" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="84" y="542" font-size="13" fill="#1f2328">unit/order.aggregate.spec.ts</text>
  <circle cx="68" cy="563" r="9" fill="#3d4449"/>
  <text x="68" y="568" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="84" y="568" font-size="13" fill="#1f2328">fakes/order.repository.fake.ts</text>
  <circle cx="370" cy="511" r="9" fill="#3d4449"/>
  <text x="370" y="516" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="386" y="516" font-size="13" fill="#1f2328">integration/order.repository.contract.spec.ts</text>
  <circle cx="370" cy="537" r="9" fill="#3d4449"/>
  <text x="370" y="542" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="386" y="542" font-size="13" fill="#1f2328">unit/place-order.handler.spec.ts</text>
  <circle cx="370" cy="563" r="9" fill="#3d4449"/>
  <text x="370" y="568" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="386" y="568" font-size="13" fill="#1f2328">unit/place-order.controller.spec.ts</text>
  <text x="44" y="616" font-size="13" fill="#1f2328">Mis à jour au passage : CONTEXT.md (le glossaire et les listes générées) et ordering.declarations.ts (le câblage).</text>
  <!-- outside the context -->
  <text x="32" y="672" font-size="14" font-weight="600" fill="#5f6b73">hors du contexte</text>
  <circle cx="200" cy="667" r="9" fill="#3d4449"/>
  <text x="200" y="672" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <text x="216" y="672" font-size="13" fill="#1f2328">test/e2e/place-order.e2e.spec.ts</text>
  <circle cx="500" cy="667" r="9" fill="#3d4449"/>
  <text x="500" y="672" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="516" y="672" font-size="13" fill="#1f2328">src/platform/database/schema.ts (mis à jour)</text>
  <text x="32" y="704" font-size="13" font-style="italic" fill="#5f6b73">La plupart des fichiers portent des marqueurs TODO(domain) là où une décision vous revient : npx ddd-ts-kit todo ordering les liste.</text>
  <text x="32" y="724" font-size="13" font-style="italic" fill="#5f6b73">Trois arrivent câblés et n'en portent aucun : le groupe de routes, les permissions et le repository Drizzle.</text>
</svg>
