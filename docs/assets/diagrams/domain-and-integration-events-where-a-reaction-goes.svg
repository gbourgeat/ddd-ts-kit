<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 548" width="960" height="548" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Where the reaction to a domain event goes</title>
  <desc id="desc">A decision tree with three questions. Does another bounded context react? Yes: publish an integration event, which a publisher writes to the outbox and the other context consumes. No: does the effect write only in the transaction of the command? Yes: a before-commit handler, the default, which commits or rolls back with the state change. No: may the effect be lost? Yes: an after-commit handler, at most once, whose failure never fails the command. No: put it behind an integration event, through the outbox, at least once, consumed by an idempotent handler.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="548" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Where the reaction to a domain event goes</text>
  <rect x="32" y="64" width="420" height="84" rx="10" fill="#ffffff" stroke="#3d4449" stroke-width="2"/>
  <text x="242" y="98" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Does another context react?</text>
  <text x="242" y="122" font-size="13" fill="#5f6b73" text-anchor="middle">a bounded context other than this one</text>
  <rect x="32" y="184" width="420" height="84" rx="10" fill="#ffffff" stroke="#3d4449" stroke-width="2"/>
  <text x="242" y="218" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Does it write only in the transaction?</text>
  <text x="242" y="242" font-size="13" fill="#5f6b73" text-anchor="middle">repositories of the context, the outbox,</text>
  <text x="242" y="260" font-size="13" fill="#5f6b73" text-anchor="middle">kernel ports that join the transaction</text>
  <rect x="32" y="304" width="420" height="84" rx="10" fill="#ffffff" stroke="#3d4449" stroke-width="2"/>
  <text x="242" y="338" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">May the effect be lost?</text>
  <text x="242" y="362" font-size="13" fill="#5f6b73" text-anchor="middle">a cache to refresh, a best-effort notice</text>
  <rect x="560" y="64" width="368" height="84" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="744" y="94" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">an integration event</text>
  <text x="744" y="118" font-size="13" fill="#1f2328" text-anchor="middle">a publisher writes it to the outbox;</text>
  <text x="744" y="136" font-size="13" fill="#1f2328" text-anchor="middle">the other context consumes it</text>
  <rect x="560" y="184" width="368" height="84" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="744" y="214" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">a before-commit handler</text>
  <text x="744" y="238" font-size="13" fill="#1f2328" text-anchor="middle">the default: commits or rolls back</text>
  <text x="744" y="256" font-size="13" fill="#1f2328" text-anchor="middle">with the state change</text>
  <rect x="560" y="304" width="368" height="84" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="744" y="334" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">an after-commit handler</text>
  <text x="744" y="358" font-size="13" fill="#1f2328" text-anchor="middle">phase: 'after-commit'; at most once,</text>
  <text x="744" y="376" font-size="13" fill="#1f2328" text-anchor="middle">its failure never fails the command</text>
  <rect x="560" y="440" width="368" height="84" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="744" y="470" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">an integration event</text>
  <text x="744" y="494" font-size="13" fill="#1f2328" text-anchor="middle">through the outbox, at least once;</text>
  <text x="744" y="512" font-size="13" fill="#1f2328" text-anchor="middle">consumed by an idempotent handler</text>
  <line x1="454" y1="106" x2="558" y2="106" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="506" y="98" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">yes</text>
  <line x1="454" y1="226" x2="558" y2="226" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="506" y="218" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">yes</text>
  <line x1="454" y1="346" x2="558" y2="346" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="506" y="338" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">yes</text>
  <line x1="242" y1="150" x2="242" y2="182" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="254" y="171" font-size="14" font-weight="600" fill="#1f2328">no</text>
  <line x1="242" y1="270" x2="242" y2="302" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="254" y="291" font-size="14" font-weight="600" fill="#1f2328">no</text>
  <path d="M242,390 V482 H558" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="254" y="424" font-size="14" font-weight="600" fill="#1f2328">no</text>
</svg>
