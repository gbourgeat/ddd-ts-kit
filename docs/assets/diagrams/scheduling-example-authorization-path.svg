<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 572" width="960" height="572" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Where each authorization question is answered</title>
  <desc id="desc">A request crosses four checks in order. The HTTP boundary verifies the token Keycloak issued, or answers 401. The authorizer, before the handler, grants the permission from a role of the token, else from the relationships, or answers 403. The handler loads the element and Access.authorize runs the policies of the permission, which may answer 403. The domain keeps its invariants, or answers 422. Three cases are followed through: an assistant booking on a delegated calendar passes everything and gets 201; a patient cancelling less than 24 hours before the start is refused by the policy with 403; the practitioner cancelling without a reason passes the rights and is refused by the domain with 422.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="572" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Where each authorization question is answered</text>

  <!-- 1. presentation -->
  <rect x="24" y="64" width="170" height="140" rx="10" fill="#f6ede6" stroke="#9a5b2b" stroke-width="2"/>
  <text x="109" y="92" font-size="16" font-weight="700" fill="#9a5b2b" text-anchor="middle">Who is calling?</text>
  <line x1="40" y1="104" x2="178" y2="104" stroke="#9a5b2b" stroke-opacity="0.35"/>
  <text x="109" y="128" font-size="13" fill="#1f2328" text-anchor="middle">the HTTP boundary</text>
  <text x="109" y="148" font-size="13" fill="#1f2328" text-anchor="middle">verifies the token</text>
  <text x="109" y="168" font-size="13" fill="#1f2328" text-anchor="middle">Keycloak issued</text>
  <!-- 2. platform -->
  <rect x="210" y="64" width="170" height="140" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="295" y="92" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">May they do this?</text>
  <line x1="226" y1="104" x2="364" y2="104" stroke="#5f6b73" stroke-opacity="0.35"/>
  <text x="295" y="128" font-size="13" fill="#1f2328" text-anchor="middle">the authorizer, before</text>
  <text x="295" y="148" font-size="13" fill="#1f2328" text-anchor="middle">the handler: a role of</text>
  <text x="295" y="168" font-size="13" fill="#1f2328" text-anchor="middle">the token, else the</text>
  <text x="295" y="188" font-size="13" fill="#1f2328" text-anchor="middle">relationships</text>
  <!-- 3. application -->
  <rect x="396" y="64" width="170" height="140" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="481" y="92" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">On this element?</text>
  <line x1="412" y1="104" x2="550" y2="104" stroke="#2b5d8a" stroke-opacity="0.35"/>
  <text x="481" y="128" font-size="13" fill="#1f2328" text-anchor="middle">the handler loads it,</text>
  <text x="481" y="148" font-size="13" fill="#1f2328" text-anchor="middle">Access.authorize runs</text>
  <text x="481" y="168" font-size="13" fill="#1f2328" text-anchor="middle">the policies of the</text>
  <text x="481" y="188" font-size="13" fill="#1f2328" text-anchor="middle">permission</text>
  <!-- 4. domain -->
  <rect x="582" y="64" width="170" height="140" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="667" y="92" font-size="16" font-weight="700" fill="#2f6f4f" text-anchor="middle">Is it valid?</text>
  <line x1="598" y1="104" x2="736" y2="104" stroke="#2f6f4f" stroke-opacity="0.35"/>
  <text x="667" y="128" font-size="13" fill="#1f2328" text-anchor="middle">the aggregate keeps</text>
  <text x="667" y="148" font-size="13" fill="#1f2328" text-anchor="middle">its invariants</text>
  <!-- 5. answer -->
  <rect x="768" y="64" width="170" height="140" rx="10" fill="#ffffff" stroke="#3d4449" stroke-width="2"/>
  <text x="853" y="92" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">The answer</text>
  <line x1="784" y1="104" x2="922" y2="104" stroke="#3d4449" stroke-opacity="0.35"/>
  <text x="853" y="128" font-size="13" fill="#1f2328" text-anchor="middle">201 or 200 once</text>
  <text x="853" y="148" font-size="13" fill="#1f2328" text-anchor="middle">every check passed</text>

  <!-- the order of the checks -->
  <line x1="195" y1="134" x2="208" y2="134" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="381" y1="134" x2="394" y2="134" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="567" y1="134" x2="580" y2="134" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="753" y1="134" x2="766" y2="134" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- refusals -->
  <line x1="109" y1="206" x2="109" y2="222" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="109" y="242" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">no valid token: 401</text>
  <line x1="295" y1="206" x2="295" y2="222" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="295" y="242" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">no role, no path: 403</text>
  <line x1="481" y1="206" x2="481" y2="222" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="481" y="242" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">a policy says no: 403</text>
  <line x1="667" y1="206" x2="667" y2="222" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="667" y="242" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">an invariant: 422</text>

  <text x="32" y="290" font-size="16" font-weight="700" fill="#1f2328">Three cases, followed through</text>

  <!-- case A -->
  <rect x="24" y="304" width="914" height="78" rx="10" fill="#f3f4f5"/>
  <text x="40" y="326" font-size="14" font-weight="600" fill="#1f2328">An assistant books on a delegated calendar</text>
  <text x="109" y="350" font-size="13" fill="#1f2328" text-anchor="middle">token of</text>
  <text x="109" y="368" font-size="13" fill="#1f2328" text-anchor="middle">demo-assistant</text>
  <text x="295" y="350" font-size="13" fill="#1f2328" text-anchor="middle">no role grants it;</text>
  <text x="295" y="368" font-size="13" fill="#1f2328" text-anchor="middle">delegate of the desk</text>
  <text x="481" y="350" font-size="13" fill="#1f2328" text-anchor="middle">no policy on</text>
  <text x="481" y="368" font-size="13" fill="#1f2328" text-anchor="middle">booking</text>
  <text x="667" y="350" font-size="13" fill="#1f2328" text-anchor="middle">the slot is free,</text>
  <text x="667" y="368" font-size="13" fill="#1f2328" text-anchor="middle">in the opening hours</text>
  <text x="853" y="360" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">201</text>

  <!-- case B -->
  <rect x="24" y="392" width="914" height="78" rx="10" fill="#f3f4f5"/>
  <text x="40" y="414" font-size="14" font-weight="600" fill="#1f2328">A patient cancels less than 24 hours before the start</text>
  <text x="109" y="438" font-size="13" fill="#1f2328" text-anchor="middle">token of</text>
  <text x="109" y="456" font-size="13" fill="#1f2328" text-anchor="middle">demo-patient</text>
  <text x="295" y="438" font-size="13" fill="#1f2328" text-anchor="middle">patient of the</text>
  <text x="295" y="456" font-size="13" fill="#1f2328" text-anchor="middle">appointment</text>
  <text x="481" y="438" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">patient-cancels-</text>
  <text x="481" y="456" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">until-notice says no</text>
  <text x="667" y="447" font-size="13" font-style="italic" fill="#5f6b73" text-anchor="middle">not reached</text>
  <text x="853" y="448" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">403</text>

  <!-- case C -->
  <rect x="24" y="480" width="914" height="78" rx="10" fill="#f3f4f5"/>
  <text x="40" y="502" font-size="14" font-weight="600" fill="#1f2328">The practitioner cancels without a reason</text>
  <text x="109" y="526" font-size="13" fill="#1f2328" text-anchor="middle">token of</text>
  <text x="109" y="544" font-size="13" fill="#1f2328" text-anchor="middle">demo-practitioner</text>
  <text x="295" y="526" font-size="13" fill="#1f2328" text-anchor="middle">holder of the desk</text>
  <text x="295" y="544" font-size="13" fill="#1f2328" text-anchor="middle">of the calendar</text>
  <text x="481" y="526" font-size="13" fill="#1f2328" text-anchor="middle">not the patient:</text>
  <text x="481" y="544" font-size="13" fill="#1f2328" text-anchor="middle">the policy allows</text>
  <text x="667" y="535" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">REASON_REQUIRED</text>
  <text x="853" y="536" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">422</text>
</svg>
