<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Une commande, une unité de travail</title>
  <desc id="desc">Dans la transaction : d'abord le travail, où le gestionnaire de la commande modifie des agrégats et où chaque save met en file les événements qu'ils ont enregistrés ; puis les gestionnaires before-commit, appelés sur toute la file dans l'ordre d'enregistrement, dont les saves et les lignes d'outbox s'ajoutent au travail. Puis la transaction est validée. Après la validation, les gestionnaires after-commit s'exécutent, attendus, dans l'ordre de distribution, au plus une fois, et leur échec est remonté, jamais levé ; puis la commande répond à qui l'a envoyée. Plus tard, le relais publie les lignes de l'outbox, et les consommateurs des autres contextes les dédupliquent. Quand le travail lève une erreur, qu'un save est rejeté, qu'un gestionnaire before-commit échoue ou que la validation échoue, tout est annulé : la file est abandonnée, aucun gestionnaire after-commit ne s'exécute et aucune ligne d'outbox ne reste.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="580" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Une commande, une unité de travail</text>
  <!-- inside the transaction -->
  <text x="40" y="74" font-size="14" font-weight="600" fill="#5f6b73">dans la transaction</text>
  <rect x="24" y="86" width="400" height="256" rx="12" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="44" y="104" width="360" height="100" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="224" y="134" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">1. le travail</text>
  <text x="224" y="160" font-size="13" fill="#1f2328" text-anchor="middle">le gestionnaire modifie des agrégats ;</text>
  <text x="224" y="182" font-size="13" fill="#1f2328" text-anchor="middle">chaque save() met en file leurs événements</text>
  <rect x="44" y="224" width="360" height="100" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="224" y="254" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">2. gestionnaires before-commit</text>
  <text x="224" y="280" font-size="13" fill="#1f2328" text-anchor="middle">appelés sur toute la file, dans l'ordre ;</text>
  <text x="224" y="302" font-size="13" fill="#1f2328" text-anchor="middle">leurs saves et lignes d'outbox s'y ajoutent</text>
  <line x1="224" y1="206" x2="224" y2="220" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- commit -->
  <rect x="444" y="86" width="56" height="256" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="472" y="214" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 472 214)">3. validation (commit)</text>
  <line x1="406" y1="274" x2="440" y2="274" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- after the commit -->
  <text x="520" y="74" font-size="14" font-weight="600" fill="#5f6b73">après la validation</text>
  <rect x="520" y="104" width="416" height="100" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="728" y="134" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">4. gestionnaires after-commit</text>
  <text x="728" y="160" font-size="13" fill="#1f2328" text-anchor="middle">attendus, dans l'ordre de distribution,</text>
  <text x="728" y="182" font-size="13" fill="#1f2328" text-anchor="middle">au plus une fois ; un échec est remonté, jamais levé</text>
  <rect x="520" y="224" width="416" height="100" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="728" y="254" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">5. la commande répond</text>
  <text x="728" y="280" font-size="13" fill="#1f2328" text-anchor="middle">au contrôleur, au job ou au consommateur</text>
  <text x="728" y="302" font-size="13" fill="#1f2328" text-anchor="middle">qui l'a envoyée</text>
  <line x1="502" y1="154" x2="516" y2="154" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="728" y1="206" x2="728" y2="220" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- on failure -->
  <rect x="24" y="384" width="400" height="110" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="224" y="412" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">annulation, sur tout échec</text>
  <text x="224" y="438" font-size="13" fill="#1f2328" text-anchor="middle">échec du travail, d'un save, d'un gestionnaire</text>
  <text x="224" y="460" font-size="13" fill="#1f2328" text-anchor="middle">before-commit ou de la validation : la file est</text>
  <text x="224" y="482" font-size="13" fill="#1f2328" text-anchor="middle">abandonnée, sans after-commit ni ligne d'outbox</text>
  <line x1="224" y1="344" x2="224" y2="380" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <!-- later -->
  <rect x="520" y="384" width="196" height="110" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="618" y="412" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">6. le relais</text>
  <text x="618" y="438" font-size="13" fill="#1f2328" text-anchor="middle">plus tard, publie</text>
  <text x="618" y="460" font-size="13" fill="#1f2328" text-anchor="middle">les lignes de l'outbox</text>
  <rect x="740" y="384" width="196" height="110" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="838" y="412" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">7. consommateurs</text>
  <text x="838" y="438" font-size="13" fill="#1f2328" text-anchor="middle">des autres contextes,</text>
  <text x="838" y="460" font-size="13" fill="#1f2328" text-anchor="middle">dédupliquent les événements</text>
  <path d="M472,344 V439 H516" fill="none" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <line x1="718" y1="439" x2="736" y2="439" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <!-- legend -->
  <line x1="40" y1="526" x2="84" y2="526" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="96" y="531" font-size="14" fill="#1f2328">l'étape suivante de la même commande</text>
  <line x1="40" y1="552" x2="84" y2="552" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="96" y="557" font-size="14" fill="#1f2328">en cas d'échec, ou plus tard et en asynchrone</text>
</svg>
