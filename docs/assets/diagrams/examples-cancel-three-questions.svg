<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">One request, three questions: cancelling an appointment</title>
  <desc id="desc">The path of POST /appointments/:id/cancellation in the scheduling example, top to bottom. The route group lets only an authenticated caller through (401 otherwise). Before the handler, the permission appointment.cancel is checked on the appointment by the authorizer, from the roles of the token then the relationships (403). In the handler, the appointment is loaded (404 when it does not exist) and the policy scheduling.patient-cancels-until-notice is asked with it (403 for a patient less than 24 hours before). The domain then holds its invariants: the practice gives a reason (422 REASON_REQUIRED), an ended appointment does not change (409 APPOINTMENT_ENDED). Last, one unit of work commits together the appointment, the reactions to AppointmentCancelled (the freed slot offered to the waitlist, the attendance note when the patient cancelled) and the outbox row, and the answer is 201.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="660" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">One request, three questions: cancelling an appointment</text>
  <text x="24" y="72" font-size="13" font-weight="600" fill="#5f6b73">the question</text>
  <text x="236" y="72" font-size="13" font-weight="600" fill="#5f6b73">what runs, in this order</text>
  <text x="676" y="72" font-size="13" font-weight="600" fill="#5f6b73">the answer when it says no</text>

  <!-- the questions -->
  <text x="24" y="122" font-size="15" font-weight="700" fill="#1f2328">Who is calling?</text>
  <text x="24" y="144" font-size="13" fill="#1f2328">a Keycloak token,</text>
  <text x="24" y="162" font-size="13" fill="#1f2328">verified at the edge</text>
  <line x1="214" y1="192" x2="214" y2="360" stroke="#2b5d8a" stroke-width="2"/>
  <text x="24" y="262" font-size="15" font-weight="700" fill="#1f2328">May they do this,</text>
  <text x="24" y="282" font-size="15" font-weight="700" fill="#1f2328">on this?</text>
  <text x="24" y="304" font-size="13" fill="#1f2328">the application decides,</text>
  <text x="24" y="322" font-size="13" fill="#1f2328">before any change</text>
  <text x="24" y="422" font-size="15" font-weight="700" fill="#1f2328">Is it valid at all?</text>
  <text x="24" y="444" font-size="13" fill="#1f2328">the domain, whoever</text>
  <text x="24" y="462" font-size="13" fill="#1f2328">is calling</text>
  <text x="24" y="522" font-size="15" font-weight="700" fill="#1f2328">Then it is kept</text>
  <text x="24" y="544" font-size="13" fill="#1f2328">all of it commits together,</text>
  <text x="24" y="562" font-size="13" fill="#1f2328">or nothing does</text>

  <!-- 1. presentation -->
  <rect x="236" y="88" width="400" height="76" rx="10" fill="#f6ede6" stroke="#9a5b2b" stroke-width="2"/>
  <text x="252" y="114" font-size="15" font-weight="700" fill="#9a5b2b">POST /appointments/:id/cancellation</text>
  <text x="252" y="136" font-size="13" fill="#1f2328">the Authenticated guard of the route group,</text>
  <text x="252" y="154" font-size="13" fill="#1f2328">then the controller sends CancelAppointmentCommand</text>
  <!-- 2. permission -->
  <rect x="236" y="188" width="400" height="76" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="252" y="214" font-size="15" font-weight="700" fill="#2b5d8a">permission, before the handler</text>
  <text x="252" y="236" font-size="13" fill="#1f2328">@Requires: appointment.cancel on appointment:&lt;id&gt;</text>
  <text x="252" y="254" font-size="13" fill="#1f2328">the authorizer reads token roles, then relationships</text>
  <!-- 3. policy -->
  <rect x="236" y="288" width="400" height="76" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="252" y="314" font-size="15" font-weight="700" fill="#2b5d8a">policy, in the handler</text>
  <text x="252" y="336" font-size="13" fill="#1f2328">load the appointment, then Access.authorize with it</text>
  <text x="252" y="354" font-size="13" fill="#1f2328">scheduling.patient-cancels-until-notice</text>
  <!-- 4. domain -->
  <rect x="236" y="388" width="400" height="76" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="252" y="414" font-size="15" font-weight="700" fill="#2f6f4f">invariants, in the domain</text>
  <text x="252" y="436" font-size="13" fill="#1f2328">Cancellation.create: the practice gives a reason</text>
  <text x="252" y="454" font-size="13" fill="#1f2328">appointment.cancel: only a requested or booked one</text>
  <!-- 5. unit of work -->
  <rect x="236" y="488" width="400" height="94" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="252" y="514" font-size="15" font-weight="700" fill="#7a4f9a">one unit of work</text>
  <text x="252" y="536" font-size="13" fill="#1f2328">the appointment, the reactions to AppointmentCancelled</text>
  <text x="252" y="554" font-size="13" fill="#1f2328">(the freed slot offered to the waitlist, the attendance</text>
  <text x="252" y="572" font-size="13" fill="#1f2328">note if the patient cancelled) and the outbox row</text>

  <!-- yes: down -->
  <line x1="436" y1="164" x2="436" y2="184" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="436" y1="264" x2="436" y2="284" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="436" y1="364" x2="436" y2="384" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="436" y1="464" x2="436" y2="484" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- no: right -->
  <line x1="636" y1="126" x2="672" y2="126" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="654" y="118" font-size="13" fill="#1f2328" text-anchor="middle">no</text>
  <line x1="636" y1="226" x2="672" y2="226" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="654" y="218" font-size="13" fill="#1f2328" text-anchor="middle">no</text>
  <line x1="636" y1="326" x2="672" y2="326" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="654" y="318" font-size="13" fill="#1f2328" text-anchor="middle">no</text>
  <line x1="636" y1="426" x2="672" y2="426" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="654" y="418" font-size="13" fill="#1f2328" text-anchor="middle">no</text>
  <line x1="636" y1="526" x2="672" y2="526" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- the answers -->
  <rect x="676" y="88" width="260" height="76" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="692" y="114" font-size="15" font-weight="700" fill="#5f6b73">401 UNAUTHORIZED</text>
  <text x="692" y="136" font-size="13" fill="#1f2328">anonymous caller</text>
  <rect x="676" y="188" width="260" height="76" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="692" y="214" font-size="15" font-weight="700" fill="#5f6b73">403 FORBIDDEN</text>
  <text x="692" y="236" font-size="13" fill="#1f2328">no role and no relationship</text>
  <text x="692" y="254" font-size="13" fill="#1f2328">grants the permission</text>
  <rect x="676" y="288" width="260" height="76" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="692" y="314" font-size="15" font-weight="700" fill="#5f6b73">403 FORBIDDEN</text>
  <text x="692" y="336" font-size="13" fill="#1f2328">a patient, less than 24 h before;</text>
  <text x="692" y="354" font-size="13" fill="#1f2328">404 APPOINTMENT_NOT_FOUND</text>
  <rect x="676" y="388" width="260" height="76" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="692" y="414" font-size="15" font-weight="700" fill="#5f6b73">422 REASON_REQUIRED</text>
  <text x="692" y="436" font-size="13" fill="#1f2328">the practice said no reason;</text>
  <text x="692" y="454" font-size="13" fill="#1f2328">409 APPOINTMENT_ENDED</text>
  <rect x="676" y="488" width="260" height="94" rx="10" fill="#ffffff" stroke="#3d4449" stroke-width="2"/>
  <text x="692" y="514" font-size="15" font-weight="700" fill="#1f2328">201 { id }</text>
  <text x="692" y="536" font-size="13" fill="#1f2328">the appointment is cancelled</text>

  <text x="32" y="618" font-size="14" fill="#1f2328">After the commit, the relay publishes scheduling.appointment.cancelled: notification tells the</text>
  <text x="32" y="638" font-size="14" fill="#1f2328">patient, analytics records the outcome. Neither runs inside this request.</text>
</svg>
