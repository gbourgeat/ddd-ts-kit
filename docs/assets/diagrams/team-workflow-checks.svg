<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 232" width="960" height="232" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Where the checks run, and what is left to the reviewer</title>
  <desc id="desc">The same rules run three times, from the smallest scope to the whole project: at each file write in an agent session, through the hook of the plugin; at each commit, through the pre-commit hook on the staged files; on the pull request, in the pipeline, whose gate job is the one required check. The human review comes after a green gate and judges the design.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="232" rx="16" fill="#ffffff"/>
  <text x="32" y="34" font-size="18" font-weight="600" fill="#1f2328">Where the checks run, and what is left to the reviewer</text>
  <rect x="24" y="60" width="204" height="96" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="126" y="88" font-size="16" font-weight="700" text-anchor="middle" fill="#5f6b73">at each file write</text>
  <text x="126" y="110" font-size="13" text-anchor="middle" fill="#1f2328">the plugin's hook,</text>
  <text x="126" y="130" font-size="13" text-anchor="middle" fill="#1f2328">in an agent session</text>
  <rect x="260" y="60" width="204" height="96" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="362" y="88" font-size="16" font-weight="700" text-anchor="middle" fill="#5f6b73">at each commit</text>
  <text x="362" y="110" font-size="13" text-anchor="middle" fill="#1f2328">the pre-commit hook,</text>
  <text x="362" y="130" font-size="13" text-anchor="middle" fill="#1f2328">on the staged files</text>
  <rect x="496" y="60" width="204" height="96" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="598" y="88" font-size="16" font-weight="700" text-anchor="middle" fill="#5f6b73">on the pull request</text>
  <text x="598" y="110" font-size="13" text-anchor="middle" fill="#1f2328">the pipeline: its gate job</text>
  <text x="598" y="130" font-size="13" text-anchor="middle" fill="#1f2328">is the required check</text>
  <rect x="732" y="60" width="204" height="96" rx="10" fill="#ffffff" stroke="#3d4449" stroke-width="2"/>
  <text x="834" y="88" font-size="16" font-weight="700" text-anchor="middle" fill="#3d4449">human review</text>
  <text x="834" y="110" font-size="13" text-anchor="middle" fill="#1f2328">after a green gate:</text>
  <text x="834" y="130" font-size="13" text-anchor="middle" fill="#1f2328">the design</text>
  <line x1="228" y1="108" x2="258" y2="108" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="464" y1="108" x2="494" y2="108" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="108" x2="730" y2="108" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M24,176 V188 H700 V176" fill="none" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="362" y="212" font-size="14" text-anchor="middle" font-style="italic" fill="#1f2328">the same rules, from the smallest scope to the whole project</text>
</svg>
