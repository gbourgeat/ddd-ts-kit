<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">How a builder makes its value</title>
  <desc id="desc">On the left, the valid defaults the builder declares once, and what a test states with the methods of the ubiquitous language. In the middle, props resolves them: the defaults, then what the test stated, every sequence, lazy and generated value drawn, every nested builder built. On the right, the two outputs of the same properties: build calls construct, which goes through the public API of the aggregate and gives an Order valid by construction; buildRequest, a method the project writes on its own builder from props, gives the request payload an end-to-end spec sends.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="470" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">How a builder makes its value</text>

  <!-- defaults -->
  <rect x="32" y="64" width="280" height="168" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="52" y="92" font-size="16" font-weight="700" fill="#5f6b73">defaults(), declared once</text>
  <line x1="48" y1="104" x2="296" y2="104" stroke="#5f6b73" stroke-opacity="0.35"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1f2328">
    <text x="52" y="130">id: sequence('order')</text>
    <text x="52" y="152">customer: aCustomer()</text>
    <text x="52" y="174">lines: [aLine()]</text>
    <text x="52" y="196">paid: false</text>
  </g>
  <text x="52" y="220" font-size="13" font-style="italic" fill="#5f6b73">valid values the rules accept</text>

  <!-- what the test states -->
  <rect x="32" y="256" width="280" height="150" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="52" y="284" font-size="16" font-weight="700" fill="#5f6b73">what the test states</text>
  <line x1="48" y1="296" x2="296" y2="296" stroke="#5f6b73" stroke-opacity="0.35"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1f2328">
    <text x="52" y="322">anOrder()</text>
    <text x="68" y="344">.paid()</text>
    <text x="68" y="366">.withLine(aLine())</text>
  </g>
  <text x="52" y="392" font-size="13" font-style="italic" fill="#5f6b73">only what the rule depends on</text>

  <!-- props -->
  <rect x="372" y="140" width="232" height="190" rx="10" fill="#ffffff" stroke="#3d4449" stroke-width="2"/>
  <text x="488" y="168" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">props()</text>
  <line x1="388" y1="180" x2="588" y2="180" stroke="#3d4449" stroke-opacity="0.35"/>
  <text x="488" y="204" font-size="13" fill="#1f2328" text-anchor="middle">the defaults, overridden by</text>
  <text x="488" y="226" font-size="13" fill="#1f2328" text-anchor="middle">what the test stated</text>
  <text x="488" y="256" font-size="13" fill="#1f2328" text-anchor="middle">each sequence, lazy and</text>
  <text x="488" y="278" font-size="13" fill="#1f2328" text-anchor="middle">generated value drawn,</text>
  <text x="488" y="300" font-size="13" fill="#1f2328" text-anchor="middle">each nested builder built</text>

  <!-- arrows into props -->
  <path d="M312,148 H340 V210 H368" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M312,330 H340 V262 H368" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- build: the aggregate -->
  <rect x="664" y="64" width="264" height="168" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="684" y="92" font-size="16" font-weight="700" fill="#2f6f4f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">build()</text>
  <line x1="680" y1="104" x2="912" y2="104" stroke="#2f6f4f" stroke-opacity="0.35"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1f2328">
    <text x="684" y="130">construct(props)</text>
    <text x="700" y="152">Order.place(…)</text>
    <text x="700" y="174">order.pay(…)</text>
  </g>
  <text x="684" y="204" font-size="13" font-weight="600" fill="#2f6f4f">an Order, valid by construction:</text>
  <text x="684" y="222" font-size="13" fill="#1f2328">domain, application, adapter specs</text>

  <!-- buildRequest: the payload -->
  <rect x="664" y="256" width="264" height="150" rx="10" fill="#f6ede6" stroke="#9a5b2b" stroke-width="2"/>
  <text x="684" y="284" font-size="16" font-weight="700" fill="#9a5b2b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">buildRequest()</text>
  <text x="684" y="306" font-size="13" font-style="italic" fill="#5f6b73">your method, written on props()</text>
  <line x1="680" y1="318" x2="912" y2="318" stroke="#9a5b2b" stroke-opacity="0.35"/>
  <text x="684" y="342" font-size="13" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">{ customerId, lines }</text>
  <text x="684" y="368" font-size="13" font-weight="600" fill="#9a5b2b">the request payload:</text>
  <text x="684" y="388" font-size="13" fill="#1f2328">end-to-end specs, through the API</text>

  <!-- arrows out of props -->
  <path d="M604,200 H634 V148 H660" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M604,270 H634 V330 H660" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="32" y="446" font-size="14" fill="#1f2328">Each step answers a new builder: anOrder() can be shared between tests, and each build draws its own order-1, order-2...</text>
</svg>
