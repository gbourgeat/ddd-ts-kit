<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="960" height="530" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Trois modèles derrière le même port Authorizer</title>
  <desc id="desc">Rôles : l'acteur a des rôles, un rôle accorde des permissions, et la réponse est la même pour chaque élément. Politiques sur attributs : les attributs de l'acteur, de la ressource et du moment alimentent des règles permit et forbid, et un forbid qui s'applique l'emporte. Relations : des tuples enregistrés disent qu'Ada possède le calendrier 42, dont le parent est la clinique 7, dont Bob est membre ; un chemin de tuples donne le calendrier à Bob.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="530" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Trois modèles derrière le même port Authorizer</text>
  <rect x="24" y="58" width="288" height="448" rx="12" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="40" y="86" font-size="16" font-weight="700" fill="#1f2328">Rôles (RBAC)</text>
  <text x="40" y="108" font-size="13" font-style="italic" fill="#5f6b73">un des rôles de l'acteur l'accorde-t-il ?</text>
  <text x="40" y="490" font-size="13" fill="#5f6b73">coût constant ; aveugle à l'élément</text>
  <rect x="336" y="58" width="288" height="448" rx="12" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="352" y="86" font-size="16" font-weight="700" fill="#1f2328">Politiques sur attributs (ABAC)</text>
  <text x="352" y="108" font-size="13" font-style="italic" fill="#5f6b73">les attributs satisfont-ils une règle ?</text>
  <text x="352" y="490" font-size="13" fill="#5f6b73">par élément ; ne liste pas</text>
  <rect x="648" y="58" width="288" height="448" rx="12" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="664" y="86" font-size="16" font-weight="700" fill="#1f2328">Relations (ReBAC)</text>
  <text x="664" y="108" font-size="13" font-style="italic" fill="#5f6b73">un chemin de tuples mène-t-il à l'acteur ?</text>
  <text x="664" y="490" font-size="13" fill="#5f6b73">par élément ; liste par expansion inverse</text>
  <!-- roles -->
  <rect x="48" y="130" width="240" height="72" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="168.0" y="156" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">acteur ada</text>
  <line x1="62" y1="166" x2="274" y2="166" stroke="#2b5d8a" stroke-opacity="0.35"/>
  <text x="168.0" y="186" font-size="13" fill="#1f2328" text-anchor="middle">rôles : receptionist</text>
  <line x1="168" y1="204" x2="168" y2="234" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="48" y="238" width="240" height="92" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="168.0" y="264" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">rôle receptionist</text>
  <line x1="62" y1="274" x2="274" y2="274" stroke="#2b5d8a" stroke-opacity="0.35"/>
  <text x="168.0" y="294" font-size="13" fill="#1f2328" text-anchor="middle">accorde appointments:*, soit</text>
  <text x="168.0" y="314" font-size="13" fill="#1f2328" text-anchor="middle">appointment.book et .cancel</text>
  <line x1="168" y1="332" x2="168" y2="362" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="48" y="366" width="240" height="72" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="168.0" y="392" font-size="16" font-weight="700" fill="#2f6f4f" text-anchor="middle">appointment.book</text>
  <line x1="62" y1="402" x2="274" y2="402" stroke="#2f6f4f" stroke-opacity="0.35"/>
  <text x="168.0" y="422" font-size="13" fill="#1f2328" text-anchor="middle">accordé, sur chaque élément</text>
  <!-- attribute policies -->
  <rect x="360" y="130" width="240" height="112" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="480.0" y="156" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">attributs</text>
  <line x1="374" y1="166" x2="586" y2="166" stroke="#5f6b73" stroke-opacity="0.35"/>
  <text x="480.0" y="186" font-size="13" fill="#1f2328" text-anchor="middle">acteur : clinique 7</text>
  <text x="480.0" y="206" font-size="13" fill="#1f2328" text-anchor="middle">ressource : clinique 7, client actif</text>
  <text x="480.0" y="226" font-size="13" fill="#1f2328" text-anchor="middle">moment : 10 h 30, ouvert</text>
  <line x1="480" y1="244" x2="480" y2="268" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="360" y="272" width="240" height="112" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="480.0" y="298" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">règles</text>
  <line x1="374" y1="308" x2="586" y2="308" stroke="#2b5d8a" stroke-opacity="0.35"/>
  <text x="480.0" y="328" font-size="13" fill="#1f2328" text-anchor="middle">permit : même clinique,</text>
  <text x="480.0" y="348" font-size="13" fill="#1f2328" text-anchor="middle">pendant les heures d'ouverture</text>
  <text x="480.0" y="368" font-size="13" fill="#1f2328" text-anchor="middle">forbid : client suspendu</text>
  <line x1="480" y1="386" x2="480" y2="410" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="360" y="414" width="240" height="52" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="480" y="446" font-size="14" font-weight="700" fill="#2f6f4f" text-anchor="middle">un forbid applicable l'emporte</text>
  <!-- relationships: tuples as edges from the object to the subject -->
  <rect x="737" y="132" width="110" height="36" rx="8" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="1.5"/>
  <text x="792.0" y="155" font-size="14" font-weight="600" fill="#2f6f4f" text-anchor="middle">calendar:42</text>
  <rect x="660" y="228" width="110" height="36" rx="8" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="715.0" y="251" font-size="14" font-weight="600" fill="#5f6b73" text-anchor="middle">user:ada</text>
  <rect x="814" y="228" width="110" height="36" rx="8" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="1.5"/>
  <text x="869.0" y="251" font-size="14" font-weight="600" fill="#2f6f4f" text-anchor="middle">clinic:7</text>
  <rect x="814" y="320" width="110" height="36" rx="8" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="869.0" y="343" font-size="14" font-weight="600" fill="#5f6b73" text-anchor="middle">user:bob</text>
  <line x1="772" y1="170" x2="730" y2="224" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="812" y1="170" x2="854" y2="224" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="869" y1="266" x2="869" y2="316" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="744" y="204" font-size="13" fill="#1f2328" text-anchor="end">owner</text>
  <text x="842" y="204" font-size="13" fill="#1f2328">parent</text>
  <text x="877" y="296" font-size="13" fill="#1f2328">member</text>
  <text x="664" y="392" font-size="13" font-weight="600" fill="#1f2328">bob peut-il gérer calendar:42 ?</text>
  <text x="664" y="412" font-size="13" fill="#1f2328">oui : le propriétaire de calendar:42,</text>
  <text x="664" y="430" font-size="13" fill="#1f2328">ou un membre de sa clinique parente,</text>
  <text x="664" y="448" font-size="13" fill="#1f2328">et bob est membre de clinic:7</text>
</svg>
