<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 568" width="960" height="568" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Ce qu'émet le kit, et où cela va</title>
  <desc id="desc">Dans le processus de l'API, la plateforme lie quatre choses. Les traces partent en OTLP/HTTP, par un Collector OpenTelemetry facultatif, vers Jaeger ou Grafana Tempo. Les lignes de journal partent sur la sortie standard, vers votre pipeline de journaux. Les rapports d'erreur vont à Sentry ou à GlitchTip, par le même adaptateur avec un autre DSN. Les métriques partent aussi en OTLP/HTTP, depuis openTelemetryMetrics, vers un stockage qui reçoit des métriques OTLP.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="568" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Ce qu'émet le kit, et où cela va</text>
  <!-- process -->
  <rect x="24" y="60" width="372" height="384" rx="14" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="44" y="88" font-size="14" font-weight="600" fill="#5f6b73">Processus de l'API : lié par src/platform</text>
  <!-- traces -->
  <rect x="44" y="104" width="332" height="68" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="62" y="132" font-size="16" font-weight="700" fill="#7a4f9a">traces</text>
  <text x="62" y="156" font-size="13" fill="#1f2328">initTracing, traceApplication()</text>
  <!-- logs -->
  <rect x="44" y="188" width="332" height="68" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="62" y="216" font-size="16" font-weight="700" fill="#7a4f9a">lignes de journal</text>
  <text x="62" y="240" font-size="13" fill="#1f2328">Logger : StdoutLogger, pino ou winston</text>
  <!-- errors -->
  <rect x="44" y="272" width="332" height="68" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="62" y="300" font-size="16" font-weight="700" fill="#7a4f9a">rapports d'erreur</text>
  <text x="62" y="324" font-size="13" fill="#1f2328">ErrorReporter : initSentry(...)</text>
  <!-- metrics -->
  <rect x="44" y="356" width="332" height="68" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="62" y="384" font-size="16" font-weight="700" fill="#7a4f9a">métriques</text>
  <text x="62" y="408" font-size="13" fill="#1f2328">Metrics : openTelemetryMetrics()</text>
  <!-- collector -->
  <rect x="470" y="104" width="196" height="68" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="568" y="132" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">Collector</text>
  <text x="568" y="156" font-size="13" fill="#1f2328" text-anchor="middle">facultatif : tail sampling</text>
  <!-- backends -->
  <rect x="736" y="70" width="196" height="44" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="834" y="98" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">Jaeger</text>
  <rect x="736" y="124" width="196" height="44" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="834" y="152" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">Grafana Tempo</text>
  <rect x="470" y="188" width="462" height="68" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="488" y="216" font-size="16" font-weight="700" fill="#5f6b73">votre pipeline de journaux</text>
  <text x="488" y="240" font-size="13" fill="#1f2328">ce qui collecte la sortie de vos conteneurs (Loki, par exemple)</text>
  <rect x="470" y="272" width="462" height="68" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="488" y="300" font-size="16" font-weight="700" fill="#5f6b73">Sentry ou GlitchTip</text>
  <text x="488" y="324" font-size="13" fill="#1f2328">un adaptateur pour les deux : seul le DSN change</text>
  <rect x="470" y="356" width="462" height="68" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="488" y="384" font-size="16" font-weight="700" fill="#5f6b73">un stockage de métriques</text>
  <text x="488" y="408" font-size="13" fill="#1f2328">qui reçoit des métriques OTLP (un Collector, par exemple)</text>
  <!-- arrows -->
  <line x1="378" y1="138" x2="466" y2="138" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="422" y="128" font-size="13" fill="#1f2328" text-anchor="middle">OTLP/HTTP</text>
  <line x1="668" y1="126" x2="732" y2="96" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="668" y1="146" x2="732" y2="146" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="378" y1="222" x2="466" y2="222" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="422" y="212" font-size="13" fill="#1f2328" text-anchor="middle">stdout</text>
  <line x1="378" y1="306" x2="466" y2="306" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="422" y="296" font-size="13" fill="#1f2328" text-anchor="middle">DSN</text>
  <line x1="378" y1="390" x2="466" y2="390" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="422" y="380" font-size="13" fill="#1f2328" text-anchor="middle">OTLP/HTTP</text>
  <!-- what ties them -->
  <text x="40" y="464" font-size="14" font-weight="600" fill="#1f2328">Un identifiant de trace sur chaque span, ligne de journal et rapport d'erreur ;</text>
  <text x="40" y="484" font-size="14" font-weight="600" fill="#1f2328">l'identifiant de corrélation sur le span racine, chaque ligne de journal et chaque rapport d'erreur.</text>
  <!-- legend -->
  <line x1="40" y1="520" x2="84" y2="520" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="96" y="525" font-size="14" fill="#1f2328">livré et câblé par le kit</text>
  <line x1="40" y1="546" x2="84" y2="546" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="96" y="551" font-size="14" fill="#1f2328">à écrire par vous ; une boîte en pointillés est facultative ou non livrée</text>
</svg>
