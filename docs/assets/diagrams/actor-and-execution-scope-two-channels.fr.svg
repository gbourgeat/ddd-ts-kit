<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Deux canaux : l'acteur voyage dans le message, la portée d'exécution entoure le travail</title>
  <desc id="desc">Les frontières (une requête HTTP, un événement consommé, un job planifié) font deux choses. Elles construisent la commande ou la requête, dont le premier argument est l'acteur : le gestionnaire ne lit que sa commande, et le domaine reçoit des identifiants en arguments, jamais un acteur. Et elles ouvrent la portée d'exécution de l'unité de travail, avec les identifiants de corrélation et de causalité, le tenant, la session, l'origine, l'échéance et l'instant où un job était dû. Seules l'infrastructure et la plateforme lisent la portée : les adaptateurs de repository pour les colonnes d'audit et la condition de tenant, les loggers et le traçage, le décorateur du publisher qui appose la corrélation sur les événements, le journal d'audit. Les gestionnaires et le domaine ne la lisent jamais.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="520" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Deux canaux : l'acteur dans le message, la portée autour du travail</text>
  <!-- boundaries -->
  <rect x="24" y="78" width="240" height="372" rx="10" fill="#f6ede6" stroke="#9a5b2b" stroke-width="2"/>
  <text x="144" y="106" font-size="16" font-weight="700" fill="#9a5b2b" text-anchor="middle">frontières</text>
  <line x1="40" y1="118" x2="248" y2="118" stroke="#9a5b2b" stroke-opacity="0.35"/>
  <text x="144" y="160" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">requête HTTP</text>
  <text x="144" y="180" font-size="13" fill="#1f2328" text-anchor="middle">l'acteur tiré du jeton</text>
  <text x="144" y="250" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">événement consommé</text>
  <text x="144" y="270" font-size="13" fill="#1f2328" text-anchor="middle">l'acteur système du consommateur,</text>
  <text x="144" y="288" font-size="13" fill="#1f2328" text-anchor="middle">la corrélation de l'événement</text>
  <text x="144" y="358" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">job planifié</text>
  <text x="144" y="378" font-size="13" fill="#1f2328" text-anchor="middle">l'acteur système du job,</text>
  <text x="144" y="396" font-size="13" fill="#1f2328" text-anchor="middle">une corrélation neuve</text>
  <!-- explicit lane -->
  <text x="320" y="68" font-size="14" font-weight="600" fill="#2b5d8a">explicite : l'acteur voyage dans le message</text>
  <rect x="320" y="78" width="220" height="80" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="430" y="106" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">commande ou requête</text>
  <text x="430" y="130" font-size="13" fill="#1f2328" text-anchor="middle">premier argument : l'acteur</text>
  <rect x="600" y="78" width="164" height="80" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="682" y="106" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">gestionnaire</text>
  <text x="682" y="130" font-size="13" fill="#1f2328" text-anchor="middle">lit sa commande</text>
  <rect x="800" y="78" width="136" height="80" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="868" y="106" font-size="16" font-weight="700" fill="#2f6f4f" text-anchor="middle">domaine</text>
  <text x="868" y="128" font-size="13" fill="#1f2328" text-anchor="middle">sans acteur :</text>
  <text x="868" y="146" font-size="13" fill="#1f2328" text-anchor="middle">ids en arguments</text>
  <line x1="266" y1="118" x2="316" y2="118" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="542" y1="118" x2="596" y2="118" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="766" y1="118" x2="796" y2="118" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- ambient lane -->
  <text x="320" y="320" font-size="14" font-weight="600" fill="#5f6b73">ambiante : ouverte une fois, lue par l'infrastructure seule</text>
  <rect x="320" y="330" width="220" height="104" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="430" y="358" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">portée d'exécution</text>
  <text x="430" y="382" font-size="13" fill="#1f2328" text-anchor="middle">correlationId, causationId</text>
  <text x="430" y="402" font-size="13" fill="#1f2328" text-anchor="middle">tenantId, session, origin</text>
  <text x="430" y="422" font-size="13" fill="#1f2328" text-anchor="middle">deadline, scheduledAt</text>
  <rect x="600" y="330" width="336" height="140" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="768" y="358" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">infrastructure et plateforme</text>
  <text x="616" y="382" font-size="13" fill="#1f2328">repositories : colonnes d'audit,</text>
  <text x="632" y="400" font-size="13" fill="#1f2328">condition de tenant</text>
  <text x="616" y="422" font-size="13" fill="#1f2328">loggers, traçage : corrélation, id de l'acteur</text>
  <text x="616" y="442" font-size="13" fill="#1f2328">publisher : corrélation apposée aux événements</text>
  <text x="616" y="462" font-size="13" fill="#1f2328">journal d'audit : acteur, session, origine</text>
  <line x1="266" y1="382" x2="316" y2="382" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="542" y1="382" x2="596" y2="382" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- never read by the handler and the domain -->
  <line x1="510" y1="300" x2="672" y2="160" stroke="#5f6b73" stroke-width="2" stroke-dasharray="3 5"/>
  <text x="620" y="252" font-size="13" font-style="italic" fill="#5f6b73">jamais lue par les gestionnaires</text>
  <text x="620" y="270" font-size="13" font-style="italic" fill="#5f6b73">ni par le domaine</text>
  <!-- legend -->
  <line x1="40" y1="492" x2="84" y2="492" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="96" y="497" font-size="14" fill="#1f2328">construit, ouvre, transmet ou lit</text>
  <line x1="420" y1="492" x2="464" y2="492" stroke="#5f6b73" stroke-width="2" stroke-dasharray="3 5"/>
  <text x="476" y="497" font-size="14" fill="#1f2328">aucun accès</text>
</svg>
