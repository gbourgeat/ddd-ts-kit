<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Two instances, one run per occurrence</title>
  <desc id="desc">Instance A and instance B both compute the 07:00 occurrence. A asks the shared lock for the key of the occurrence, made of the job name and the due instant, and gets it. B asks for the same key, finds it held and records skipped-locked. A runs the job, which sends SendReminders with scheduledAt 07:00. The key is kept after the run, so a late timer cannot run the occurrence again.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="560" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Two instances, one run per occurrence</text>
  <!-- participants -->
  <rect x="90" y="60" width="180" height="48" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="180" y="90" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">instance A</text>
  <rect x="380" y="60" width="200" height="48" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="480" y="82" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">Lock</text>
  <text x="480" y="100" font-size="13" fill="#1f2328" text-anchor="middle">on a shared store</text>
  <rect x="690" y="60" width="180" height="48" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="780" y="90" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">instance B</text>
  <!-- lifelines -->
  <line x1="180" y1="108" x2="180" y2="536" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="480" y1="108" x2="480" y2="536" stroke="#7a4f9a" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="780" y1="108" x2="780" y2="536" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="5 5"/>
  <!-- 07:00 -->
  <rect x="120" y="124" width="720" height="32" rx="8" fill="#e7eef5" stroke="#2b5d8a" stroke-width="1.5"/>
  <text x="480" y="145" font-size="14" fill="#1f2328" text-anchor="middle">07:00: both instances compute the same occurrence</text>
  <!-- A acquires -->
  <text x="330" y="182" font-size="13" fill="#1f2328" text-anchor="middle">acquire the key</text>
  <text x="330" y="200" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">job:&lt;name&gt;:&lt;due instant&gt;</text>
  <line x1="182" y1="210" x2="476" y2="210" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="330" y="244" font-size="13" fill="#1f2328" text-anchor="middle">granted</text>
  <line x1="478" y1="254" x2="184" y2="254" stroke="#3d4449" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <!-- B tries -->
  <text x="630" y="290" font-size="13" fill="#1f2328" text-anchor="middle">acquire the same key</text>
  <line x1="778" y1="300" x2="484" y2="300" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="630" y="334" font-size="13" fill="#1f2328" text-anchor="middle">held by somebody else</text>
  <line x1="482" y1="344" x2="776" y2="344" stroke="#3d4449" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <!-- outcomes -->
  <rect x="60" y="276" width="240" height="66" rx="8" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="180" y="300" font-size="13" font-weight="700" fill="#2b5d8a" text-anchor="middle">runs the job</text>
  <text x="180" y="320" font-size="13" fill="#1f2328" text-anchor="middle">SendReminders</text>
  <text x="180" y="336" font-size="13" fill="#1f2328" text-anchor="middle">(scheduledAt 07:00)</text>
  <rect x="660" y="368" width="240" height="58" rx="8" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="780" y="392" font-size="13" font-weight="700" fill="#5f6b73" text-anchor="middle">does not run it</text>
  <text x="780" y="414" font-size="13" fill="#1f2328" text-anchor="middle">records skipped-locked</text>
  <!-- the key is kept -->
  <rect x="270" y="448" width="420" height="62" rx="8" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="1.5"/>
  <text x="480" y="473" font-size="13" fill="#1f2328" text-anchor="middle">the key is kept after the run, until its time to live:</text>
  <text x="480" y="493" font-size="13" fill="#1f2328" text-anchor="middle">a late timer cannot run the occurrence again</text>
</svg>
