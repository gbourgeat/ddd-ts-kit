<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Three shapes: where the boundaries are, and what holds them</title>
  <desc id="desc">Three panels. A layered monolith: one process cut into technical layers across the whole application, over one schema joined freely; nothing holds a boundary between features. A modular monolith: one process cut into bounded contexts, each layered inside and with its own schema, collaborating by events; static analysis and tests hold the boundaries. Microservices: one process per bounded context, each with its own database, talking over the network; the network holds the boundaries.</desc>
  <defs>
    <marker id="arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="470" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Three shapes: where the boundaries are, and what holds them</text>
