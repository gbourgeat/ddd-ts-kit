<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 484" width="960" height="484" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Generated files travel with what generated them</title>
  <desc id="desc">The same work in two histories. On the left, a use case and an event version are committed without their regenerated contracts, which a third commit adds: the first two commits fail verify. On the right, each commit carries the contract it changed: every commit passes verify, so git bisect can stop on any of them and git revert takes a feature together with its contract.</desc>
  <rect width="960" height="484" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Generated files travel with what generated them</text>

  <!-- instead of -->
  <rect x="24" y="58" width="448" height="378" rx="14" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="44" y="84" font-size="14" font-weight="600" fill="#5f6b73">Instead of: the contracts regenerated in a later commit</text>
  <line x1="44" y1="148" x2="44" y2="364" stroke="#5f6b73" stroke-width="2"/>

  <circle cx="44" cy="148" r="7" fill="#ffffff" stroke="#5f6b73" stroke-width="2"/>
  <rect x="64" y="100" width="392" height="96" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="80" y="124" font-size="13" font-weight="700" fill="#1f2328">feat(scheduling): reschedule an appointment</text>
  <text x="80" y="146" font-size="13" fill="#1f2328">by hand: the command, the handler, the route, specs</text>
  <text x="80" y="166" font-size="13" fill="#5f6b73">generated: nothing</text>
  <text x="80" y="186" font-size="13" font-weight="700" fill="#1f2328">✗ verify fails: the OpenAPI document drifted</text>

  <circle cx="44" cy="256" r="7" fill="#ffffff" stroke="#5f6b73" stroke-width="2"/>
  <rect x="64" y="208" width="392" height="96" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="80" y="232" font-size="13" font-weight="700" fill="#1f2328">feat(scheduling): publish appointment.rescheduled v1</text>
  <text x="80" y="254" font-size="13" fill="#1f2328">by hand: the integration event, its publisher</text>
  <text x="80" y="274" font-size="13" fill="#5f6b73">generated: nothing</text>
  <text x="80" y="294" font-size="13" font-weight="700" fill="#1f2328">✗ verify fails: the event catalog drifted</text>

  <circle cx="44" cy="364" r="7" fill="#3d4449" stroke="#3d4449" stroke-width="2"/>
  <rect x="64" y="316" width="392" height="96" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="2"/>
  <text x="80" y="340" font-size="13" font-weight="700" fill="#1f2328">docs: regenerate</text>
  <text x="80" y="362" font-size="13" fill="#1f2328">by hand: nothing</text>
  <text x="80" y="382" font-size="13" fill="#5f6b73">generated: OpenAPI, AsyncAPI, event catalog</text>
  <text x="80" y="402" font-size="13" font-weight="700" fill="#1f2328">✓ verify passes</text>

  <!-- write -->
  <rect x="488" y="58" width="448" height="378" rx="14" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="508" y="84" font-size="14" font-weight="600" fill="#5f6b73">Write: each change with what it generated</text>
  <line x1="508" y1="148" x2="508" y2="256" stroke="#5f6b73" stroke-width="2"/>

  <circle cx="508" cy="148" r="7" fill="#3d4449" stroke="#3d4449" stroke-width="2"/>
  <rect x="528" y="100" width="392" height="96" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="544" y="124" font-size="13" font-weight="700" fill="#1f2328">feat(scheduling): reschedule an appointment</text>
  <text x="544" y="146" font-size="13" fill="#1f2328">by hand: the command, the handler, the route, specs</text>
  <text x="544" y="166" font-size="13" fill="#5f6b73">generated: openapi/openapi.yaml</text>
  <text x="544" y="186" font-size="13" font-weight="700" fill="#1f2328">✓ verify passes</text>

  <circle cx="508" cy="256" r="7" fill="#3d4449" stroke="#3d4449" stroke-width="2"/>
  <rect x="528" y="208" width="392" height="96" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="544" y="232" font-size="13" font-weight="700" fill="#1f2328">feat(scheduling): publish appointment.rescheduled v1</text>
  <text x="544" y="254" font-size="13" fill="#1f2328">by hand: the integration event, its publisher</text>
  <text x="544" y="274" font-size="13" fill="#5f6b73">generated: AsyncAPI, event catalog</text>
  <text x="544" y="294" font-size="13" font-weight="700" fill="#1f2328">✓ verify passes</text>

  <text x="528" y="340" font-size="13" fill="#1f2328">Two commits instead of three, each one whole:</text>
  <text x="528" y="360" font-size="13" fill="#1f2328">git bisect may stop on either, and git revert</text>
  <text x="528" y="380" font-size="13" fill="#1f2328">takes a feature away with its contract.</text>

  <text x="32" y="466" font-size="14" fill="#1f2328">A dashed commit leaves the project red: bisection lands on it and cannot tell a fault from a missing file.</text>
</svg>
