<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Un port Authorizer, trois endroits où la décision est calculée</title>
  <desc id="desc">Un cas d'usage exige une permission ; le middleware d'autorisation interroge le port Authorizer avant que le gestionnaire s'exécute. Rien de cela ne change avec le choix du moteur. Derrière le port, un adaptateur : les autoriseurs en processus du kit, qui lisent les rôles et les tuples de votre propre base, l'adaptateur d'un moteur de relations distant (OpenFgaAuthorizer, ou le vôtre pour SpiceDB) qui appelle son serveur, ou votre adaptateur autour d'un moteur de politiques embarqué (Cedar, Open Policy Agent) qui évalue les attributs passés avec chaque requête.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
    <marker id="arrow-infrastructure" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a4f9a"/>
    </marker>
  </defs>
  <rect width="960" height="660" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Un port Authorizer, trois endroits où la décision est calculée</text>
  <!-- what does not change -->
  <rect x="24" y="56" width="912" height="276" rx="12" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="44" y="82" font-size="14" font-weight="600" fill="#5f6b73">identique quel que soit le choix</text>
  <text x="44" y="102" font-size="13" fill="#5f6b73">permissions, cas d'usage,</text>
  <text x="44" y="120" font-size="13" fill="#5f6b73">gestionnaires, routes, leurs tests</text>
  <rect x="330" y="92" width="300" height="56" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="480" y="116" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">un cas d'usage</text>
  <text x="480" y="137" font-size="13" fill="#1f2328" text-anchor="middle">exige appointment.cancel</text>
  <line x1="480" y1="148" x2="480" y2="170" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="330" y="174" width="300" height="56" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="480" y="198" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">middleware d'autorisation</text>
  <text x="480" y="219" font-size="13" fill="#1f2328" text-anchor="middle">interroge avant le gestionnaire</text>
  <line x1="480" y1="230" x2="480" y2="252" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="330" y="256" width="300" height="56" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="3"/>
  <text x="480" y="280" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">port Authorizer</text>
  <text x="480" y="301" font-size="13" fill="#1f2328" text-anchor="middle">check(), listAccessible()</text>
  <!-- the choice -->
  <rect x="24" y="346" width="912" height="290" rx="12" fill="#ffffff" stroke="#7a4f9a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="44" y="622" font-size="14" font-weight="600" fill="#7a4f9a">le choix : l'adaptateur lié au port, et les données qu'il lit</text>
  <!-- adapters -->
  <rect x="40" y="384" width="280" height="100" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="180" y="410" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">en processus</text>
  <line x1="56" y1="420" x2="304" y2="420" stroke="#7a4f9a" stroke-opacity="0.35"/>
  <text x="180" y="442" font-size="13" fill="#1f2328" text-anchor="middle">RoleBasedAuthorizer</text>
  <text x="180" y="460" font-size="13" fill="#1f2328" text-anchor="middle">PolicyBasedAuthorizer</text>
  <text x="180" y="478" font-size="13" fill="#1f2328" text-anchor="middle">RelationBasedAuthorizer</text>
  <rect x="340" y="384" width="280" height="100" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="480" y="410" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">moteur de relations distant</text>
  <line x1="356" y1="420" x2="604" y2="420" stroke="#7a4f9a" stroke-opacity="0.35"/>
  <text x="480" y="442" font-size="13" fill="#1f2328" text-anchor="middle">OpenFgaAuthorizer</text>
  <text x="480" y="460" font-size="13" fill="#1f2328" text-anchor="middle">(@ddd-ts-kit/openfga)</text>
  <text x="480" y="478" font-size="13" fill="#1f2328" text-anchor="middle">ou votre adaptateur SpiceDB</text>
  <rect x="640" y="384" width="280" height="100" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="780" y="410" font-size="15" font-weight="700" fill="#7a4f9a" text-anchor="middle">moteur de politiques embarqué</text>
  <line x1="656" y1="420" x2="904" y2="420" stroke="#7a4f9a" stroke-opacity="0.35"/>
  <text x="780" y="442" font-size="13" fill="#1f2328" text-anchor="middle">votre adaptateur autour de</text>
  <text x="780" y="460" font-size="13" fill="#1f2328" text-anchor="middle">Cedar (WebAssembly)</text>
  <text x="780" y="478" font-size="13" fill="#1f2328" text-anchor="middle">ou d'Open Policy Agent</text>
  <!-- implements -->
  <line x1="180" y1="382" x2="436" y2="316" stroke="#7a4f9a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-infrastructure)"/>
  <line x1="480" y1="382" x2="480" y2="316" stroke="#7a4f9a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-infrastructure)"/>
  <line x1="780" y1="382" x2="524" y2="316" stroke="#7a4f9a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-infrastructure)"/>
  <!-- data -->
  <rect x="40" y="522" width="280" height="64" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="180" y="548" font-size="14" font-weight="700" fill="#5f6b73" text-anchor="middle">vos propres données</text>
  <text x="180" y="570" font-size="13" fill="#1f2328" text-anchor="middle">rôles du jeton, tuples de votre base</text>
  <rect x="340" y="522" width="280" height="64" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="480" y="548" font-size="14" font-weight="700" fill="#5f6b73" text-anchor="middle">serveur OpenFGA ou SpiceDB</text>
  <text x="480" y="570" font-size="13" fill="#1f2328" text-anchor="middle">son propre stockage, HTTP ou gRPC</text>
  <rect x="640" y="522" width="280" height="64" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="780" y="548" font-size="14" font-weight="700" fill="#5f6b73" text-anchor="middle">politiques et attributs</text>
  <text x="780" y="570" font-size="13" fill="#1f2328" text-anchor="middle">passés avec chaque requête</text>
  <line x1="180" y1="484" x2="180" y2="518" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="484" x2="480" y2="518" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="780" y1="484" x2="780" y2="518" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- legend -->
  <line x1="690" y1="82" x2="734" y2="78" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="746" y="87" font-size="14" fill="#1f2328">appelle, lit</text>
  <line x1="690" y1="108" x2="734" y2="104" stroke="#7a4f9a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-infrastructure)"/>
  <text x="746" y="113" font-size="14" fill="#1f2328">implémente le port</text>
</svg>
