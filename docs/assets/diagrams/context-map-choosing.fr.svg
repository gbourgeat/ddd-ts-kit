<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Choisir un patron de relation</title>
  <desc id="desc">Un arbre de décision. Les deux contextes ont-ils besoin l'un de l'autre ? Sinon, chemins séparés : ne rien déclarer. Si oui : le concept est-il identique et change-t-il en même temps ? Si oui, un noyau partagé, gardé petit. Sinon : contrôlez-vous l'amont ou pouvez-vous l'influencer ? Dans le même produit, langage publié ; avec une autre équipe qui planifie avec vous, client-fournisseur. Sinon : son modèle est-il acceptable dans le vôtre ? Si oui, conformiste ; sinon, une couche anticorruption.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="520" rx="16" fill="#ffffff"/>
  <text x="32" y="36" font-size="18" font-weight="600" fill="#1f2328">Choisir le patron d'une relation</text>
  <rect x="40" y="64" width="440" height="48" rx="8" fill="#ffffff" stroke="#3d4449" stroke-width="1.5"/>
  <text x="260" y="94" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Les deux contextes ont-ils besoin l'un de l'autre ?</text>
  <rect x="40" y="164" width="440" height="48" rx="8" fill="#ffffff" stroke="#3d4449" stroke-width="1.5"/>
  <text x="260" y="194" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Le concept est-il identique, et change-t-il en même temps ?</text>
  <rect x="40" y="264" width="440" height="48" rx="8" fill="#ffffff" stroke="#3d4449" stroke-width="1.5"/>
  <text x="260" y="294" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Contrôlez-vous l'amont, ou l'influencez-vous ?</text>
  <rect x="40" y="394" width="440" height="48" rx="8" fill="#ffffff" stroke="#3d4449" stroke-width="1.5"/>
  <text x="260" y="424" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Son modèle est-il acceptable dans le vôtre ?</text>
  <line x1="260" y1="114" x2="260" y2="160" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="272" y="141" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">oui</text>
  <line x1="260" y1="214" x2="260" y2="260" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="272" y="241" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">non</text>
  <line x1="260" y1="314" x2="260" y2="390" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="272" y="356" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">non</text>
  <rect x="576" y="66" width="344" height="44" rx="8" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="592" y="85" font-size="14" font-weight="700" fill="#2b5d8a" text-anchor="start">chemins séparés</text>
  <text x="592" y="103" font-size="13" fill="#1f2328" text-anchor="start">ne rien déclarer</text>
  <rect x="576" y="166" width="344" height="44" rx="8" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="592" y="185" font-size="14" font-weight="700" fill="#2b5d8a" text-anchor="start">noyau partagé</text>
  <text x="592" y="203" font-size="13" fill="#1f2328" text-anchor="start">gardé petit</text>
  <rect x="576" y="236" width="344" height="44" rx="8" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="592" y="255" font-size="14" font-weight="700" fill="#2b5d8a" text-anchor="start">langage publié</text>
  <text x="592" y="273" font-size="13" fill="#1f2328" text-anchor="start">oui, le même produit</text>
  <rect x="576" y="292" width="344" height="44" rx="8" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="592" y="311" font-size="14" font-weight="700" fill="#2b5d8a" text-anchor="start">client-fournisseur</text>
  <text x="592" y="329" font-size="13" fill="#1f2328" text-anchor="start">oui, une autre équipe qui planifie avec vous</text>
  <rect x="576" y="362" width="344" height="44" rx="8" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="592" y="381" font-size="14" font-weight="700" fill="#2b5d8a" text-anchor="start">conformiste</text>
  <text x="592" y="399" font-size="13" fill="#1f2328" text-anchor="start">son modèle convient</text>
  <rect x="576" y="430" width="344" height="44" rx="8" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="592" y="449" font-size="14" font-weight="700" fill="#2b5d8a" text-anchor="start">couche anticorruption</text>
  <text x="592" y="467" font-size="13" fill="#1f2328" text-anchor="start">traduire à votre frontière</text>
  <line x1="482" y1="88" x2="572" y2="88" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="526" y="80" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">non</text>
  <line x1="482" y1="188" x2="572" y2="188" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="526" y="180" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">oui</text>
  <path d="M482,272 H528 V258 H572" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M482,302 H528 V314 H572" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="504" y="266" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">oui</text>
  <text x="504" y="296" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">oui</text>
  <path d="M482,404 H528 V384 H572" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M482,432 H528 V452 H572" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="504" y="398" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">oui</text>
  <text x="504" y="450" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">non</text>
  <text x="32" y="500" font-size="14" fill="#1f2328" text-anchor="start">Un amont qui sert de nombreux consommateurs ajoute de son côté un service hôte ouvert.</text>
</svg>
