  <line x1="232" y1="435.0" x2="274" y2="435.0" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="246" y="422" font-size="13" fill="#1f2328" text-anchor="middle">no</text>
  <rect x="276" y="412" width="196" height="46" rx="10" fill="#f6ede6" stroke="#9a5b2b" stroke-width="2"/>
  <text x="374" y="431" font-size="14" font-weight="700" fill="#9a5b2b" text-anchor="middle">ForbiddenError</text>
  <text x="374" y="449" font-size="13" fill="#1f2328" text-anchor="middle">FORBIDDEN, 403, reason</text>
  <line x1="127.0" y1="460" x2="127.0" y2="482" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
