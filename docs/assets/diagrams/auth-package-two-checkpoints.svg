  <text x="246" y="278" font-size="13" fill="#1f2328" text-anchor="middle">no</text>
  <rect x="276" y="268" width="196" height="46" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="374" y="287" font-size="14" font-weight="700" fill="#5f6b73" text-anchor="middle">MissingActorError</text>
  <text x="374" y="305" font-size="13" fill="#1f2328" text-anchor="middle">a bug: fails a test</text>
  <line x1="127.0" y1="316" x2="127.0" y2="338" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="136.0" y="332" font-size="13" fill="#1f2328">yes</text>
  <rect x="24" y="340" width="206" height="46" rx="10" fill="#ffffff" stroke="#2b5d8a" stroke-width="2"/>
