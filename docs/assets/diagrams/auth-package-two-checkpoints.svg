  <text x="136.0" y="188" font-size="13" fill="#1f2328">yes</text>
  <rect x="24" y="196" width="206" height="46" rx="10" fill="#ffffff" stroke="#2b5d8a" stroke-width="2"/>
  <text x="127" y="224" font-size="13" fill="#1f2328" text-anchor="middle">declared public?</text>
  <line x1="232" y1="219.0" x2="274" y2="219.0" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="246" y="206" font-size="13" fill="#1f2328" text-anchor="middle">yes</text>
  <rect x="276" y="196" width="196" height="46" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="374" y="215" font-size="14" font-weight="700" fill="#2b5d8a" text-anchor="middle">handler runs</text>
  <text x="374" y="233" font-size="13" fill="#1f2328" text-anchor="middle">nothing is asked</text>
  <line x1="127.0" y1="244" x2="127.0" y2="266" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="136.0" y="260" font-size="13" fill="#1f2328">no</text>
  <rect x="24" y="268" width="206" height="46" rx="10" fill="#ffffff" stroke="#2b5d8a" stroke-width="2"/>
  <text x="127" y="296" font-size="13" fill="#1f2328" text-anchor="middle">carries an actor?</text>
