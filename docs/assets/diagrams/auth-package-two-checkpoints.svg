  <text x="480" y="575" font-size="14" font-weight="600" fill="#5f6b73" text-anchor="middle">onDecision: both checkpoints record every decision, allowed or refused</text>
  <text x="480" y="594" font-size="13" fill="#1f2328" text-anchor="middle">{ actorId, permissionId, resource?, decision, useCase?, kind? }, for the audit trail; a hook that throws refuses</text>
</svg>
