  <text x="127" y="521" font-size="13" fill="#1f2328" text-anchor="middle">then the handler runs</text>
  <text x="486" y="84" font-size="16" font-weight="700" fill="#2b5d8a">2. Access, in the handler</text>
  <text x="486" y="106" font-size="13" fill="#5f6b73">access.authorize(actor, permission, invoice)</text>
  <rect x="486" y="124" width="206" height="46" rx="10" fill="#ffffff" stroke="#2b5d8a" stroke-width="2"/>
  <text x="589" y="152" font-size="13" fill="#1f2328" text-anchor="middle">anonymous actor?</text>
  <line x1="694" y1="147.0" x2="736" y2="147.0" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="708" y="134" font-size="13" fill="#1f2328" text-anchor="middle">yes</text>
