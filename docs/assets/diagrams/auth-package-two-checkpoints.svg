<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 616" width="960" height="616" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Two checkpoints: the guard of the bus, then Access in the handler</title>
  <desc id="desc">On the left, the guard of the bus, for every command and query before its handler. A message missing from the authorization map fails with UndeclaredUseCaseError, a programming error. A public message goes to its handler with no check. A protected message without an actor fails with MissingActorError. The anonymous actor is refused with UnauthenticatedError, code UNAUTHORIZED, answered 401. Otherwise the Authorizer decides: refused, ForbiddenError, code FORBIDDEN, answered 403 with a reason code; allowed, the unit of work opens and the handler runs. On the right, Access in the handler, once the element is loaded. The anonymous actor is refused with UnauthenticatedError. Each policy of the permission is asked: a subject it does not apply to is refused with the reason SUBJECT_MISMATCH, a policy that answers false refuses with its own name as the reason. Then the Authorizer is asked about the resource the subject stands for; refused, ForbiddenError with the reason of the model. Allowed, the aggregate changes. Both checkpoints hand every decision, allowed or refused, to the onDecision hook.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="616" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Two checkpoints: the guard of the bus, then Access in the handler</text>
  <text x="24" y="84" font-size="16" font-weight="700" fill="#2b5d8a">1. The guard of the bus</text>
  <text x="24" y="106" font-size="13" fill="#5f6b73">authorizationMiddleware, for every command and query</text>
  <rect x="24" y="124" width="206" height="46" rx="10" fill="#ffffff" stroke="#2b5d8a" stroke-width="2"/>
