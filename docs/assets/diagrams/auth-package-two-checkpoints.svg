  <text x="836" y="143" font-size="14" font-weight="700" fill="#9a5b2b" text-anchor="middle">UnauthenticatedError</text>
  <text x="836" y="161" font-size="13" fill="#1f2328" text-anchor="middle">UNAUTHORIZED, 401</text>
  <line x1="589.0" y1="172" x2="589.0" y2="194" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="598.0" y="188" font-size="13" fill="#1f2328">no</text>
  <rect x="486" y="196" width="206" height="46" rx="10" fill="#ffffff" stroke="#2b5d8a" stroke-width="2"/>
  <text x="589" y="224" font-size="13" fill="#1f2328" text-anchor="middle">each policy: appliesTo?</text>
  <line x1="694" y1="219.0" x2="736" y2="219.0" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="708" y="206" font-size="13" fill="#1f2328" text-anchor="middle">no</text>
