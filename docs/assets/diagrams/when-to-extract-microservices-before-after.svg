<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Extracting notification: what changes and what does not</title>
  <desc id="desc">Before: one deployable started by src/main.ts holds the four contexts identity, scheduling, analytics and notification, an in-process event bus with the outbox written in the same transaction, and one database with a schema per context. After: src/main.ts keeps identity, scheduling and analytics; its outbox relay publishes to a broker; the notification service, started by src/apps/notification/main.ts, consumes through a durable subscription and owns its schema. The domain and application code of every context is unchanged; the entry point, the event provider and the place of the schema change.</desc>
  <defs>
    <marker id="arrow-infrastructure" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a4f9a"/>
    </marker>
  </defs>
  <rect width="960" height="520" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Extracting notification: what changes and what does not</text>

  <!-- before -->
  <rect x="24" y="58" width="440" height="340" rx="14" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="44" y="84" font-size="14" font-weight="600" fill="#5f6b73">Before: one deployable, src/main.ts</text>
  <rect x="44" y="100" width="190" height="52" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="139" y="131" font-size="16" font-weight="700" fill="#2f6f4f" text-anchor="middle">identity</text>
  <rect x="254" y="100" width="190" height="52" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="349" y="131" font-size="16" font-weight="700" fill="#2f6f4f" text-anchor="middle">scheduling</text>
  <rect x="44" y="164" width="190" height="52" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="139" y="195" font-size="16" font-weight="700" fill="#2f6f4f" text-anchor="middle">analytics</text>
  <rect x="254" y="164" width="190" height="52" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="349" y="195" font-size="16" font-weight="700" fill="#2f6f4f" text-anchor="middle">notification</text>
  <rect x="44" y="236" width="400" height="66" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="244" y="262" font-size="14" font-weight="600" fill="#7a4f9a" text-anchor="middle">in-process event bus</text>
  <text x="244" y="284" font-size="13" fill="#1f2328" text-anchor="middle">the outbox is written in the transaction of the command</text>
  <rect x="44" y="314" width="400" height="66" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="244" y="340" font-size="14" font-weight="600" fill="#7a4f9a" text-anchor="middle">one database</text>
  <text x="244" y="362" font-size="13" fill="#1f2328" text-anchor="middle">a schema per context, no join between them</text>

  <!-- after -->
  <rect x="496" y="58" width="440" height="340" rx="14" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="516" y="84" font-size="14" font-weight="600" fill="#5f6b73">After: notification deployed alone</text>
  <rect x="512" y="96" width="408" height="96" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="528" y="116" font-size="13" font-weight="600" fill="#5f6b73">src/main.ts</text>
  <rect x="528" y="128" width="120" height="48" rx="8" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="588" y="157" font-size="14" font-weight="700" fill="#2f6f4f" text-anchor="middle">identity</text>
  <rect x="656" y="128" width="120" height="48" rx="8" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="716" y="157" font-size="14" font-weight="700" fill="#2f6f4f" text-anchor="middle">scheduling</text>
  <rect x="784" y="128" width="120" height="48" rx="8" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="844" y="157" font-size="14" font-weight="700" fill="#2f6f4f" text-anchor="middle">analytics</text>
  <line x1="716" y1="194" x2="716" y2="222" stroke="#7a4f9a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-infrastructure)"/>
  <text x="728" y="213" font-size="13" fill="#7a4f9a">outbox relay</text>
  <rect x="512" y="226" width="408" height="40" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="716" y="251" font-size="14" font-weight="700" fill="#5f6b73" text-anchor="middle">broker: RabbitMQ, Kafka, NATS, Redis Streams</text>
  <line x1="716" y1="268" x2="716" y2="296" stroke="#7a4f9a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-infrastructure)"/>
  <text x="728" y="287" font-size="13" fill="#7a4f9a">durable subscription</text>
  <rect x="512" y="300" width="408" height="84" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="528" y="320" font-size="13" font-weight="600" fill="#5f6b73">src/apps/notification/main.ts</text>
  <rect x="528" y="330" width="180" height="44" rx="8" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="618" y="357" font-size="14" font-weight="700" fill="#2f6f4f" text-anchor="middle">notification</text>
  <text x="724" y="349" font-size="13" fill="#1f2328">its schema and migrations,</text>
  <text x="724" y="367" font-size="13" fill="#1f2328">moved with it</text>

  <!-- what changes -->
  <rect x="24" y="414" width="440" height="84" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="44" y="440" font-size="16" font-weight="700" fill="#2f6f4f">Unchanged</text>
  <text x="44" y="462" font-size="13" fill="#1f2328">the domain and application code of every context,</text>
  <text x="44" y="482" font-size="13" fill="#1f2328">its handlers and their specs, the published language</text>
  <rect x="496" y="414" width="440" height="84" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="516" y="440" font-size="16" font-weight="700" fill="#7a4f9a">Changed</text>
  <text x="516" y="462" font-size="13" fill="#1f2328">an entry point, the event provider on both sides,</text>
  <text x="516" y="482" font-size="13" fill="#1f2328">the schema moved to the service that owns it</text>
</svg>
