<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" width="960" height="590" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Choreography or orchestration of the deposit flow</title>
  <desc id="desc">Choreography: appointments, payments and notifications react to each other's events, and the process is the sum of their subscriptions. Orchestration: a process manager inside appointments reacts to the events of payments, to the events of its own aggregate and to its timeout; it keeps the state of the process and sends the commands of its own context.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="590" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Choreography or orchestration of the deposit flow</text>
  <rect x="24" y="58" width="444" height="448" rx="14" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="44" y="86" font-size="16" font-weight="700" fill="#1f2328">Choreography</text>
  <text x="44" y="106" font-size="13" font-style="italic" fill="#5f6b73">each context reacts to the others' events</text>
  <text x="44" y="470" font-size="13" fill="#1f2328">Who cancels after fifteen minutes?</text>
  <text x="44" y="488" font-size="13" fill="#1f2328">Nobody owns the question.</text>
  <rect x="492" y="58" width="444" height="448" rx="14" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="512" y="86" font-size="16" font-weight="700" fill="#1f2328">Orchestration</text>
  <text x="512" y="106" font-size="13" font-style="italic" fill="#5f6b73">a process manager decides the next step</text>
  <text x="512" y="470" font-size="13" fill="#1f2328">Its commands stay inside its context; another context</text>
  <text x="512" y="488" font-size="13" fill="#1f2328">is reached by its events, or through a gateway port.</text>
  <!-- choreography: three contexts react to each other -->
  <rect x="44" y="134" width="140" height="56" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="114.0" y="167.0" font-size="15" font-weight="700" fill="#5f6b73" text-anchor="middle">appointments</text>
  <rect x="308" y="134" width="140" height="56" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="378.0" y="167.0" font-size="15" font-weight="700" fill="#5f6b73" text-anchor="middle">payments</text>
  <rect x="168" y="330" width="160" height="56" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="248.0" y="363.0" font-size="15" font-weight="700" fill="#5f6b73" text-anchor="middle">notifications</text>
  <line x1="186" y1="150" x2="304" y2="150" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="246" y="142" font-size="13" fill="#1f2328" text-anchor="middle">booked</text>
  <line x1="306" y1="176" x2="188" y2="176" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="246" y="200" font-size="13" fill="#1f2328" text-anchor="middle">deposit paid</text>
  <path d="M114,192 V358 H164" fill="none" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="106" y="280" font-size="13" fill="#1f2328" text-anchor="end">confirmed</text>
  <!-- orchestration: a process manager inside appointments -->
  <rect x="512" y="124" width="252" height="316" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="528" y="146" font-size="14" font-weight="600" fill="#5f6b73">appointments</text>
  <rect x="528" y="160" width="220" height="80" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="638.0" y="186" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">Process manager</text>
  <line x1="542" y1="196" x2="734" y2="196" stroke="#2b5d8a" stroke-opacity="0.35"/>
  <text x="638.0" y="216" font-size="13" fill="#1f2328" text-anchor="middle">keeps the state,</text>
  <text x="638.0" y="236" font-size="13" fill="#1f2328" text-anchor="middle">decides the next step</text>
  <rect x="528" y="336" width="220" height="80" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="638.0" y="362" font-size="16" font-weight="700" fill="#2f6f4f" text-anchor="middle">Appointment</text>
  <line x1="542" y1="372" x2="734" y2="372" stroke="#2f6f4f" stroke-opacity="0.35"/>
  <text x="638.0" y="392" font-size="13" fill="#1f2328" text-anchor="middle">confirm, cancel:</text>
  <text x="638.0" y="412" font-size="13" fill="#1f2328" text-anchor="middle">the invariants</text>
  <line x1="680" y1="242" x2="680" y2="332" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="672" y="290" font-size="13" fill="#1f2328" text-anchor="end">commands</text>
  <line x1="576" y1="334" x2="576" y2="244" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="568" y="290" font-size="13" fill="#1f2328" text-anchor="end">booked</text>
  <rect x="784" y="152" width="136" height="76" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="852.0" y="178" font-size="15" font-weight="700" fill="#5f6b73" text-anchor="middle">payments</text>
  <text x="852.0" y="200" font-size="13" fill="#1f2328" text-anchor="middle">deposit paid,</text>
  <text x="852.0" y="218" font-size="13" fill="#1f2328" text-anchor="middle">deposit refused</text>
  <line x1="782" y1="190" x2="752" y2="190" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <rect x="784" y="330" width="136" height="90" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="852.0" y="356" font-size="15" font-weight="700" fill="#5f6b73" text-anchor="middle">job queue</text>
  <line x1="798" y1="366" x2="906" y2="366" stroke="#5f6b73" stroke-opacity="0.35"/>
  <text x="852.0" y="386" font-size="13" fill="#1f2328" text-anchor="middle">delivers</text>
  <text x="852.0" y="406" font-size="13" fill="#1f2328" text-anchor="middle">the timeout</text>
  <path d="M782,375 H768 V226 H752" fill="none" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <!-- legend -->
  <line x1="40" y1="536" x2="84" y2="536" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="96" y="541" font-size="14" fill="#1f2328">an event: whoever subscribes to it reacts</text>
  <line x1="40" y1="562" x2="84" y2="562" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="96" y="567" font-size="14" fill="#1f2328">a command: asks its context for one step</text>
</svg>
