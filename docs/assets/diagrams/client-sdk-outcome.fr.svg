<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Ce que répond un appel du client généré</title>
  <desc id="desc">Une méthode du client envoie la requête HTTP. Un statut que le contrat ne déclare pas pour l'opération lève une UnexpectedResponseError, qui lit le code et le requestId du document problem. Un statut déclaré inférieur à 400 répond ok true avec les données ; un statut déclaré de 400 ou plus répond ok false avec le problem, dont le code est typé par les codes de ce statut. Avec unwrap, un succès donne ses données et un refus est levé en ProblemError, que isProblem affine.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="560" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Ce que répond un appel du client généré</text>
  <!-- the call -->
  <rect x="150" y="60" width="360" height="48" rx="10" fill="#ffffff" stroke="#3d4449" stroke-width="1.5"/>
  <text x="330" y="89" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">await api.openPractice({ body })</text>
  <line x1="330" y1="108" x2="330" y2="134" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- first question -->
  <rect x="150" y="138" width="360" height="60" rx="10" fill="#ffffff" stroke="#3d4449" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="330" y="163" font-size="14" fill="#1f2328" text-anchor="middle">Le contrat déclare-t-il ce statut</text>
  <text x="330" y="184" font-size="14" fill="#1f2328" text-anchor="middle">pour cette opération ?</text>
  <line x1="514" y1="168" x2="596" y2="168" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="555" y="158" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">non</text>
  <!-- unexpected -->
  <rect x="600" y="116" width="336" height="150" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="768" y="144" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">lève UnexpectedResponseError</text>
  <line x1="616" y1="156" x2="920" y2="156" stroke="#5f6b73" stroke-opacity="0.35"/>
  <text x="616" y="180" font-size="13" fill="#1f2328">panne du serveur : 500, code INTERNAL_ERROR</text>
  <text x="616" y="202" font-size="13" fill="#1f2328">une passerelle entre les deux : 502, 503</text>
  <text x="616" y="224" font-size="13" fill="#1f2328">un serveur en désaccord avec son contrat</text>
  <text x="616" y="250" font-size="13" font-style="italic" font-weight="600" fill="#5f6b73">citez error.requestId à l'équipe de l'API</text>
  <!-- second question -->
  <line x1="330" y1="198" x2="330" y2="232" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="342" y="220" font-size="13" font-weight="600" fill="#1f2328">oui</text>
  <rect x="150" y="236" width="360" height="48" rx="10" fill="#ffffff" stroke="#3d4449" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="330" y="265" font-size="14" fill="#1f2328" text-anchor="middle">Le statut est-il inférieur à 400 ?</text>
  <line x1="230" y1="284" x2="230" y2="328" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="242" y="312" font-size="13" font-weight="600" fill="#1f2328">oui</text>
  <line x1="430" y1="284" x2="430" y2="328" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="442" y="312" font-size="13" font-weight="600" fill="#1f2328">non</text>
  <!-- success -->
  <rect x="40" y="332" width="280" height="100" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="180" y="360" font-size="15" font-weight="700" fill="#2b5d8a" text-anchor="middle">{ ok: true, status, data }</text>
  <line x1="56" y1="372" x2="304" y2="372" stroke="#2b5d8a" stroke-opacity="0.35"/>
  <text x="180" y="396" font-size="13" fill="#1f2328" text-anchor="middle">201 : result.data.id</text>
  <text x="180" y="418" font-size="13" fill="#1f2328" text-anchor="middle">un 304 ou un 302 manuel aussi</text>
  <!-- refusal -->
  <rect x="350" y="332" width="350" height="100" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="525" y="360" font-size="15" font-weight="700" fill="#2b5d8a" text-anchor="middle">{ ok: false, status, problem }</text>
  <line x1="366" y1="372" x2="684" y2="372" stroke="#2b5d8a" stroke-opacity="0.35"/>
  <text x="525" y="396" font-size="13" fill="#1f2328" text-anchor="middle">422 : problem.code vaut 'UNKNOWN_TIME_ZONE'</text>
  <text x="525" y="418" font-size="13" fill="#1f2328" text-anchor="middle">| 'VALIDATION_FAILED', et rien d'autre</text>
  <!-- unwrap -->
  <line x1="180" y1="432" x2="180" y2="466" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <line x1="525" y1="432" x2="525" y2="466" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <rect x="40" y="470" width="280" height="64" rx="10" fill="#ffffff" stroke="#2b5d8a" stroke-width="1.5"/>
  <text x="180" y="497" font-size="14" font-weight="600" fill="#2b5d8a" text-anchor="middle">unwrap renvoie les données</text>
  <text x="180" y="519" font-size="13" fill="#1f2328" text-anchor="middle">typées comme le corps du succès</text>
  <rect x="350" y="470" width="350" height="64" rx="10" fill="#ffffff" stroke="#2b5d8a" stroke-width="1.5"/>
  <text x="525" y="497" font-size="14" font-weight="600" fill="#2b5d8a" text-anchor="middle">unwrap lève une ProblemError</text>
  <text x="525" y="519" font-size="13" fill="#1f2328" text-anchor="middle">isProblem(error, 'UNKNOWN_TIME_ZONE') l'affine</text>
  <!-- legend -->
  <line x1="730" y1="470" x2="774" y2="470" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="786" y="475" font-size="14" fill="#1f2328">la méthode elle-même</text>
  <line x1="730" y1="498" x2="774" y2="498" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="786" y="503" font-size="14" fill="#1f2328">avec unwrap(...)</text>
</svg>
