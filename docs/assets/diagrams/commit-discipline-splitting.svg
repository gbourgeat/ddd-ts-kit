<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Splitting a change that grew</title>
  <desc id="desc">One branch of about 1900 lines holds a refactoring of Calendar, a new integration event, a domain rule and two use cases. It is split into five pull requests merged in order: the refactoring alone, the contract, the domain concept with its spec, the use case that reschedules, stacked on the domain concept, and the use case that cancels.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="470" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Splitting a change that grew</text>

  <!-- the branch that grew -->
  <rect x="32" y="64" width="250" height="380" rx="12" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="52" y="94" font-size="16" font-weight="700" fill="#5f6b73">One branch that grew</text>
  <text x="52" y="116" font-size="13" fill="#1f2328">about 1 900 changed lines</text>
  <line x1="52" y1="130" x2="262" y2="130" stroke="#5f6b73" stroke-opacity="0.35"/>
  <text x="52" y="158" font-size="13" fill="#1f2328">BookingWindow pulled out</text>
  <text x="52" y="176" font-size="13" fill="#1f2328">of Calendar</text>
  <text x="52" y="206" font-size="13" fill="#1f2328">a new integration event</text>
  <text x="52" y="236" font-size="13" fill="#1f2328">a rule on the booking window</text>
  <text x="52" y="266" font-size="13" fill="#1f2328">reschedule an appointment</text>
  <text x="52" y="296" font-size="13" fill="#1f2328">cancel an appointment</text>
  <text x="52" y="326" font-size="13" fill="#1f2328">their routes and specs, and</text>
  <text x="52" y="344" font-size="13" fill="#1f2328">the regenerated contracts</text>
  <text x="52" y="410" font-size="13" font-style="italic" fill="#5f6b73">two ideas or more: no reviewer</text>
  <text x="52" y="428" font-size="13" font-style="italic" fill="#5f6b73">reads it, everybody approves it</text>

  <line x1="284" y1="254" x2="328" y2="254" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- the pull requests -->
  <text x="336" y="84" font-size="14" font-weight="600" fill="#1f2328">Five pull requests, merged in this order</text>
  <rect x="336" y="96" width="592" height="60" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="352" y="121" font-size="14" font-weight="700" fill="#1f2328">1  refactor(scheduling): extract BookingWindow from Calendar</text>
  <text x="372" y="143" font-size="13" fill="#5f6b73">the move alone, no behaviour change: trivial to review</text>
  <rect x="336" y="168" width="592" height="60" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="352" y="193" font-size="14" font-weight="700" fill="#1f2328">2  feat(scheduling): publish scheduling.appointment.rescheduled v1</text>
  <text x="372" y="215" font-size="13" fill="#2b5d8a">the contract first, so that consumers can start against it</text>
  <rect x="336" y="240" width="592" height="60" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="352" y="265" font-size="14" font-weight="700" fill="#1f2328">3  feat(scheduling): refuse a slot outside the booking window</text>
  <text x="372" y="287" font-size="13" fill="#2f6f4f">the domain concept and its spec, useful and green alone</text>
  <rect x="336" y="312" width="592" height="60" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="352" y="337" font-size="14" font-weight="700" fill="#1f2328">4  feat(scheduling): reschedule an appointment</text>
  <text x="372" y="359" font-size="13" fill="#2b5d8a">one use case, stacked on 3, which it calls</text>
  <rect x="336" y="384" width="592" height="60" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="352" y="409" font-size="14" font-weight="700" fill="#1f2328">5  feat(scheduling): cancel an appointment</text>
  <text x="372" y="431" font-size="13" fill="#2b5d8a">one use case: a failure in 4 does not hold it back</text>
</svg>
