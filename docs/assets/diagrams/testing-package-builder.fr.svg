<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Comment un builder fabrique sa valeur</title>
  <desc id="desc">À gauche, les valeurs par défaut valides que le builder déclare une fois, et ce qu'un test énonce avec les méthodes du langage omniprésent. Au milieu, props les résout : les valeurs par défaut, puis ce que le test a énoncé, chaque valeur sequence, lazy et generated tirée, chaque builder imbriqué construit. À droite, les deux sorties des mêmes propriétés : build appelle construct, qui passe par l'API publique de l'agrégat et donne un Order valide par construction ; buildRequest, une méthode que le projet écrit sur son propre builder à partir de props, donne le contenu de la requête HTTP qu'envoie une spec de bout en bout.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="470" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Comment un builder fabrique sa valeur</text>

  <!-- defaults -->
  <rect x="32" y="64" width="280" height="168" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="52" y="92" font-size="16" font-weight="700" fill="#5f6b73">defaults(), déclarées une fois</text>
  <line x1="48" y1="104" x2="296" y2="104" stroke="#5f6b73" stroke-opacity="0.35"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1f2328">
    <text x="52" y="130">id: sequence('order')</text>
    <text x="52" y="152">customer: aCustomer()</text>
    <text x="52" y="174">lines: [aLine()]</text>
    <text x="52" y="196">paid: false</text>
  </g>
  <text x="52" y="220" font-size="13" font-style="italic" fill="#5f6b73">des valeurs que les règles acceptent</text>

  <!-- what the test states -->
  <rect x="32" y="256" width="280" height="150" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="52" y="284" font-size="16" font-weight="700" fill="#5f6b73">ce que le test énonce</text>
  <line x1="48" y1="296" x2="296" y2="296" stroke="#5f6b73" stroke-opacity="0.35"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1f2328">
    <text x="52" y="322">anOrder()</text>
    <text x="68" y="344">.paid()</text>
    <text x="68" y="366">.withLine(aLine())</text>
  </g>
  <text x="52" y="392" font-size="13" font-style="italic" fill="#5f6b73">seulement ce dont la règle dépend</text>

  <!-- props -->
  <rect x="372" y="140" width="232" height="190" rx="10" fill="#ffffff" stroke="#3d4449" stroke-width="2"/>
  <text x="488" y="168" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">props()</text>
  <line x1="388" y1="180" x2="588" y2="180" stroke="#3d4449" stroke-opacity="0.35"/>
  <text x="488" y="202" font-size="13" fill="#1f2328" text-anchor="middle">les valeurs par défaut,</text>
  <text x="488" y="221" font-size="13" fill="#1f2328" text-anchor="middle">remplacées par ce que</text>
  <text x="488" y="240" font-size="13" fill="#1f2328" text-anchor="middle">le test a énoncé</text>
  <text x="488" y="268" font-size="13" fill="#1f2328" text-anchor="middle">chaque valeur sequence, lazy</text>
  <text x="488" y="287" font-size="13" fill="#1f2328" text-anchor="middle">et generated tirée,</text>
  <text x="488" y="306" font-size="13" fill="#1f2328" text-anchor="middle">chaque builder imbriqué construit</text>

  <!-- arrows into props -->
  <path d="M312,148 H340 V210 H368" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M312,330 H340 V262 H368" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- build: the aggregate -->
  <rect x="664" y="64" width="264" height="168" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="684" y="92" font-size="16" font-weight="700" fill="#2f6f4f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">build()</text>
  <line x1="680" y1="104" x2="912" y2="104" stroke="#2f6f4f" stroke-opacity="0.35"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1f2328">
    <text x="684" y="126">construct(props)</text>
    <text x="700" y="146">Order.place(…)</text>
    <text x="700" y="166">order.pay(…)</text>
  </g>
  <text x="684" y="189" font-size="13" font-weight="600" fill="#2f6f4f">un Order, valide par construction :</text>
  <text x="684" y="206" font-size="13" fill="#1f2328">specs du domaine, d'application</text>
  <text x="684" y="223" font-size="13" fill="#1f2328">et d'adaptateur</text>

  <!-- buildRequest: the payload -->
  <rect x="664" y="256" width="264" height="150" rx="10" fill="#f6ede6" stroke="#9a5b2b" stroke-width="2"/>
  <text x="684" y="284" font-size="16" font-weight="700" fill="#9a5b2b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">buildRequest()</text>
  <text x="684" y="306" font-size="13" font-style="italic" fill="#5f6b73">votre méthode, écrite sur props()</text>
  <line x1="680" y1="318" x2="912" y2="318" stroke="#9a5b2b" stroke-opacity="0.35"/>
  <text x="684" y="342" font-size="13" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">{ customerId, lines }</text>
  <text x="684" y="368" font-size="13" font-weight="600" fill="#9a5b2b">le contenu de la requête HTTP :</text>
  <text x="684" y="388" font-size="13" fill="#1f2328">specs de bout en bout, par l'API</text>

  <!-- arrows out of props -->
  <path d="M604,200 H634 V148 H660" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M604,270 H634 V330 H660" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="32" y="446" font-size="14" fill="#1f2328">Chaque étape rend un nouveau builder : anOrder() se partage entre tests, et chaque build tire son propre order-1, order-2...</text>
</svg>
