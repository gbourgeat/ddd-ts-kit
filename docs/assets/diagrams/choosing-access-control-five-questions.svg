<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Five questions choose the authorization model</title>
  <desc id="desc">A decision tree. Question 1: does a right depend on which element? No: RBAC, roles grant actions. Yes: question 2, do users share, delegate or inherit along a hierarchy? Yes: ReBAC, relationship tuples. No: question 3, do rights follow properties or need explicit refusals? Yes: ABAC over roles. No: RBAC plus a few policies. Then, whatever the model: third parties with a limited credential add scopes on the routes, and several customers in one deployment add a tenancy strategy.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="560" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Five questions choose the authorization model</text>

  <!-- question 1 -->
  <rect x="32" y="64" width="440" height="64" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="52" y="91" font-size="14" font-weight="600" fill="#1f2328">1. Does a right depend on which element,</text>
  <text x="52" y="113" font-size="14" fill="#1f2328">not only on the action?</text>
  <!-- answer: RBAC -->
  <rect x="568" y="68" width="360" height="56" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="588" y="92" font-size="16" font-weight="700" fill="#2b5d8a">RBAC</text>
  <text x="588" y="113" font-size="13" fill="#1f2328">roles grant actions</text>
  <line x1="474" y1="96" x2="564" y2="96" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="518" y="88" font-size="13" fill="#1f2328" text-anchor="middle">no</text>
  <line x1="252" y1="130" x2="252" y2="160" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="262" y="150" font-size="13" fill="#1f2328">yes</text>

  <!-- question 2 -->
  <rect x="32" y="164" width="440" height="80" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="52" y="191" font-size="14" font-weight="600" fill="#1f2328">2. Do users share elements, delegate, or</text>
  <text x="52" y="211" font-size="14" fill="#1f2328">inherit rights along a hierarchy? Must a list</text>
  <text x="52" y="231" font-size="14" fill="#1f2328">show everything the actor can reach?</text>
  <!-- answer: ReBAC -->
  <rect x="568" y="172" width="360" height="64" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="588" y="198" font-size="16" font-weight="700" fill="#2b5d8a">ReBAC (Zanzibar)</text>
  <text x="588" y="220" font-size="13" fill="#1f2328">tuples in PostgreSQL, then OpenFGA</text>
  <line x1="474" y1="204" x2="564" y2="204" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="518" y="196" font-size="13" fill="#1f2328" text-anchor="middle">yes</text>
  <line x1="252" y1="246" x2="252" y2="276" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="262" y="266" font-size="13" fill="#1f2328">no</text>

  <!-- question 3 -->
  <rect x="32" y="280" width="440" height="80" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="52" y="307" font-size="14" font-weight="600" fill="#1f2328">3. Do rights follow properties (department,</text>
  <text x="52" y="327" font-size="14" fill="#1f2328">amount, status, time of day), or need explicit</text>
  <text x="52" y="347" font-size="14" fill="#1f2328">refusals that win over grants?</text>
  <!-- answer: ABAC -->
  <rect x="568" y="268" width="360" height="50" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="588" y="290" font-size="16" font-weight="700" fill="#2b5d8a">ABAC over roles</text>
  <text x="588" y="309" font-size="13" fill="#1f2328">permit and forbid rules on attributes</text>
  <line x1="474" y1="293" x2="564" y2="293" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="518" y="285" font-size="13" fill="#1f2328" text-anchor="middle">yes</text>
  <!-- answer: RBAC plus policies -->
  <rect x="568" y="326" width="360" height="50" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="588" y="348" font-size="16" font-weight="700" fill="#2b5d8a">RBAC plus policies</text>
  <text x="588" y="367" font-size="13" fill="#1f2328">a few rules on the loaded element</text>
  <line x1="474" y1="351" x2="564" y2="351" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="518" y="343" font-size="13" fill="#1f2328" text-anchor="middle">no</text>

  <!-- whatever the model -->
  <rect x="32" y="404" width="896" height="136" rx="12" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="52" y="432" font-size="14" font-weight="600" fill="#5f6b73">Then, whatever the model chosen above, add:</text>
  <rect x="52" y="446" width="418" height="78" rx="10" fill="#f6ede6" stroke="#9a5b2b" stroke-width="2"/>
  <text x="70" y="474" font-size="14" font-weight="600" fill="#1f2328">4. Third parties act with a limited credential?</text>
  <text x="70" y="504" font-size="14" fill="#9a5b2b">yes: scopes, HasScope on the routes</text>
  <rect x="490" y="446" width="418" height="78" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="508" y="474" font-size="14" font-weight="600" fill="#1f2328">5. Several customers share the deployment?</text>
  <text x="508" y="504" font-size="14" fill="#5f6b73">yes: a tenancy strategy, roles per tenant</text>
</svg>
