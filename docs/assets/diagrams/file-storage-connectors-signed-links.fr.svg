<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 456" width="960" height="456" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Qui répond à un lien signé : l'application, ou le bucket</title>
  <desc id="desc">Deux panneaux. À gauche, un stockage que l'application sert, le répertoire local ou la mémoire : 1, le client demande un lien à un cas d'usage ; 2, LocalFileStorage signe un jeton et l'API renvoie un lien vers sa propre route /files qui le porte ; 3, le client le suit, signedFileRoutes vérifie le jeton et lit le fichier dans LocalFileStorage par openSigned, si bien que chaque octet passe par l'API. À droite, un stockage objet : 1, le client demande un lien à un cas d'usage ; 2, S3FileStorage présigne l'URL sans aucune requête au bucket et l'API la répond ; 3, le client télécharge directement depuis le bucket, qui vérifie la signature et l'expiration, et aucun octet ne passe par l'API.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="456" rx="16" fill="#ffffff"/>
  <text x="24" y="36" font-size="18" font-weight="600" fill="#1f2328">Qui répond à un lien signé : l'application, ou le bucket</text>
  <line x1="480" y1="56" x2="480" y2="436" stroke="#d0d7de" stroke-width="1.5"/>
  <!-- left panel: a served storage -->
  <text x="24" y="70" font-size="16" font-weight="700" fill="#1f2328">Un stockage servi : répertoire, mémoire</text>
  <rect x="24" y="88" width="96" height="164" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="72" y="176" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">client</text>
  <rect x="236" y="88" width="228" height="164" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="350" y="108" font-size="14" font-weight="600" fill="#5f6b73" text-anchor="middle">API</text>
  <rect x="258" y="118" width="184" height="44" rx="8" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="350" y="145" font-size="14" font-weight="700" fill="#2b5d8a" text-anchor="middle">cas d'usage</text>
  <rect x="258" y="192" width="184" height="44" rx="8" fill="#f6ede6" stroke="#9a5b2b" stroke-width="2"/>
  <text x="350" y="219" font-size="14" font-weight="700" fill="#9a5b2b" text-anchor="middle">signedFileRoutes</text>
  <rect x="236" y="300" width="228" height="58" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="350" y="324" font-size="15" font-weight="700" fill="#7a4f9a" text-anchor="middle">LocalFileStorage</text>
  <text x="350" y="346" font-size="13" fill="#1f2328" text-anchor="middle">le répertoire</text>
  <text x="178" y="124" font-size="13" fill="#1f2328" text-anchor="middle">1 demande</text>
  <line x1="122" y1="132" x2="256" y2="132" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="188" y="160" font-size="13" fill="#1f2328" text-anchor="middle">2 /files?token=</text>
  <line x1="256" y1="168" x2="122" y2="168" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="178" y="206" font-size="13" fill="#1f2328" text-anchor="middle">3 GET du lien</text>
  <line x1="122" y1="214" x2="256" y2="214" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="350" y1="238" x2="350" y2="298" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M444,140 H454 V298" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="446" y="274" font-size="13" fill="#1f2328" text-anchor="end">signe un jeton</text>
  <text x="342" y="274" font-size="13" fill="#1f2328" text-anchor="end">openSigned(token)</text>
  <text x="24" y="392" font-size="14" fill="#1f2328">Chaque octet passe par l'API, sous /files.</text>
  <text x="24" y="414" font-size="14" fill="#1f2328">Une machine ; avec Express, montées avant express.json().</text>
  <!-- right panel: an object store -->
  <text x="504" y="70" font-size="16" font-weight="700" fill="#1f2328">Un stockage objet : S3FileStorage</text>
  <rect x="504" y="88" width="96" height="164" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="552" y="176" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">client</text>
  <rect x="712" y="88" width="224" height="164" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="824" y="108" font-size="14" font-weight="600" fill="#5f6b73" text-anchor="middle">API</text>
  <rect x="728" y="118" width="192" height="44" rx="8" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="824" y="145" font-size="14" font-weight="700" fill="#2b5d8a" text-anchor="middle">cas d'usage</text>
  <rect x="728" y="192" width="192" height="44" rx="8" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="824" y="212" font-size="14" font-weight="700" fill="#7a4f9a" text-anchor="middle">S3FileStorage</text>
  <text x="824" y="229" font-size="13" fill="#1f2328" text-anchor="middle">présigne, sans requête</text>
  <line x1="824" y1="164" x2="824" y2="190" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="712" y="300" width="224" height="58" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="824" y="324" font-size="15" font-weight="700" fill="#5f6b73" text-anchor="middle">bucket</text>
  <text x="824" y="346" font-size="13" fill="#1f2328" text-anchor="middle">vérifie signature, expiration</text>
  <text x="656" y="124" font-size="13" fill="#1f2328" text-anchor="middle">1 demande</text>
  <line x1="602" y1="132" x2="726" y2="132" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="666" y="160" font-size="13" fill="#1f2328" text-anchor="middle">2 URL présignée</text>
  <line x1="726" y1="168" x2="602" y2="168" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M552,254 V329 H710" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="566" y="318" font-size="13" fill="#1f2328">3 GET, en direct</text>
  <text x="504" y="392" font-size="14" fill="#1f2328">Aucun octet ne passe par l'API.</text>
  <text x="504" y="414" font-size="14" fill="#1f2328">Toutes les instances, quel que soit leur nombre,</text>
  <text x="504" y="434" font-size="14" fill="#1f2328">signent les mêmes liens.</text>
</svg>
