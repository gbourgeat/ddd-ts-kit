  <text x="662" y="380" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">rabbitmq, kafka, nats</text>
  <text x="662" y="398" font-size="13" fill="#1f2328" text-anchor="middle">brokers</text>
  <rect x="756" y="360" width="164" height="48" rx="8" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="838" y="380" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">redis</text>
  <text x="838" y="398" font-size="13" fill="#1f2328" text-anchor="middle">cache, verrou, streams</text>
  <rect x="52" y="418" width="164" height="48" rx="8" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="134" y="438" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">auth</text>
  <text x="134" y="456" font-size="13" fill="#1f2328" text-anchor="middle">JWT, autorisation</text>
  <rect x="228" y="418" width="164" height="48" rx="8" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="310" y="438" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">openfga</text>
  <text x="310" y="456" font-size="13" fill="#1f2328" text-anchor="middle">relations</text>
  <rect x="404" y="418" width="164" height="48" rx="8" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="486" y="438" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">aspects</text>
  <text x="486" y="456" font-size="13" fill="#1f2328" text-anchor="middle">journaux, résilience</text>
  <rect x="580" y="418" width="164" height="48" rx="8" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="662" y="438" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">tracing</text>
  <text x="662" y="456" font-size="13" fill="#1f2328" text-anchor="middle">OpenTelemetry</text>
  <rect x="756" y="418" width="164" height="48" rx="8" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="838" y="438" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">audit</text>
  <text x="838" y="456" font-size="13" fill="#1f2328" text-anchor="middle">journal d'audit</text>
  <rect x="52" y="476" width="164" height="48" rx="8" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="134" y="496" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">scheduling</text>
  <text x="134" y="514" font-size="13" fill="#1f2328" text-anchor="middle">jobs planifiés</text>
  <rect x="228" y="476" width="164" height="48" rx="8" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="310" y="496" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">pino, winston</text>
