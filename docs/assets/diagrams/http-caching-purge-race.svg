<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">A read on its way when the purge runs</title>
  <desc id="desc">A timeline in four lanes. A public read loads version 7 of the calendar. Meanwhile the command commits version 8, and the relay, woken by the commit, purges the tag calendar:c-1 from Varnish. The read then reaches Varnish with version 7, which is kept as fresh although it is stale. Two seconds after the first purge, RepeatedCachePurger purges the tag again: the stale answer is removed and the next read loads version 8.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
    <marker id="arrow-infrastructure" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a4f9a"/>
    </marker>
  </defs>
  <rect width="960" height="420" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">A read on its way when the purge runs</text>
  <!-- lanes -->
  <text x="32" y="105" font-size="14" font-weight="600" fill="#2b5d8a">a public read</text>
  <text x="32" y="171" font-size="14" font-weight="600" fill="#2b5d8a">the command</text>
  <text x="32" y="237" font-size="14" font-weight="600" fill="#7a4f9a">the outbox relay</text>
  <text x="32" y="303" font-size="14" font-weight="600" fill="#5f6b73">Varnish</text>
  <line x1="190" y1="133" x2="936" y2="133" stroke="#5f6b73" stroke-opacity="0.2"/>
  <line x1="190" y1="199" x2="936" y2="199" stroke="#5f6b73" stroke-opacity="0.2"/>
  <line x1="190" y1="265" x2="936" y2="265" stroke="#5f6b73" stroke-opacity="0.2"/>
  <!-- the read -->
  <rect x="210" y="86" width="290" height="30" rx="8" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="355" y="106" font-size="13" fill="#1f2328" text-anchor="middle">GET /calendars/c-1/opening-hours: loads v7</text>
  <!-- the command -->
  <rect x="300" y="152" width="100" height="30" rx="8" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="350" y="172" font-size="13" font-weight="600" fill="#2b5d8a" text-anchor="middle">commit v8</text>
  <!-- the relay -->
  <path d="M350,184 V200 H440 V214" fill="none" stroke="#7a4f9a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-infrastructure)"/>
  <rect x="400" y="218" width="80" height="30" rx="8" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="440" y="238" font-size="13" font-weight="600" fill="#7a4f9a" text-anchor="middle">purge</text>
  <rect x="700" y="218" width="140" height="30" rx="8" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="770" y="238" font-size="13" font-weight="600" fill="#7a4f9a" text-anchor="middle">purge again</text>
  <text x="590" y="238" font-size="13" fill="#7a4f9a" text-anchor="middle">againAfterMs: 2_000</text>
  <!-- Varnish -->
  <rect x="210" y="284" width="230" height="30" rx="6" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="325" y="304" font-size="13" fill="#1f2328" text-anchor="middle">v7</text>
  <rect x="440" y="284" width="60" height="30" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="500" y="284" width="270" height="30" rx="6" fill="#f3f4f5" stroke="#3d4449" stroke-width="2.5"/>
  <text x="635" y="304" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">v7 kept as fresh: stale</text>
  <rect x="770" y="284" width="160" height="30" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="850" y="304" font-size="13" fill="#1f2328" text-anchor="middle">empty: next read, v8</text>
  <!-- arrows into Varnish -->
  <line x1="440" y1="250" x2="440" y2="282" stroke="#7a4f9a" stroke-width="2" marker-end="url(#arrow-infrastructure)"/>
  <line x1="770" y1="250" x2="770" y2="282" stroke="#7a4f9a" stroke-width="2" marker-end="url(#arrow-infrastructure)"/>
  <path d="M500,118 V140 H520 V282" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="528" y="172" font-size="13" fill="#1f2328">the answer with v7</text>
  <text x="528" y="190" font-size="13" fill="#1f2328">reaches Varnish late</text>
  <!-- window -->
  <path d="M500,326 V336 H770 V326" fill="none" stroke="#3d4449" stroke-width="1.5"/>
  <text x="635" y="356" font-size="13" fill="#1f2328" text-anchor="middle">the window the second purge closes;</text>
  <text x="635" y="374" font-size="13" fill="#1f2328" text-anchor="middle">without it, the whole s-maxage</text>
  <!-- time -->
  <line x1="210" y1="400" x2="926" y2="400" stroke="#3d4449" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="210" y="392" font-size="13" fill="#5f6b73">time</text>
</svg>
