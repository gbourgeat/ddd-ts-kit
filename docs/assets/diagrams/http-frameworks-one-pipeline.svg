<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Four frameworks, one pipeline</title>
  <desc id="desc">Express, Fastify, Hono and NestJS each hand the raw request to executeRoute through their adapter: mountExpress, mountFastify or fastifyRoutes, mountHono, createRoutesModule. The pipeline gives the request its identifiers, resolves the principal, validates params, query, headers and body with the schemas of the route, builds the execution context, runs the handler inside the execution scope, which sends a command or a query on the bus, and answers. A refusal at any step goes through the error mapper and is answered as an application/problem+json document.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="540" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Four frameworks, one pipeline</text>
  <!-- frameworks -->
  <text x="132" y="74" font-size="13" font-weight="600" fill="#5f6b73" text-anchor="middle">the framework listens</text>
  <rect x="32" y="90" width="200" height="64" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="132" y="117" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">Express 5</text>
  <text x="132" y="139" font-size="13" fill="#1f2328" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">mountExpress</text>
  <rect x="32" y="170" width="200" height="64" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="132" y="197" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">Fastify 5</text>
  <text x="132" y="219" font-size="13" fill="#1f2328" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">fastifyRoutes</text>
  <rect x="32" y="250" width="200" height="64" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="132" y="277" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">Hono 4, on Node</text>
  <text x="132" y="299" font-size="13" fill="#1f2328" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">mountHono</text>
  <rect x="32" y="330" width="200" height="64" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="132" y="357" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">NestJS</text>
  <text x="132" y="379" font-size="13" fill="#1f2328" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">createRoutesModule</text>
  <path d="M234,202 H260 M234,282 H260 M234,362 H260 M260,362 V122" fill="none" stroke="#3d4449" stroke-width="2"/>
  <line x1="234" y1="122" x2="300" y2="122" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- pipeline -->
  <rect x="288" y="58" width="396" height="356" rx="12" fill="#f6ede6" stroke="#9a5b2b" stroke-width="2"/>
  <text x="486" y="84" font-size="16" font-weight="700" fill="#9a5b2b" text-anchor="middle">executeRoute: the pipeline of the kit</text>
  <rect x="304" y="102" width="364" height="40" rx="8" fill="#ffffff" stroke="#9a5b2b" stroke-opacity="0.5"/>
  <text x="318" y="127" font-size="13" fill="#1f2328">1. request id and correlation id</text>
  <rect x="304" y="152" width="364" height="40" rx="8" fill="#ffffff" stroke="#9a5b2b" stroke-opacity="0.5"/>
  <text x="318" y="177" font-size="13" fill="#1f2328">2. resolvePrincipal: the bearer token becomes a session</text>
  <rect x="304" y="202" width="364" height="40" rx="8" fill="#ffffff" stroke="#9a5b2b" stroke-opacity="0.5"/>
  <text x="318" y="227" font-size="13" fill="#1f2328">3. validate params, query, headers, body (Schema)</text>
  <rect x="304" y="252" width="364" height="40" rx="8" fill="#ffffff" stroke="#9a5b2b" stroke-opacity="0.5"/>
  <text x="318" y="277" font-size="13" fill="#1f2328">4. execution context: actor, tenant, locale, deadline</text>
  <rect x="304" y="302" width="364" height="40" rx="8" fill="#ffffff" stroke="#9a5b2b" stroke-opacity="0.5"/>
  <text x="318" y="327" font-size="13" fill="#1f2328">5. the handler, inside the execution scope</text>
  <rect x="304" y="352" width="364" height="40" rx="8" fill="#ffffff" stroke="#9a5b2b" stroke-opacity="0.5"/>
  <text x="318" y="377" font-size="13" fill="#1f2328">6. answer: status, body, identifier headers</text>
  <!-- bus -->
  <line x1="670" y1="322" x2="726" y2="322" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="728" y="290" width="200" height="64" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="828" y="317" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">CommandBus</text>
  <text x="828" y="339" font-size="13" fill="#1f2328" text-anchor="middle">or QueryBus: the use case</text>
  <!-- refusals -->
  <line x1="486" y1="416" x2="486" y2="450" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="498" y="438" font-size="13" fill="#1f2328">a refusal at any step</text>
  <rect x="288" y="452" width="396" height="64" rx="10" fill="#f6ede6" stroke="#9a5b2b" stroke-width="2"/>
  <text x="486" y="479" font-size="16" font-weight="700" fill="#9a5b2b" text-anchor="middle">error mapper</text>
  <text x="486" y="501" font-size="13" fill="#1f2328" text-anchor="middle">code to status, application/problem+json (RFC 9457)</text>
</svg>
