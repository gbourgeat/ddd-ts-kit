<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 556" width="960" height="556" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Choosing a broker, question by question</title>
  <desc id="desc">If no consumer runs in another process, the in-process bus behind the outbox is enough. If a consumer must see one aggregate's events in order and the payload carries no version, Kafka, with a per-key relay and a single relay. If a consumer added later must read past events, Kafka or NATS JetStream with retention limits. If the events tolerate a rare loss on a server crash, Redis Streams on a server that is not the cache; otherwise RabbitMQ with quorum queues. Between two that fit, the one the team already operates.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="556" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Choosing a broker, question by question</text>
  <!-- questions -->
  <rect x="32" y="64" width="480" height="60" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="2"/>
  <text x="272" y="99" font-size="14" fill="#1f2328" text-anchor="middle">Does a consumer run in another process?</text>
  <rect x="32" y="164" width="480" height="60" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="2"/>
  <text x="272" y="189" font-size="14" fill="#1f2328" text-anchor="middle">Must a consumer see one aggregate's events in order,</text>
  <text x="272" y="210" font-size="14" fill="#1f2328" text-anchor="middle">with no version in the payload to sort them?</text>
  <rect x="32" y="264" width="480" height="60" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="2"/>
  <text x="272" y="299" font-size="14" fill="#1f2328" text-anchor="middle">Must a consumer added later read past events?</text>
  <rect x="32" y="364" width="480" height="60" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="2"/>
  <text x="272" y="389" font-size="14" fill="#1f2328" text-anchor="middle">Can the events tolerate a rare loss</text>
  <text x="272" y="410" font-size="14" fill="#1f2328" text-anchor="middle">when the server crashes?</text>
  <!-- down arrows -->
  <line x1="272" y1="126" x2="272" y2="160" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="284" y="148" font-size="13" fill="#1f2328">yes</text>
  <line x1="272" y1="226" x2="272" y2="260" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="284" y="248" font-size="13" fill="#1f2328">no</text>
  <line x1="272" y1="326" x2="272" y2="360" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="284" y="348" font-size="13" fill="#1f2328">no</text>
  <line x1="272" y1="426" x2="272" y2="460" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="284" y="448" font-size="13" fill="#1f2328">no</text>
  <!-- answers -->
  <rect x="592" y="64" width="336" height="60" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="760" y="90" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">in-process bus</text>
  <text x="760" y="112" font-size="13" fill="#1f2328" text-anchor="middle">behind the outbox relay: no broker</text>
  <rect x="592" y="164" width="336" height="60" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="760" y="190" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">Kafka</text>
  <text x="760" y="212" font-size="13" fill="#1f2328" text-anchor="middle">keyOf the aggregate id, a single per-key relay</text>
  <rect x="592" y="264" width="336" height="60" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="760" y="290" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">Kafka or NATS JetStream</text>
  <text x="760" y="312" font-size="13" fill="#1f2328" text-anchor="middle">with retention limits set explicitly</text>
  <rect x="592" y="364" width="336" height="60" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="760" y="390" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">Redis Streams</text>
  <text x="760" y="412" font-size="13" fill="#1f2328" text-anchor="middle">on a server that is not the cache</text>
  <rect x="32" y="464" width="480" height="60" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="272" y="490" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">RabbitMQ</text>
  <text x="272" y="512" font-size="13" fill="#1f2328" text-anchor="middle">quorum queues, the default of the provider</text>
  <line x1="514" y1="94" x2="588" y2="94" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="551" y="86" font-size="13" fill="#1f2328" text-anchor="middle">no</text>
  <line x1="514" y1="194" x2="588" y2="194" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="551" y="186" font-size="13" fill="#1f2328" text-anchor="middle">yes</text>
  <line x1="514" y1="294" x2="588" y2="294" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="551" y="286" font-size="13" fill="#1f2328" text-anchor="middle">yes</text>
  <line x1="514" y1="394" x2="588" y2="394" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="551" y="386" font-size="13" fill="#1f2328" text-anchor="middle">yes</text>
  <!-- tie-breaker -->
  <text x="592" y="484" font-size="14" font-weight="600" fill="#1f2328">Between two that fit:</text>
  <text x="592" y="506" font-size="14" fill="#1f2328">the one your team already operates</text>
  <text x="592" y="528" font-size="14" fill="#1f2328">and can debug at night.</text>
</svg>
