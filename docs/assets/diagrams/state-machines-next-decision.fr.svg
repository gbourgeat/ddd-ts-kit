<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 630" width="960" height="630" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Comment next(from, transition, context) décide</title>
  <desc id="desc">Première question : la transition quitte-t-elle l'état from ? Si non, la machine lève le refus que sa déclaration construit avec refused, comme APPOINTMENT_ENDED, ou, sans refused, TransitionError.forbidden, de code FORBIDDEN_TRANSITION. Si oui, deuxième question : sa garde répond-elle un refus pour le contexte ? Si oui, la machine le lève, comme APPOINTMENT_NOT_STARTED. Sinon, elle répond l'état où mène la transition, ou from pour une transition sans to.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="630" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Comment next(from, transition, context) décide</text>
  <rect x="40" y="62" width="380" height="52" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="2"/>
  <text x="230" y="93" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">next(from, transition, context)</text>
  <rect x="40" y="152" width="380" height="84" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="2"/>
  <text x="230" y="179" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">Quitte from ?</text>
  <text x="230" y="205" font-size="13" fill="#1f2328" text-anchor="middle">from est-il parmi les états</text>
  <text x="230" y="225" font-size="13" fill="#1f2328" text-anchor="middle">que la transition quitte ?</text>
  <line x1="230.0" y1="116" x2="230.0" y2="150" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="500" y="152" width="436" height="84" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="2"/>
  <text x="718" y="179" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">refused déclaré ?</text>
  <text x="718" y="205" font-size="13" fill="#1f2328" text-anchor="middle">la déclaration nomme-t-elle</text>
  <text x="718" y="225" font-size="13" fill="#1f2328" text-anchor="middle">une fabrique de refus ?</text>
  <line x1="422" y1="194" x2="498" y2="194" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="460.0" y="184" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="600">non</text>
  <rect x="500" y="290" width="210" height="84" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="605" y="317" font-size="16" font-weight="700" fill="#2f6f4f" text-anchor="middle">Lève son refus</text>
  <text x="605" y="343" font-size="13" fill="#1f2328" text-anchor="middle">construit par refused(..) :</text>
  <text x="605" y="363" font-size="13" fill="#1f2328" text-anchor="middle">APPOINTMENT_ENDED</text>
  <rect x="726" y="290" width="210" height="84" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="831" y="317" font-size="16" font-weight="700" fill="#2f6f4f" text-anchor="middle">Lève le refus par défaut</text>
  <text x="831" y="343" font-size="13" fill="#1f2328" text-anchor="middle">TransitionError.forbidden :</text>
  <text x="831" y="363" font-size="13" fill="#1f2328" text-anchor="middle">FORBIDDEN_TRANSITION</text>
  <line x1="605.0" y1="238" x2="605.0" y2="288" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="615.0" y="268" font-size="13" fill="#1f2328" text-anchor="start" font-weight="600">oui</text>
  <line x1="831.0" y1="238" x2="831.0" y2="288" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="841.0" y="268" font-size="13" fill="#1f2328" text-anchor="start" font-weight="600">non</text>
  <rect x="40" y="412" width="380" height="84" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="2"/>
  <text x="230" y="439" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">La garde refuse ?</text>
  <text x="230" y="465" font-size="13" fill="#1f2328" text-anchor="middle">sa garde répond-elle</text>
  <text x="230" y="485" font-size="13" fill="#1f2328" text-anchor="middle">un refus pour context ?</text>
  <line x1="230.0" y1="238" x2="230.0" y2="410" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="240.0" y="330" font-size="13" fill="#1f2328" text-anchor="start" font-weight="600">oui</text>
  <rect x="500" y="412" width="436" height="84" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="718" y="449" font-size="16" font-weight="700" fill="#2f6f4f" text-anchor="middle">Lève le refus de la garde</text>
  <text x="718" y="475" font-size="13" fill="#1f2328" text-anchor="middle">par exemple APPOINTMENT_NOT_STARTED</text>
  <line x1="422" y1="454" x2="498" y2="454" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="460.0" y="444" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="600">oui</text>
  <rect x="40" y="546" width="380" height="64" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="230" y="573" font-size="16" font-weight="700" fill="#2f6f4f" text-anchor="middle">Répond l'état suivant</text>
  <text x="230" y="599" font-size="13" fill="#1f2328" text-anchor="middle">to, ou from pour une transition sans to</text>
  <line x1="230.0" y1="498" x2="230.0" y2="544" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="240.0" y="526" font-size="13" fill="#1f2328" text-anchor="start" font-weight="600">non, ou pas de garde</text>
</svg>
