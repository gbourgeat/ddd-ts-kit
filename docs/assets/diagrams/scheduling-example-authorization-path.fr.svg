<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 572" width="960" height="572" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Où chaque question d'autorisation trouve sa réponse</title>
  <desc id="desc">Une requête HTTP franchit quatre contrôles, dans l'ordre. La frontière HTTP vérifie le jeton émis par Keycloak, ou répond 401. L'autorisateur, avant le gestionnaire, accorde la permission par un rôle du jeton, sinon par les relations, ou répond 403. Le gestionnaire charge l'élément et Access.authorize applique les politiques de la permission, qui peuvent répondre 403. Le domaine garde ses invariants, ou répond 422. Trois cas sont suivis : un assistant qui réserve sur un calendrier délégué passe tout et obtient 201 ; un patient qui annule moins de 24 heures avant le début est refusé par la politique avec 403 ; le praticien qui annule sans motif passe les droits et est refusé par le domaine avec 422.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="572" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Où chaque question d'autorisation trouve sa réponse</text>

  <!-- 1. presentation -->
  <rect x="24" y="64" width="170" height="140" rx="10" fill="#f6ede6" stroke="#9a5b2b" stroke-width="2"/>
  <text x="109" y="92" font-size="16" font-weight="700" fill="#9a5b2b" text-anchor="middle">Qui appelle ?</text>
  <line x1="40" y1="104" x2="178" y2="104" stroke="#9a5b2b" stroke-opacity="0.35"/>
  <text x="109" y="128" font-size="13" fill="#1f2328" text-anchor="middle">la frontière HTTP</text>
  <text x="109" y="148" font-size="13" fill="#1f2328" text-anchor="middle">vérifie le jeton</text>
  <text x="109" y="168" font-size="13" fill="#1f2328" text-anchor="middle">émis par Keycloak</text>
  <!-- 2. platform -->
  <rect x="210" y="64" width="170" height="140" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="295" y="92" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">A-t-il le droit ?</text>
  <line x1="226" y1="104" x2="364" y2="104" stroke="#5f6b73" stroke-opacity="0.35"/>
  <text x="295" y="128" font-size="13" fill="#1f2328" text-anchor="middle">l'autorisateur, avant le</text>
  <text x="295" y="148" font-size="13" fill="#1f2328" text-anchor="middle">gestionnaire : un rôle</text>
  <text x="295" y="168" font-size="13" fill="#1f2328" text-anchor="middle">du jeton, sinon les</text>
  <text x="295" y="188" font-size="13" fill="#1f2328" text-anchor="middle">relations</text>
  <!-- 3. application -->
  <rect x="396" y="64" width="170" height="140" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="481" y="92" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">Sur cet élément ?</text>
  <line x1="412" y1="104" x2="550" y2="104" stroke="#2b5d8a" stroke-opacity="0.35"/>
  <text x="481" y="128" font-size="13" fill="#1f2328" text-anchor="middle">le gestionnaire charge</text>
  <text x="481" y="148" font-size="13" fill="#1f2328" text-anchor="middle">l'élément, puis</text>
  <text x="481" y="168" font-size="13" fill="#1f2328" text-anchor="middle">Access.authorize</text>
  <text x="481" y="188" font-size="13" fill="#1f2328" text-anchor="middle">applique les politiques</text>
  <!-- 4. domain -->
  <rect x="582" y="64" width="170" height="140" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="667" y="92" font-size="16" font-weight="700" fill="#2f6f4f" text-anchor="middle">Est-ce valide ?</text>
  <line x1="598" y1="104" x2="736" y2="104" stroke="#2f6f4f" stroke-opacity="0.35"/>
  <text x="667" y="128" font-size="13" fill="#1f2328" text-anchor="middle">l'agrégat garde</text>
  <text x="667" y="148" font-size="13" fill="#1f2328" text-anchor="middle">ses invariants</text>
  <!-- 5. answer -->
  <rect x="768" y="64" width="170" height="140" rx="10" fill="#ffffff" stroke="#3d4449" stroke-width="2"/>
  <text x="853" y="92" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">La réponse</text>
  <line x1="784" y1="104" x2="922" y2="104" stroke="#3d4449" stroke-opacity="0.35"/>
  <text x="853" y="128" font-size="13" fill="#1f2328" text-anchor="middle">201 ou 200 quand</text>
  <text x="853" y="148" font-size="13" fill="#1f2328" text-anchor="middle">tout est passé</text>

  <!-- the order of the checks -->
  <line x1="195" y1="134" x2="208" y2="134" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="381" y1="134" x2="394" y2="134" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="567" y1="134" x2="580" y2="134" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="753" y1="134" x2="766" y2="134" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- refusals -->
  <line x1="109" y1="206" x2="109" y2="222" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="109" y="242" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">jeton invalide : 401</text>
  <line x1="295" y1="206" x2="295" y2="222" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="295" y="242" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">ni rôle, ni chemin : 403</text>
  <line x1="481" y1="206" x2="481" y2="222" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="481" y="242" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">une politique refuse : 403</text>
  <line x1="667" y1="206" x2="667" y2="222" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="667" y="242" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">un invariant : 422</text>

  <text x="32" y="290" font-size="16" font-weight="700" fill="#1f2328">Trois cas, suivis de bout en bout</text>

  <!-- case A -->
  <rect x="24" y="304" width="914" height="78" rx="10" fill="#f3f4f5"/>
  <text x="40" y="326" font-size="14" font-weight="600" fill="#1f2328">Un assistant réserve sur un calendrier délégué</text>
  <text x="109" y="350" font-size="13" fill="#1f2328" text-anchor="middle">jeton de</text>
  <text x="109" y="368" font-size="13" fill="#1f2328" text-anchor="middle">demo-assistant</text>
  <text x="295" y="350" font-size="13" fill="#1f2328" text-anchor="middle">aucun rôle ;</text>
  <text x="295" y="368" font-size="13" fill="#1f2328" text-anchor="middle">délégué du poste</text>
  <text x="481" y="350" font-size="13" fill="#1f2328" text-anchor="middle">aucune politique</text>
  <text x="481" y="368" font-size="13" fill="#1f2328" text-anchor="middle">sur la réservation</text>
  <text x="667" y="350" font-size="13" fill="#1f2328" text-anchor="middle">le créneau est libre,</text>
  <text x="667" y="368" font-size="13" fill="#1f2328" text-anchor="middle">dans les horaires d'ouverture</text>
  <text x="853" y="360" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">201</text>

  <!-- case B -->
  <rect x="24" y="392" width="914" height="78" rx="10" fill="#f3f4f5"/>
  <text x="40" y="414" font-size="14" font-weight="600" fill="#1f2328">Un patient annule moins de 24 heures avant le début</text>
  <text x="109" y="438" font-size="13" fill="#1f2328" text-anchor="middle">jeton de</text>
  <text x="109" y="456" font-size="13" fill="#1f2328" text-anchor="middle">demo-patient</text>
  <text x="295" y="438" font-size="13" fill="#1f2328" text-anchor="middle">patient du</text>
  <text x="295" y="456" font-size="13" fill="#1f2328" text-anchor="middle">rendez-vous</text>
  <text x="481" y="438" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">patient-cancels-</text>
  <text x="481" y="456" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">until-notice dit non</text>
  <text x="667" y="447" font-size="13" font-style="italic" fill="#5f6b73" text-anchor="middle">non atteint</text>
  <text x="853" y="448" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">403</text>

  <!-- case C -->
  <rect x="24" y="480" width="914" height="78" rx="10" fill="#f3f4f5"/>
  <text x="40" y="502" font-size="14" font-weight="600" fill="#1f2328">Le praticien annule sans motif</text>
  <text x="109" y="526" font-size="13" fill="#1f2328" text-anchor="middle">jeton de</text>
  <text x="109" y="544" font-size="13" fill="#1f2328" text-anchor="middle">demo-practitioner</text>
  <text x="295" y="526" font-size="13" fill="#1f2328" text-anchor="middle">titulaire du poste</text>
  <text x="295" y="544" font-size="13" fill="#1f2328" text-anchor="middle">du calendrier</text>
  <text x="481" y="526" font-size="13" fill="#1f2328" text-anchor="middle">pas le patient :</text>
  <text x="481" y="544" font-size="13" fill="#1f2328" text-anchor="middle">la politique accepte</text>
  <text x="667" y="535" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">REASON_REQUIRED</text>
  <text x="853" y="536" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">422</text>
</svg>
