<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">The path of one log line through WinstonLogger and winston</title>
  <desc id="desc">An adapter calls logger.info with a message and fields. WinstonLogger first asks winston whether the level is enabled: below the threshold, or once the logger was flushed, nothing is written. Otherwise it describes the errors among the fields and keeps the level and the message out of them. winston merges the fields of the line, those of the children and its defaultMeta (service, environment, base). Then the formats run in order: correlationFields fills the keys nobody gave from fields(), redactCredentials replaces the value of every credential key by [redacted], isoTime writes time, and json or the pretty line serializes. Each transport writes the line if it passes its own level: the console by default, or the files, syslog or streams you give.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="540" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">The path of one log line through winston</text>

  <!-- row 1 -->
  <rect x="32" y="70" width="240" height="96" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="152" y="98" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">an adapter</text>
  <text x="152" y="122" font-size="13" fill="#1f2328" text-anchor="middle">logger.info('order shipped',</text>
  <text x="152" y="142" font-size="13" fill="#1f2328" text-anchor="middle">{ orderId })</text>
  <rect x="312" y="70" width="200" height="96" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="412" y="98" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">level enabled?</text>
  <text x="412" y="122" font-size="13" fill="#1f2328" text-anchor="middle">asked by WinstonLogger,</text>
  <text x="412" y="142" font-size="13" fill="#1f2328" text-anchor="middle">false once flushed</text>
  <rect x="552" y="70" width="240" height="96" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="672" y="98" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">WinstonLogger</text>
  <text x="672" y="122" font-size="13" fill="#1f2328" text-anchor="middle">errors described once</text>
  <text x="672" y="142" font-size="13" fill="#1f2328" text-anchor="middle">level and message protected</text>
  <line x1="274" y1="118" x2="308" y2="118" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="514" y1="118" x2="548" y2="118" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="530" y="108" font-size="13" fill="#1f2328" text-anchor="middle">yes</text>
  <line x1="412" y1="168" x2="412" y2="196" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="422" y="188" font-size="13" fill="#1f2328">no</text>
  <rect x="312" y="200" width="200" height="44" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="412" y="219" font-size="13" fill="#1f2328" text-anchor="middle">nothing written,</text>
  <text x="412" y="236" font-size="13" fill="#1f2328" text-anchor="middle">no format runs</text>

  <!-- row 2, right to left -->
  <line x1="740" y1="168" x2="740" y2="266" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="660" y="270" width="268" height="150" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="794" y="296" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">winston merges</text>
  <text x="678" y="324" font-size="13" fill="#1f2328">the fields of the line</text>
  <text x="678" y="348" font-size="13" fill="#1f2328">the fields of the children</text>
  <text x="678" y="372" font-size="13" fill="#1f2328">defaultMeta: service,</text>
  <text x="678" y="392" font-size="13" fill="#1f2328">environment, base</text>

  <rect x="340" y="270" width="280" height="250" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="480" y="296" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">formats, in order</text>
  <rect x="354" y="310" width="252" height="44" rx="8" fill="#ffffff" stroke="#7a4f9a" stroke-width="1.5"/>
  <text x="366" y="328" font-size="13" font-weight="700" fill="#7a4f9a">1. correlationFields</text>
  <text x="366" y="346" font-size="13" fill="#1f2328">fields() fills the keys nobody gave</text>
  <rect x="354" y="362" width="252" height="44" rx="8" fill="#ffffff" stroke="#7a4f9a" stroke-width="1.5"/>
  <text x="366" y="380" font-size="13" font-weight="700" fill="#7a4f9a">2. redactCredentials</text>
  <text x="366" y="398" font-size="13" fill="#1f2328">password, token, ... [redacted]</text>
  <rect x="354" y="414" width="252" height="44" rx="8" fill="#ffffff" stroke="#7a4f9a" stroke-width="1.5"/>
  <text x="366" y="432" font-size="13" font-weight="700" fill="#7a4f9a">3. isoTime</text>
  <text x="366" y="450" font-size="13" fill="#1f2328">time, in ISO 8601</text>
  <rect x="354" y="466" width="252" height="44" rx="8" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="366" y="484" font-size="13" font-weight="700" fill="#5f6b73">4. json, or the pretty line</text>
  <text x="366" y="502" font-size="13" fill="#1f2328">keys sorted in JSON</text>
  <line x1="658" y1="345" x2="624" y2="345" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="32" y="270" width="268" height="200" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="166" y="296" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">transports</text>
  <text x="50" y="322" font-size="13" fill="#1f2328">each one checks its own level</text>
  <rect x="46" y="336" width="240" height="36" rx="8" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="58" y="359" font-size="13" fill="#1f2328">Console: the default</text>
  <rect x="46" y="380" width="240" height="36" rx="8" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="58" y="403" font-size="13" fill="#1f2328">File, with or without rotation</text>
  <rect x="46" y="424" width="240" height="36" rx="8" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="58" y="447" font-size="13" fill="#1f2328">Stream, syslog, a vendor</text>
  <line x1="338" y1="390" x2="304" y2="390" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
