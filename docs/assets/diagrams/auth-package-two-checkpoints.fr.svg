<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 616" width="960" height="616" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Deux points de contrôle : la garde du bus, puis Access dans le gestionnaire</title>
  <desc id="desc">À gauche, la garde du bus, pour chaque commande et chaque requête, avant son gestionnaire. Un message absent de la carte des autorisations échoue avec UndeclaredUseCaseError, une erreur de programmation. Un message public va à son gestionnaire sans contrôle. Un message protégé sans acteur échoue avec MissingActorError. L'acteur anonyme est refusé avec UnauthenticatedError, code UNAUTHORIZED, traduit en 401. Sinon l'Authorizer décide : refusé, ForbiddenError, code FORBIDDEN, traduit en 403 avec un code de raison ; autorisé, l'unité de travail s'ouvre et le gestionnaire s'exécute. À droite, Access dans le gestionnaire, une fois l'élément chargé. L'acteur anonyme est refusé avec UnauthenticatedError. Chaque politique de la permission est interrogée : un sujet auquel elle ne s'applique pas est refusé avec la raison SUBJECT_MISMATCH, une politique qui renvoie false refuse avec son propre nom pour raison. Puis l'Authorizer est interrogé sur la ressource que représente le sujet ; refusé, ForbiddenError avec la raison du modèle. Autorisé, l'agrégat change. Les deux points de contrôle transmettent chaque décision, autorisée ou refusée, au hook onDecision.</desc>
