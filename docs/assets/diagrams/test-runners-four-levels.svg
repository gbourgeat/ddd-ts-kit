<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Four levels of specs, and which run measures them</title>
  <desc id="desc">A domain spec, where Appointment refuses a second cancellation, and a handler spec, where CancelAppointment goes through the command bus with fakes, take milliseconds and run in the unit project, which measures the domain, application and presentation layers. An adapter spec, the repository against PostgreSQL held to its contract, takes seconds and runs in the integration project, which measures the infrastructure layer. An end-to-end spec, POST /appointments over HTTP and the event bus, takes seconds and runs with its own configuration against the whole application.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="420" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Four levels of specs, and which run measures them</text>
  <!-- levels -->
  <rect x="32" y="66" width="400" height="64" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="48" y="92" font-size="16" font-weight="700" fill="#2f6f4f">domain spec</text>
  <text x="48" y="116" font-size="13" fill="#1f2328">Appointment refuses a second cancellation</text>
  <rect x="32" y="146" width="400" height="64" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="48" y="172" font-size="16" font-weight="700" fill="#2b5d8a">handler spec</text>
  <text x="48" y="196" font-size="13" fill="#1f2328">CancelAppointment through the command bus, with fakes</text>
  <rect x="32" y="226" width="400" height="64" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="48" y="252" font-size="16" font-weight="700" fill="#7a4f9a">adapter spec</text>
  <text x="48" y="276" font-size="13" fill="#1f2328">the repository against PostgreSQL, held to its contract</text>
  <rect x="32" y="306" width="400" height="64" rx="10" fill="#f6ede6" stroke="#9a5b2b" stroke-width="2"/>
  <text x="48" y="332" font-size="16" font-weight="700" fill="#9a5b2b">end-to-end spec</text>
  <text x="48" y="356" font-size="13" fill="#1f2328">POST /appointments over HTTP and the event bus</text>
  <!-- speeds -->
  <line x1="434" y1="98" x2="584" y2="98" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="508" y="90" font-size="13" fill="#1f2328" text-anchor="middle">milliseconds</text>
  <line x1="434" y1="178" x2="584" y2="178" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="508" y="170" font-size="13" fill="#1f2328" text-anchor="middle">milliseconds</text>
  <line x1="434" y1="258" x2="584" y2="258" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="508" y="250" font-size="13" fill="#1f2328" text-anchor="middle">seconds</text>
  <line x1="434" y1="338" x2="584" y2="338" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="508" y="330" font-size="13" fill="#1f2328" text-anchor="middle">seconds</text>
  <!-- runs -->
  <rect x="586" y="66" width="342" height="144" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="602" y="96" font-size="16" font-weight="700" fill="#5f6b73">unit project</text>
  <text x="602" y="122" font-size="13" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">vitest run --project unit</text>
  <text x="602" y="150" font-size="13" fill="#1f2328">run on every change, no database</text>
  <text x="602" y="176" font-size="13" fill="#1f2328">coverage: domain, application,</text>
  <text x="602" y="196" font-size="13" fill="#1f2328">presentation</text>
  <rect x="586" y="226" width="342" height="64" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="602" y="252" font-size="16" font-weight="700" fill="#5f6b73">integration project</text>
  <text x="602" y="276" font-size="13" fill="#1f2328">a real database; coverage: infrastructure</text>
  <rect x="586" y="306" width="342" height="64" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="602" y="332" font-size="16" font-weight="700" fill="#5f6b73">end-to-end configuration</text>
  <text x="602" y="356" font-size="13" fill="#1f2328">the whole application, on a free port</text>
  <text x="32" y="400" font-size="13" fill="#5f6b73">The levels and the runs are the ones Vitest is configured with; under Jest one run holds the first three.</text>
</svg>
