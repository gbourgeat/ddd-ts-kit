<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Avant et après la règle de dépendance</title>
  <desc id="desc">À gauche, trois tiers : les règles de réservation importent l'ORM et l'appellent, la flèche de l'import et celle de l'appel pointent toutes deux vers le bas. À droite, la règle de dépendance : les règles de réservation déclarent un port de repository, l'adaptateur ORM importe ce port et l'implémente, l'import pointe donc vers le haut, tandis que l'appel descend toujours à l'exécution.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
    <marker id="arrow-infrastructure" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a4f9a"/>
    </marker>
    <marker id="arrow-call" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/>
    </marker>
  </defs>
  <rect width="960" height="470" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Dans quel sens pointe l'import</text>
  <!-- left panel: three tiers -->
  <rect x="24" y="58" width="444" height="300" rx="14" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="44" y="88" font-size="16" font-weight="700" fill="#5f6b73">Avant : trois tiers</text>
  <text x="44" y="110" font-size="13" fill="#1f2328">le code métier importe le code de la base de données</text>
  <rect x="104" y="130" width="284" height="72" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="246" y="160" font-size="16" font-weight="700" fill="#2f6f4f" text-anchor="middle">règles de réservation</text>
  <text x="246" y="184" font-size="13" fill="#1f2328" text-anchor="middle">écrites en lignes et en sessions</text>
  <rect x="104" y="268" width="284" height="72" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="246" y="298" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">ORM, base de données</text>
  <text x="246" y="322" font-size="13" fill="#1f2328" text-anchor="middle">Knex, Prisma, TypeORM...</text>
  <line x1="246" y1="204" x2="246" y2="264" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="258" y="230" font-size="13" fill="#1f2328">importe</text>
  <text x="258" y="248" font-size="13" fill="#1f2328">et appelle</text>
  <!-- right panel: dependency rule -->
  <rect x="492" y="58" width="444" height="300" rx="14" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="512" y="88" font-size="16" font-weight="700" fill="#5f6b73">Après : la règle de dépendance</text>
  <text x="512" y="110" font-size="13" fill="#1f2328">le code métier déclare un port, la périphérie l'implémente</text>
  <rect x="572" y="130" width="284" height="96" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="714" y="156" font-size="16" font-weight="700" fill="#2f6f4f" text-anchor="middle">règles de réservation</text>
  <rect x="592" y="170" width="244" height="40" rx="8" fill="#ffffff" stroke="#2f6f4f" stroke-width="1.5"/>
  <text x="714" y="195" font-size="13" font-weight="600" fill="#2f6f4f" text-anchor="middle">AppointmentRepository (port)</text>
  <rect x="572" y="268" width="284" height="72" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="714" y="298" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">adaptateur ORM</text>
  <text x="714" y="322" font-size="13" fill="#1f2328" text-anchor="middle">infrastructure/persistence/</text>
  <!-- call at run time, down -->
  <line x1="640" y1="212" x2="640" y2="264" stroke="#8c959f" stroke-width="2" stroke-dasharray="2 4" marker-end="url(#arrow-call)"/>
  <text x="622" y="236" font-size="13" fill="#5f6b73" text-anchor="end">appelle à</text>
  <text x="622" y="254" font-size="13" fill="#5f6b73" text-anchor="end">l'exécution</text>
  <!-- import and implementation, up -->
  <line x1="788" y1="266" x2="788" y2="214" stroke="#7a4f9a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-infrastructure)"/>
  <text x="800" y="236" font-size="13" fill="#7a4f9a">importe et</text>
  <text x="800" y="254" font-size="13" fill="#7a4f9a">implémente</text>
  <!-- legend -->
  <line x1="40" y1="394" x2="84" y2="394" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="96" y="399" font-size="14" fill="#1f2328">import : une dépendance de source</text>
  <line x1="40" y1="422" x2="84" y2="422" stroke="#7a4f9a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-infrastructure)"/>
  <text x="96" y="427" font-size="14" fill="#1f2328">implémente un port : un import aussi, tourné vers le domaine</text>
  <line x1="40" y1="450" x2="84" y2="450" stroke="#8c959f" stroke-width="2" stroke-dasharray="2 4" marker-end="url(#arrow-call)"/>
  <text x="96" y="455" font-size="14" fill="#1f2328">appel à l'exécution : inchangé, il va toujours des règles vers la base de données</text>
</svg>
