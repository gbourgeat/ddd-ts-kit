<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 416" width="960" height="416" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">From a file write to the gate of the CI</title>
  <desc id="desc">Six moments in order. On the machine: the plugin's hook at every file write of an agent session, which blocks but fails open; the pre-commit hook, which blocks on ESLint, the formatter and the architecture check and only advises on the commit size; the commit-msg hook, which blocks a message that is not a conventional commit; the pre-push hook, which blocks on the type check and the unit tests. On the server: the title check of the pull request, and the CI, whose single gate job is the authority. Below, what no tool holds: one use case per commit, generated files in the same commit, every intermediate commit green, the quality of a message beyond its format, and the size unless strict is added.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="416" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">From a file write to the gate of the CI</text>

  <!-- groups -->
  <text x="32" y="70" font-size="13" font-weight="600" fill="#5f6b73">on the machine</text>
  <line x1="32" y1="78" x2="619" y2="78" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="644" y="70" font-size="13" font-weight="600" fill="#5f6b73">on the server</text>
  <line x1="644" y1="78" x2="925" y2="78" stroke="#5f6b73" stroke-width="1.5"/>

  <!-- 1 write -->
  <rect x="32" y="88" width="128" height="200" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="96" y="112" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">file write</text>
  <text x="96" y="130" font-size="13" fill="#5f6b73" text-anchor="middle">agent session</text>
  <line x1="44" y1="140" x2="148" y2="140" stroke="#5f6b73" stroke-opacity="0.35"/>
  <text x="96" y="162" font-size="13" fill="#1f2328" text-anchor="middle">plugin's hook:</text>
  <text x="96" y="180" font-size="13" fill="#1f2328" text-anchor="middle">generated files,</text>
  <text x="96" y="198" font-size="13" fill="#1f2328" text-anchor="middle">worker scope,</text>
  <text x="96" y="216" font-size="13" fill="#1f2328" text-anchor="middle">violations</text>
  <text x="96" y="256" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">blocks,</text>
  <text x="96" y="274" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">fails open</text>

  <!-- 2 pre-commit -->
  <rect x="185" y="88" width="128" height="200" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="249" y="112" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">pre-commit</text>
  <text x="249" y="130" font-size="13" fill="#5f6b73" text-anchor="middle">lefthook</text>
  <line x1="197" y1="140" x2="301" y2="140" stroke="#5f6b73" stroke-opacity="0.35"/>
  <text x="249" y="162" font-size="13" fill="#1f2328" text-anchor="middle">ESLint, format,</text>
  <text x="249" y="180" font-size="13" fill="#1f2328" text-anchor="middle">check on src/,</text>
  <text x="249" y="198" font-size="13" fill="#1f2328" text-anchor="middle">commit size</text>
  <text x="249" y="256" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">blocks;</text>
  <text x="249" y="274" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">size: advice</text>

  <!-- 3 commit-msg -->
  <rect x="338" y="88" width="128" height="200" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="402" y="112" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">commit-msg</text>
  <text x="402" y="130" font-size="13" fill="#5f6b73" text-anchor="middle">lefthook</text>
  <line x1="350" y1="140" x2="454" y2="140" stroke="#5f6b73" stroke-opacity="0.35"/>
  <text x="402" y="162" font-size="13" fill="#1f2328" text-anchor="middle">commitlint:</text>
  <text x="402" y="180" font-size="13" fill="#1f2328" text-anchor="middle">conventional</text>
  <text x="402" y="198" font-size="13" fill="#1f2328" text-anchor="middle">format</text>
  <text x="402" y="274" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">blocks</text>

  <!-- 4 pre-push -->
  <rect x="491" y="88" width="128" height="200" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="555" y="112" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">pre-push</text>
  <text x="555" y="130" font-size="13" fill="#5f6b73" text-anchor="middle">lefthook</text>
  <line x1="503" y1="140" x2="607" y2="140" stroke="#5f6b73" stroke-opacity="0.35"/>
  <text x="555" y="162" font-size="13" fill="#1f2328" text-anchor="middle">type check,</text>
  <text x="555" y="180" font-size="13" fill="#1f2328" text-anchor="middle">unit tests</text>
  <text x="555" y="274" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">blocks</text>

  <!-- 5 pull request -->
  <rect x="644" y="88" width="128" height="200" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="708" y="112" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">pull request</text>
  <text x="708" y="130" font-size="13" fill="#5f6b73" text-anchor="middle">title check</text>
  <line x1="656" y1="140" x2="760" y2="140" stroke="#5f6b73" stroke-opacity="0.35"/>
  <text x="708" y="162" font-size="13" fill="#1f2328" text-anchor="middle">commitlint on</text>
  <text x="708" y="180" font-size="13" fill="#1f2328" text-anchor="middle">the title, which</text>
  <text x="708" y="198" font-size="13" fill="#1f2328" text-anchor="middle">a squash makes</text>
  <text x="708" y="216" font-size="13" fill="#1f2328" text-anchor="middle">the commit</text>
  <text x="708" y="274" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">blocks the merge</text>

  <!-- 6 CI -->
  <rect x="797" y="88" width="128" height="200" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="861" y="112" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">CI</text>
  <text x="861" y="130" font-size="13" fill="#5f6b73" text-anchor="middle">the gate job</text>
  <line x1="809" y1="140" x2="913" y2="140" stroke="#5f6b73" stroke-opacity="0.35"/>
  <text x="861" y="162" font-size="13" fill="#1f2328" text-anchor="middle">every gate,</text>
  <text x="861" y="180" font-size="13" fill="#1f2328" text-anchor="middle">stale generated</text>
  <text x="861" y="198" font-size="13" fill="#1f2328" text-anchor="middle">files included</text>
  <text x="861" y="274" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">the authority</text>

  <!-- order -->
  <line x1="162" y1="188" x2="181" y2="188" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="315" y1="188" x2="334" y2="188" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="468" y1="188" x2="487" y2="188" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="621" y1="188" x2="640" y2="188" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="774" y1="188" x2="793" y2="188" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- not enforced -->
  <rect x="32" y="312" width="893" height="84" rx="12" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="52" y="338" font-size="14" font-weight="600" fill="#1f2328">Held by review and habit, by no tool</text>
  <text x="52" y="362" font-size="13" fill="#1f2328">one use case per commit · generated files in the same commit as their cause · every intermediate commit green</text>
  <text x="52" y="382" font-size="13" fill="#1f2328">the quality of a message beyond its format · the size of a commit or a pull request, unless --strict is added</text>
</svg>
