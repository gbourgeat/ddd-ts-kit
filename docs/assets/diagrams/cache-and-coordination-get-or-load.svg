<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">What getOrLoad does on a miss</title>
  <desc id="desc">getOrLoad reads the entry and answers it when it is there. On a miss, a computation already running in this process is shared. Otherwise, without the lock option of RedisCache, it runs load and stores the value with its time to live. With the lock option, it takes the lock, waiting up to waitMs, and reads the entry again: if another process filled it meanwhile, it answers it. Otherwise it runs load, stores the value with its time to live and releases the lock. It never fails because of the lock or the server.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="560" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">getOrLoad on a miss: one computation per process, or across processes with a lock</text>
  <!-- column of steps -->
  <rect x="160" y="60" width="400" height="48" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="360" y="90" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">cache.getOrLoad(key, load, { ttlMs })</text>
  <rect x="160" y="136" width="400" height="48" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="2"/>
  <text x="360" y="166" font-size="14" fill="#1f2328" text-anchor="middle">is the entry in the cache?</text>
  <rect x="160" y="212" width="400" height="48" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="2"/>
  <text x="360" y="242" font-size="14" fill="#1f2328" text-anchor="middle">is this process already computing it?</text>
  <rect x="160" y="288" width="400" height="48" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="360" y="308" font-size="14" fill="#1f2328" text-anchor="middle">take the lock, waiting up to waitMs (2 s)</text>
  <text x="360" y="327" font-size="13" fill="#5f6b73" text-anchor="middle">only with the lock option of RedisCache</text>
  <rect x="160" y="364" width="400" height="48" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="2"/>
  <text x="360" y="384" font-size="14" fill="#1f2328" text-anchor="middle">is the entry in the cache now?</text>
  <text x="360" y="403" font-size="13" fill="#5f6b73" text-anchor="middle">only with the lock option</text>
  <rect x="160" y="440" width="400" height="48" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="360" y="470" font-size="14" fill="#1f2328" text-anchor="middle">load(), set it with ttlMs, release any lock</text>
  <!-- down arrows -->
  <line x1="360" y1="110" x2="360" y2="132" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="360" y1="186" x2="360" y2="208" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="372" y="202" font-size="13" fill="#1f2328">no</text>
  <line x1="360" y1="262" x2="360" y2="284" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="372" y="278" font-size="13" fill="#1f2328">no</text>
  <line x1="360" y1="338" x2="360" y2="360" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="372" y="354" font-size="13" fill="#1f2328">held, or not after waitMs</text>
  <line x1="360" y1="414" x2="360" y2="436" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="372" y="430" font-size="13" fill="#1f2328">no</text>
  <!-- without the lock option -->
  <path d="M158,248 H128 V464 H156" fill="none" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="120" y="350" font-size="13" fill="#1f2328" text-anchor="end">no, without</text>
  <text x="120" y="368" font-size="13" fill="#1f2328" text-anchor="end">the lock option</text>
  <!-- outcomes -->
  <rect x="640" y="136" width="288" height="48" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="784" y="166" font-size="14" fill="#1f2328" text-anchor="middle">answer the entry</text>
  <rect x="640" y="212" width="288" height="48" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="784" y="242" font-size="14" fill="#1f2328" text-anchor="middle">share that computation</text>
  <rect x="640" y="364" width="288" height="48" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="784" y="386" font-size="14" fill="#1f2328" text-anchor="middle">answer it: another process</text>
  <text x="784" y="404" font-size="14" fill="#1f2328" text-anchor="middle">computed it meanwhile</text>
  <line x1="562" y1="160" x2="636" y2="160" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="598" y="152" font-size="13" fill="#1f2328" text-anchor="middle">yes</text>
  <line x1="562" y1="236" x2="636" y2="236" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="598" y="228" font-size="13" fill="#1f2328" text-anchor="middle">yes</text>
  <line x1="562" y1="388" x2="636" y2="388" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="598" y="380" font-size="13" fill="#1f2328" text-anchor="middle">yes</text>
  <!-- note -->
  <text x="32" y="526" font-size="14" fill="#1f2328">A lock or a server that fails is ignored: the worst case is the unprotected computation. A failed load is not cached.</text>
</svg>
