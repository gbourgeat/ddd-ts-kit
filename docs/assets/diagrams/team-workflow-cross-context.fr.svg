<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="840" height="400" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Changer deux contextes : une proposition, puis trois pull requests, amont d'abord</title>
  <desc id="desc">Deux couloirs, le propriétaire d'appointments et celui d'analytics. 1 : appointments propose un changement additif, un champ optionnel late, et analytics l'accepte. 2 : appointments fusionne son langage publié, son publisher et le catalogue, dans la même version. Puis, en parallèle : 3, appointments fait calculer late par l'agrégat, avec ses tests ; 4, analytics fusionne un gestionnaire qui lit late et tolère son absence. Chaque pull request est verte et déployable seule.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="840" height="400" rx="16" fill="#ffffff"/>
  <text x="32" y="34" font-size="18" font-weight="600" fill="#1f2328">Changer deux contextes : une proposition, puis trois pull requests, amont d'abord</text>
  <rect x="24" y="52" width="792" height="136" rx="12" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="40" y="74" font-size="14" font-weight="600" fill="#5f6b73">propriétaire d'appointments</text>
  <rect x="24" y="200" width="792" height="136" rx="12" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="40" y="222" font-size="14" font-weight="600" fill="#5f6b73">propriétaire d'analytics</text>
  <rect x="48" y="86" width="200" height="90" rx="10" fill="#ffffff" stroke="#3d4449" stroke-width="2"/>
  <text x="148" y="120" font-size="16" font-weight="700" text-anchor="middle" fill="#3d4449">1. proposer</text>
  <text x="148" y="142" font-size="13" text-anchor="middle" fill="#1f2328">un champ optionnel late</text>
  <rect x="48" y="234" width="200" height="90" rx="10" fill="#ffffff" stroke="#3d4449" stroke-width="2"/>
  <text x="148" y="268" font-size="16" font-weight="700" text-anchor="middle" fill="#3d4449">1. accepter</text>
  <text x="148" y="290" font-size="13" text-anchor="middle" fill="#1f2328">le besoin est couvert</text>
  <rect x="300" y="86" width="220" height="90" rx="10" fill="#ffffff" stroke="#3d4449" stroke-width="2"/>
  <text x="410" y="112" font-size="16" font-weight="700" text-anchor="middle" fill="#3d4449">2. pull request</text>
  <text x="410" y="134" font-size="13" text-anchor="middle" fill="#1f2328">langage publié,</text>
  <text x="410" y="153" font-size="13" text-anchor="middle" fill="#1f2328">publisher, catalogue</text>
  <rect x="572" y="86" width="220" height="90" rx="10" fill="#ffffff" stroke="#3d4449" stroke-width="2"/>
  <text x="682" y="112" font-size="16" font-weight="700" text-anchor="middle" fill="#3d4449">3. pull request</text>
  <text x="682" y="134" font-size="13" text-anchor="middle" fill="#1f2328">l'agrégat calcule late,</text>
  <text x="682" y="153" font-size="13" text-anchor="middle" fill="#1f2328">avec ses tests</text>
  <rect x="572" y="234" width="220" height="90" rx="10" fill="#ffffff" stroke="#3d4449" stroke-width="2"/>
  <text x="682" y="260" font-size="16" font-weight="700" text-anchor="middle" fill="#3d4449">4. pull request</text>
  <text x="682" y="282" font-size="13" text-anchor="middle" fill="#1f2328">le gestionnaire lit late,</text>
  <text x="682" y="301" font-size="13" text-anchor="middle" fill="#1f2328">tolère son absence</text>
  <line x1="226" y1="176" x2="226" y2="232" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M248,279 H274 V131 H298" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="520" y1="131" x2="570" y2="131" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M410,176 V279 H570" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="32" y="362" font-size="14" fill="#1f2328">Chaque pull request est verte et déployable seule. L'étape 4 n'attend pas l'étape 3 : tant qu'appointments</text>
  <text x="32" y="384" font-size="14" fill="#1f2328">n'est pas déployé partout, des événements sans late arrivent encore, de l'outbox et des files d'attente.</text>
</svg>
