<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 630" width="960" height="630" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">How next(from, transition, context) decides</title>
  <desc id="desc">First question: does the transition leave the state from? When it does not, the machine throws the refusal its declaration builds with refused, such as APPOINTMENT_ENDED, or, without refused, TransitionError.forbidden with the code FORBIDDEN_TRANSITION. When it does, second question: does its guard answer a refusal for the context? When it does, the machine throws it, such as APPOINTMENT_NOT_STARTED. Otherwise it answers the state the transition leads to, or from for a transition without to.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="630" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">How next(from, transition, context) decides</text>
  <rect x="40" y="62" width="380" height="52" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="2"/>
  <text x="230" y="93" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">next(from, transition, context)</text>
  <rect x="40" y="152" width="380" height="84" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="2"/>
  <text x="230" y="179" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">Leaves from?</text>
  <text x="230" y="205" font-size="13" fill="#1f2328" text-anchor="middle">is from among the states</text>
  <text x="230" y="225" font-size="13" fill="#1f2328" text-anchor="middle">the transition leaves?</text>
  <line x1="230.0" y1="116" x2="230.0" y2="150" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="500" y="152" width="436" height="84" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="2"/>
  <text x="718" y="179" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">Declares refused?</text>
  <text x="718" y="205" font-size="13" fill="#1f2328" text-anchor="middle">does the declaration name</text>
  <text x="718" y="225" font-size="13" fill="#1f2328" text-anchor="middle">a factory of refusals?</text>
  <line x1="422" y1="194" x2="498" y2="194" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="460.0" y="184" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="600">no</text>
  <rect x="500" y="290" width="210" height="84" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="605" y="317" font-size="16" font-weight="700" fill="#2f6f4f" text-anchor="middle">Throws its refusal</text>
  <text x="605" y="343" font-size="13" fill="#1f2328" text-anchor="middle">built by refused(..):</text>
  <text x="605" y="363" font-size="13" fill="#1f2328" text-anchor="middle">APPOINTMENT_ENDED</text>
  <rect x="726" y="290" width="210" height="84" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="831" y="317" font-size="16" font-weight="700" fill="#2f6f4f" text-anchor="middle">Throws the default</text>
  <text x="831" y="343" font-size="13" fill="#1f2328" text-anchor="middle">TransitionError.forbidden:</text>
  <text x="831" y="363" font-size="13" fill="#1f2328" text-anchor="middle">FORBIDDEN_TRANSITION</text>
  <line x1="605.0" y1="238" x2="605.0" y2="288" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="615.0" y="268" font-size="13" fill="#1f2328" text-anchor="start" font-weight="600">yes</text>
  <line x1="831.0" y1="238" x2="831.0" y2="288" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="841.0" y="268" font-size="13" fill="#1f2328" text-anchor="start" font-weight="600">no</text>
  <rect x="40" y="412" width="380" height="84" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="2"/>
  <text x="230" y="439" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">Guard refuses?</text>
  <text x="230" y="465" font-size="13" fill="#1f2328" text-anchor="middle">does its guard answer</text>
  <text x="230" y="485" font-size="13" fill="#1f2328" text-anchor="middle">a refusal for context?</text>
  <line x1="230.0" y1="238" x2="230.0" y2="410" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="240.0" y="330" font-size="13" fill="#1f2328" text-anchor="start" font-weight="600">yes</text>
  <rect x="500" y="412" width="436" height="84" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="718" y="449" font-size="16" font-weight="700" fill="#2f6f4f" text-anchor="middle">Throws the refusal of the guard</text>
  <text x="718" y="475" font-size="13" fill="#1f2328" text-anchor="middle">for example APPOINTMENT_NOT_STARTED</text>
  <line x1="422" y1="454" x2="498" y2="454" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="460.0" y="444" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="600">yes</text>
  <rect x="40" y="546" width="380" height="64" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="230" y="573" font-size="16" font-weight="700" fill="#2f6f4f" text-anchor="middle">Answers the next state</text>
  <text x="230" y="599" font-size="13" fill="#1f2328" text-anchor="middle">to, or from for a transition without to</text>
  <line x1="230.0" y1="498" x2="230.0" y2="544" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="240.0" y="526" font-size="13" fill="#1f2328" text-anchor="start" font-weight="600">no, or no guard</text>
</svg>
