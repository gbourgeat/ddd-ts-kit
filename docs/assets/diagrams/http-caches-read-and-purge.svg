<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 884" width="960" height="884" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">A public read filed under its tags, then purged after the commit of a command</title>
  <desc id="desc">A sequence over five participants: the client, the shared cache (Varnish), the API, the database and the outbox relay. First, a public read: the client asks GET /calendars/c-1/opening-hours, the cache misses and passes it to the API, which answers 200 with the tag header xkey: calendar:c-1; the cache keeps the answer for an hour under that tag and removes the header before the client. The same read later is answered from the cache. Then a command: the client sends PUT, the cache passes it to the API, which saves the calendar and a purge request in one transaction. The relay claims the request, sends PURGE with xkey-purge: calendar:c-1 to the cache, which answers 200 and drops the answers filed under the tag, and the relay marks the request published. The next read is a miss and files the new answer again.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="884" rx="16" fill="#ffffff"/>
  <text x="24" y="36" font-size="18" font-weight="600" fill="#1f2328">A public read filed under its tags, then purged after the commit of a command</text>
  <!-- participants -->
  <rect x="24" y="56" width="120" height="56" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="84" y="90" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">client</text>
  <rect x="228" y="56" width="180" height="56" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="318" y="80" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">shared cache</text>
  <text x="318" y="100" font-size="13" fill="#1f2328" text-anchor="middle">Varnish</text>
  <rect x="468" y="56" width="160" height="56" rx="10" fill="#f6ede6" stroke="#9a5b2b" stroke-width="2"/>
  <text x="548" y="80" font-size="16" font-weight="700" fill="#9a5b2b" text-anchor="middle">API</text>
  <text x="548" y="100" font-size="13" fill="#1f2328" text-anchor="middle">route, use case</text>
  <rect x="658" y="56" width="140" height="56" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="728" y="80" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">database</text>
  <text x="728" y="100" font-size="13" fill="#1f2328" text-anchor="middle">state, outbox</text>
  <rect x="818" y="56" width="120" height="56" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="878" y="80" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">outbox relay</text>
  <text x="878" y="100" font-size="13" fill="#1f2328" text-anchor="middle">CachePurger</text>
  <!-- lifelines -->
  <g stroke="#5f6b73" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="84" y1="112" x2="84" y2="828"/>
    <line x1="318" y1="112" x2="318" y2="828"/>
    <line x1="548" y1="112" x2="548" y2="828"/>
    <line x1="728" y1="112" x2="728" y2="828"/>
    <line x1="878" y1="112" x2="878" y2="828"/>
  </g>
  <!-- 1. a public read -->
  <rect x="24" y="126" width="330" height="24" rx="6" fill="#ffffff"/>
  <text x="24" y="143" font-size="14" font-weight="700" fill="#1f2328">1. A public read, answered once by the API</text>
  <text x="201" y="168" font-size="13" fill="#1f2328" text-anchor="middle">GET /calendars/c-1/opening-hours</text>
  <line x1="86" y1="176" x2="316" y2="176" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="433" y="206" font-size="13" fill="#1f2328" text-anchor="middle">miss: passed to the API</text>
  <line x1="320" y1="214" x2="546" y2="214" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="433" y="248" font-size="13" fill="#1f2328" text-anchor="middle">200 + xkey: calendar:c-1</text>
  <line x1="546" y1="256" x2="320" y2="256" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="208" y="272" width="220" height="30" rx="6" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="318" y="292" font-size="13" fill="#1f2328" text-anchor="middle">kept 1 h, filed under calendar:c-1</text>
  <text x="201" y="326" font-size="13" fill="#1f2328" text-anchor="middle">200, xkey removed</text>
  <line x1="316" y1="334" x2="86" y2="334" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="201" y="368" font-size="13" fill="#1f2328" text-anchor="middle">the same GET, later</text>
  <line x1="86" y1="376" x2="316" y2="376" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="201" y="406" font-size="13" fill="#1f2328" text-anchor="middle">200 from the cache (HIT)</text>
  <line x1="316" y1="414" x2="86" y2="414" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- 2. a command, then the purge -->
  <line x1="24" y1="446" x2="938" y2="446" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="24" y="458" width="490" height="24" rx="6" fill="#ffffff"/>
  <text x="24" y="475" font-size="14" font-weight="700" fill="#1f2328">2. A command changes the calendar, then the relay purges</text>
  <text x="201" y="500" font-size="13" fill="#1f2328" text-anchor="middle">PUT /calendars/c-1/opening-hours</text>
  <line x1="86" y1="508" x2="316" y2="508" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="433" y="538" font-size="13" fill="#1f2328" text-anchor="middle">passed: a write is never kept</text>
  <line x1="320" y1="546" x2="546" y2="546" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="638" y="576" font-size="13" fill="#1f2328" text-anchor="middle">one transaction:</text>
  <text x="638" y="592" font-size="13" fill="#1f2328" text-anchor="middle">calendar + purge request</text>
  <line x1="550" y1="602" x2="726" y2="602" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="803" y="640" font-size="13" fill="#1f2328" text-anchor="middle">claim the request</text>
  <line x1="876" y1="648" x2="730" y2="648" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="478" y="676" width="240" height="20" rx="4" fill="#ffffff"/>
  <text x="598" y="690" font-size="13" fill="#1f2328" text-anchor="middle">PURGE, xkey-purge: calendar:c-1</text>
  <line x1="876" y1="698" x2="320" y2="698" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="548" y="720" width="100" height="20" rx="4" fill="#ffffff"/>
  <text x="598" y="734" font-size="13" fill="#1f2328" text-anchor="middle">200 Purged 1</text>
  <line x1="320" y1="742" x2="876" y2="742" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="188" y="756" width="260" height="30" rx="6" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="318" y="776" font-size="13" fill="#1f2328" text-anchor="middle">answers under calendar:c-1 dropped</text>
  <text x="803" y="802" font-size="13" fill="#1f2328" text-anchor="middle">mark it published</text>
  <line x1="876" y1="810" x2="730" y2="810" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- what follows -->
  <text x="480" y="862" font-size="14" fill="#1f2328" text-anchor="middle">The next read is a miss: the API answers the new hours, and the cache files them again under calendar:c-1.</text>
</svg>
