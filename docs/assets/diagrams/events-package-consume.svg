<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 690" width="960" height="690" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">One delivery through consume</title>
  <desc id="desc">A delivery from the provider is parsed by the declaration of the event. Another type or version is skipped, without any mark. An invalid payload throws InvalidEventPayloadError, so the provider retries the delivery or dead-letters it. A valid event enters one unit of work: the processed-event store marks the pair of the consumer name and the event id. When the pair was marked before, the handler is skipped. Otherwise the handler runs with the typed event. When it returns, the mark and the state change of the consumer commit together; when it throws, both roll back, so the redelivery is handled. When a scope is given, all of it runs inside scope.run with the execution context of the event.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="690" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">One delivery through consume</text>

  <!-- the delivery -->
  <rect x="360" y="58" width="240" height="52" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="480" y="80" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">a delivery</text>
  <text x="480" y="100" font-size="13" fill="#1f2328" text-anchor="middle">an IntegrationEvent from the provider</text>
  <line x1="480" y1="112" x2="480" y2="136" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- parse -->
  <rect x="340" y="138" width="280" height="58" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="480" y="162" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">orderPlaced.parse(event)</text>
  <text x="480" y="183" font-size="13" fill="#1f2328" text-anchor="middle">the type, the version, then the payload</text>

  <!-- branch: another type or version -->
  <path d="M338,167 H160 V222" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250" y="158" font-size="13" fill="#1f2328" text-anchor="middle">another type or version</text>
  <rect x="40" y="224" width="240" height="72" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="160" y="248" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">skipped</text>
  <text x="160" y="268" font-size="13" fill="#1f2328" text-anchor="middle">no mark: the subscription</text>
  <text x="160" y="286" font-size="13" fill="#1f2328" text-anchor="middle">of that version handles it</text>

  <!-- branch: invalid payload -->
  <path d="M622,167 H800 V222" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="710" y="158" font-size="13" fill="#1f2328" text-anchor="middle">invalid payload</text>
  <rect x="680" y="224" width="240" height="72" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="800" y="248" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">throws</text>
  <text x="800" y="268" font-size="13" fill="#1f2328" text-anchor="middle">InvalidEventPayloadError: the</text>
  <text x="800" y="286" font-size="13" fill="#1f2328" text-anchor="middle">provider retries or dead-letters</text>

  <!-- valid: into the unit of work -->
  <line x1="480" y1="198" x2="480" y2="362" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="490" y="270" font-size="13" fill="#1f2328">valid</text>

  <!-- the unit of work -->
  <rect x="150" y="318" width="660" height="352" rx="12" fill="none" stroke="#2b5d8a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="170" y="342" font-size="14" font-weight="600" fill="#2b5d8a">one unit of work</text>

  <rect x="350" y="364" width="260" height="58" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="480" y="388" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">markProcessed(consumer, id)</text>
  <text x="480" y="409" font-size="13" fill="#1f2328" text-anchor="middle">the processed-event store</text>

  <line x1="348" y1="393" x2="306" y2="393" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="164" y="358" width="140" height="70" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="234" y="380" font-size="14" font-weight="700" fill="#5f6b73" text-anchor="middle">false: seen before</text>
  <text x="234" y="400" font-size="13" fill="#1f2328" text-anchor="middle">the handler</text>
  <text x="234" y="418" font-size="13" fill="#1f2328" text-anchor="middle">is skipped</text>

  <line x1="480" y1="424" x2="480" y2="456" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="490" y="446" font-size="13" fill="#1f2328">true: first time</text>

  <rect x="340" y="458" width="280" height="58" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="480" y="482" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">handler(event)</text>
  <text x="480" y="503" font-size="13" fill="#1f2328" text-anchor="middle">typed and validated</text>

  <line x1="420" y1="518" x2="420" y2="554" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="518" x2="540" y2="554" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="170" y="556" width="300" height="76" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="320" y="580" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">returns: commit</text>
  <text x="320" y="600" font-size="13" fill="#1f2328" text-anchor="middle">the mark and the state change</text>
  <text x="320" y="618" font-size="13" fill="#1f2328" text-anchor="middle">of the consumer, together</text>

  <rect x="490" y="556" width="300" height="76" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="640" y="580" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">throws: rollback</text>
  <text x="640" y="600" font-size="13" fill="#1f2328" text-anchor="middle">the mark goes with the rest,</text>
  <text x="640" y="618" font-size="13" fill="#1f2328" text-anchor="middle">so the redelivery is handled</text>

  <text x="480" y="656" font-size="13" fill="#2b5d8a" text-anchor="middle">with a scope: inside scope.run(...), in the execution context of the event</text>
</svg>
