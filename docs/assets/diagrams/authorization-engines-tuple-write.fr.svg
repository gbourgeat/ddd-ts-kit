<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Où s'écrit le tuple d'un nouveau rendez-vous</title>
  <desc id="desc">Avec le magasin de tuples dans PostgreSQL, le gestionnaire enregistre le rendez-vous et ses gestionnaires d'événements écrivent son tuple dans la même transaction, l'unité de travail de la commande : les deux sont validés ou aucun, et une vérification voit le tuple aussitôt. Avec OpenFGA, la transaction valide le rendez-vous et une ligne d'outbox, ajoutée par le publisher d'un événement d'intégration ; après la validation, le relais livre cet événement au moins une fois, et son consommateur écrit le tuple sur le serveur OpenFGA, de façon idempotente. Un gestionnaire after-commit ne convient pas : il s'exécute au plus une fois, et un tuple perdu ne reviendrait jamais. Entre la validation et cette écriture, le rendez-vous existe sans son tuple et une vérification répond NO_RELATION.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="540" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Où s'écrit le tuple d'un nouveau rendez-vous</text>
  <!-- lane 1: PostgreSQL -->
  <text x="40" y="78" font-size="16" font-weight="700" fill="#7a4f9a">Magasin de tuples dans PostgreSQL</text>
  <rect x="40" y="110" width="180" height="70" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="130" y="136" font-size="15" font-weight="700" fill="#2b5d8a" text-anchor="middle">BookAppointment</text>
  <text x="130" y="157" font-size="13" fill="#1f2328" text-anchor="middle">gestionnaire, puis les</text>
  <text x="130" y="173" font-size="13" fill="#1f2328" text-anchor="middle">gestionnaires d'événements</text>
  <rect x="250" y="94" width="450" height="122" rx="12" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="266" y="114" font-size="13" font-weight="600" fill="#5f6b73">une transaction : l'unité de travail de la commande</text>
  <rect x="266" y="126" width="200" height="78" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="366" y="152" font-size="14" font-weight="700" fill="#7a4f9a" text-anchor="middle">appointments</text>
  <text x="366" y="176" font-size="13" fill="#1f2328" text-anchor="middle">INSERT du rendez-vous</text>
  <rect x="484" y="126" width="200" height="78" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="584" y="152" font-size="14" font-weight="700" fill="#7a4f9a" text-anchor="middle">relation_tuples</text>
  <text x="584" y="174" font-size="13" fill="#1f2328" text-anchor="middle">appointment:42#patient</text>
  <text x="584" y="193" font-size="13" fill="#1f2328" text-anchor="middle">@user:ada</text>
  <line x1="222" y1="145" x2="246" y2="145" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="702" y1="155" x2="736" y2="155" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="740" y="104" width="180" height="102" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="830" y="132" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">validation</text>
  <text x="830" y="156" font-size="13" fill="#1f2328" text-anchor="middle">les deux, ou aucun</text>
  <text x="830" y="176" font-size="13" fill="#1f2328" text-anchor="middle">une vérification</text>
  <text x="830" y="194" font-size="13" fill="#1f2328" text-anchor="middle">voit le tuple aussitôt</text>
  <line x1="24" y1="248" x2="936" y2="248" stroke="#5f6b73" stroke-opacity="0.35"/>
  <!-- lane 2: OpenFGA -->
  <text x="40" y="284" font-size="16" font-weight="700" fill="#7a4f9a">OpenFGA (@ddd-ts-kit/openfga)</text>
  <rect x="40" y="330" width="180" height="70" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="130" y="356" font-size="15" font-weight="700" fill="#2b5d8a" text-anchor="middle">BookAppointment</text>
  <text x="130" y="377" font-size="13" fill="#1f2328" text-anchor="middle">gestionnaire, puis</text>
  <text x="130" y="393" font-size="13" fill="#1f2328" text-anchor="middle">son publisher</text>
  <rect x="250" y="304" width="220" height="122" rx="12" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="266" y="324" font-size="13" font-weight="600" fill="#5f6b73">la transaction</text>
  <rect x="266" y="336" width="188" height="78" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="360" y="360" font-size="14" font-weight="700" fill="#7a4f9a" text-anchor="middle">appointments</text>
  <text x="360" y="384" font-size="13" fill="#1f2328" text-anchor="middle">INSERT du rendez-vous</text>
  <text x="360" y="402" font-size="13" fill="#1f2328" text-anchor="middle">et de sa ligne d'outbox</text>
  <line x1="222" y1="365" x2="246" y2="365" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="472" y1="365" x2="556" y2="365" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="514" y="354" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">validation</text>
  <rect x="560" y="316" width="230" height="98" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="675" y="342" font-size="14" font-weight="700" fill="#2b5d8a" text-anchor="middle">consommateur d'intégration</text>
  <text x="675" y="364" font-size="13" fill="#1f2328" text-anchor="middle">par l'outbox : au moins</text>
  <text x="675" y="384" font-size="13" fill="#1f2328" text-anchor="middle">une fois, idempotent</text>
  <text x="675" y="403" font-size="13" fill="#1f2328" text-anchor="middle">une seconde étape, jamais perdue</text>
  <line x1="792" y1="365" x2="812" y2="365" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="816" y="316" width="120" height="98" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="876" y="346" font-size="15" font-weight="700" fill="#5f6b73" text-anchor="middle">OpenFGA</text>
  <text x="876" y="370" font-size="13" fill="#1f2328" text-anchor="middle">écrit</text>
  <text x="876" y="390" font-size="13" fill="#1f2328" text-anchor="middle">le tuple</text>
  <!-- window -->
  <rect x="470" y="452" width="466" height="58" rx="8" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="470" y1="440" x2="470" y2="522" stroke="#3d4449" stroke-width="1.5"/>
  <line x1="936" y1="440" x2="936" y2="522" stroke="#3d4449" stroke-width="1.5"/>
  <text x="486" y="476" font-size="13" font-weight="600" fill="#1f2328">la fenêtre : le rendez-vous existe sans son tuple,</text>
  <text x="486" y="497" font-size="13" fill="#1f2328">une vérification répond NO_RELATION jusqu'à l'écriture</text>
  <text x="456" y="486" font-size="13" fill="#5f6b73" text-anchor="end">validation (commit)</text>
  <text x="456" y="506" font-size="13" fill="#5f6b73" text-anchor="end">du rendez-vous</text>
</svg>
