<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">One declaration of the lifecycle, and who reads it</title>
  <desc id="desc">The state machine of the appointment is declared once in the domain: its states, its initial states, its transitions named after the intention methods, its guards and its refusals. The aggregate calls it at run time (start, next, can, isFinal), and so does the spec of the machine. ddd-ts-kit docs and ddd-ts-kit describe read its source text to draw and list it. The rule lifecycle/status-through-machine, held by ddd-ts-kit check and ESLint, reads the source of the aggregate and checks every write of its status.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="560" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">One declaration of the lifecycle, and who reads it</text>
  <rect x="352" y="76" width="276" height="296" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="490" y="152" font-size="16" font-weight="700" fill="#2f6f4f" text-anchor="middle">appointment.state-machine.ts</text>
  <text x="490" y="180" font-size="13" fill="#1f2328" text-anchor="middle">defineStateMachine({</text>
  <text x="490" y="202" font-size="13" fill="#1f2328" text-anchor="middle">states: the vocabulary,</text>
  <text x="490" y="224" font-size="13" fill="#1f2328" text-anchor="middle">initial states,</text>
  <text x="490" y="246" font-size="13" fill="#1f2328" text-anchor="middle">transitions named after</text>
  <text x="490" y="268" font-size="13" fill="#1f2328" text-anchor="middle">the intention methods,</text>
  <text x="490" y="290" font-size="13" fill="#1f2328" text-anchor="middle">guards, refused</text>
  <text x="490" y="312" font-size="13" fill="#1f2328" text-anchor="middle">})</text>
  <rect x="24" y="134" width="262" height="180" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="155" y="189" font-size="16" font-weight="700" fill="#2f6f4f" text-anchor="middle">Appointment aggregate</text>
  <text x="155" y="215" font-size="13" fill="#1f2328" text-anchor="middle">start(..) when created,</text>
  <text x="155" y="235" font-size="13" fill="#1f2328" text-anchor="middle">next(..) in each</text>
  <text x="155" y="255" font-size="13" fill="#1f2328" text-anchor="middle">intention method,</text>
  <text x="155" y="275" font-size="13" fill="#1f2328" text-anchor="middle">can(..), isFinal(..)</text>
  <line x1="288" y1="224.0" x2="350" y2="224.0" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="319.0" y="214.0" font-size="13" fill="#1f2328" text-anchor="middle" font-style="italic">asks</text>
  <rect x="24" y="396" width="262" height="84" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="155" y="423" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">ddd-ts-kit check, ESLint</text>
  <text x="155" y="449" font-size="13" fill="#1f2328" text-anchor="middle">lifecycle/status-through-machine:</text>
  <text x="155" y="469" font-size="13" fill="#1f2328" text-anchor="middle">every write of the status</text>
  <line x1="155.0" y1="394" x2="155.0" y2="316" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <rect x="700" y="76" width="236" height="84" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="818" y="103" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">ddd-ts-kit docs</text>
  <text x="818" y="129" font-size="13" fill="#1f2328" text-anchor="middle">the Mermaid diagram</text>
  <text x="818" y="149" font-size="13" fill="#1f2328" text-anchor="middle">of CONTEXT.md</text>
  <rect x="700" y="182" width="236" height="84" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="818" y="209" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">ddd-ts-kit describe</text>
  <text x="818" y="235" font-size="13" fill="#1f2328" text-anchor="middle">its states and</text>
  <text x="818" y="255" font-size="13" fill="#1f2328" text-anchor="middle">its transitions</text>
  <rect x="700" y="288" width="236" height="84" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="2"/>
  <text x="818" y="315" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">Spec of the machine</text>
  <text x="818" y="341" font-size="13" fill="#1f2328" text-anchor="middle">transitions and refusals,</text>
  <text x="818" y="361" font-size="13" fill="#1f2328" text-anchor="middle">by their code</text>
  <line x1="698" y1="118.0" x2="630" y2="118.0" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <line x1="698" y1="224.0" x2="630" y2="224.0" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <line x1="698" y1="330.0" x2="630" y2="330.0" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="32" y="520" width="22" height="16" rx="4" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="64" y="533" font-size="14" fill="#1f2328" text-anchor="start">domain layer</text>
  <rect x="206" y="520" width="22" height="16" rx="4" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="238" y="533" font-size="14" fill="#1f2328" text-anchor="start">tools of the kit</text>
  <rect x="380" y="520" width="22" height="16" rx="4" fill="#ffffff" stroke="#5f6b73" stroke-width="2"/>
  <text x="412" y="533" font-size="14" fill="#1f2328" text-anchor="start">test</text>
  <line x1="482" y1="528" x2="526" y2="528" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="538" y="533" font-size="14" fill="#1f2328" text-anchor="start">calls it at run time</text>
  <line x1="722" y1="528" x2="766" y2="528" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="778" y="533" font-size="14" fill="#1f2328" text-anchor="start">reads its source text</text>
</svg>
