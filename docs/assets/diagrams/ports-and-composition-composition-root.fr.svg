<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 536" width="960" height="536" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">La racine de composition de l'application d'exemple</title>
  <desc id="desc">main.ts importe d'abord le traçage, charge la configuration et ouvre le stockage, puis appelle composeApplication de src/platform/compose-application.ts. Celle-ci donne les modules à createApplication : le module du kernel, le module de la plateforme, les modules d'autorisation et d'audit, le module des fichiers, et un module par contexte délimité, identity, scheduling, notification et analytics, chacun construit à partir des déclarations générées de son contexte. Le conteneur vérifie tout le graphe avant de construire quoi que ce soit.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="536" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">La racine de composition : un seul endroit connaît toutes les couches</text>
  <rect x="32" y="206" width="156" height="104" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="110" y="234" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">main.ts</text>
  <text x="110" y="256" font-size="13" fill="#1f2328" text-anchor="middle">le traçage d'abord,</text>
  <text x="110" y="274" font-size="13" fill="#1f2328" text-anchor="middle">la configuration,</text>
  <text x="110" y="292" font-size="13" fill="#1f2328" text-anchor="middle">le stockage</text>
  <rect x="220" y="206" width="196" height="104" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="318" y="234" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">composeApplication</text>
  <text x="318" y="256" font-size="13" fill="#1f2328" text-anchor="middle">src/platform/</text>
  <text x="318" y="274" font-size="13" fill="#1f2328" text-anchor="middle">compose-application.ts</text>
  <line x1="190" y1="258" x2="218" y2="258" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="418" y1="258" x2="446" y2="258" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="448" y="60" width="488" height="420" rx="12" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="468" y="86" font-size="14" font-weight="600" fill="#5f6b73">createApplication({ modules: [...] })</text>
  <text x="468" y="114" font-size="13" fill="#5f6b73">modules partagés</text>
  <rect x="468" y="124" width="216" height="96" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="576" y="152" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">module du kernel</text>
  <text x="576" y="174" font-size="13" fill="#1f2328" text-anchor="middle">bus, horloge, identifiants,</text>
  <text x="576" y="192" font-size="13" fill="#1f2328" text-anchor="middle">défauts en mémoire</text>
  <rect x="700" y="124" width="216" height="96" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="808" y="152" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">module plateforme</text>
  <text x="808" y="174" font-size="13" fill="#1f2328" text-anchor="middle">stockage, fournisseur</text>
  <text x="808" y="192" font-size="13" fill="#1f2328" text-anchor="middle">d'événements, politique</text>
  <text x="808" y="210" font-size="13" fill="#1f2328" text-anchor="middle">des appels sortants</text>
  <rect x="468" y="232" width="216" height="80" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="576" y="260" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">autorisation, audit</text>
  <text x="576" y="282" font-size="13" fill="#1f2328" text-anchor="middle">la garde des cas d'usage,</text>
  <text x="576" y="300" font-size="13" fill="#1f2328" text-anchor="middle">le journal d'audit</text>
  <rect x="700" y="232" width="216" height="80" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="808" y="260" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">module des fichiers</text>
  <text x="808" y="282" font-size="13" fill="#1f2328" text-anchor="middle">quand le projet</text>
  <text x="808" y="300" font-size="13" fill="#1f2328" text-anchor="middle">stocke des fichiers</text>
  <text x="468" y="350" font-size="13" fill="#5f6b73">un module par contexte : contextModule('&lt;context&gt;', declarations)</text>
  <rect x="468" y="360" width="216" height="44" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="576" y="388" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">identity</text>
  <rect x="700" y="360" width="216" height="44" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="808" y="388" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">scheduling</text>
  <rect x="468" y="416" width="216" height="44" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="576" y="444" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">notification</text>
  <rect x="700" y="416" width="216" height="44" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="808" y="444" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">analytics</text>
  <text x="32" y="508" font-size="14" fill="#1f2328">Avant de construire quoi que ce soit, le conteneur vérifie tout le graphe : liaisons en double,</text>
  <text x="32" y="528" font-size="14" fill="#1f2328">dépendances non liées et cycles arrêtent le démarrage par une WiringError qui nomme le port et le module.</text>
</svg>
