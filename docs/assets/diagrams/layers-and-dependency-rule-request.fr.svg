<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" width="960" height="590" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Une requête HTTP de réservation à travers les couches</title>
  <desc id="desc">Cinq participants de gauche à droite : la route de la présentation, le bus de commandes, le gestionnaire de l'application, l'agrégat Appointment du domaine et l'adaptateur du repository dans l'infrastructure. La route envoie BookAppointment au bus, le bus exécute ses middlewares puis le gestionnaire, le gestionnaire demande à Appointment de réserver, reçoit le rendez-vous et son événement enregistré, et l'enregistre par le port du repository, dont l'adaptateur le stocke. L'identifiant du rendez-vous revient à la route en passant par le bus.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="590" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">POST /appointments, couche par couche</text>
  <!-- participants -->
  <rect x="30" y="54" width="164" height="72" rx="10" fill="#f6ede6" stroke="#9a5b2b" stroke-width="2"/>
  <text x="112" y="86" font-size="16" font-weight="700" fill="#9a5b2b" text-anchor="middle">route</text>
  <text x="112" y="110" font-size="13" fill="#1f2328" text-anchor="middle">présentation</text>
  <rect x="214" y="54" width="164" height="72" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="296" y="86" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">CommandBus</text>
  <text x="296" y="110" font-size="13" fill="#1f2328" text-anchor="middle">port du noyau</text>
  <rect x="398" y="54" width="164" height="72" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="480" y="86" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">gestionnaire</text>
  <text x="480" y="110" font-size="13" fill="#1f2328" text-anchor="middle">application</text>
  <rect x="582" y="54" width="164" height="72" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="664" y="86" font-size="16" font-weight="700" fill="#2f6f4f" text-anchor="middle">Appointment</text>
  <text x="664" y="110" font-size="13" fill="#1f2328" text-anchor="middle">domaine</text>
  <rect x="766" y="54" width="164" height="72" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="848" y="78" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">adaptateur du</text>
  <text x="848" y="96" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">repository</text>
  <text x="848" y="116" font-size="13" fill="#1f2328" text-anchor="middle">infrastructure</text>
  <!-- lifelines -->
  <line x1="112" y1="128" x2="112" y2="470" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="296" y1="128" x2="296" y2="470" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="480" y1="128" x2="480" y2="470" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="664" y1="128" x2="664" y2="470" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="848" y1="128" x2="848" y2="470" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="4 4"/>
  <!-- messages -->
  <text x="204" y="152" font-size="13" fill="#1f2328" text-anchor="middle">execute(BookAppointment)</text>
  <line x1="114" y1="160" x2="292" y2="160" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="388" y="192" font-size="13" fill="#1f2328" text-anchor="middle">middlewares, puis</text>
  <text x="388" y="208" font-size="13" fill="#1f2328" text-anchor="middle">execute(command)</text>
  <line x1="298" y1="216" x2="476" y2="216" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="572" y="248" font-size="13" fill="#1f2328" text-anchor="middle">Appointment.book(...)</text>
  <line x1="482" y1="256" x2="660" y2="256" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="572" y="288" font-size="13" fill="#1f2328" text-anchor="middle">rendez-vous, événement</text>
  <line x1="662" y1="296" x2="484" y2="296" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="572" y="328" font-size="13" fill="#1f2328" text-anchor="middle">save(appointment)</text>
  <text x="756" y="328" font-size="13" fill="#1f2328" text-anchor="middle">par le port</text>
  <line x1="482" y1="336" x2="844" y2="336" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="756" y="368" font-size="13" fill="#1f2328" text-anchor="middle">enregistré</text>
  <line x1="846" y1="376" x2="484" y2="376" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="388" y="408" font-size="13" fill="#1f2328" text-anchor="middle">id du rendez-vous</text>
  <line x1="478" y1="416" x2="300" y2="416" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="204" y="448" font-size="13" fill="#1f2328" text-anchor="middle">id du rendez-vous</text>
  <line x1="294" y1="456" x2="116" y2="456" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <!-- note -->
  <rect x="398" y="482" width="532" height="50" rx="8" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="414" y="503" font-size="13" fill="#1f2328">Le gestionnaire nomme le port AppointmentRepository, jamais</text>
  <text x="414" y="522" font-size="13" fill="#1f2328">l'adaptateur : la plateforme lie l'adaptateur au démarrage.</text>
  <!-- legend -->
  <line x1="40" y1="500" x2="84" y2="500" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="96" y="505" font-size="14" fill="#1f2328">appel</text>
  <line x1="40" y1="526" x2="84" y2="526" stroke="#3d4449" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="96" y="531" font-size="14" fill="#1f2328">réponse</text>
  <text x="32" y="566" font-size="13" fill="#5f6b73">L'unité de travail diffuse l'événement enregistré une fois que le gestionnaire a rendu la main, avant la validation.</text>
</svg>
