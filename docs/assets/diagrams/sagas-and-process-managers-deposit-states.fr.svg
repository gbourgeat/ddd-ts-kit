<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Le processus d'acompte : un état entre des transactions locales</title>
  <desc id="desc">BookAppointment laisse le rendez-vous en attente de son acompte, le créneau retenu. L'acompte payé le confirme ; l'acompte refusé, ou quinze minutes écoulées, l'annule et libère le créneau. Chaque flèche est une transaction locale dans un seul contexte, et l'état d'attente est visible entre les deux.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="420" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Le processus d'acompte : un état entre des transactions locales</text>
  <circle cx="48" cy="210" r="9" fill="#3d4449"/>
  <line x1="60" y1="210" x2="216" y2="210" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="136" y="198" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">BookAppointment</text>
  <rect x="220" y="170" width="190" height="86" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="315.0" y="196" font-size="16" font-weight="700" fill="#2f6f4f" text-anchor="middle">attente d'acompte</text>
  <line x1="234" y1="206" x2="396" y2="206" stroke="#2f6f4f" stroke-opacity="0.35"/>
  <text x="315.0" y="226" font-size="13" fill="#1f2328" text-anchor="middle">le créneau est retenu,</text>
  <text x="315.0" y="246" font-size="13" fill="#1f2328" text-anchor="middle">visible de tous</text>
  <rect x="700" y="68" width="180" height="64" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="790.0" y="94" font-size="16" font-weight="700" fill="#2f6f4f" text-anchor="middle">confirmé</text>
  <text x="790.0" y="114" font-size="13" fill="#1f2328" text-anchor="middle">l'acompte est payé</text>
  <rect x="700" y="290" width="180" height="66" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="790.0" y="316" font-size="16" font-weight="700" fill="#2f6f4f" text-anchor="middle">annulé</text>
  <text x="790.0" y="336" font-size="13" fill="#1f2328" text-anchor="middle">le créneau est libéré</text>
  <!-- transitions: each one a local transaction in one context -->
  <path d="M412,190 H500 V100 H696" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="508" y="92" font-size="13" font-weight="600" fill="#1f2328">acompte payé</text>
  <path d="M412,222 H540 V310 H696" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="548" y="302" font-size="13" font-weight="600" fill="#1f2328">acompte refusé</text>
  <path d="M412,242 H500 V336 H696" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="508" y="356" font-size="13" font-weight="600" fill="#1f2328">quinze minutes écoulées</text>
  <line x1="882" y1="100" x2="920" y2="100" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="932" cy="100" r="10" fill="none" stroke="#3d4449" stroke-width="2"/>
  <circle cx="932" cy="100" r="5" fill="#3d4449"/>
  <line x1="882" y1="323" x2="920" y2="323" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="932" cy="323" r="10" fill="none" stroke="#3d4449" stroke-width="2"/>
  <circle cx="932" cy="323" r="5" fill="#3d4449"/>
  <text x="480" y="398" font-size="14" font-style="italic" fill="#1f2328" text-anchor="middle">Chaque flèche est une transaction locale dans un seul contexte : aucune transaction ne couvre le processus.</text>
</svg>
