<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Entities and value objects inside an aggregate</title>
  <desc id="desc">The Calendar aggregate. Its root, the entity Calendar, holds WorkingHours, a value object, and two inner TimeOff entities, each with a Period value object. A handler of the application changes a time off by calling a method of the root; reaching an inner entity directly never happens. The CalendarRepository port loads and saves the whole aggregate, in one transaction.</desc>
  <defs>
    <marker id="arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
    <marker id="arrow-refused" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b42318"/>
    </marker>
  </defs>
  <rect width="960" height="540" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Entities and value objects inside an aggregate</text>
  <g transform="translate(0,40)">
  <rect x="32" y="120" width="220" height="90" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="142" y="148" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">handler</text>
  <line x1="46" y1="160" x2="238" y2="160" stroke="#2b5d8a" stroke-opacity="0.35"/>
  <text x="142" y="184" font-size="13" fill="#1f2328" text-anchor="middle">loads the calendar, then</text>
  <text x="142" y="204" font-size="13" fill="#1f2328" text-anchor="middle">calendar.shortenTimeOff(...)</text>
  <rect x="32" y="262" width="220" height="90" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="142" y="290" font-size="15" font-weight="700" fill="#2f6f4f" text-anchor="middle">CalendarRepository</text>
  <line x1="46" y1="302" x2="238" y2="302" stroke="#2f6f4f" stroke-opacity="0.35"/>
  <text x="142" y="326" font-size="13" fill="#1f2328" text-anchor="middle">loads and saves</text>
  <text x="142" y="346" font-size="13" fill="#1f2328" text-anchor="middle">the whole aggregate</text>
  <rect x="300" y="64" width="628" height="330" rx="14" fill="#ffffff" stroke="#2f6f4f" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="320" y="378" font-size="14" font-weight="600" fill="#2f6f4f">aggregate Calendar: one transaction, one repository</text>
  <rect x="324" y="120" width="260" height="170" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="3"/>
  <text x="454" y="148" font-size="16" font-weight="700" fill="#2f6f4f" text-anchor="middle">Calendar</text>
  <line x1="338" y1="160" x2="570" y2="160" stroke="#2f6f4f" stroke-opacity="0.35"/>
  <text x="340" y="184" font-size="13" fill="#1f2328">root entity, id: calendarId</text>
  <text x="340" y="208" font-size="13" fill="#1f2328">workingHours: WorkingHours</text>
  <text x="340" y="232" font-size="13" fill="#1f2328">addTimeOff(id, period)</text>
  <text x="340" y="256" font-size="13" fill="#1f2328">shortenTimeOff(id, period)</text>
  <rect x="660" y="96" width="240" height="112" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="780" y="122" font-size="16" font-weight="700" fill="#2f6f4f" text-anchor="middle">TimeOff #1</text>
  <line x1="674" y1="134" x2="886" y2="134" stroke="#2f6f4f" stroke-opacity="0.35"/>
  <text x="676" y="156" font-size="13" fill="#1f2328">inner entity, id unique</text>
  <text x="676" y="176" font-size="13" fill="#1f2328">within the calendar</text>
  <text x="676" y="196" font-size="13" fill="#1f2328">period: Period</text>
  <rect x="660" y="232" width="240" height="112" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="780" y="258" font-size="16" font-weight="700" fill="#2f6f4f" text-anchor="middle">TimeOff #2</text>
  <line x1="674" y1="270" x2="886" y2="270" stroke="#2f6f4f" stroke-opacity="0.35"/>
  <text x="676" y="292" font-size="13" fill="#1f2328">inner entity, id unique</text>
  <text x="676" y="312" font-size="13" fill="#1f2328">within the calendar</text>
  <text x="676" y="332" font-size="13" fill="#1f2328">period: Period</text>
  <line x1="586" y1="170" x2="656" y2="150" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow-neutral)"/>
  <line x1="586" y1="250" x2="656" y2="288" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow-neutral)"/>
  <text x="612" y="214" font-size="13" fill="#1f2328" text-anchor="middle">holds</text>
  <line x1="254" y1="165" x2="320" y2="165" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow-neutral)"/>
  <line x1="254" y1="307" x2="297" y2="307" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow-neutral)"/>
  <path d="M142,118 V40 H780 V92" fill="none" stroke="#b42318" stroke-width="2" marker-end="url(#arrow-refused)"/>
  <path d="M212,32 L228,48 M228,32 L212,48" fill="none" stroke="#b42318" stroke-width="3" stroke-linecap="round"/>
  <text x="470" y="32" font-size="13" fill="#b42318" text-anchor="middle">never: an inner entity is changed only through its root</text>
  <rect x="32" y="420" width="44" height="20" rx="4" fill="#ffffff" stroke="#2f6f4f" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="88" y="435" font-size="14" fill="#1f2328">the boundary of the aggregate: what one transaction changes, as a whole</text>
  <line x1="32" y1="462" x2="76" y2="462" stroke="#b42318" stroke-width="2" marker-end="url(#arrow-refused)"/>
  <path d="M40,456 L52,468 M52,456 L40,468" fill="none" stroke="#b42318" stroke-width="3" stroke-linecap="round"/>
  <text x="88" y="467" font-size="14" fill="#1f2328">refused: a handler reaching an inner entity directly</text>
  </g>
</svg>
