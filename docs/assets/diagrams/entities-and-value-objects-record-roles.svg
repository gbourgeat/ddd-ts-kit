<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 684" width="960" height="684" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">How domain/value-object-class reads an answered object</title>
  <desc id="desc">Five functions and the object each answers, read entry by entry. A literal, a parameter or a call of the language is data; a call of the model such as Money.of is built by the model; a function is behaviour; a spread is derived. money and decide answer data alone and are reported; split holds a value object it builds, evolve spreads a state, and dueBefore answers a function only: none of them is reported.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="684" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">How an answered object is read, entry by entry</text>
  <rect x="24" y="56" width="216" height="66" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="38" y="78" font-size="14" font-weight="700" fill="#2b5d8a">data</text>
  <text x="38" y="98" font-size="13" fill="#1f2328">a literal, a parameter,</text>
  <text x="38" y="114" font-size="13" fill="#1f2328">Math.round(..)</text>
  <rect x="256" y="56" width="216" height="66" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="270" y="78" font-size="14" font-weight="700" fill="#2f6f4f">built by the model</text>
  <text x="270" y="98" font-size="13" fill="#1f2328">Money.of(..), total.add(..),</text>
  <text x="270" y="114" font-size="13" fill="#1f2328">new Slot(..)</text>
  <rect x="488" y="56" width="216" height="66" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="502" y="78" font-size="14" font-weight="700" fill="#7a4f9a">behaviour</text>
  <text x="502" y="98" font-size="13" fill="#1f2328">a function, a method,</text>
  <text x="502" y="114" font-size="13" fill="#1f2328">a local closure</text>
  <rect x="720" y="56" width="216" height="66" rx="10" fill="#f6ede6" stroke="#9a5b2b" stroke-width="2"/>
  <text x="734" y="78" font-size="14" font-weight="700" fill="#9a5b2b">derived</text>
  <text x="734" y="98" font-size="13" fill="#1f2328">a spread,</text>
  <text x="734" y="114" font-size="13" fill="#1f2328">...state</text>
  <text x="24" y="148" font-size="14" font-weight="600" fill="#1f2328">Reported when the object holds data, nothing built by the model and no spread.</text>
  <rect x="24" y="164" width="912" height="82" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="40" y="188" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" fill="#1f2328">export const money = (amount: number, currency: string) =&gt;</text>
  <text x="40" y="206" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" fill="#1f2328">  ({ <tspan fill="#2b5d8a" font-weight="700">amount</tspan>, <tspan fill="#2b5d8a" font-weight="700">currency</tspan> });</text>
  <text x="40" y="232" font-size="13" fill="#1f2328"><tspan fill="#2b5d8a" font-weight="700">amount</tspan>: data · <tspan fill="#2b5d8a" font-weight="700">currency</tspan>: data</text>
  <rect x="672" y="175" width="252" height="60" rx="8" fill="#fbeae8" stroke="#b42318" stroke-width="2"/>
  <text x="686" y="195" font-size="14" font-weight="700" fill="#b42318">reported</text>
  <text x="686" y="213" font-size="13" fill="#1f2328">data alone: a value of the</text>
  <text x="686" y="229" font-size="13" fill="#1f2328">model written as a function</text>
  <rect x="24" y="258" width="912" height="82" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="40" y="282" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" fill="#1f2328">export const split = (total: Money) =&gt;</text>
  <text x="40" y="300" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" fill="#1f2328">  ({ first: <tspan fill="#2f6f4f" font-weight="700">Money.of(1)</tspan>, rest: <tspan fill="#2b5d8a" font-weight="700">total</tspan> });</text>
  <text x="40" y="326" font-size="13" fill="#1f2328"><tspan fill="#2f6f4f" font-weight="700">first</tspan>: built by the model · <tspan fill="#2b5d8a" font-weight="700">rest</tspan>: data</text>
  <rect x="672" y="269" width="252" height="60" rx="8" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="686" y="289" font-size="14" font-weight="700" fill="#5f6b73">not reported</text>
  <text x="686" y="307" font-size="13" fill="#1f2328">a value object it builds:</text>
  <text x="686" y="323" font-size="13" fill="#1f2328">an operation of the model</text>
  <rect x="24" y="352" width="912" height="82" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="40" y="376" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" fill="#1f2328">export const evolve = (state: State, status: string) =&gt;</text>
  <text x="40" y="394" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" fill="#1f2328">  ({ <tspan fill="#9a5b2b" font-weight="700">...state</tspan>, <tspan fill="#2b5d8a" font-weight="700">status</tspan> });</text>
  <text x="40" y="420" font-size="13" fill="#1f2328"><tspan fill="#9a5b2b" font-weight="700">...state</tspan>: derived · <tspan fill="#2b5d8a" font-weight="700">status</tspan>: data</text>
  <rect x="672" y="363" width="252" height="60" rx="8" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="686" y="383" font-size="14" font-weight="700" fill="#5f6b73">not reported</text>
  <text x="686" y="401" font-size="13" fill="#1f2328">a spread: derived from a</text>
  <text x="686" y="417" font-size="13" fill="#1f2328">record that exists (a reducer)</text>
  <rect x="24" y="446" width="912" height="118" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="40" y="470" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" fill="#1f2328">export const dueBefore = (day: Date) =&gt; {</text>
  <text x="40" y="488" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" fill="#1f2328">  const <tspan fill="#7a4f9a" font-weight="700">isSatisfiedBy</tspan> = (invoice: Invoice): boolean =&gt; invoice.dueAt &lt; day;</text>
  <text x="40" y="506" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" fill="#1f2328">  return { <tspan fill="#7a4f9a" font-weight="700">isSatisfiedBy</tspan> };</text>
  <text x="40" y="524" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" fill="#1f2328">};</text>
  <text x="40" y="550" font-size="13" fill="#1f2328"><tspan fill="#7a4f9a" font-weight="700">isSatisfiedBy</tspan>: behaviour</text>
  <rect x="672" y="475" width="252" height="60" rx="8" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="686" y="495" font-size="14" font-weight="700" fill="#5f6b73">not reported</text>
  <text x="686" y="513" font-size="13" fill="#1f2328">functions only:</text>
  <text x="686" y="529" font-size="13" fill="#1f2328">a specification</text>
  <rect x="24" y="576" width="912" height="82" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="40" y="600" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" fill="#1f2328">export const decide = (reason: string) =&gt;</text>
  <text x="40" y="618" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" fill="#1f2328">  ({ kind: <tspan fill="#2b5d8a" font-weight="700">&#x27;refused&#x27; as const</tspan>, <tspan fill="#2b5d8a" font-weight="700">reason</tspan> });</text>
  <text x="40" y="644" font-size="13" fill="#1f2328"><tspan fill="#2b5d8a" font-weight="700">kind</tspan>: data · <tspan fill="#2b5d8a" font-weight="700">reason</tspan>: data</text>
  <rect x="672" y="587" width="252" height="60" rx="8" fill="#fbeae8" stroke="#b42318" stroke-width="2"/>
  <text x="686" y="607" font-size="14" font-weight="700" fill="#b42318">reported</text>
  <text x="686" y="625" font-size="13" fill="#1f2328">data alone: throw the refusal</text>
  <text x="686" y="641" font-size="13" fill="#1f2328">from a factory, or a value object</text>
</svg>
