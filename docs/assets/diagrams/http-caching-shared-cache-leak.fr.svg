<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 542" width="960" height="542" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">La réponse publique d'une route authentifiée fuit</title>
  <desc id="desc">En haut, une route authentifiée répond public sans Vary : Ada demande son agenda, le cache partagé ne l'a pas, l'application décide pour Ada et répond, et le cache garde la réponse sous l'URL. Bob demande ensuite la même URL avec son propre jeton : le cache répond l'agenda d'Ada sans interroger l'application. En bas, la même route répond private : le cache partagé ne garde rien et transmet chaque requête HTTP, l'application décide donc pour chaque appelant, et chaque navigateur garde sa propre copie.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="542" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">La réponse publique d'une route authentifiée fuit</text>
  <!-- instead of -->
  <rect x="24" y="56" width="912" height="230" rx="14" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="44" y="82" font-size="14" font-weight="600" fill="#5f6b73">au lieu de : guards [Authenticated], cache { scope: public }, sans vary</text>
  <rect x="36" y="100" width="150" height="48" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="111" y="129" font-size="14" font-weight="700" fill="#5f6b73" text-anchor="middle">navigateur d'Ada</text>
  <rect x="36" y="196" width="150" height="48" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="111" y="225" font-size="14" font-weight="700" fill="#5f6b73" text-anchor="middle">navigateur de Bob</text>
  <rect x="380" y="100" width="180" height="144" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="470" y="160" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">cache partagé</text>
  <text x="470" y="182" font-size="13" fill="#1f2328" text-anchor="middle">garde sous /agenda :</text>
  <text x="470" y="200" font-size="13" fill="#1f2328" text-anchor="middle">l'agenda d'Ada</text>
  <rect x="760" y="100" width="156" height="144" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="838" y="160" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">application</text>
  <text x="838" y="182" font-size="13" fill="#1f2328" text-anchor="middle">décide pour Ada ;</text>
  <text x="838" y="200" font-size="13" fill="#1f2328" text-anchor="middle">n'entend jamais Bob</text>
  <line x1="188" y1="116" x2="378" y2="116" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="283" y="108" font-size="13" fill="#1f2328" text-anchor="middle">GET /agenda, jeton d'Ada</text>
  <line x1="378" y1="136" x2="188" y2="136" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="283" y="154" font-size="13" fill="#1f2328" text-anchor="middle">l'agenda d'Ada</text>
  <line x1="562" y1="116" x2="758" y2="116" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="660" y="108" font-size="13" fill="#1f2328" text-anchor="middle">absente du cache : transmise</text>
  <line x1="758" y1="136" x2="562" y2="136" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="660" y="154" font-size="13" fill="#1f2328" text-anchor="middle">l'agenda d'Ada, public</text>
  <line x1="188" y1="212" x2="378" y2="212" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="283" y="204" font-size="13" fill="#1f2328" text-anchor="middle">GET /agenda, jeton de Bob</text>
  <line x1="378" y1="232" x2="188" y2="232" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="283" y="264" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">trouvée en cache : l'agenda d'Ada, servi à Bob</text>
  <!-- write -->
  <rect x="24" y="302" width="912" height="216" rx="14" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="44" y="328" font-size="14" font-weight="600" fill="#5f6b73">écrivez : cache { scope: private, maxAge: '0s', mustRevalidate: true, etag }</text>
  <rect x="36" y="346" width="150" height="48" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="111" y="375" font-size="14" font-weight="700" fill="#5f6b73" text-anchor="middle">navigateur d'Ada</text>
  <rect x="36" y="442" width="150" height="48" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="111" y="471" font-size="14" font-weight="700" fill="#5f6b73" text-anchor="middle">navigateur de Bob</text>
  <rect x="380" y="346" width="180" height="144" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="470" y="406" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">cache partagé</text>
  <text x="470" y="428" font-size="13" fill="#1f2328" text-anchor="middle">ne garde rien :</text>
  <text x="470" y="446" font-size="13" fill="#1f2328" text-anchor="middle">la réponse est privée</text>
  <rect x="760" y="346" width="156" height="144" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="838" y="406" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">application</text>
  <text x="838" y="428" font-size="13" fill="#1f2328" text-anchor="middle">décide pour</text>
  <text x="838" y="446" font-size="13" fill="#1f2328" text-anchor="middle">chaque appelant</text>
  <line x1="188" y1="362" x2="378" y2="362" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="283" y="354" font-size="13" fill="#1f2328" text-anchor="middle">GET /agenda, jeton d'Ada</text>
  <line x1="378" y1="382" x2="188" y2="382" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="283" y="400" font-size="13" fill="#1f2328" text-anchor="middle">l'agenda d'Ada, gardé par Ada</text>
  <line x1="562" y1="362" x2="758" y2="362" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="660" y="354" font-size="13" fill="#1f2328" text-anchor="middle">transmise</text>
  <line x1="758" y1="382" x2="562" y2="382" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="660" y="400" font-size="13" fill="#1f2328" text-anchor="middle">l'agenda d'Ada, privé</text>
  <line x1="188" y1="458" x2="378" y2="458" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="283" y="450" font-size="13" fill="#1f2328" text-anchor="middle">GET /agenda, jeton de Bob</text>
  <line x1="378" y1="478" x2="188" y2="478" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="283" y="496" font-size="13" fill="#1f2328" text-anchor="middle">l'agenda de Bob, gardé par Bob</text>
  <line x1="562" y1="458" x2="758" y2="458" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="660" y="450" font-size="13" fill="#1f2328" text-anchor="middle">transmise</text>
  <line x1="758" y1="478" x2="562" y2="478" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="660" y="496" font-size="13" fill="#1f2328" text-anchor="middle">l'agenda de Bob, privé</text>
</svg>
