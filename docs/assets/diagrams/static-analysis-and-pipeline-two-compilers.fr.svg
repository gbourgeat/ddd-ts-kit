<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Deux compilateurs TypeScript côte à côte dans un projet généré</title>
  <desc id="desc">typescript 6 est chargé comme bibliothèque par les outils qui lisent les sources par l'API du compilateur : ESLint avec les types, par typescript-eslint, et dependency-cruiser. @typescript/native, un alias npm de typescript 7, le compilateur natif sans API JavaScript, fait la vérification des types et le build, clients compris. Les deux packages déclarent un binaire tsc : les scripts appellent le natif par son chemin.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="420" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Deux compilateurs TypeScript côte à côte dans un projet généré</text>
  <!-- typescript 6 -->
  <rect x="40" y="64" width="400" height="112" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="240" y="94" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">typescript ~6.0.3</text>
  <line x1="56" y1="106" x2="424" y2="106" stroke="#5f6b73" stroke-opacity="0.35"/>
  <text x="240" y="130" font-size="13" fill="#1f2328" text-anchor="middle">l'API du compilateur, chargée comme bibliothèque</text>
  <text x="240" y="152" font-size="13" fill="#1f2328" text-anchor="middle">par les outils qui lisent les sources avec elle</text>
  <!-- typescript 7 -->
  <rect x="520" y="64" width="400" height="112" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="720" y="94" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">@typescript/native</text>
  <line x1="536" y1="106" x2="904" y2="106" stroke="#5f6b73" stroke-opacity="0.35"/>
  <text x="720" y="130" font-size="13" fill="#1f2328" text-anchor="middle">npm:typescript@~7.0.2, le compilateur natif</text>
  <text x="720" y="152" font-size="13" fill="#1f2328" text-anchor="middle">bien plus rapide, pas encore d'API JavaScript</text>
  <!-- tools on 6 -->
  <rect x="40" y="244" width="190" height="70" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="135" y="270" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">ESLint avec les types</text>
  <text x="135" y="292" font-size="13" fill="#1f2328" text-anchor="middle">typescript-eslint 8.71:</text>
  <text x="135" y="308" font-size="13" fill="#1f2328" text-anchor="middle">peer &lt;6.1.0</text>
  <rect x="250" y="244" width="190" height="70" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="345" y="270" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">dependency-cruiser</text>
  <text x="345" y="292" font-size="13" fill="#1f2328" text-anchor="middle">résout les imports</text>
  <text x="345" y="308" font-size="13" fill="#1f2328" text-anchor="middle">des sources TypeScript</text>
  <line x1="135" y1="242" x2="135" y2="180" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="345" y1="242" x2="345" y2="180" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="148" y="216" font-size="13" fill="#3d4449">charge</text>
  <text x="358" y="216" font-size="13" fill="#3d4449">charge</text>
  <!-- tools on 7 -->
  <rect x="520" y="244" width="190" height="70" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="615" y="270" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">npm run typecheck</text>
  <text x="615" y="292" font-size="13" fill="#1f2328" text-anchor="middle">pre-push et</text>
  <text x="615" y="308" font-size="13" fill="#1f2328" text-anchor="middle">ci:typecheck</text>
  <rect x="730" y="244" width="190" height="70" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="825" y="270" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">npm run build</text>
  <text x="825" y="292" font-size="13" fill="#1f2328" text-anchor="middle">et sdk:build</text>
  <text x="825" y="308" font-size="13" fill="#1f2328" text-anchor="middle">pour les clients</text>
  <line x1="615" y1="242" x2="615" y2="180" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="825" y1="242" x2="825" y2="180" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="628" y="216" font-size="13" fill="#3d4449">lance</text>
  <text x="838" y="216" font-size="13" fill="#3d4449">lance</text>
  <!-- note -->
  <text x="40" y="356" font-size="14" fill="#1f2328">Les deux packages déclarent un binaire tsc : les scripts appellent node node_modules/@typescript/native/bin/tsc,</text>
  <text x="40" y="378" font-size="14" fill="#1f2328">jamais npx tsc. Refusez de monter typescript en 7 tant que les outils de lint ne l'acceptent pas.</text>
</svg>
