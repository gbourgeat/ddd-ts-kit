<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">La carte des contextes décide des imports que le checker accepte</title>
  <desc id="desc">La configuration déclare qu'analytics nomme appointments comme amont, en conformiste. Le code d'analytics peut importer le langage publié d'appointments. Un import du domaine d'appointments est refusé par context/published-language-only. Un import du langage publié de notifications est refusé par context/declared-relationship, car analytics ne nomme pas notifications comme amont. Un cycle de relations déclarées est refusé par context/no-cycle.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="500" rx="16" fill="#ffffff"/>
  <text x="32" y="34" font-size="18" font-weight="600" fill="#1f2328">La carte des contextes décide des imports que le checker accepte</text>
  <rect x="40" y="52" width="880" height="44" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="480" y="79" font-size="14" text-anchor="middle" fill="#1f2328">ddd-ts-kit.config.json : « analytics » compte « appointments » parmi ses amonts, en conformiste</text>
  <rect x="40" y="124" width="260" height="316" rx="12" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="56" y="148" font-size="14" font-weight="600" fill="#5f6b73">analytics</text>
  <rect x="60" y="162" width="220" height="260" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="170" y="280" font-size="16" font-weight="700" text-anchor="middle" fill="#2b5d8a">code d'analytics</text>
  <text x="170" y="302" font-size="13" text-anchor="middle" fill="#1f2328">gestionnaires, projections,</text>
  <text x="170" y="323" font-size="13" text-anchor="middle" fill="#1f2328">requêtes</text>
  <rect x="620" y="124" width="300" height="180" rx="12" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="636" y="148" font-size="14" font-weight="600" fill="#5f6b73">appointments</text>
  <rect x="640" y="162" width="260" height="52" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="770" y="194" font-size="16" font-weight="700" text-anchor="middle" fill="#5f6b73">published-language/</text>
  <rect x="640" y="232" width="260" height="52" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="770" y="264" font-size="16" font-weight="700" text-anchor="middle" fill="#2f6f4f">domain/</text>
  <rect x="620" y="330" width="300" height="110" rx="12" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="636" y="354" font-size="14" font-weight="600" fill="#5f6b73">notifications</text>
  <rect x="640" y="370" width="260" height="52" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="770" y="402" font-size="16" font-weight="700" text-anchor="middle" fill="#5f6b73">published-language/</text>
  <line x1="280" y1="188" x2="638" y2="188" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="460" y="178" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">accepté : relation déclarée</text>
  <line x1="280" y1="258" x2="638" y2="258" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="460" cy="258" r="10" fill="#ffffff" stroke="#3d4449" stroke-width="2"/>
  <path d="M455,253 L465,263 M465,253 L455,263" stroke="#3d4449" stroke-width="2"/>
  <text x="460" y="240" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">refusé : context/published-language-only</text>
  <line x1="280" y1="396" x2="638" y2="396" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="460" cy="396" r="10" fill="#ffffff" stroke="#3d4449" stroke-width="2"/>
  <path d="M455,391 L465,401 M465,391 L455,401" stroke="#3d4449" stroke-width="2"/>
  <text x="460" y="378" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">refusé : context/declared-relationship</text>
  <text x="40" y="476" font-size="14" fill="#1f2328">Un cycle de relations déclarées est refusé aussi : context/no-cycle.</text>
</svg>
