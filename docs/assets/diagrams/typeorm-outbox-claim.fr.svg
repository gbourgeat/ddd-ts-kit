<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 562" width="960" height="562" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Comment deux relais se partagent l'outbox : skip-locked et compare-and-set</title>
  <desc id="desc">À gauche, skip-locked : chaque relais sélectionne les lignes dues FOR UPDATE SKIP LOCKED dans une courte transaction, si bien que le relais A prend les lignes 1 à 3 et que le relais B les saute et prend les lignes 4 à 6, puis chacun repousse next_attempt_at de la durée du bail et valide. À droite, compare-and-set : les deux relais lisent la ligne 7 avec attempts 0, tous deux tentent une mise à jour gardée par attempts = 0 ; le premier écrit une ligne et la prend, le second n'en écrit aucune et relit. Dans les deux cas, une ligne prise reste cachée jusqu'à la fin de son bail, si bien que les lignes d'un relais mort reviennent.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="562" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Comment deux relais se partagent l'outbox : les deux stratégies de prise</text>
  <!-- left panel: skip-locked -->
  <rect x="24" y="58" width="444" height="380" rx="12" fill="#ffffff" stroke="#7a4f9a" stroke-width="1.5"/>
  <text x="44" y="86" font-size="16" font-weight="700" fill="#7a4f9a">skip-locked</text>
  <text x="44" y="106" font-size="13" fill="#1f2328">par défaut avec postgres, mysql, cockroachdb (et aurora)</text>
  <rect x="40" y="150" width="112" height="56" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="96" y="183" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">relais A</text>
  <rect x="340" y="214" width="112" height="56" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="396" y="247" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">relais B</text>
  <text x="246" y="132" font-size="13" font-weight="600" fill="#7a4f9a" text-anchor="middle">outbox, lignes dues</text>
  <rect x="190" y="140" width="112" height="28" fill="#f1ebf5" stroke="#7a4f9a"/>
  <text x="246" y="159" font-size="13" fill="#1f2328" text-anchor="middle">1 : prise par A</text>
  <rect x="190" y="168" width="112" height="28" fill="#f1ebf5" stroke="#7a4f9a"/>
  <text x="246" y="187" font-size="13" fill="#1f2328" text-anchor="middle">2 : prise par A</text>
  <rect x="190" y="196" width="112" height="28" fill="#f1ebf5" stroke="#7a4f9a"/>
  <text x="246" y="215" font-size="13" fill="#1f2328" text-anchor="middle">3 : prise par A</text>
  <rect x="190" y="224" width="112" height="28" fill="#ffffff" stroke="#7a4f9a"/>
  <text x="246" y="243" font-size="13" fill="#1f2328" text-anchor="middle">4 : prise par B</text>
  <rect x="190" y="252" width="112" height="28" fill="#ffffff" stroke="#7a4f9a"/>
  <text x="246" y="271" font-size="13" fill="#1f2328" text-anchor="middle">5 : prise par B</text>
  <rect x="190" y="280" width="112" height="28" fill="#ffffff" stroke="#7a4f9a"/>
  <text x="246" y="299" font-size="13" fill="#1f2328" text-anchor="middle">6 : prise par B</text>
  <line x1="154" y1="178" x2="186" y2="178" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="338" y1="262" x2="306" y2="262" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="396" y="290" font-size="13" fill="#1f2328" text-anchor="middle">saute les lignes</text>
  <text x="396" y="308" font-size="13" fill="#1f2328" text-anchor="middle">que A a verrouillées</text>
  <text x="44" y="344" font-size="13" font-weight="600" fill="#1f2328">Une courte transaction par relais :</text>
  <text x="44" y="366" font-size="13" fill="#1f2328">1. SELECT des lignes dues FOR UPDATE SKIP LOCKED</text>
  <text x="44" y="386" font-size="13" fill="#1f2328">2. UPDATE attempts + 1, next_attempt_at = now + leaseMs</text>
  <text x="44" y="406" font-size="13" fill="#1f2328">3. COMMIT : les verrous partent, le bail reste</text>
  <text x="44" y="426" font-size="13" fill="#1f2328">Deux instructions, quelle que soit la taille du lot.</text>
  <!-- right panel: compare-and-set -->
  <rect x="492" y="58" width="444" height="380" rx="12" fill="#ffffff" stroke="#7a4f9a" stroke-width="1.5"/>
  <text x="512" y="86" font-size="16" font-weight="700" fill="#7a4f9a">compare-and-set</text>
  <text x="512" y="106" font-size="13" fill="#1f2328">par défaut ailleurs (SQLite...), ou claim : 'compare-and-set'</text>
  <rect x="508" y="150" width="112" height="56" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="564" y="183" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">relais A</text>
  <rect x="508" y="236" width="112" height="56" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="564" y="269" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">relais B</text>
  <rect x="808" y="192" width="112" height="56" fill="#f1ebf5" stroke="#7a4f9a"/>
  <text x="864" y="215" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">ligne 7</text>
  <text x="864" y="235" font-size="13" fill="#1f2328" text-anchor="middle">attempts 0 → 1</text>
  <line x1="622" y1="178" x2="804" y2="204" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="712" y="164" font-size="13" fill="#1f2328" text-anchor="middle">WHERE attempts = 0 :</text>
  <text x="712" y="182" font-size="13" fill="#1f2328" text-anchor="middle">1 ligne, prise</text>
  <line x1="622" y1="264" x2="804" y2="238" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="712" y="280" font-size="13" fill="#1f2328" text-anchor="middle">même UPDATE, plus tard :</text>
  <text x="712" y="298" font-size="13" fill="#1f2328" text-anchor="middle">0 ligne, B relit les lignes dues</text>
  <text x="512" y="344" font-size="13" font-weight="600" fill="#1f2328">Aucune clause de verrou, donc toute base convient :</text>
  <text x="512" y="366" font-size="13" fill="#1f2328">1. SELECT des lignes dues, telles quelles</text>
  <text x="512" y="386" font-size="13" fill="#1f2328">2. par ligne, UPDATE attempts + 1 et le bail</text>
  <text x="530" y="406" font-size="13" fill="#1f2328">WHERE id, pending, attempts = le compte lu</text>
  <text x="512" y="426" font-size="13" fill="#1f2328">Une instruction par enregistrement.</text>
  <!-- both -->
  <rect x="24" y="456" width="912" height="86" rx="12" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="44" y="482" font-size="14" fill="#1f2328">Dans les deux cas : une ligne prise reste cachée jusqu'à la fin de son bail (leaseMs, 30 s par défaut), si bien</text>
  <text x="44" y="504" font-size="14" fill="#1f2328">que les lignes d'un relais mort reviennent seules.</text>
  <text x="44" y="526" font-size="14" fill="#1f2328">Livraison au moins une fois : un consommateur déduplique avec les événements traités.</text>
</svg>
