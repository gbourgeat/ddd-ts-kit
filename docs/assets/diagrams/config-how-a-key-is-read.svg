<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 604" width="960" height="604" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">How a key of ddd-ts-kit.config.json is read</title>
  <desc id="desc">A decision tree. A key the kit does not know is read by nothing, and ddd-ts-kit check reports it as config/valid with the nearest known key. A known key that is not written is read as its default: the default of its table, except for thirteen stack keys and importExtension, which are read as the default of a file written before the key existed. A written value the kit accepts is read as written. A wrong stack value stops every command with the accepted values. Any other wrong value is kept or read as its default, and ddd-ts-kit check reports it as config/valid with its line.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="604" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">How a key of ddd-ts-kit.config.json is read</text>
  <rect x="40" y="70" width="320" height="60" rx="10" fill="#ffffff" stroke="#3d4449" stroke-width="2"/>
  <text x="200" y="106" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">Does the kit know the key?</text>
  <line x1="362" y1="100" x2="438" y2="100" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="92" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">no</text>
  <rect x="440" y="68" width="480" height="64" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="456" y="93" font-size="14" font-weight="600" fill="#5f6b73">Ignored, without a message</text>
  <text x="456" y="115" font-size="13" fill="#1f2328">a misspelt key is not reported: read the table of its section</text>
  <line x1="200" y1="132" x2="200" y2="174" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="210" y="158" font-size="13" font-weight="600" fill="#1f2328">yes</text>
  <rect x="40" y="176" width="320" height="60" rx="10" fill="#ffffff" stroke="#3d4449" stroke-width="2"/>
  <text x="200" y="212" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">Is the key written in the file?</text>
  <line x1="362" y1="206" x2="438" y2="206" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="198" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">no</text>
  <rect x="440" y="166" width="480" height="80" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="456" y="189" font-size="14" font-weight="600" fill="#5f6b73">Read as its default</text>
  <text x="456" y="210" font-size="13" fill="#1f2328">the default of its table; for thirteen stack keys and importExtension,</text>
  <text x="456" y="230" font-size="13" fill="#1f2328">the default of an older file, not what init writes today</text>
  <line x1="200" y1="238" x2="200" y2="280" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="210" y="264" font-size="13" font-weight="600" fill="#1f2328">yes</text>
  <rect x="40" y="282" width="320" height="60" rx="10" fill="#ffffff" stroke="#3d4449" stroke-width="2"/>
  <text x="200" y="318" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">Is the value one the kit accepts?</text>
  <line x1="362" y1="312" x2="438" y2="312" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="304" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">yes</text>
  <rect x="440" y="280" width="480" height="64" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="456" y="305" font-size="14" font-weight="600" fill="#2f6f4f">Read as written</text>
  <text x="456" y="327" font-size="13" fill="#1f2328">check compares what follows from it, as tsconfig.json</text>
  <line x1="200" y1="344" x2="200" y2="386" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="210" y="370" font-size="13" font-weight="600" fill="#1f2328">no</text>
  <rect x="40" y="388" width="320" height="60" rx="10" fill="#ffffff" stroke="#3d4449" stroke-width="2"/>
  <text x="200" y="424" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">Is it a stack.* key?</text>
  <line x1="362" y1="418" x2="438" y2="418" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="410" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">yes</text>
  <rect x="440" y="386" width="480" height="64" rx="10" fill="#f6ede6" stroke="#9a5b2b" stroke-width="2"/>
  <text x="456" y="411" font-size="14" font-weight="600" fill="#9a5b2b">Every command stops</text>
  <text x="456" y="433" font-size="13" fill="#1f2328">and lists the accepted values; so does a file that is not JSON</text>
  <line x1="200" y1="450" x2="200" y2="492" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="210" y="476" font-size="13" font-weight="600" fill="#1f2328">no</text>
  <rect x="40" y="494" width="880" height="86" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="56" y="519" font-size="14" font-weight="600" fill="#2b5d8a">Kept, or read as its default: the command goes on</text>
  <text x="56" y="541" font-size="13" fill="#1f2328">ddd-ts-kit check reports it as config/valid, with its line in the file and the fix: for example a wrong</text>
  <text x="56" y="563" font-size="13" fill="#1f2328">classification, relationship, rule id, guard mode, import extension or coverage rate</text>
</svg>
