<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">retry then timeout, or timeout then retry</title>
  <desc id="desc">Two timelines of the same call to a slow provider, in seconds, with the default backoff of retry (a wait of at most 0.1 s, then at most 0.2 s). Above, retry is outside timeout: each attempt has its own 2 second limit; attempts 1 and 2 are cut at 2 seconds with TimeoutError, retry waits, and attempt 3 answers, so the call resolves near 6.2 seconds. Below, timeout is outside retry: one 2 second limit covers the attempts and the waits together; attempt 1 fails fast, retry waits, attempt 2 is still running at 2 seconds and the caller gets a TimeoutError at once. Without signal, nothing cancels the call: attempt 2 goes on, retry waits, attempt 3 runs, all in the background, and their outcome is dropped.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="470" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">retry then timeout, or timeout then retry</text>

  <!-- panel 1: 100 px per second; default backoff, waits of at most 0.1 s then 0.2 s -->
  <text x="32" y="78" font-size="14" font-weight="700" fill="#1f2328">compose(retry({ attempts: 3 }), timeout(2000))</text>
  <text x="430" y="78" font-size="14" fill="#1f2328">each attempt has its own 2 s</text>
  <g font-size="13" fill="#1f2328" text-anchor="middle">
    <text x="250" y="102">limit 2 s</text>
    <text x="460" y="102">limit 2 s</text>
    <text x="680" y="102">limit 2 s</text>
  </g>
  <g fill="none" stroke="#3d4449" stroke-width="1.5">
    <path d="M150,116 V108 H350 V116"/>
    <path d="M360,116 V108 H560 V116"/>
    <path d="M580,116 V108 H780 V116"/>
  </g>
  <rect x="150" y="122" width="200" height="40" rx="6" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="250" y="147" font-size="13" font-weight="700" fill="#7a4f9a" text-anchor="middle">attempt 1: TIMEOUT</text>
  <rect x="360" y="122" width="200" height="40" rx="6" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="460" y="147" font-size="13" font-weight="700" fill="#7a4f9a" text-anchor="middle">attempt 2: TIMEOUT</text>
  <rect x="580" y="122" width="190" height="40" rx="6" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="675" y="147" font-size="13" font-weight="700" fill="#7a4f9a" text-anchor="middle">attempt 3: answers</text>
  <g stroke="#3d4449" stroke-width="1.5">
    <line x1="355" y1="164" x2="355" y2="168"/>
    <line x1="570" y1="164" x2="570" y2="168"/>
  </g>
  <g font-size="13" fill="#1f2328" text-anchor="middle">
    <text x="355" y="182">wait ≤ 0.1 s</text>
    <text x="570" y="182">wait ≤ 0.2 s</text>
    <text x="785" y="182">the call resolves near 6.2 s</text>
  </g>
  <!-- axis 1 -->
  <line x1="150" y1="198" x2="900" y2="198" stroke="#3d4449" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g stroke="#3d4449" stroke-width="1.5">
    <line x1="150" y1="194" x2="150" y2="202"/><line x1="250" y1="194" x2="250" y2="202"/><line x1="350" y1="194" x2="350" y2="202"/><line x1="450" y1="194" x2="450" y2="202"/><line x1="550" y1="194" x2="550" y2="202"/><line x1="650" y1="194" x2="650" y2="202"/><line x1="750" y1="194" x2="750" y2="202"/><line x1="850" y1="194" x2="850" y2="202"/>
  </g>
  <g font-size="13" fill="#5f6b73" text-anchor="middle">
    <text x="150" y="218">0 s</text><text x="250" y="218">1</text><text x="350" y="218">2</text><text x="450" y="218">3</text><text x="550" y="218">4</text><text x="650" y="218">5</text><text x="750" y="218">6</text><text x="850" y="218">7</text>
  </g>

  <line x1="32" y1="242" x2="928" y2="242" stroke="#d0d7de" stroke-width="1"/>

  <!-- panel 2 -->
  <text x="32" y="276" font-size="14" font-weight="700" fill="#1f2328">compose(timeout(2000), retry({ attempts: 3 }))</text>
  <text x="430" y="276" font-size="14" fill="#1f2328">one 2 s limit for the whole call: attempts and waits</text>
  <text x="250" y="300" font-size="13" fill="#1f2328" text-anchor="middle">limit 2 s</text>
  <path d="M150,314 V306 H350 V314" fill="none" stroke="#3d4449" stroke-width="1.5"/>
  <rect x="150" y="320" width="80" height="40" rx="6" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="190" y="345" font-size="13" font-weight="700" fill="#7a4f9a" text-anchor="middle">attempt 1</text>
  <rect x="240" y="320" width="110" height="40" rx="6" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="295" y="345" font-size="13" font-weight="700" fill="#7a4f9a" text-anchor="middle">attempt 2</text>
  <!-- what goes on in the background after the TimeoutError, outcome dropped -->
  <g fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="5 3">
    <rect x="352" y="320" width="98" height="40" rx="6"/>
    <rect x="470" y="320" width="150" height="40" rx="6"/>
  </g>
  <text x="545" y="345" font-size="13" font-weight="700" fill="#5f6b73" text-anchor="middle">attempt 3</text>
  <line x1="350" y1="300" x2="350" y2="372" stroke="#7a4f9a" stroke-width="2"/>
  <g font-size="13" text-anchor="middle">
    <text x="182" y="378" fill="#1f2328">fails fast</text>
    <text x="235" y="394" fill="#1f2328">wait</text>
    <text x="460" y="378" fill="#5f6b73">wait</text>
  </g>
  <line x1="235" y1="362" x2="235" y2="381" stroke="#3d4449" stroke-width="1"/>
  <text x="486" y="397" font-size="13" fill="#5f6b73" text-anchor="middle" font-style="italic">in the background</text>
  <g font-size="13" fill="#1f2328">
    <text x="636" y="334" font-weight="700" fill="#7a4f9a">TimeoutError at 2 s</text>
    <text x="636" y="352">the caller gets it; the attempts</text>
    <text x="636" y="370">keep running, their outcome dropped</text>
  </g>
  <!-- axis 2 -->
  <line x1="150" y1="410" x2="900" y2="410" stroke="#3d4449" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g stroke="#3d4449" stroke-width="1.5">
    <line x1="150" y1="406" x2="150" y2="414"/><line x1="250" y1="406" x2="250" y2="414"/><line x1="350" y1="406" x2="350" y2="414"/><line x1="450" y1="406" x2="450" y2="414"/><line x1="550" y1="406" x2="550" y2="414"/><line x1="650" y1="406" x2="650" y2="414"/><line x1="750" y1="406" x2="750" y2="414"/><line x1="850" y1="406" x2="850" y2="414"/>
  </g>
  <g font-size="13" fill="#5f6b73" text-anchor="middle">
    <text x="150" y="430">0 s</text><text x="250" y="430">1</text><text x="350" y="430">2</text><text x="450" y="430">3</text><text x="550" y="430">4</text><text x="650" y="430">5</text><text x="750" y="430">6</text><text x="850" y="430">7</text>
  </g>
  <text x="32" y="456" font-size="13" fill="#1f2328">The first aspect is outermost. A TimeoutError is a fault, so an outer retry tries again; a DomainError never is.</text>
</svg>
