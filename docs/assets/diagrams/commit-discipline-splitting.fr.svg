<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Découper un changement qui a grossi</title>
  <desc id="desc">Une branche d'environ 1 900 lignes contient un remaniement de Calendar, un nouvel événement d'intégration, une règle du domaine et deux cas d'usage. Elle est découpée en cinq pull requests fusionnées dans l'ordre : le remaniement seul, le contrat, le concept du domaine avec sa spec, le cas d'usage qui replanifie, empilé sur le concept du domaine, et le cas d'usage qui annule.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="470" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Découper un changement qui a grossi</text>

  <!-- the branch that grew -->
  <rect x="32" y="64" width="250" height="380" rx="12" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="52" y="94" font-size="16" font-weight="700" fill="#5f6b73">Une branche qui a grossi</text>
  <text x="52" y="116" font-size="13" fill="#1f2328">environ 1 900 lignes changées</text>
  <line x1="52" y1="130" x2="262" y2="130" stroke="#5f6b73" stroke-opacity="0.35"/>
  <text x="52" y="158" font-size="13" fill="#1f2328">BookingWindow sorti</text>
  <text x="52" y="176" font-size="13" fill="#1f2328">de Calendar</text>
  <text x="52" y="206" font-size="13" fill="#1f2328">un nouvel événement d'intégration</text>
  <text x="52" y="236" font-size="13" fill="#1f2328">une règle sur BookingWindow</text>
  <text x="52" y="266" font-size="13" fill="#1f2328">replanifier un rendez-vous</text>
  <text x="52" y="296" font-size="13" fill="#1f2328">annuler un rendez-vous</text>
  <text x="52" y="326" font-size="13" fill="#1f2328">leurs routes et leurs specs, et</text>
  <text x="52" y="344" font-size="13" fill="#1f2328">les contrats régénérés</text>
  <text x="52" y="410" font-size="13" font-style="italic" fill="#5f6b73">deux idées ou plus : personne ne</text>
  <text x="52" y="428" font-size="13" font-style="italic" fill="#5f6b73">la relit, tout le monde l'approuve</text>

  <line x1="284" y1="254" x2="328" y2="254" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- the pull requests -->
  <text x="336" y="84" font-size="14" font-weight="600" fill="#1f2328">Cinq pull requests, fusionnées dans cet ordre</text>
  <rect x="336" y="96" width="592" height="60" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="352" y="121" font-size="14" font-weight="700" fill="#1f2328">1  refactor(scheduling): extract BookingWindow from Calendar</text>
  <text x="372" y="143" font-size="13" fill="#5f6b73">le déplacement seul, sans changement de comportement : facile à relire</text>
  <rect x="336" y="168" width="592" height="60" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="352" y="193" font-size="14" font-weight="700" fill="#1f2328">2  feat(scheduling): publish scheduling.appointment.rescheduled v1</text>
  <text x="372" y="215" font-size="13" fill="#2b5d8a">le contrat d'abord, pour que les consommateurs puissent démarrer</text>
  <rect x="336" y="240" width="592" height="60" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="352" y="265" font-size="14" font-weight="700" fill="#1f2328">3  feat(scheduling): refuse a slot outside the booking window</text>
  <text x="372" y="287" font-size="13" fill="#2f6f4f">le concept du domaine et sa spec, utile et vert à lui seul</text>
  <rect x="336" y="312" width="592" height="60" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="352" y="337" font-size="14" font-weight="700" fill="#1f2328">4  feat(scheduling): reschedule an appointment</text>
  <text x="372" y="359" font-size="13" fill="#2b5d8a">un cas d'usage, empilé sur 3, qu'il appelle</text>
  <rect x="336" y="384" width="592" height="60" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="352" y="409" font-size="14" font-weight="700" fill="#1f2328">5  feat(scheduling): cancel an appointment</text>
  <text x="372" y="431" font-size="13" fill="#2b5d8a">un cas d'usage : un échec de 4 ne le retient pas</text>
</svg>
