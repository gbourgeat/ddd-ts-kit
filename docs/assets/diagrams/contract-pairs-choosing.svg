<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Choosing a contract pair, question by question</title>
  <desc id="desc">An existing NestJS application adopting the kit takes NestJS and class-validator. A team that wants the contract to be the schema itself takes Fastify and TypeBox. A team that may move the service to another runtime, or prefers the Web standard Request and Response, takes Hono and zod. Otherwise Express and zod, the default. The size of the application is not a criterion.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="470" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Choosing a contract pair, question by question</text>
  <!-- questions -->
  <rect x="32" y="64" width="480" height="60" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="2"/>
  <text x="272" y="99" font-size="14" fill="#1f2328" text-anchor="middle">Is it an existing NestJS application adopting the kit?</text>
  <rect x="32" y="164" width="480" height="60" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="2"/>
  <text x="272" y="189" font-size="14" fill="#1f2328" text-anchor="middle">Should the contract be the schema itself,</text>
  <text x="272" y="210" font-size="14" fill="#1f2328" text-anchor="middle">with JSON Schema keywords as issue codes?</text>
  <rect x="32" y="264" width="480" height="60" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="2"/>
  <text x="272" y="289" font-size="14" fill="#1f2328" text-anchor="middle">May the service move to another runtime, or does</text>
  <text x="272" y="310" font-size="14" fill="#1f2328" text-anchor="middle">the team prefer Web standard Request and Response?</text>
  <line x1="272" y1="126" x2="272" y2="160" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="284" y="148" font-size="13" fill="#1f2328">no</text>
  <line x1="272" y1="226" x2="272" y2="260" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="284" y="248" font-size="13" fill="#1f2328">no</text>
  <line x1="272" y1="326" x2="272" y2="360" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="284" y="348" font-size="13" fill="#1f2328">no</text>
  <!-- answers -->
  <rect x="592" y="64" width="336" height="60" rx="10" fill="#f6ede6" stroke="#9a5b2b" stroke-width="2"/>
  <text x="760" y="90" font-size="16" font-weight="700" fill="#9a5b2b" text-anchor="middle">NestJS + class-validator</text>
  <text x="760" y="112" font-size="13" fill="#1f2328" text-anchor="middle">--http nest --di nest --validation class-validator</text>
  <rect x="592" y="164" width="336" height="60" rx="10" fill="#f6ede6" stroke="#9a5b2b" stroke-width="2"/>
  <text x="760" y="190" font-size="16" font-weight="700" fill="#9a5b2b" text-anchor="middle">Fastify + TypeBox</text>
  <text x="760" y="212" font-size="13" fill="#1f2328" text-anchor="middle">--http fastify --validation typebox</text>
  <rect x="592" y="264" width="336" height="60" rx="10" fill="#f6ede6" stroke="#9a5b2b" stroke-width="2"/>
  <text x="760" y="290" font-size="16" font-weight="700" fill="#9a5b2b" text-anchor="middle">Hono + zod</text>
  <text x="760" y="312" font-size="13" fill="#1f2328" text-anchor="middle">--http hono (proven on Node only)</text>
  <rect x="32" y="364" width="480" height="60" rx="10" fill="#f6ede6" stroke="#9a5b2b" stroke-width="2"/>
  <text x="272" y="390" font-size="16" font-weight="700" fill="#9a5b2b" text-anchor="middle">Express + zod</text>
  <text x="272" y="412" font-size="13" fill="#1f2328" text-anchor="middle">the default of init: no flag</text>
  <line x1="514" y1="94" x2="588" y2="94" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="551" y="86" font-size="13" fill="#1f2328" text-anchor="middle">yes</text>
  <line x1="514" y1="194" x2="588" y2="194" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="551" y="186" font-size="13" fill="#1f2328" text-anchor="middle">yes</text>
  <line x1="514" y1="294" x2="588" y2="294" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="551" y="286" font-size="13" fill="#1f2328" text-anchor="middle">yes</text>
  <!-- note -->
  <text x="592" y="384" font-size="14" font-weight="600" fill="#1f2328">Not a criterion: the size of the</text>
  <text x="592" y="406" font-size="14" fill="#1f2328">application. The four carry a large</text>
  <text x="592" y="428" font-size="14" fill="#1f2328">one the same way.</text>
</svg>
