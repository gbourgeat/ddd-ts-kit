<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">La même tâche, en cherchant ou en lisant la carte</title>
  <desc id="desc">À gauche, un agent sur un projet sans structure liste les répertoires, cherche, ouvre les fichiers candidats, écrit le gestionnaire, se fait refuser par un contrôle et le réécrit : six étapes, et une boucle de reprise. À droite, sur un projet construit avec le kit, l'agent lit le contexte sous forme de faits avec describe, lance le générateur qui liste les endroits à remplir, remplit seulement ces endroits et contrôle ce qui a changé : quatre étapes. Chaque résultat d'outil des deux chemins reste dans la conversation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="560" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">La même tâche, en cherchant ou en lisant la carte</text>
  <text x="32" y="62" font-size="14" fill="#1f2328">Tâche : permettre d'annuler un rendez-vous, dans appointments, permission appointment.cancel</text>
  <!-- left column -->
  <text x="270" y="100" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">Sans carte : chercher, puis lire</text>
  <rect x="70" y="116" width="400" height="56" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="88" y="139" font-size="14" font-weight="600" fill="#1f2328">1. lister les répertoires</text>
  <text x="88" y="160" font-size="13" fill="#1f2328">ls, tree : chaque chemin du projet entre dans la conversation</text>
  <rect x="70" y="188" width="400" height="56" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="88" y="211" font-size="14" font-weight="600" fill="#1f2328">2. chercher « cancel » et « appointment »</text>
  <text x="88" y="232" font-size="13" fill="#1f2328">chaque ligne trouvée, commentaires et tests compris</text>
  <rect x="70" y="260" width="400" height="56" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="88" y="283" font-size="14" font-weight="600" fill="#1f2328">3. ouvrir les fichiers candidats</text>
  <text x="88" y="304" font-size="13" fill="#1f2328">fichiers entiers, pour voir les conventions à l'œuvre</text>
  <rect x="70" y="332" width="400" height="56" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="88" y="355" font-size="14" font-weight="600" fill="#1f2328">4. écrire la commande, le gestionnaire, la route</text>
  <text x="88" y="376" font-size="13" fill="#1f2328">code répétitif écrit à la main, à un endroit deviné</text>
  <rect x="70" y="404" width="400" height="56" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="88" y="427" font-size="14" font-weight="600" fill="#1f2328">5. un contrôle ou un relecteur le refuse</text>
  <text x="88" y="448" font-size="13" fill="#1f2328">tout le journal des tests, lu pour un seul échec</text>
  <rect x="70" y="476" width="400" height="56" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="88" y="499" font-size="14" font-weight="600" fill="#1f2328">6. lire la règle, réécrire</text>
  <text x="88" y="520" font-size="13" fill="#1f2328">le coût de l'étape 4, payé une seconde fois</text>
  <line x1="270" y1="172" x2="270" y2="186" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="270" y1="244" x2="270" y2="258" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="270" y1="316" x2="270" y2="330" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="270" y1="388" x2="270" y2="402" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="270" y1="460" x2="270" y2="474" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- rework loop -->
  <path d="M70,504 H44 V360 H66" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="36" y="432" font-size="13" font-weight="600" fill="#3d4449" text-anchor="middle" transform="rotate(-90 36 432)">reprise</text>
  <!-- right column -->
  <text x="710" y="100" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">Avec le kit : lire la carte, puis les endroits</text>
  <rect x="510" y="116" width="400" height="72" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="1.5"/>
  <text x="528" y="139" font-size="14" font-weight="600" fill="#1f2328">1. npx ddd-ts-kit describe appointments</text>
  <text x="528" y="160" font-size="13" fill="#1f2328">cas d'usage, routes, ports et événements, en texte ;</text>
  <text x="528" y="178" font-size="13" fill="#1f2328">puis le CONTEXT.md du contexte</text>
  <rect x="510" y="208" width="400" height="72" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="1.5"/>
  <text x="528" y="231" font-size="14" font-weight="600" fill="#1f2328">2. npx ddd-ts-kit generate command ... --json</text>
  <text x="528" y="252" font-size="13" fill="#1f2328">les fichiers à leurs chemins calculés, câblés ;</text>
  <text x="528" y="270" font-size="13" fill="#1f2328">"todos" : le file:line de chaque décision restante</text>
  <rect x="510" y="300" width="400" height="72" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="1.5"/>
  <text x="528" y="323" font-size="14" font-weight="600" fill="#1f2328">3. remplir les TODO(domain) et les it.todo</text>
  <text x="528" y="344" font-size="13" fill="#1f2328">seulement les endroits listés sous "todos" ; le hook</text>
  <text x="528" y="362" font-size="13" fill="#1f2328">du plugin contrôle chaque fichier à l'écriture</text>
  <rect x="510" y="392" width="400" height="72" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="1.5"/>
  <text x="528" y="415" font-size="14" font-weight="600" fill="#1f2328">4. npx ddd-ts-kit check --changed-since origin/main</text>
  <text x="528" y="436" font-size="13" fill="#1f2328">seulement les fichiers modifiés ; chaque violation</text>
  <text x="528" y="454" font-size="13" fill="#1f2328">porte sa correction ; puis les tests d'un contexte</text>
  <line x1="710" y1="188" x2="710" y2="206" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="710" y1="280" x2="710" y2="298" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="710" y1="372" x2="710" y2="390" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="710" y="500" font-size="14" font-style="italic" fill="#2b5d8a" text-anchor="middle">aucune recherche, aucun code répétitif écrit à la main,</text>
  <text x="710" y="520" font-size="14" font-style="italic" fill="#2b5d8a" text-anchor="middle">les règles contrôlées à chaque écriture</text>
</svg>
