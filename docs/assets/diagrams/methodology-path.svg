<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">The path, from a statement of needs to running code</title>
  <desc id="desc">Nine steps in order. From the statement of needs: 1 discover, 2 contexts, 3 glossaries, 4 context map, which model the domain; 5 stack and bootstrap, which builds the platform; then for each slice 6 plan slices, 7 build, 8 verify, 9 document. After step 9 the next slice starts again at step 6. When verifying shows a boundary was wrong, the work goes back to step 2. Each step names the file it leaves and the skill or tool that produces it.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="520" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">The path, from a statement of needs to running code</text>
  <!-- needs -->
  <rect x="24" y="58" width="160" height="34" rx="17" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="104" y="80" font-size="14" fill="#1f2328" text-anchor="middle">statement of needs</text>
  <line x1="104" y1="92" x2="104" y2="114" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- row 1: model the domain, then bootstrap -->
  <rect x="24" y="116" width="160" height="96" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="104" y="142" font-size="15" font-weight="700" fill="#2f6f4f" text-anchor="middle">1. Discover</text>
  <text x="104" y="168" font-size="13" fill="#1f2328" text-anchor="middle">discovery.md</text>
  <text x="104" y="192" font-size="13" font-style="italic" fill="#2f6f4f" text-anchor="middle">discover-domain</text>
  <rect x="212" y="116" width="160" height="96" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="292" y="142" font-size="15" font-weight="700" fill="#2f6f4f" text-anchor="middle">2. Contexts</text>
  <text x="292" y="168" font-size="13" fill="#1f2328" text-anchor="middle">contexts.md</text>
  <text x="292" y="192" font-size="13" font-style="italic" fill="#2f6f4f" text-anchor="middle">bounded-contexts</text>
  <rect x="400" y="116" width="160" height="96" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="480" y="142" font-size="15" font-weight="700" fill="#2f6f4f" text-anchor="middle">3. Glossaries</text>
  <text x="480" y="168" font-size="13" fill="#1f2328" text-anchor="middle">glossary.md</text>
  <text x="480" y="192" font-size="13" font-style="italic" fill="#2f6f4f" text-anchor="middle">glossary</text>
  <rect x="588" y="116" width="160" height="96" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="668" y="142" font-size="15" font-weight="700" fill="#2f6f4f" text-anchor="middle">4. Context map</text>
  <text x="668" y="168" font-size="13" fill="#1f2328" text-anchor="middle">context-map.md</text>
  <text x="668" y="192" font-size="13" font-style="italic" fill="#2f6f4f" text-anchor="middle">context-map</text>
  <rect x="776" y="116" width="160" height="96" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="856" y="142" font-size="15" font-weight="700" fill="#5f6b73" text-anchor="middle">5. Stack, bootstrap</text>
  <text x="856" y="168" font-size="13" fill="#1f2328" text-anchor="middle">config, skeleton, ADRs</text>
  <text x="856" y="192" font-size="13" font-style="italic" fill="#5f6b73" text-anchor="middle">bootstrap, init</text>
  <line x1="184" y1="164" x2="210" y2="164" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="372" y1="164" x2="398" y2="164" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="560" y1="164" x2="586" y2="164" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="748" y1="164" x2="774" y2="164" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="856" y1="212" x2="856" y2="282" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- row 2: for each slice, right to left -->
  <rect x="776" y="284" width="160" height="96" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="856" y="310" font-size="15" font-weight="700" fill="#2b5d8a" text-anchor="middle">6. Plan slices</text>
  <text x="856" y="336" font-size="13" fill="#1f2328" text-anchor="middle">slices.md</text>
  <text x="856" y="360" font-size="13" font-style="italic" fill="#2b5d8a" text-anchor="middle">plan-slices</text>
  <rect x="588" y="284" width="160" height="96" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="668" y="310" font-size="15" font-weight="700" fill="#2b5d8a" text-anchor="middle">7. Build</text>
  <text x="668" y="336" font-size="13" fill="#1f2328" text-anchor="middle">code, specs, a commit</text>
  <text x="668" y="360" font-size="13" font-style="italic" fill="#2b5d8a" text-anchor="middle">use-case, generate</text>
  <rect x="400" y="284" width="160" height="96" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="480" y="310" font-size="15" font-weight="700" fill="#2b5d8a" text-anchor="middle">8. Verify</text>
  <text x="480" y="336" font-size="13" fill="#1f2328" text-anchor="middle">a green gate</text>
  <text x="480" y="360" font-size="13" font-style="italic" fill="#2b5d8a" text-anchor="middle">npm run verify</text>
  <rect x="212" y="284" width="160" height="96" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="292" y="310" font-size="15" font-weight="700" fill="#2b5d8a" text-anchor="middle">9. Document</text>
  <text x="292" y="336" font-size="13" fill="#1f2328" text-anchor="middle">generated documents</text>
  <text x="292" y="360" font-size="13" font-style="italic" fill="#2b5d8a" text-anchor="middle">ddd-ts-kit docs</text>
  <line x1="776" y1="332" x2="750" y2="332" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="588" y1="332" x2="562" y2="332" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="332" x2="374" y2="332" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- loops -->
  <path d="M292,380 V412 H836 V384" fill="none" stroke="#2b5d8a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="564" y="434" font-size="14" fill="#2b5d8a" text-anchor="middle">next slice</text>
  <path d="M480,284 V246 H292 V216" fill="none" stroke="#5f6b73" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="386" y="268" font-size="14" fill="#5f6b73" text-anchor="middle">a boundary was wrong</text>
  <!-- legend -->
  <rect x="24" y="464" width="22" height="16" rx="4" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="1.5"/>
  <text x="54" y="477" font-size="14" fill="#1f2328">model the domain, with people</text>
  <rect x="290" y="464" width="22" height="16" rx="4" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="320" y="477" font-size="14" fill="#1f2328">the platform, once</text>
  <rect x="470" y="464" width="22" height="16" rx="4" fill="#e7eef5" stroke="#2b5d8a" stroke-width="1.5"/>
  <text x="500" y="477" font-size="14" fill="#1f2328">for each slice; CI replays 8 and 9</text>
  <text x="24" y="504" font-size="13" font-style="italic" fill="#1f2328">Italic: the skill of the plugin or the tool that does the step. /ddd-ts-kit:start conducts steps 1 to 7, one per turn.</text>
</svg>
