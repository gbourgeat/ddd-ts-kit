<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" width="960" height="510" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Where @ddd-ts-kit/drizzle sits in an application</title>
  <desc id="desc">A bounded context holds a handler, the repository port of the domain and the drizzle repository that implements it. The package gives one object that is both the UnitOfWork the command bus runs each command in and the Database of the project, whose executor() the repository and the stores query through; that object opens db.transaction() on the drizzle database of any PostgreSQL driver. The tables of the context, the outbox, the processed events and the jobs are declared in drizzle schema files and created by the migrations drizzle-kit writes. The platform binds everything at start-up.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
    <marker id="arrow-infrastructure" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a4f9a"/>
    </marker>
  </defs>
  <rect width="960" height="510" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">Where @ddd-ts-kit/drizzle sits in an application</text>
  <!-- platform -->
  <rect x="16" y="56" width="928" height="382" rx="14" fill="#f3f4f5" stroke="#5f6b73" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="36" y="84" font-size="14" font-weight="600" fill="#5f6b73">platform (src/platform): binds the unit of work to UnitOfWork and Database, each store to its port</text>
  <!-- bounded context -->
  <rect x="32" y="102" width="244" height="318" rx="12" fill="#ffffff" stroke="#5f6b73" stroke-width="1.5"/>
  <text x="48" y="126" font-size="14" font-weight="600" fill="#5f6b73">order-management context</text>
  <rect x="46" y="142" width="216" height="60" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="154" y="168" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">handler</text>
  <text x="154" y="189" font-size="13" fill="#1f2328" text-anchor="middle">application</text>
  <rect x="46" y="240" width="216" height="60" rx="10" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="2"/>
  <text x="154" y="266" font-size="16" font-weight="700" fill="#2f6f4f" text-anchor="middle">OrderRepository</text>
  <text x="154" y="287" font-size="13" fill="#1f2328" text-anchor="middle">port of the domain</text>
  <rect x="46" y="338" width="216" height="66" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="154" y="364" font-size="15" font-weight="700" fill="#7a4f9a" text-anchor="middle">DrizzleOrderRepository</text>
  <text x="154" y="386" font-size="13" fill="#1f2328" text-anchor="middle">adapter, infrastructure</text>
  <line x1="154" y1="204" x2="154" y2="238" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="154" y1="336" x2="154" y2="302" stroke="#7a4f9a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-infrastructure)"/>
  <!-- the package -->
  <rect x="300" y="102" width="344" height="318" rx="12" fill="#ffffff" stroke="#7a4f9a" stroke-width="1.5"/>
  <text x="316" y="126" font-size="14" font-weight="700" fill="#7a4f9a">@ddd-ts-kit/drizzle/postgres</text>
  <rect x="318" y="142" width="308" height="112" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="472" y="168" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">createDrizzleUnitOfWork(db)</text>
  <line x1="334" y1="180" x2="610" y2="180" stroke="#7a4f9a" stroke-opacity="0.35"/>
  <text x="472" y="202" font-size="13" fill="#1f2328" text-anchor="middle">one object, two ports:</text>
  <text x="472" y="222" font-size="13" fill="#1f2328" text-anchor="middle">UnitOfWork: run(work) runs the handler</text>
  <text x="472" y="242" font-size="13" fill="#1f2328" text-anchor="middle">Database (a DrizzleContext): executor()</text>
  <rect x="318" y="294" width="308" height="112" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="472" y="318" font-size="16" font-weight="700" fill="#7a4f9a" text-anchor="middle">the stores</text>
  <text x="472" y="340" font-size="13" fill="#1f2328" text-anchor="middle">DrizzleOutboxStore</text>
  <text x="472" y="358" font-size="13" fill="#1f2328" text-anchor="middle">DrizzleProcessedEventStore</text>
  <text x="472" y="376" font-size="13" fill="#1f2328" text-anchor="middle">DrizzleJobStore, DrizzleProcessStore</text>
  <text x="472" y="394" font-size="13" fill="#1f2328" text-anchor="middle">event store, read model store</text>
  <!-- calls -->
  <line x1="316" y1="168" x2="264" y2="168" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M264,370 H288 V230 H316" fill="none" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="472" y1="292" x2="472" y2="256" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="482" y="278" font-size="13" fill="#1f2328">executor()</text>
  <!-- drizzle and the database -->
  <rect x="712" y="142" width="216" height="112" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="2"/>
  <text x="820" y="168" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">drizzle db</text>
  <line x1="728" y1="180" x2="912" y2="180" stroke="#5f6b73" stroke-opacity="0.35"/>
  <text x="820" y="202" font-size="13" fill="#1f2328" text-anchor="middle">any PostgreSQL driver:</text>
  <text x="820" y="222" font-size="13" fill="#1f2328" text-anchor="middle">node-postgres, postgres-js,</text>
  <text x="820" y="242" font-size="13" fill="#1f2328" text-anchor="middle">PGlite, Neon</text>
  <rect x="712" y="294" width="216" height="112" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="2"/>
  <text x="820" y="318" font-size="16" font-weight="700" fill="#5f6b73" text-anchor="middle">PostgreSQL</text>
  <text x="820" y="340" font-size="13" fill="#1f2328" text-anchor="middle">order_management.orders</text>
  <text x="820" y="358" font-size="13" fill="#1f2328" text-anchor="middle">messaging.outbox</text>
  <text x="820" y="376" font-size="13" fill="#1f2328" text-anchor="middle">messaging.processed_events</text>
  <text x="820" y="394" font-size="13" font-style="italic" fill="#5f6b73" text-anchor="middle">created by drizzle-kit migrations</text>
  <line x1="628" y1="198" x2="710" y2="198" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="669" y="190" font-size="13" fill="#1f2328" text-anchor="middle">transaction()</text>
  <line x1="820" y1="256" x2="820" y2="292" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- legend -->
  <line x1="32" y1="462" x2="76" y2="462" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="88" y="467" font-size="14" fill="#1f2328">depends on or calls: every statement goes through executor(), the transaction of the unit of work when there is one</text>
  <line x1="32" y1="490" x2="76" y2="490" stroke="#7a4f9a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-infrastructure)"/>
  <text x="88" y="495" font-size="14" fill="#1f2328">implements a port of the domain</text>
</svg>
