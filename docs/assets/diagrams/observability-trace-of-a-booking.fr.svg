<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">La trace d'une réservation</title>
  <desc id="desc">Une cascade de spans, une ligne par span, en retrait sous son parent, avec une barre pour sa durée. La requête HTTP POST /appointments contient la commande BookAppointment, qui appelle deux fois le repository, puis l'unité de travail distribue l'événement du domaine appointments.appointment.booked avant la validation ; son gestionnaire ajoute l'événement d'intégration à l'outbox. La réponse part après la validation. Un moment plus tard, le relais publie l'événement, dans la même trace, et le consommateur de notifications le traite : sa commande enregistre un rappel. Les barres sont colorées par couche : présentation, application, domaine, infrastructure.</desc>
  <rect width="960" height="500" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">La trace d'une réservation</text>
  <rect x="24" y="88" width="912" height="234" rx="8" fill="#f3f4f5"/>
  <rect x="24" y="348" width="912" height="78" rx="8" fill="#f3f4f5"/>
  <text x="928" y="340" font-size="13" font-weight="600" fill="#5f6b73" text-anchor="end">notifications</text>
  <text x="32" y="74" font-size="13" font-weight="600" fill="#5f6b73">span</text>
  <text x="470" y="74" font-size="13" font-weight="600" fill="#5f6b73">temps</text>
  <text x="928" y="74" font-size="13" font-weight="600" fill="#5f6b73" text-anchor="end">appointments</text>
  <text x="32" y="105" font-size="13" fill="#1f2328">POST /appointments</text>
  <rect x="470" y="93" width="247" height="16" rx="4" fill="#f6ede6" stroke="#9a5b2b" stroke-width="1.5"/>
  <text x="44" y="131" font-size="13" fill="#1f2328">command BookAppointment</text>
  <rect x="484" y="119" width="224" height="16" rx="4" fill="#e7eef5" stroke="#2b5d8a" stroke-width="1.5"/>
  <text x="56" y="157" font-size="13" fill="#1f2328">repository AppointmentRepository.findOverlapping</text>
  <rect x="493" y="145" width="56" height="16" rx="4" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="1.5"/>
  <text x="56" y="183" font-size="13" fill="#1f2328">repository AppointmentRepository.save</text>
  <rect x="559" y="171" width="47" height="16" rx="4" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="1.5"/>
  <text x="56" y="209" font-size="13" fill="#1f2328">unit-of-work before-commit</text>
  <rect x="614" y="197" width="75" height="16" rx="4" fill="#e7eef5" stroke="#2b5d8a" stroke-width="1.5"/>
  <text x="68" y="235" font-size="13" fill="#1f2328">domain-event appointments.appointment.booked</text>
  <rect x="619" y="223" width="65" height="16" rx="4" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="1.5"/>
  <text x="80" y="261" font-size="13" fill="#1f2328">handler AppointmentBookedPublisher</text>
  <rect x="624" y="249" width="56" height="16" rx="4" fill="#e7eef5" stroke="#2b5d8a" stroke-width="1.5"/>
  <text x="92" y="287" font-size="13" fill="#1f2328">outbox append appointments.appointment.booked</text>
  <rect x="633" y="275" width="37" height="16" rx="4" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="1.5"/>
  <text x="104" y="313" font-size="13" fill="#1f2328">publish appointments.appointment.booked</text>
  <rect x="768" y="301" width="28" height="16" rx="4" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="1.5"/>
  <text x="760" y="313" font-size="13" font-style="italic" fill="#5f6b73" text-anchor="end">plus tard, par le relais</text>
  <text x="116" y="365" font-size="13" fill="#1f2328">process notifications.remind-on-appointment-booked</text>
  <rect x="806" y="353" width="116" height="16" rx="4" fill="#e7eef5" stroke="#2b5d8a" stroke-width="1.5"/>
  <text x="128" y="391" font-size="13" fill="#1f2328">command ScheduleReminder</text>
  <rect x="815" y="379" width="98" height="16" rx="4" fill="#e7eef5" stroke="#2b5d8a" stroke-width="1.5"/>
  <text x="140" y="417" font-size="13" fill="#1f2328">repository ReminderRepository.save</text>
  <rect x="843" y="405" width="56" height="16" rx="4" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="1.5"/>
  <line x1="712" y1="80" x2="712" y2="294" stroke="#3d4449" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="720" y="183" font-size="13" fill="#1f2328">validation, puis 201</text>
  <rect x="32" y="452" width="28" height="16" rx="4" fill="#f6ede6" stroke="#9a5b2b" stroke-width="1.5"/>
  <text x="70" y="465" font-size="14" fill="#1f2328">présentation (HTTP)</text>
  <rect x="492" y="452" width="28" height="16" rx="4" fill="#e7eef5" stroke="#2b5d8a" stroke-width="1.5"/>
  <text x="530" y="465" font-size="14" fill="#1f2328">application (cas d'usage, gestionnaire, consommateur)</text>
  <rect x="32" y="478" width="28" height="16" rx="4" fill="#e8f1ec" stroke="#2f6f4f" stroke-width="1.5"/>
  <text x="70" y="491" font-size="14" fill="#1f2328">domaine (événement du domaine)</text>
  <rect x="492" y="478" width="28" height="16" rx="4" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="1.5"/>
  <text x="530" y="491" font-size="14" fill="#1f2328">infrastructure (repository, outbox, broker)</text>
</svg>
