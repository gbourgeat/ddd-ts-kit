<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">N'extraire un contexte que si les quatre questions y mènent</title>
  <desc id="desc">Un arbre de décision. Question 1 : un signal mesuré dit-il que le déploiement unique est le problème ? Non : rester un monolithe modulaire. Oui, question 2 : une réponse moins chère le règle-t-elle, comme un processus worker, la mise à l'échelle horizontale, une file d'attente ou des cloisons ? Oui : l'appliquer et garder un seul déployable. Non, question 3 : le contexte est-il prêt à partir, selon le contrôle extractable et le test de démarrage ? Non : corriger d'abord son isolation. Oui, question 4 : une équipe peut-elle posséder et exploiter le service ? Non : attendre. Oui : extraire, un adaptateur à la fois, en gardant le chemin du retour.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4449"/>
    </marker>
  </defs>
  <rect width="960" height="560" rx="16" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="600" fill="#1f2328">N'extraire un contexte que si les quatre questions y mènent</text>

  <!-- question 1 -->
  <rect x="32" y="64" width="440" height="64" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="52" y="91" font-size="14" font-weight="600" fill="#1f2328">1. Un signal mesuré dit-il que le déploiement</text>
  <text x="52" y="113" font-size="14" fill="#1f2328">unique est désormais le problème ?</text>
  <rect x="568" y="68" width="360" height="56" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="588" y="92" font-size="16" font-weight="700" fill="#2b5d8a">Rester un monolithe modulaire</text>
  <text x="588" y="113" font-size="13" fill="#1f2328">le checker tient les frontières</text>
  <line x1="474" y1="96" x2="564" y2="96" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="518" y="88" font-size="13" fill="#1f2328" text-anchor="middle">non</text>
  <line x1="252" y1="130" x2="252" y2="160" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="262" y="150" font-size="13" fill="#1f2328">oui</text>

  <!-- question 2 -->
  <rect x="32" y="164" width="440" height="80" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="52" y="191" font-size="14" font-weight="600" fill="#1f2328">2. Une réponse moins chère le règle-t-elle ? Un</text>
  <text x="52" y="211" font-size="14" fill="#1f2328">processus worker, l'échelle horizontale, une file,</text>
  <text x="52" y="231" font-size="14" fill="#1f2328">des cloisons, des feature flags, un responsable par contexte</text>
  <rect x="568" y="172" width="360" height="64" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="588" y="198" font-size="16" font-weight="700" fill="#2b5d8a">L'appliquer, garder un seul déployable</text>
  <text x="588" y="220" font-size="13" fill="#1f2328">npx ddd-ts-kit generate worker, pour les jobs</text>
  <line x1="474" y1="204" x2="564" y2="204" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="518" y="196" font-size="13" fill="#1f2328" text-anchor="middle">oui</text>
  <line x1="252" y1="246" x2="252" y2="276" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="262" y="266" font-size="13" fill="#1f2328">non</text>

  <!-- question 3 -->
  <rect x="32" y="280" width="440" height="64" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="52" y="307" font-size="14" font-weight="600" fill="#1f2328">3. Le contexte est-il prêt à partir ?</text>
  <text x="52" y="329" font-size="14" fill="#1f2328">check --rule context/extractable, le test de démarrage</text>
  <rect x="568" y="284" width="360" height="56" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="588" y="308" font-size="16" font-weight="700" fill="#2b5d8a">Corriger d'abord son isolation</text>
  <text x="588" y="329" font-size="13" fill="#1f2328">données propres, outbox, ports de gateway</text>
  <line x1="474" y1="312" x2="564" y2="312" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="518" y="304" font-size="13" fill="#1f2328" text-anchor="middle">non</text>
  <line x1="252" y1="346" x2="252" y2="376" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="262" y="366" font-size="13" fill="#1f2328">oui</text>

  <!-- question 4 -->
  <rect x="32" y="380" width="440" height="64" rx="10" fill="#f3f4f5" stroke="#5f6b73" stroke-width="2"/>
  <text x="52" y="407" font-size="14" font-weight="600" fill="#1f2328">4. Une équipe peut-elle le posséder et l'exploiter ?</text>
  <text x="52" y="429" font-size="14" fill="#1f2328">pipeline, astreinte, tableaux de bord, alertes</text>
  <rect x="568" y="384" width="360" height="56" rx="10" fill="#e7eef5" stroke="#2b5d8a" stroke-width="2"/>
  <text x="588" y="408" font-size="16" font-weight="700" fill="#2b5d8a">Attendre</text>
  <text x="588" y="429" font-size="13" fill="#1f2328">personne ne porterait les nouvelles pannes</text>
  <line x1="474" y1="412" x2="564" y2="412" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="518" y="404" font-size="13" fill="#1f2328" text-anchor="middle">non</text>
  <line x1="252" y1="446" x2="252" y2="476" stroke="#3d4449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="262" y="466" font-size="13" fill="#1f2328">oui</text>

  <!-- extract -->
  <rect x="32" y="480" width="896" height="56" rx="10" fill="#f1ebf5" stroke="#7a4f9a" stroke-width="2"/>
  <text x="52" y="504" font-size="16" font-weight="700" fill="#7a4f9a">Extraire : npx ddd-ts-kit generate service &lt;context&gt;</text>
  <text x="52" y="525" font-size="13" fill="#1f2328">puis basculer un adaptateur à la fois, à côté du monolithe, et garder le retour possible jusqu'à l'épreuve de la production</text>
</svg>
